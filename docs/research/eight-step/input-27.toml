  "docs/zh/porting/input.md:56 — 使用选定 kernelcache 确认 IOHIDFamily 方法和对象布局：27 侧即 24A446 的 IOHIDDevice vtable/instance size，不能沿用 16.x 的 IOHIDFamily-2031 布局（见 ③）",
  "docs/zh/porting/input.md:58 — 按传感器适配报告描述符、逻辑坐标范围与接触数量上限：K60 是 max-x 14400 / max-y 32000（board.toml:265-269）与 GOODIX_MAX_TOUCHES 10",
  "docs/zh/porting/input.md:61,65 — HID 配方绑定 OS 接口，sheng-touch-hid=1 启用触控发布路径；检查命令 rg -n 'native_touch_|ReportDescriptor' drivers/ShengHidInput/NativeHidInput.cpp",
