  "2026-11-19 15:33 投票路径统一遵守硬件上限：voteDomain 在选档前读 0x30c，bit2 置位且 cap 低于表顶时用 readTableCapped 以 cap 重建 LUT，cap 低于最低档时跳过投票并打印 hardware cap=… below table；mode 2/3/6/7 不再可能投到固件 ceiling 之上。未写 DCVS_CTRL；离线编译通过，battery archive 145,928 B sha256 61ed83175bb9be778ad9b6a0f43096eef9b8095235e031f4c025b266d8d13672；host CPU 203 项、七套件 1579 项不变；尚未上机。",
