  { kind = "host", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "gcc -O1 -Wall -Wextra -Werror -DK60_HOST_TEST -I drivers/PongCellular -o /mnt/e/k60-work/artifacts/tests/t-k60-ipa-qrtr scripts/tests/test-k60-ipa-qrtr.c drivers/PongCellular/K60IpaQrtr.c drivers/PongCellular/K60IpaQmiTransport.c drivers/PongCellular/K60IpaQmiServer.c drivers/PongCellular/K60IpaQmi.c drivers/PongCellular/K60ModemQrtr.c ; bash /mnt/e/k60-work/artifacts/run-host-tests.sh ; python3 scripts/gen-ipa-patch.py ; PYTHONIOENCODING=utf-8 python3 scripts/tests/test-k60-ipa-patch.py ; llvm-nm --defined-only /mnt/e/k60-work/artifacts/modem-20261117k27/kernel.macho | grep _k60_ipa_qrtr", revision = "49d41615a0c93c67bb9cb314e62bc1bbcb64ea03", result = "The QRTR service 49 session is host-proven and compiled into a kernel image but has no runtime caller. test-k60-ipa-qrtr.c prints K60 IPA QRTR PASS announce lookup discovery init-driver response subscribe completion bye failures: the announce and lookup datagrams match the builders byte for byte; a synthetic NEW_SERVER for 49/0x201 at node 42/port 0x4001 is recorded and starts the 154 B INIT_DRIVER DATA from 0x123; the 0x21 response gets no reply; 0x20 is answered from 0x122; 0x35 status 1 yields its reply plus exactly one 14 B type-4 0x22 indication and ready() turns true; a late 0x20 gets no second completion; BYE then stale DATA is ignored; a refused send leaves INIT_DRIVER pending and flush delivers the padded 188 B datagram; short datagrams, null arguments, a wrong instance, a wrong service and node 0 are rejected. run-host-tests.sh is rc0 with that line plus bringup 12, PAS 5, QRTR 13, PMIC 16, IPA M0/RES/GSI, MDT, GSI DMA, IPA SMMU, QMAP, QMI, QMI SERVER, QMI TRANSPORT, ARM SMMU and FW LAYOUT. 0623 is 173,712 B over eighteen files with pong_ipa_qrtr.h/.c added by gen-ipa-patch.py and registered in append-conffiles.py; the first k27 build failed with \"K60ModemQrtr.h\" file not found because the kernel copy needs 0622's pong_modem_qrtr.h, and b11af099 fixes the rename. The k27 kernel 105,582,592 B sha256 faac521b7431274126a6e453a33f67291ae4df09e7180dce06cb9c74c4ebd547 has _k60_ipa_qrtr_reset, _announce, _lookup, _receive, _flush and _ready, and was built offline; no image was packaged and no hardware ran." },
  { kind = "device", reference = "docs/research/cellular/19-MODEM-BRINGUP-FLIGHT.md", command = "bash scripts/flash.sh /mnt/e/k60-work/artifacts/modem-20261117k22/boot-modem-rails-only.img 240 ; python3 scripts/check-modem-flight-log.py --phase p1 E:/k60-work/evidence/usblog-20261119-042322/console.log", revision = "3e4497733cfca7d82ecb6470ffcf126ceaf624d6", result = "The k22 rail-only image 393d7f2f booted with bootAccepted=true and a complete 213,490 B capture (sha256 c94dceedd888e70f0dcf4ac761a51d403c5d4450bdaaa86cd59c863752a9e67e, stopReason budget, no panic or reset). console.log:481 reports the carrier present at 0x8bc00000; :484 is the only positive line, K60MODEM power ok cx=0x30000/6 mss=0x30060/7 xo=0x300b0/3; :485 is power prepared; :486 is the diagnostic stop after power with init_image not sent. There is no init_image, mem_setup, auth_reset or power failure line, and the mechanical judge prints P1: PASS (rc 0). This is the first hardware evidence for the three TCS4 modem rail votes and for the xo.lvl literal 3, so the HR-01 unverified row is closed at the P1 level; QRTR remains unobserved because this image never sends a PAS command. Same kernel a2139ecb, FD 40c29d51, payload kernel 229ebe50; no flash or partition write was issued." },
  { kind = "host", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "gcc -O1 -Wall -Wextra -Werror -DK60_HOST_TEST -I drivers/PongCellular -o /mnt/e/k60-work/artifacts/tests/t-k60-ipa-qmi-transport scripts/tests/test-k60-ipa-qmi-transport.c drivers/PongCellular/K60IpaQmiTransport.c drivers/PongCellular/K60IpaQmiServer.c drivers/PongCellular/K60IpaQmi.c ; bash /mnt/e/k60-work/artifacts/run-host-tests.sh ; python3 scripts/gen-ipa-patch.py ; PYTHONIOENCODING=utf-8 python3 scripts/tests/test-k60-ipa-patch.py ; llvm-nm --defined-only /mnt/e/k60-work/artifacts/modem-20261117k26/kernel.macho | grep _k60_ipa_qmi_transport", revision = "341f248aad46062acadcc0b9f2ffa0262116e4f3", result = "The IPA QMI transport glue is host-proven and compiled into a kernel image but has no runtime caller. test-k60-ipa-qmi-transport.c prints K60 IPA QMI TRANSPORT PASS start retry subscribe status complete exhaustion send-failure unhandled: the first start sends 154 B with transaction 1 and a retry before any response sends transaction 2; an accepted 0x21 response moves the state to DriverReady; 0x20 yields a 14-byte result-0 reply; 0x35 status 1 yields its reply plus exactly one 14-byte type-4 0x22 indication and ready() turns true; a later 0x20 gets no second completion; three unanswered starts exhaust at attempt 3 with transactions 1/2/3; a refused send of the INIT_DRIVER leaves 154 B pending and flush delivers it, and a refused completion send leaves 14 B pending with ready() false until flush; 0x99 answers result 1/error 94; null arguments are rejected. run-host-tests.sh is rc0 with that line plus bringup TESTS OK 12, PAS 5, QRTR 13, PMIC 16, IPA M0/RES/GSI, MDT, GSI DMA, IPA SMMU, QMAP, QMI, QMI SERVER, ARM SMMU and FW LAYOUT. 0623 is 163,645 B over sixteen files with pong_ipa_qmi_transport.h/.c added by gen-ipa-patch.py and registered in append-conffiles.py; test-k60-ipa-patch.py passes. The k26 kernel 105,582,592 B sha256 2713e297ffb5faacedddc476b1393a2ae6beeadf8ef7f82d8e30ce933b4f16c9 has _k60_ipa_qmi_transport_reset at fffffff00776be40, _start at fffffff00776be8c, _receive at fffffff00776bff0, _flush at fffffff00776c16c and _ready at fffffff00776c204; built offline, no image packaged, no hardware ran." },
  { kind = "host", reference = "docs/research/cellular/19-MODEM-BRINGUP-FLIGHT.md", command = "PYTHONIOENCODING=utf-8 python3 scripts/tests/test-check-modem-flight-log.py ; PYTHONIOENCODING=utf-8 python3 scripts/check-modem-flight-log.py --phase c /mnt/e/k60-work/evidence/usblog-20261118-234555/console.log", revision = "f0751ad253b517e0920a5507f5fda6d2d1d161a8", result = "The modem flight verdict is now mechanical instead of an ad-hoc grep. scripts/check-modem-flight-log.py applies section 4.1: phase p1 requires exactly one K60MODEM power ok line with xo voted as the literal 3, one power prepared line and one diagnostic stop after power, and rejects any init_image/mem_setup/auth_reset/transport line, any power failure and any duplicated positive line; phase c requires exactly one init_image ok with metadata=0xb7ff0000 bytes=5884, one mem_setup ok with base=0x8bc00000 span=0x13200000 and the auth-reset stop line, and rejects power/transport/auth leakage; phase b reports S3 (power, init_image, transport, mem_setup, auth_reset and no failure line) and S4 (the qrtr glink descriptor plus a non-placeholder dms revision) separately and fails on any unexpected line. The regression prints K60 FLIGHT LOG PASS p1 c b negative-cases after checking the xo index case, a PAS command leaking into p1, a duplicated stop line, transport leaking into c, a wrong mem_setup span, a missing transport line and a missing dms revision, and run-host-tests.sh is rc0 with that line. Re-judging the stored k18 C log E:/k60-work/evidence/usblog-20261118-234555/console.log prints C: PASS while the same log under --phase p1 prints FAIL, so the phases are not interchangeable." },
  { kind = "host", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "gcc -O1 -Wall -Wextra -Werror -DK60_HOST_TEST -I drivers/PongCellular -o /mnt/e/k60-work/artifacts/tests/t-k60-ipa-qmi-server scripts/tests/test-k60-ipa-qmi-server.c drivers/PongCellular/K60IpaQmiServer.c drivers/PongCellular/K60IpaQmi.c ; bash /mnt/e/k60-work/artifacts/run-host-tests.sh ; python3 scripts/gen-ipa-patch.py ; PYTHONIOENCODING=utf-8 python3 scripts/tests/test-k60-ipa-patch.py ; llvm-nm --defined-only /mnt/e/k60-work/artifacts/modem-20261117k25/kernel.macho | grep _k60_ipa_qmi_server", revision = "a65c8a279e9a92f7ba0275d18feb3460f992389c", result = "The IPA QMI server state machine is host-proven and compiled into a kernel image but has no runtime caller. test-k60-ipa-qmi-server.c prints K60 IPA QMI SERVER PASS attempts refused happy-path status configuration filter rules unhandled malformed: three INIT_DRIVER attempts carry transaction ids 1/2/3 and the fourth is refused; a refused 0x21 response moves the state to Failed and stops further attempts and the INIT_COMPLETE gate; an accepted response plus 0x20 plus a 0x35 status of 1 emits the exact 14-byte 0x22 indication once and ready() turns true; 0x35 status 0 answers result 1/error 1; 0x27 stores 20 bytes of configuration with the 0x10 and 0x13 field bits; 0x24 accepts pipe 3/status 1 and refuses pipe 40; 0x23 echoes two ids in a 26-byte reply; 0x99 answers result 1/error 94; short frames, a bad type, a stray response and null arguments are rejected or ignored. run-host-tests.sh is rc0 with that line plus bringup TESTS OK 12, PAS 5, QRTR 13, PMIC 16, IPA M0/RES/GSI, MDT, GSI DMA, IPA SMMU, QMAP, QMI, ARM SMMU and FW LAYOUT. 0623 is 156,864 B over fourteen files with pong_ipa_qmi_server.h/.c added by gen-ipa-patch.py and registered in append-conffiles.py; test-k60-ipa-patch.py passes. The k25 kernel 105,582,592 B sha256 f3b93c7900187bb9d9dc0e77a505b95da579337fa626c3c827d7ffe10ca29d6a has _k60_ipa_qmi_server_reset at fffffff00776b664, _k60_ipa_qmi_server_init_driver at fffffff00776b698, _k60_ipa_qmi_server_receive at fffffff00776b728, _k60_ipa_qmi_server_init_complete at fffffff00776bd98 and _k60_ipa_qmi_server_ready at fffffff00776be0c; built offline, no image packaged, no hardware ran." },
  { kind = "host", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "gcc -O1 -Wall -Wextra -Werror -DK60_HOST_TEST -I drivers/PongCellular -o /mnt/e/k60-work/artifacts/tests/t-k60-ipa-qmi scripts/tests/test-k60-ipa-qmi.c drivers/PongCellular/K60IpaQmi.c && /mnt/e/k60-work/artifacts/tests/t-k60-ipa-qmi ; bash /mnt/e/k60-work/artifacts/run-host-tests.sh ; python3 scripts/gen-ipa-patch.py ; PYTHONIOENCODING=utf-8 python3 scripts/tests/test-k60-ipa-patch.py ; llvm-nm --defined-only /mnt/e/k60-work/artifacts/modem-20261117k24/kernel.macho | grep _k60_ipa_qmi", revision = "2c986e3ffbf505d2c61257517057af048e4cdca5", result = "The IPA service 0x31 codec is host-proven and compiled into a kernel image but has no runtime caller. test-k60-ipa-qmi.c prints K60 IPA QMI PASS init-driver init-complete response parse classify driver-status rules: the INIT_DRIVER frame is 154 B with a 7-byte header and 17 TLVs whose 0x10/0x11/0x16/0x17/0x21/0x22 values match the base+offset table, INIT_COMPLETE is the 14-byte {4,0,0,0x22,0,7,0,2,4,0,0,0,0,0} indication, responses are 14 B (result TLV 0x02) and 30 B when three rule ids ride TLV 0x11, and the parsers reject wrong transaction/message/type, short frames, missing or two-byte status TLVs, more than 64 rules, truncated id lists and short capacity. run-host-tests.sh is rc0 with that line plus bringup TESTS OK 12, PAS 5, QRTR 13, PMIC 16, IPA M0/RES/GSI, MDT, GSI DMA, IPA SMMU, ARM SMMU, 0623 and FW LAYOUT. 0623 is 144,081 B over twelve files with pong_ipa_qmi.h/.c added by gen-ipa-patch.py and registered in append-conffiles.py, test-k60-ipa-patch.py passes. The k24 kernel 105,578,496 B sha256 70c707f59c4fd5313f954fa9ba9aacc38032eb7551f6d3195142f45483f6117d has _k60_ipa_qmi_build_init_driver at fffffff00776a920, _k60_ipa_qmi_build_init_complete at fffffff00776acd0, _k60_ipa_qmi_build_response at fffffff00776ad14, _k60_ipa_qmi_parse_response at fffffff00776b0a0, _k60_ipa_qmi_classify at fffffff00776b194, _k60_ipa_qmi_driver_status at fffffff00776b228 and _k60_ipa_qmi_rules at fffffff00776b2e4; built offline, no image packaged, no hardware ran." },
  { kind = "host", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "gcc -std=c11 -Wall -Wextra -I drivers/PongCellular -o /tmp/test-qmap scripts/tests/test-k60-ipa-qmap.c drivers/PongCellular/K60IpaQmap.c ; bash /mnt/e/k60-work/artifacts/run-host-tests.sh ; python3 scripts/gen-ipa-patch.py ; PYTHONIOENCODING=utf-8 python3 scripts/tests/test-k60-ipa-patch.py ; llvm-nm --defined-only E:/k60-work/artifacts/modem-20261117k23/kernel.macho | grep qmap", revision = "673330c16b9f3635a9b57c2615518da4c1cc174d", result = "The QMAP codec is host-proven and compiled into a kernel image but has no runtime caller. test-k60-ipa-qmap.c prints K60 IPA QMAP PASS frame_bytes encode decode aggregate header-errors round-trip: aligned and unaligned encodes with a 0xa5 guard byte, refused null/zero/mux 0 and 255/padded length above 0xffff/short capacity, 0xffff-3 accepted, decode of single frames, truncated header and payload, null buffer and receiver, an aggregate of mux 1 + a command frame + mux 4 + mux 3 with padding trimmed by length-pad, zero-length/pad>length/reserved/mux 0/trailing partial errors, and 1..64-byte round trips across mux 1..4 plus a 1492-byte MTU frame. run-host-tests.sh is rc0 with that line plus bringup TESTS OK 12, PAS 5 groups, QRTR 13, PMIC 16, IPA M0 version=5.256.2/RES/GSI, MDT, GSI DMA, IPA SMMU, ARM SMMU mair=0x4ff44 tables=6 leaves=267, 0623 IPA PATCH and FW LAYOUT. 0623 is 128,623 B over ten files and test-k60-ipa-patch.py passes. The k23 kernel 105,578,496 B sha256 3fe1b577c164a2e89806821223bdfe3c79c9bfa904ff492d710dcf3322235a91 has _k60_ipa_qmap_encode at fffffff00776a6e0, _k60_ipa_qmap_frame_bytes at fffffff00776a6cc and _k60_ipa_qmap_decode at fffffff00776a79c, and was built offline; no image was packaged and no hardware ran." },
  { kind = "host", reference = "docs/research/cellular/19-MODEM-BRINGUP-FLIGHT.md", command = "llvm-objdump -d --no-show-raw-insn E:/k60-work/artifacts/modem-20261117k22/kernel.macho (in _k60_modem_rails_vote) ; python3 scripts/update-modem-qrtr-patch.py --check ; python3 scripts/tests/test-k60-modem-image.py ; bash /mnt/e/k60-work/artifacts/run-host-tests.sh", revision = "3e4497733cfca7d82ecb6470ffcf126ceaf624d6", result = "xo.lvl is voted as the literal 3 that Pong votes (references/pong-baseband/PongModemRuntime.cpp:159) instead of a cmd-db level index: in _k60_modem_rails_vote the k22 kernel has 3 k60_modem_vote_tcs4 calls, 2 k60_modem_find_rail calls (cx/mss) and 1 k60_cmd_db_find (xo), and the third vote is preceded by mov w3, #0x3 at fffffff00776320c. scripts/update-modem-qrtr-patch.py regenerates the five 0622 new-file hunks (include renames plus qcom_glink_ -> k60m_glink_), test-k60-modem-image.py passes, and the host suite still prints TESTS OK 12. The k22 kernel a2139ecb and the pong_modem=4 image 393d7f2f are built offline and not flown; the same kernel is packaged as the B image 82c0cab3 (payload 1baec54f, payload kernel 229ebe50), also verified by scripts/verify-boot-image.py and test-bootimg-layout.py and also not flown." },
  { kind = "host", reference = "docs/research/cellular/19-MODEM-BRINGUP-FLIGHT.md", command = "bash /mnt/e/k60-work/artifacts/run-host-tests.sh ; python3 scripts/update-modem-pas-patch.py --check ; python3 scripts/tests/test-k60-modem-image.py", revision = "fbc03066be4174ee21d90d2827311f2896ef2a8f", result = "The rail-only diagnostic phase is host-proven: test-k60-modem-bringup.c prints TESTS OK 12 and records rails -> init_image -> mem_setup -> auth_reset for the full phase, exactly one k60_modem_rails_vote() and zero PAS calls for phase 2 (pong_modem=4), a rail failure of -7 stopping before init_image, and a copy failure voting no rail; the rest of the suite passes (PAS 5, QRTR 13, PMIC 16, IPA M0/RES/GSI, MDT, GSI DMA, IPA SMMU, ARM SMMU mair=0x4ff44 tables=6 leaves=267, 0623, FW LAYOUT). 0621 is regenerated by scripts/update-modem-pas-patch.py (112/135/232-line new-file hunks plus the 8-line kern_exec call site) and test-k60-modem-image.py passes. The k21 kernel and the pong_modem=4 image are built offline; the modem rails still have no device observation, so the HR-01 ledger row stays unverified." },
  { kind = "device", reference = "docs/research/cellular/19-MODEM-BRINGUP-FLIGHT.md", command = "K60_DEVICE_INPUT=/mnt/e/k60-work/mirror-k14-device bash scripts/flash.sh /mnt/e/k60-work/artifacts/modem-20261117k20/boot-modem-ipa-only.img 240 ; K60_DEVICE_INPUT=/mnt/e/k60-work/mirror-k14-device bash scripts/flash.sh /mnt/e/k60-work/artifacts/modem-20261117k20/boot-modem-ipa-only-m2.img 240", revision = "a2ba2e2264835f20f343dfb38a2233eacf053630", result = "Two hardware PASSes on 2026-11-19. p1 (41abb125..., pong_ipa=1) at 01:21:54: console.log:480-494 shows firmware source=0x8b900000 bytes=57344, plan span=0x9000 metadata=0xe8c, scm cmd=0x1 rc=0 calls=5 x0=0 x1=0 (INIT_IMAGE resumed four times), init_image ok, mem_setup ok base=0x8b910000 span=0x9000 (calls=1), auth_and_reset ok (cmd=0x5, calls=1), post-PAS GSI status=0x1 channels=28 events=27, version=0x45 comp=0x50010000, resources ready=1, M2 runtime gated. p2 (b2474eea..., pong_ipa=2) at 01:30:21: same PAS15 then M2 ring=0x90d50d000 tables=0x90d60d000, SMMU idr/context id0=0x4c017e71 id1=0x6000004b id2=0x5111 cbar=0x1f300 sctlr=0x27, bank=72 slot=110 pages=6 leaf=268 smem=0x809e3000/0xa000, GSI ready stage=10 restricted=0 sram=0x5000 completed=3. Evidence E:/k60-work/evidence/usblog-20261119-012152 (2,783 lines, sha256 8fc784e5...) and usblog-20261119-013021 (3,204 lines, sha256 8218c3ca...), both stopReason=budget with no panic/reset; boot.json bootAccepted=false is the known PowerShell stderr artifact and fastboot.log shows Sending/Booting OKAY." },
  { kind = "source", reference = "docs/research/cellular/04-DT-NODES.md", command = "dtc -I dts -O dtb -o new.dtb -i <soc:dts> dts/mondrian.dts ; python3 /tmp/dtcheck/controlled.py", revision = "d5a99397697ca99f6f1aed1597e0d508f59dc281", result = "The four approved nodes are in dts/mondrian.dts as lines 229-390, 192 insertions and no deletions. None of them carries status or unixnu,adt-name, so the exported ADT set stays ['intc','pong-audio','ufshc'], the tree still holds two status properties and three adt-name properties, and arm_io_window stays (0x1000000, 0x17000000). dtc 1.7.0 compiles with no warnings. The DTB grows from 27 to 39 nodes with 12 added, none removed and no property changed on the 27 pre-existing nodes. ADT generation is not deterministic because chosen random-seed is os.urandom(256) at devicetree.py:310, so the proof is a masked comparison: feeding the baseline DTB and the patched DTB through the same board configuration yields 15736-byte ADTs that differ only in the 256-byte random-seed window at offsets 372-628, and both hash to b0dc4beed52129983cfdb00f933347be6b22aa9909502741eb63ba27a7a3dd5f once that window is masked." },
  { kind = "device", reference = "docs/research/cellular/01-ANDROID-INVENTORY.md", command = "adb -s 6033dbec shell 'su -c \"ls -l /vendor/firmware_mnt/image/\"' ; adb -s 6033dbec shell getprop | grep -i baseband ; adb -s 6033dbec shell 'su -c \"od -An -tx1 -N 52 /vendor/firmware_mnt/image/modem.mdt\"'", revision = "90d82717b075b0226048f3894c5c65330c7266d5", result = "modem_a is /dev/block/sde7 at 389120 KiB (380 MiB, fastboot agrees: 0x17C00000) and is mounted read-only vfat at /vendor/firmware_mnt. Its image directory holds 30 modem.* files totalling 109072529 bytes (104.02 MiB); modem.b14, b21 and b30 are absent because those segments are pure bss. modem.mdt is ELF32 little-endian, e_type 2, e_machine 0xA4 (QDSP6, not AArch64), e_entry 0x8bc00000, e_phoff 52, e_phentsize 32, e_phnum 32. gsm.version.baseband reads MPSS.DE.2.0.c1-CN-Jan 13 2026-02:08:51 twice, once per SIM slot, and matches mbn_build_utc.txt 1768269985 (2026-01-13T02:06:25Z) to within 2.5 minutes." },
  { kind = "device", reference = "docs/research/cellular/02-DT-TRUTH.md", command = "adb -s 6033dbec shell 'su -c \"od -An -tx1 /sys/firmware/devicetree/base/soc/remoteproc-mss@04080000/reg\"' ; .../reserved-memory/mpss_region@8bc00000/reg ; .../glink-edge/qcom,modem_qrtr/qcom,glink-channels ; 'su -c \"ls /sys/bus/pci/devices/\"'", revision = "90d82717b075b0226048f3894c5c65330c7266d5", result = "The live FDT is 919210 bytes (sha256 da19d6bb1423e571c2fff93ef341e2d6b7b8b6668512da7a981551de32c4b941). remoteproc-mss@04080000 is qcom,cape-modem-pas at 0x04080000/0x10000, status ok, with cx-supply PM8350C S6 and mx-supply PM8350C S4, memory-region pointing at mpss_region 0x8bc00000 size 0x13200000 and at linux,cma, IPCC signals fatal 0, handover 1, ready 2, stop-ack 3, shutdown-ack 7, and glink-edge transport smem with remote-pid 1 and child qcom,modem_qrtr whose qcom,glink-channels is IPCRTR with intents (0x800,5) (0x2000,3) (0x4400,2). Only two PCIe devices exist: 0000:00:00.0 17cb:0110 root port and 0000:01:00.0 17cb:1103 QCA6490 WLAN, so mhi_qrtr_cnss with dev-id 0x1103 is WLAN and not the modem." },
  { kind = "device", reference = "docs/research/cellular/03-SCOPE.md", command = "adb -s 6033dbec shell 'su -c \"grep -i qipcrtr /proc/net/protocols\"' ; 'su -c \"ls /sys/class/remoteproc/\"' ; 'su -c \"/vendor/bin/qrtr-lookup 0 1\"' ; getprop | grep init.svc", revision = "90d82717b075b0226048f3894c5c65330c7266d5", result = "AF_QIPCRTR is registered by module qrtr (size 888, 0 sockets at sample time) and qrtr-ns runs as pid 1974 with fds 0-2 on /dev/null and fd 3 on socket:[60178]; there is no /dev/qrtr node, no /dev/socket/qrtr socket and ss -x shows nothing, so QRTR is a kernel protocol family and not a unix socket. remoteproc2 is 4080000.remoteproc-mss running modem.mdt, bound to qcom_q6v5_pas. qrtr-lookup prints only its header row on stdout but writes 8209 bytes to /data/vendor/qrtr/qrtr-lookup.txt; that file lists 36 QMI services answering on node 0, including 21 Modem embedded file system, 1 Wireless Data Service, 11 User Identity Module, 3 Network Access Service and 16 Location service, plus 64 Service registry locator service on node 1 and DIAG 4097 split across MODEM, LPASS, WCNSS, SENSORS, CDSP and WDSP instances. strace confirms socket(AF_QIPCRTR, SOCK_DGRAM) followed by a 20-byte broadcast NEW_LOOKUP to node 0xffffffff and about 100 20-byte replies." },
  { kind = "host", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "bash /mnt/e/k60-work/artifacts/run-host-tests.sh ; llvm-nm --defined-only /tmp/k60-modem-20261117c/mondrian/ipados-16.6.1-20G81/mondrian/kernel/kernel.macho | grep k60_ipa", revision = "4405e3710e64ee249335bb4574b1d5b5f1336a4a", result = "M0 host gates pass: bringup 9, PAS 5 groups, QRTR 13 groups, PMIC 16, K60 IPA M0 PASS version=5.256.2, K60 IPA PATCH PASS 0623 and IPA FW LAYOUT PASS. The rebuilt kernel is 105,521,152 B sha256 31991c62e390a6f61b4ebaad9b6228c4a0fb02f34b396d83cb746eb0ded7b2f8 and llvm-nm shows _k60_ipa_probe, _k60_ipa_decode_comp_hw_version and _k60_ipa_marker. Patch 0623 compiles bsd/dev/pong_ipa.c. No IPA register was mapped and coachz_modem_data_send still returns ENETDOWN." }, { kind = "host", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "bash /mnt/e/k60-work/artifacts/run-host-tests.sh ; llvm-nm --defined-only /tmp/k60-modem-20261117c/mondrian/ipados-16.6.1-20G81/mondrian/kernel/kernel.macho | grep -E 'k60_mdt|k60_ipa_firmware'", revision = "c00be8a550a019d0b471fad088a67f7818efb3ad", result = "M1 offline preparation is in K60Mdt.h/K60Mdt.c and K60Ipa.c: k60_ipa_firmware_check() parses ELF32 headers, requires non-ELF64, relocatable, min_address 0, span <= 0x10000 and metadata <= 0x2000. Host tests pass: K60 MDT PASS span=8192 metadata=164 loads=1 split=180 and K60 IPA PATCH PASS 0623 carries pong_ipa.h/.c and pong_mdt.h/.c; the kernel is 105,521,152 B sha256 93858624df37a534ec592755869e56aedfb4c170136c0b3232cc7b1fd11a406c and llvm-nm shows _k60_mdt_parse, _k60_mdt_metadata_size and _k60_ipa_firmware_check. No PAS 15 call and no register access yet." },
  { kind = "host", reference = "patches/qcombaseband/README.md", command = "wsl.exe -d Ubuntu-24.04 -- bash /mnt/e/k60-work/artifacts/run-native-kernel.sh", revision = "8af93c9aae2b9867845657f9e9a54c8cef69ba20", result = "The device patch applies to upstream dd0199cf at build time and produces the same compiled source as the former private branch: build-report compiled_sha256 9a51613d61c88d309a75ccebd0c7d1342667b3e4188897a9a483a1d49789e0b2, object a41ffde3f86f26651224e033902bdc9cf9b154894c4dcf02a6c3f7632cbfef19, archive 9a3aaff25e2a37e50e6912a270686c94efa4b42848e1a5837240c8aae1c2df47, device_patch true. The resulting kernel is 105,521,152 B sha256 20361c9f6f440221f529e11797ffb81f4c5d23f8540efe3034b3571b0a06afb4; the hash differs from k b69fc456 because the staged compile path differs, not because the source differs. No device observation yet." },
  { kind = "host", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "bash /mnt/e/k60-work/artifacts/run-host-tests.sh ; llvm-nm --defined-only /tmp/k60-modem-20261117c/mondrian/ipados-16.6.1-20G81/mondrian/kernel/kernel.macho | grep -E 'k60_ipa_firmware|k60_mdt'", revision = "04dfde6c52889a09e992dea96b3140c9ba3fd450", result = "M1 staging passes host: K60 IPA FW PASS size=40376 span=0x9000 metadata=0xe8c loads=3 reloc=1 and K60 IPA STAGE PASS span=0x9000 metadata=0xe8c loads=3 against the real Xiaomi mondrian ipa_fws.mbn (sha256 305173004278a0fbb79aaff1683033226a423822499cc02f626768252d48b5b6). Kernel 105,521,152 B sha256 d2b2e8b76e826656f140b6f0253c4a141d90bdf2fbe8e191656b3eb6ee379608 has _k60_ipa_firmware_check, _k60_ipa_firmware_stage, _k60_ipa_firmware_start, _k60_ipa_pas_call, _k60_mdt_parse, _k60_mdt_metadata_size and _k60_mdt_place. k60_ipa_firmware_start() maps 0x8b900000/0x10000 and 0x8b90e000/0x2000, sends PAS 15 INIT_IMAGE/MEM_SETUP/AUTH_AND_RESET and reads IPA_VERSION, but has no caller yet and there is no device observation." },
  { kind = "host", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "bash /mnt/e/k60-work/artifacts/run-host-tests.sh ; llvm-nm --defined-only /tmp/k60-modem-20261117c/mondrian/ipados-16.6.1-20G81/mondrian/kernel/kernel.macho | grep -E 'k60_ipa_firmware|k60_ipa_probe|k60_mdt'", revision = "d6f1e719a566651da59f6122e36c736c1d2b17af", result = "M1 caller and IP0 clock pass host: K60 IPA FW PASS size=40376 span=0x9000 metadata=0xe8c loads=3 reloc=1, K60 IPA STAGE PASS span=0x9000 metadata=0xe8c loads=3, K60 IPA PATCH PASS 0623 and 0624. Kernel 105,558,016 B sha256 1bee79534cb8e2c2660774eff1a781da52baa163910c20d82f9768b32ebd4064 has _k60_ipa_firmware_check, _k60_ipa_firmware_stage, _k60_ipa_firmware_start, _k60_ipa_pas_call, _k60_ipa_probe_from_handoff, _k60_mdt_parse, _k60_mdt_metadata_size and _k60_mdt_place. k5 candidates C boot c5a2034c..., C0 aa24aa9b..., IPA-only cc872deb..., B 93993909...; all boot headers kernel_size 559,476 and ramdisk 201,326,592, all FD e007de8a match. No device observation." },
  { kind = "host", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "bash /mnt/e/k60-work/artifacts/run-host-tests.sh ; llvm-nm --defined-only /mnt/e/k60-work/artifacts/modem-20261117k6/kernel.macho | grep -E 'k60_ipa_resources_prepare|k60_ipa_firmware|k60_mdt'", revision = "d822b1bf8dada1bbfb8dff6fbb109435a1f9e484", result = "M1 resource preparation passes host: K60 IPA M0 PASS, K60 IPA RES PASS (0x2c=0x180, 0x54=0x1200, 0x58=0x1200, 0x4ac=0x180e8e, 0x4b4=0xb63, 0x4b0 bit31, 0x6a0=0xc0e00ecf, 0x6a4=0xffffff9f), K60 IPA FW PASS size=40376 span=0x9000 metadata=0xe8c loads=3 reloc=1, K60 IPA STAGE PASS span=0x9000 metadata=0xe8c loads=3, K60 IPA PATCH PASS 0623/0624, IPA FW LAYOUT PASS. Kernel 105,558,016 B sha256 90e2d682a53134f5b162367ffa7d7a2cdfbb671f7536bafab624cec0d3a16ad9 has _k60_ipa_resources_prepare, _k60_ipa_firmware_check, _k60_ipa_firmware_stage, _k60_ipa_firmware_start, _k60_ipa_pas_call, _k60_ipa_probe_from_handoff, _k60_mdt_parse, _k60_mdt_metadata_size and _k60_mdt_place in llvm-nm. k60_ipa_firmware_start() now refuses a GSI EE0 already enabled before PAS and reports post-PAS GSI status/channels/events. No device observation." },
  { kind = "host", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "bash /mnt/e/k60-work/artifacts/run-host-tests.sh ; llvm-nm --defined-only /mnt/e/k60-work/artifacts/modem-20261117k6/kernel.macho | grep -E 'k60_ipa_gsi|k60_ipa_resources|k60_ipa_firmware'", revision = "b636f2e5c73ddea2336eaf69611bce24c36102b3", result = "M2a GSI ownership gate passes host: K60 IPA M0 PASS, K60 IPA RES PASS, K60 IPA GSI PASS (status=0 channels=13 events=1 cmd=0 ev0=0 accepted; status bit0 rejected as busy), K60 MDT PASS, K60 IPA PATCH PASS 0623/0624, IPA FW LAYOUT PASS. k60_ipa_firmware_start() maps the GSI view before PAS and refuses a foreign EE0; no GSI ring, doorbell or SMMU context is programmed yet. No device observation." },
  { kind = "host", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "MSYS_NO_PATHCONV=1 wsl.exe -d Ubuntu-24.04 -- bash /mnt/e/k60-work/artifacts/run-host-tests.sh", revision = "5c2170912d36ce87c70b4ea0ea136977be4fe6e0", result = "M2 GSI command-DMA and SMMU host modules pass: K60 IPA GSI DMA PASS and K60 IPA SMMU PASS id0=0x40000078 id1=0x4e id2=0x1555 groups=120 banks=78 pages=2 slot=9 bank=77 smr=0x800005c0 s2cr=77 cbar=0x10000 cba2r=1, together with the existing bringup 9, PAS 5, QRTR 13, PMIC 16, IPA M0/RES/GSI, MDT, IPA PATCH and IPA FW LAYOUT gates. Patch 0623 is 102,164 B and carries pong_ipa_gsi.h/.c and pong_ipa_smmu.h/.c into bsd/dev plus the conffiles list. No kernel build has been made with these modules and no device observation exists." },
  { kind = "host", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "MSYS_NO_PATHCONV=1 wsl.exe -d Ubuntu-24.04 -- bash /mnt/e/k60-work/artifacts/run-host-tests.sh ; llvm-nm --defined-only /mnt/e/k60-work/artifacts/modem-20261117k7/kernel.macho | grep -E 'k60_ipa_runtime|k60_ipa_gsi|k60_ipa_smmu|k60_fat'", revision = "e7bdbf165ef0df3615a7678aa67aa43201a9afac", result = "M2 runtime glue passes host and kernel build: K60 IPA M0 PASS, K60 IPA RES PASS, K60 IPA GSI PASS, K60 IPA GSI DMA PASS, K60 IPA SMMU PASS, K60 MDT PASS, K60 IPA PATCH PASS 0623 and IPA FW LAYOUT PASS. Kernel 105,562,112 B sha256 09fd0a0cf2d8739ca58dd8cd1b505e9ab609de29e6e3b6d289e993541f53a285 has _k60_ipa_runtime_start, _k60_ipa_runtime_gsi, _k60_ipa_runtime_smmu, _k60_ipa_gsi_init/_start/_poll/_submit/_stop, _k60_ipa_smmu_plan/_configure and _k60_fat_open/_find in llvm-nm. The path is gated by pong_ipa_m2 and no device observation exists." },
  { kind = "host", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "MSYS_NO_PATHCONV=1 wsl.exe -d Ubuntu-24.04 -- bash /mnt/e/k60-work/artifacts/run-host-tests.sh ; llvm-nm --defined-only /mnt/e/k60-work/artifacts/modem-20261117k8/kernel.macho | grep -E 'k60_ipa_runtime|k60_ipa_gsi|k60_ipa_smmu|k60_fat'", revision = "50aa1261ad3beccccead7281ddf66fd9b5a59093", result = "The IPA M2 gate now uses the pong_ipa level so the arm64 command line stays within DarwinBoot 607 bytes: pong_ipa=1 runs M1 only and pong_ipa=2 adds the M2 runtime. Host suite passes K60 IPA M0/RES/GSI, K60 IPA GSI DMA, K60 IPA SMMU, K60 MDT, K60 IPA PATCH 0623 and IPA FW LAYOUT. Kernel 105,562,112 B sha256 f0d90680f0f47ab9dff989af2325b5b01aedcb4d86fc55e264d3ceae4f446fe9 has _k60_ipa_runtime_start/_gsi/_smmu plus the GSI/SMMU/FAT symbols. k8 M2 diagnostic images built with pong_ipa=2: C boot 5f73c42a7193855c754ad1d65efbe40b6f6682c4fbae466ff2abb2fbc063e554, C0 boot 4d9eb4d81082602a818e46c9ebd4a3c9e7b5fd584a888421d877f1e10534f114, IPA-only boot 61b54fa693d38808f514535ffda378e72d89473d84799d6dd386228ef5f7369f; all 201,895,936 B. No device observation." },
  { kind = "host", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "bash /mnt/e/k60-work/artifacts/run-host-tests.sh ; llvm-nm --defined-only /mnt/e/k60-work/artifacts/modem-20261117k9/kernel.macho | grep -E 'k60_ipa_firmware|k60_ipa_runtime|k60_ipa_gsi|k60_fat'", revision = "e4b5cfd5081702cf5ebef85850b2b9f871dbf27d", result = "IPA firmware now loads in the live-FDT ipa_gsi_region: k60_ipa_firmware_check() enforces span <= 0xa000, k60_ipa_firmware_stage() places segments at 0x8b910000, metadata stays at 0x8b90e000/0x2000, and the static assert pins FIRMWARE_BASE 0x8b910000 and FIRMWARE_BYTES 0xa000. Host suite passes K60 IPA M0/RES/GSI, K60 IPA GSI DMA, K60 IPA SMMU, K60 MDT, K60 IPA PATCH 0623 and IPA FW LAYOUT; t-k60-ipa with the real ipa_fws.mbn prints K60 IPA FW PASS size=40376 span=0x9000 metadata=0xe8c loads=3 reloc=1 and K60 IPA STAGE PASS. Kernel 105,562,112 B sha256 63645bc319df86a7e791e22049dccbf3616ae6ddcd0cbf60c4ff272d1f42c099 has _k60_ipa_firmware_check/_stage/_start, _k60_ipa_runtime_start/_gsi/_smmu, _k60_ipa_gsi_init/_start/_poll/_submit/_stop, _k60_ipa_smmu_plan/_configure, _k60_mdt_parse/_metadata_size/_metadata/_span/_place/_split/_split_read and _k60_fat_open/_find. k9 standard pong_ipa=1 images: C boot 59ce910456c5bd79f1744148fdc480a82330664fe0d21056faa910ccc6ea1036, C0 boot f39fb8df8018c7d8bf4672783a0f6cfd06c79586679102da63d877d05a73dc2b, IPA-only boot 79cd9c8cce79fa4f695708b30dbcc0017bce73b50d5f5e54438dbb92b17544bc, B boot a23925d5c546383420965ddc37e17dcec64047800abca94442ec995f3228eaaa; k9 M2 diagnostic images: C f237e6ef..., C0 367c3ff6..., IPA-only 0d1c2a69..., B-full 1e7bc4b9...; all 201,895,936 B. No device observation." },
  { kind = "host", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "MSYS_NO_PATHCONV=1 wsl.exe -d Ubuntu-24.04 -- bash /mnt/e/k60-work/artifacts/run-host-tests.sh ; llvm-nm --defined-only /mnt/e/k60-work/artifacts/modem-20261117k10/kernel.macho | grep -E 'k60_ipa_gsi_check_caps|k60_ipa_runtime|k60_ipa_firmware'", revision = "4764d1708b00e60e9dcae9ace640b94b983f7384", result = "The post-firmware GSI EE0 rule is fixed: k60_ipa_gsi_check_caps() now returns K60IpaGsiNoDevice when GSI_STATUS is 0xffffffff or bit0 is clear, because PAS AUTH_AND_RESET leaves EE0 enabled by TZ, while command12/event0 command state still returns Busy. The pre-PAS k60_ipa_gsi_check() keeps the opposite rule (status bit0 set means a foreign owner). Host suite passes K60 IPA M0/RES/GSI, K60 IPA GSI DMA, K60 IPA SMMU, K60 MDT, K60 IPA PATCH 0623 and IPA FW LAYOUT; patch 0623 is 120,650 B. Kernel 105,562,112 B sha256 7094936dd65b50e41f1ca9ef86ee48054fce0a39b08c1822e0445e704e2f4f8f has _k60_ipa_gsi_check_caps, _k60_ipa_runtime_start/_gsi/_smmu and _k60_ipa_firmware_start. k10 standard images: C boot 752346848d083c75196894eee2a8193fe0565c615ee8a283b444821def773829, C0 10f4665223d249ee98a6225f1d0cf61b8911bed8dd1e40c1c7bf116c9b40df86, IPA-only 54611cd3d55ac30505838fe07194e0531e9b7c90ec0f44f0d7922e995595c0dd, B 68e4f749bfb38d3881bc22720243fa7f2721808151d99635c5243c19edf870b8; k10 M2 diagnostic images: C 4661ab181a446f87f1eb1a67f59d940b380af7d5b840ba4c1023a658f47a23f9, C0 a3caf67d64564d3af76f288bbbc7d58c64708cb77945ec83ce413ef279d69d15, IPA-only 1c466e3379bc2c9c6f1fa5992c5e85494aa7cd8e543953446f995c2cabbdc183, B-full 1b0cf4e35c5e4d9e4eb12d2395dd6737f69fce2ba5767563c6c41e1d249eec63; all 201,895,936 B. No device observation." },
  { kind = "host", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "gcc -O1 -Wall -Wextra -Werror -I E:/hackios/k60-cellular/drivers/PongAdreno/ArmSmmu4K E:/hackios/k60-cellular/drivers/PongAdreno/ArmSmmu4K/ArmSmmu4K.c E:/hackios/k60-cellular/drivers/PongAdreno/ArmSmmu4K/ArmSmmu4KContext.c E:/k60-work/scratch/arm-smmu-k60-device-test.c -o /tmp/arm-smmu-k60-device-test && /tmp/arm-smmu-k60-device-test", revision = "b9de56b93b8c2404625282959cb22f772d034b17", result = "The K60 PongAdreno ArmSmmu4K builder now accepts Device-nGnRE (writeback=2) ranges and context encoding uses the builder MAIR instead of hard-coded 0xff44. The exact K60 IPA range set builds status=0, mair=0x4ff44, table_pages=6, leaf_pages=267; context status=0, mair0=0x4ff44 and readback status=0. Kernel 105,562,112 B sha256 06e31af42b066aba216e9af3705a8ebea5d7aa6d2c15fe224807b8a690caebd1 contains the new code. k11 M2 diagnostic images: C boot 6177500f695deee6d0449df5046f177105b6b3e9cb4aa97ba0574ff5033fe7d1, C0 c3f58d8f3a60946a2842592f44a05f87a53adf099975b2049eaa0e72cf094804, IPA-only 9639b6c21ba34a356b4acbf0e0fe9189f0189e40bdbc8fccc54f226e5b654be1, B-full 9d128c7c9bcc9e15aceab0bca89c27b4ddb913560c3e5b6a9a2a3590e9d3c6cf; all 201,895,936 B. No device observation." },
  { kind = "host", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "MSYS_NO_PATHCONV=1 wsl.exe -d Ubuntu-24.04 -- bash /mnt/e/k60-work/artifacts/run-host-tests.sh ; llvm-nm --defined-only /mnt/e/k60-work/artifacts/modem-20261117k11/kernel.macho | grep -E 'k60_ipa_|k60_mdt|k60_fat'", revision = "e8104c335a182f9f2008a2124b714a3a3ee991e8", result = "k11 standard pong_ipa=1 images are complete and recorded with docs commit e8104c33: C boot a97eafa1..., C0 91c846c7..., IPA-only 73fcab2c..., B 5fd14161...; k11 M2 diagnostic images C 6177500f..., C0 c3f58d8f..., IPA-only 9639b6c2..., B-full 9d128c7c...; all boots 201,895,936 B, kernel 06e31af4, payload_kernel 711ae92c...; manifest-k11.json 20/20 hashes. No device observation." },
  { kind = "host", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "MSYS_NO_PATHCONV=1 wsl.exe -d Ubuntu-24.04 -- bash /mnt/e/k60-work/artifacts/run-host-tests.sh ; llvm-nm --defined-only /mnt/e/k60-work/artifacts/modem-20261117k12/kernel.macho | grep -E 'k60_ipa_|k60_mdt|k60_fat'", revision = "71e7c43631317e7f5d307e1ecf5899811060c863", result = "The IPA SMMU diagnostic commit adds idr/context readback logging without behavioral change. Host suite passes all gates including K60 IPA SMMU, K60 ARM SMMU mair=0x4ff44, K60 IPA PATCH 0623 and IPA FW LAYOUT; patch 0623 is 121,062 B. Kernel 105,562,112 B sha256 1a394bea794d5fb59e9a93ae6ee28b6f1f6d25de1f36cece4cb9732c7d8533db has _k60_ipa_firmware_start, _k60_ipa_gsi_check_caps and _k60_ipa_runtime_smmu/_start. k12 standard pong_ipa=1 images: C boot 58d9dc0163cc8f619afe3f018b867d20e70f959569797e0fcdb4b5050a0b0567, C0 b77cd1d88b1cf5f14f491fcd84290037b5dd324f25623139555fb563b8502525, IPA-only d1ffb9834f39cc4f1da0200c0bff05a10579c841aa81c05fa452d6829aeb3239, B cabeef225d7cf992d29c4e81163a58db99568324a229d3425edac8fa9c6fc6d3; k12 M2 diagnostic images: C 603f25ce259fc7dbd1c9d788bd3c7c9d373deb514c7a3528e8c4b001ccde8b63, C0 fb8764cb12a85d44a5b543c7bffc030cd9116597b16a79e4ded15820bb8d4518, IPA-only 14a1eee6ed37660588f30f14d1becb3d2298081e8c36c7b64e4684be20e970dd, B-full 12428e2a5f9ad801e91eea4df3dd0c6bf0950d186274678f74e7fd1c4ecff194; all 201,895,936 B. No device observation." },
  { kind = "host", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "MSYS_NO_PATHCONV=1 wsl.exe -d Ubuntu-24.04 -- bash /mnt/e/k60-work/artifacts/run-host-tests.sh ; llvm-nm --defined-only /mnt/e/k60-work/artifacts/modem-20261117k13/kernel.macho | grep -E 'k60_ipa_|k60_smem|k60_mdt|k60_fat'", revision = "d828f3ab80814372923096e3c625e2e0ec846367", result = "M2 runtime now allocates or reuses SMEM item 497 under the TCSR SMEM mutex at 0x1f43000 before building its SMMU range: k60_ipa_runtime_smem_item() takes the mutex, calls k60_smem_alloc() (or k60_smem_find() when already present) and refuses SMMU setup when allocation or the 0x9000 size check fails. Host suite passes bringup 9, PAS 5, QRTR 13, PMIC 16, K60 IPA M0/RES/GSI, K60 MDT, K60 IPA GSI DMA, K60 IPA SMMU, K60 ARM SMMU mair=0x4ff44, K60 IPA PATCH 0623 and IPA FW LAYOUT; patch 0623 is 122,788 B. Kernel 105,562,112 B sha256 af9b211fd643fac97e434be81a11f5e70ed82462a8824a4266938cf66cd0fc1f has _k60_ipa_runtime_start/_gsi/_smmu, _k60_ipa_gsi_check_caps and _k60_ipa_firmware_start. k13 standard pong_ipa=1 images: C boot 99be2832395b59f5c0dd8003fa905795986e371d9e67971a65c1a5fe203f4ce6, C0 e637b8f4d364415f8b61a94302cd2e067e77942dea3766d5d197078fdac7845d, IPA-only 0834794155598661820951372f9f20e3c4e507548e1aa6b5aa684f8d874a0c5d, B 6a6ec196ac4ee3a20270d1b9d3ae1f96c6c9180e98545a1bef06e223b1900092; k13 M2 diagnostic images: C f3a8f9e887eed8a2367dcb1f507d3f13ae98f690142d4ace59f58b3dc5417fdb, C0 75ec7accad300df7c3bea5c10e2609e89625ed3486c57b0ace0226b153f85245, IPA-only 451a5da20c244aff2f1f0e0cc587f16be367832e03ea271a27acaaa855640e9d, B-full df80cc6fe6721147bab146e38844658e6e46e22b8f4f0d5abf8fec08360259f3; all 201,895,936 B, payload_kernel_sha256 0316a587e9bf1a92f3d245cff9d0dbcf9aad6840e3d2413efaecd9e3855595dd, manifest-k13 20/20 hash check. No device observation." },
  { kind = "host", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "MSYS_NO_PATHCONV=1 wsl.exe -d Ubuntu-24.04 -- bash /mnt/e/k60-work/artifacts/run-host-tests.sh", revision = "7d503bacd3339b7b4e282ab5c799ab7625127af9", result = "The K60 ARM SMMU host regression covers the exact M2 runtime geometry: the SMEM item 497 window is page-rounded 0x9000 when aligned and at most 0xa000 when not. ArmSmmu4KBuild returns status=0, mair=0x4ff44, 6 tables/267 leaves for 0x9000 and 6 tables/268 leaves for 0xa000, both with 8 table-page capacity. The full host suite passes. Test-only change, no kernel rebuild and no device observation." },
  { kind = "host", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "python E:/k60-work/artifacts/check-k14-manifest.py; wsl.exe -d Ubuntu-24.04 -- python3 /mnt/e/hackios/k60-cellular/scripts/porting-gate.py --quick; wsl.exe -d Ubuntu-24.04 -- python3 /mnt/e/hackios/k60-cellular/scripts/eight-step-gate.py --flash; wsl.exe -d Ubuntu-24.04 -- python3 /mnt/e/hackios/k60-cellular/scripts/check-boot-procedure.py; wsl.exe -d Ubuntu-24.04 -- python3 /mnt/e/hackios/k60-cellular/scripts/research-gate.py; bash scripts/k60-device.sh state", revision = "050ead379cffe5bc9362fc21337d1102145a7bf9", result = "2026-11-18 authorized M2 preflight was BLOCKED before boot, not a hardware test PASS. k14 manifest hashes pass 20/20, but K60Ipa.c:1196 calls k60_ipa_clock_vote(), which maps and reads DRV2 0x17a20000 at lines 578-587 and writes TCS4 including CONTROL_TRIGGER at line 532, contrary to the then-current blanket-write restriction in HR-01. Both pong_ipa=1 and pong_ipa=2 reach this path, so current k14 standard and M2 images are on hold. Default porting-gate --quick exits 1 because /opt/k60/trees/usb-cdc-mainline/device/patches/xnu/series is absent; no environment override or force-new-series was used. Eight-step --flash, boot-procedure and research checks exit 0, but do not override the blocker. Device was fastboot at the initial probe, none at 14:55 and fastboot again at 14:59; the hold applies regardless of device state. No boot command, partition write, PAS15 call or GSI runtime observation occurred; broad goal stays paused and the cellular line returns to standby." },
  { kind = "host", reference = "docs/research/cellular/19-MODEM-BRINGUP-FLIGHT.md", command = "MSYS_NO_PATHCONV=1 wsl.exe -d Ubuntu-24.04 -- bash /mnt/e/k60-work/artifacts/run-host-tests.sh ; llvm-nm --defined-only /mnt/e/k60-work/artifacts/modem-20261117k14/kernel.macho | grep -E 'k60_ipa_|k60_smem|k60_mdt|k60_fat'", revision = "5d59eab770a3749270c903519d28196a35b7b681", result = "k14 restores patches/xnu/0621-k60-io-submap-budget.patch, raising IO_MAP_SIZE from 8 MiB to 32 MiB so the IPA SMMU ml_io_map cannot exhaust the io submap before the console starts (P-219); the previous k13 set lacked 0621. Host suite passes bringup 9, PAS 5, QRTR 13, PMIC 16, K60 IPA M0/RES/GSI, K60 MDT, K60 IPA GSI DMA, K60 IPA SMMU, K60 ARM SMMU mair=0x4ff44 tables=6 leaves=267 runtime_tables=6 runtime_leaves=268, K60 IPA PATCH 0623 and IPA FW LAYOUT. Kernel 105,562,112 B sha256 619acc64a33fc4b62ba167b5034b81951ad09d971f6671feff7b10091d3272eb has _k60_ipa_runtime_start/_gsi/_smmu, _k60_ipa_gsi_check_caps and _k60_ipa_firmware_start. k14 standard pong_ipa=1 images: C boot fb002a47abc209385f09d180ebdcfa95895288c602f24ca762b19a4226763562, C0 7ca3e1197e95bfb1b22202bad80140a107f9f594b91156021447713b85b4f7f8, IPA-only 3bbed14172a675a4288770bf383065de3229065b26fe6a3f14cdc3783a2d786f, B e6c181dd67ca7f93aa7e06f0890f7fbc17d80b8c992894b5026068a88394baca; k14 M2 diagnostic images: C 002d9a57c4eda4d9f99f88ec082d9a9f38235bd02477eae0af231895d7a5d421, C0 a37a1bfbb20e9c96c4a9acb68ad11e6b2782883bbeacf62ad9e6ef9e2b5877ea, IPA-only 4748c0ad4db2e15c6a81765d6b8dbb96693848257410ec6ccb3bf6852f85addb, B-full 0dfbb46e34eba79c3ceae1382588f7253a161102378df473fe41855aa9e53667; all 201,895,936 B, payload_kernel_sha256 aa1a8136d66671ad7dfbbb9720f9d5bc7dc3b8ed684db3be0f30c19d6498e70d, manifest-k14 20/20 hash check. No device observation." },
  { kind = "device", reference = "docs/research/cellular/20-IPA-V51-DATA-PATH.md", command = "K60_DEVICE_INPUT=/mnt/e/k60-work/mirror-k14-device bash scripts/flash.sh /mnt/e/k60-work/artifacts/modem-20261117k15/boot-modem-ipa-clock.img 240", revision = "d57634b4cce40bd872093f724736aec5c51e9246", result = "2026-11-18 15:57 single-variable IP0 clock probe PASS: kernel 105,562,112 B sha256 4e40af75da047f431195ad24bb79befa2c93d38b611ddc3a8085325ace563c60, boot image 201,895,936 B sha256 d704e37635ea684e5fe0c7979f79a235109d793f861ac1fa5ffd6ce3771e5790, args pong_modem=0 pong_ipa=1 ipclk=1 (607 bytes). console.log:480-483 prints K60IPA probe begin, clock probe begin, K60IPA IP0 clock address=0x50040 unit_khz=40 vote=0x60000bb8 ok, clock probe result rc=0; the probe stopped before payload FAT/PAS/SMMU/GSI and the boot continued to userspace. Evidence E:/k60-work/evidence/usblog-20261118-155707, capture complete 234,239 bytes sha256 1771F197B22D44924D02676AC5B97EAD15CE4029E3D9EE4CBB8F6D0E9DC40242. HR-01 ledger promoted; k14/k15 IP0 hold lifted; PAS15/IPA_VERSION/GSI remain unobserved." },
  { kind = "device", reference = "docs/research/cellular/19-MODEM-BRINGUP-FLIGHT.md", command = "K60_DEVICE_INPUT=/mnt/e/k60-work/mirror-k14-device bash scripts/flash.sh /mnt/e/k60-work/artifacts/modem-20261117k16/boot-modem-c-diagnostic-m2.img 240", revision = "8842352c8ac650b4bac1a548692cf78cdb74e904", result = "2026-11-18 20:42 k16 C-M2 flew and did NOT pass. Boot 201,895,936 B sha256 25b21fcdc43d573be323e5020438e8b04b0ee3401b80df8daf68cbf25350c0a5; evidence E:/k60-work/evidence/usblog-20261118-204241 capture complete 34,071 B, console.log 587 lines sha256 25a9b5aae99681f5cdee41715589cca7c17ac4353b788922b658ae7960941642. bootAccepted=true/exitCode=0. The k14 loader Device Error did not reproduce: XNU, USB CDC, UFS/APFS, display and touch started. console.log:475-478 shows carrier present and copy skipped. console.log:479-480 is scm cmd=0x1 rc=-1 x0=0x1 x1=0x82; QCOM_SCM_INTERRUPTED=1, so PAS4 was not finally denied and the old single-smc wrapper never resumed it. No mem_setup/auth_reset/QRTR; no PASS. GUI did not appear; GPU PAS13/CP failed at :539-546 and the diagnostic pong_metal=2 image differs from the 20:16 GUI image in kernel/FD/args, so the failure cause is not isolated. K60AUTORESET 300 s returned the device to fastboot; no reset marker was captured." },
  { kind = "host", reference = "docs/research/cellular/06-MODEM-PAS.md", command = "bash drivers/PongCellular/tests/run-modem-scm-continuation.sh ; python3 scripts/tests/test-k60-modem-image.py /mnt/e/k60-work/firmware/modem", revision = "92657c8f98f7b81f01dc0401e7a49921f0e98741", result = "PAS4 now resumes QCOM_SCM_INTERRUPTED with x0=1, the original x1..x5/x7 and the returned x6, up to 100 total calls; exhaustion returns K60ModemPasInterrupted=-3 instead of a false denial. The host test compiles the actual K60ModemPas.c with only the SMC instruction replaced and covers 8 groups including repeated interrupts, monitor-clobbered arguments, 64-bit context, terminal transport error, final payload denial, budget exhaustion and success on the 100th call. Existing 0621/host suite checks pass. k17 kernel 105,562,112 B sha256 9b21321f3ba3b0fd77c8b572381e1c5798c42bb627c89e01ea47d16a9d08164a was built offline with --skip-gates from source 92657c8f; it was not packaged or flown and is not a hardware result." },
  { kind = "host", reference = "docs/research/cellular/06-MODEM-PAS.md", command = "python3 scripts/check-modem-metadata.py", revision = "92657c8f98f7b81f01dc0401e7a49921f0e98741", result = "The metadata audit found the embedded 5,884-byte page was generated from the CRLF-contaminated modem.mdt, not modem.mdt.bin: 3,362 bytes differ and the 4,808-byte hash segment is shifted. The header is regenerated from the clean binary with CRC32 0xac600b5d and SHA256 78d5f2f45aefeab7d2920bc5753009ade0371aa7d9be5eb0f2d21a72704c1fb8, and check-modem-metadata.py passes 14 checks. No UEFI FD was rebuilt, no boot image was packed and no device action occurred." },
  { kind = "host", reference = "docs/research/cellular/19-MODEM-BRINGUP-FLIGHT.md", command = "python3 scripts/verify-boot-image.py --manifest <hash manifest>; python3 scripts/tests/test-bootimg-layout.py <boot.img>", revision = "bba7dcaab94c16490218767f8a6fb862467f9cfd", result = "k19 p1 and p2 both pass the tracked verifier: the embedded firmware volume is FD 40c29d513eab0dca410c36bceeef936244cf2a20c3233f48bbbaa8ae69a07386, the ramdisk slot equals payload.img (p1 f9c4eaec12ad025e1a77c31e5f70d5d3f8115734051da4b6e3ea798bdff41fd6, p2 50b4f7d0d87ba478ec316ee29a4aeff33cb25b9ba8ad0d163e12a4658f463af1), the payload kernel is 0f64b70374ed3a0b91eb6f8dc1c06b4968c418c43f7d92f3a269f7a004a98363 and the trailing DTB is 2d044eaa08b7e58c0510a33da795c960085e13d6943cd4c25e0e050e0bfa33cd. test-bootimg-layout passes kernel=560384 ramdisk=201326592 decompressed=3145840 DTB=4024. Manifest and flight notes are E:/k60-work/artifacts/modem-20261117k19/manifest-k19.json and FLIGHT-README.md. Both images are unflown; no device observation." },
  { kind = "device", reference = "docs/research/cellular/19-MODEM-BRINGUP-FLIGHT.md", command = "K60_DEVICE_INPUT=/mnt/e/k60-work/mirror-k14-device bash scripts/flash.sh /mnt/e/k60-work/artifacts/modem-20261117k18/boot-modem-c-diagnostic-m2.img 240", revision = "f6adcd9028037fee050f359f3d574ad395d33f5e", result = "2026-11-18 23:45 k18 C-M2 PASS of the C criteria. Boot 201,895,936 B sha256 1ae178bb5367366493a334eb5e93f000ab7a095ecdbcbe676bdaa13e39155e12; kernel 105,562,112 B sha256 f245d5066bdcba2ec5b79a274bd302619f0de0a0b58b20af5e19631f059bf784; FD 40c29d513eab0dca410c36bceeef936244cf2a20c3233f48bbbaa8ae69a07386. Evidence E:/k60-work/evidence/usblog-20261118-234555: bootAccepted=true, capture 39,372 B, stopReason=fastboot-return, console.log 648 lines sha256 FAF90D29B40EA8E2B995B5FC358CF3ABFEE30BF40FFBA2620F3273B067AF8099. Lines 482-484 print init_image ok metadata=0xb7ff0000 bytes=5884, mem_setup ok base=0x8bc00000 span=0x13200000, and diagnostic stop after mem_setup: auth_reset not sent; the C criteria are met and no auth_reset was sent. IPA PAS15 at 485-492 read the fixed window and staged firmware, then init_image returned rc=-7 with x0=1 x1=0x82 because K60Ipa.c still uses a single-SMC wrapper; this is outside the PAS4 C criteria but blocks the IPA path. Lines 519-613 show 64 K60EXC entries, with launchd shared_region failures at 570 and 581, before the device returned to fastboot; that is a separate userland issue and is not attributed to the modem. No fastboot flash, no auth_reset, no QRTR enumeration, and no B/full baseband PASS." },
]