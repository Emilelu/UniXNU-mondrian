# SOURCES.toml — 每个子系统"做之前必须考察"的参考源清单
#
# 用法：
#   1. 动手写某个子系统的代码之前，先打开下面列出的每一个文件
#   2. 在 examined 填日期，在 finding 写"从这个文件学到了什么"（>=20 字）
#   3. 跑 python3 scripts/research-gate.py，全绿才能构建
#
# 为什么需要这个：
#   2026-11-12 事实核查发现，同 SoC 兄弟移植的 wave12c-electrical.md
#   在本地躺了两天没被打开，却去抄了同仓库里另一台机器（POCO X5 Pro）
#   的驱动。根因不是"不知道要读"，是没有清单 + 没有强制。
#
# 铁则：path 必须是本地真实存在的文件；finding 必须是具体技术事实，
#       不能写"已阅读"三个字。

# ---------------------------------------------------------------------------
# 结构性限制（2026-11-14，写 path 前必读）
#   research-gate 只试两种 path 解析：
#     ① os.path.join(REPO, path)                  —— 本仓库相对，如 docs/research/...
#     ② os.path.join('/mnt/e/k60-work', path)     —— 如 references/...、reports/...
#   所以下面这些仓库的 path 一定判「文件不存在」，只能写进 REFERENCE-INDEX.md 正文：
#     - /mnt/e/hackios/QcaBluetooth   （蓝牙唯一实现副本，见 REFERENCE-INDEX 第 5 节）
#     - /mnt/e/hackios/UniXNU-liuqin  （Xiaomi Pad 6 Pro，同 SM8475，见 2.1 与 9.1）
#     - /mnt/e/hackios/Device-Binaries （K60 厂商 panel XML 唯一副本：
#         marble/RawFiles/Panel_M11a_42_02_0a_amoled_dsc_cmd.xml，见 REFERENCE-INDEX 7.7
#         与 docs/research/display/RESEARCH.md 1.1；本仓库里没有 references/ 目录，
#         所以 display 子系统下面不能给它写 required 条目，只能靠正文与本文注释）
#   处理：Lead 侧加第三回退前缀或 K60_REPO 环境变量覆盖；本线不改 gate（铁则⑧）。
# ---------------------------------------------------------------------------

[subsystem.touch]
why = "触摸：协议、寄存器、总线节拍、电源时序"

[[subsystem.touch.required]]
path = "references/phk110-port/docs/phk110/waves/wave12c-electrical.md"
why = "同 SoC SM8475 触摸 PASS 全记录（20ms 节拍 + 分帧收割）"
examined = "2026-11-12"
finding = """同 SoC SM8475 触摸 PASS 全记录。核心：该 SoC 上触摸控制器每 CS 帧只吐一个响应块，块按约 20ms 节拍重新武装；微秒级续读会踩进未武装窗口读回错位填充。改成 20ms 节拍 + 9 字节分帧收割 + padding 收编后 Boot #21 首轮 PASS。错误路径：先判"芯片电气故障"是误诊，实际芯片一直在应答。"""

[[subsystem.touch.required]]
path = "references/phk110-port/docs/phk110/waves/wave12b-probe-verdict.md"
why = "同 SoC 触摸前一轮失败诊断（软件链 1-4 环闭环、第 5 环断点）"
examined = "2026-11-12"
finding = """同 SoC 触摸前一轮失败诊断。软件链 1-4 环（供电/复位、时钟决策、后端选定、引脚配置）全部寄存器级证实可达；断点在第 5 环 MISO 数据返回侧。关键教训：v1 窗 50/50 轮无一 0xA5 帧，但这是因为续读时机错误，不是芯片不响应。bitbang 后端与 GENI FIFO 完全解耦，FIFO 被禁不影响 bitbang。"""

[[subsystem.touch.required]]
path = "references/phk110-port/docs/phk110/waves/wave12a-touch-probe.md"
why = "同 SoC 触摸第一轮（GENI FIFO 禁用、bitbang 回退）"
examined = "2026-11-12"
finding = """同 SoC 触摸第一轮。两个可一击修复的事实：GENI 引擎本身活着（firmware 0x102 = SPI 协议），但 FIFO 接口被 SE 固件关闭（GENI_IF_DISABLE_RO bit0=1）；bitbang 回退被驱动里v1_read 第 787 行硬编码直呼 geni_transfer 完全屏蔽，绕过 spi_xfer 抽象。教训：抽象层里只要有一处直呼底层，回退路径就从未被测试过。"""

[[subsystem.touch.required]]
path = "references/phk110-port/docs/phk110/waves/wave12-touch-buttons.md"
why = "同 SoC 触摸板级真值（引脚、供电、复位、INT）"
examined = "2026-11-12"
finding = """同 SoC 触摸板级真值 + 关键架构差异：cape/sm8475 的 GCC 与 mainline sm8450 不同，FDT 时钟索引 m/s_ahb = 134/135，mainline 是 118/119（铁证）。wrap1 s_ahb 分支投票后不清 bit31，0x28008 读回 0x80000002。引脚：INT=GPIO21 level-low，RESET=GPIO20 active-low，VDD=GPIO97，SPI 四线 GPIO16/17/18/19。"""

[[subsystem.touch.required]]
