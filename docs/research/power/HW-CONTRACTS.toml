id = "sleep-report-guard"
lane = "power"
what = "the default definition of the driver-level switch around the two sleep report calls; a machine-config macro deletes them silently on any board that is not that config, and the sleep judge's REPORT criterion can then never pass"
source = "patches/xnu/0629-k60-sleep-trace.patch:12"
expect = "#define K60_PLATFORM_SLEEP_REPORT 1"
dependence = "macro"
preflight = ["check_report_guard"]
ios27 = "define K60_PLATFORM_SLEEP_REPORT in the 27 copy; without it the two guards below cannot compile the reports in"
same27 = "drift"
copy27 = "patches/xnu/0629-k60-sleep-trace.patch:7"
why27 = "the 27 copy has no K60_PLATFORM_SLEEP_REPORT at all: it opens with #if defined(PONG) at :7 and gates the calls at :61, so on the 12377 frame PONG is not defined and both reports vanish"

[[contract]]
id = "sleep-report-declarations"
lane = "power"
what = "the weak declarations of the two sleep report functions; guarding these with a machine config removes the calls' only declaration, so the call site cannot be compiled in even when the macro is defined"
source = "patches/xnu/0629-k60-sleep-trace.patch:15"
expect = "#if K60_PLATFORM_SLEEP_REPORT"
dependence = "macro"
preflight = ["check_report_guard"]
ios27 = "replace the 27 copy's #if defined(PONG) at :7 with #if K60_PLATFORM_SLEEP_REPORT around the armcpu_sleep_report / k60_platform_sleep_report declarations"
same27 = "drift"
copy27 = "patches/xnu/0629-k60-sleep-trace.patch:7"
why27 = "the 27 copy's declaration block is behind #if defined(PONG) at :7; a copy that only defines the macro still has no declarations when PONG is undefined"

[[contract]]
id = "sleep-report-call-site"
lane = "power"
what = "the guarded call sites of the two sleep reports after console_resume(); this guard is independent of the declaration block and of the macro definition"
source = "patches/xnu/0629-k60-sleep-trace.patch:69"
expect = "#if K60_PLATFORM_SLEEP_REPORT"
dependence = "macro"
preflight = ["check_report_guard"]
ios27 = "replace the 27 copy's #if defined(PONG) at :61 (closed at :68) with #if K60_PLATFORM_SLEEP_REPORT; defining the macro and fixing the declarations still leaves the calls compiled out"
same27 = "drift"
copy27 = "patches/xnu/0629-k60-sleep-trace.patch:61"
why27 = "the 27 copy gates the two report calls with #if defined(PONG) at :61; a copy that defines the macro but leaves this guard still compiles the calls out, which is why the preflight scans every PONG line in the patch"
[[contract]]
id = "sleep-report-declaration-armcpu"
lane = "power"
what = "the weak declaration of armcpu_sleep_report, the ArmCpu half of the sleep report pair"
source = "patches/xnu/0629-k60-sleep-trace.patch:19"
expect = 'extern "C" void armcpu_sleep_report(void)'
dependence = "macro"
preflight = ["check_report_guard"]
ios27 = "the 27 copy declares it at :11 under #if defined(PONG); this line has to stay declared independently of the machine config"
same27 = "same"
copy27 = "patches/xnu/0629-k60-sleep-trace.patch:11"

[[contract]]
id = "sleep-report-declaration-k60"
lane = "power"
what = "the weak declaration of k60_platform_sleep_report, the board half of the sleep report pair"
source = "patches/xnu/0629-k60-sleep-trace.patch:20"
expect = 'extern "C" void k60_platform_sleep_report(void)'
dependence = "macro"
preflight = ["check_report_guard"]
ios27 = "the 27 copy declares it at :12 under #if defined(PONG); a macro-only fix leaves this declaration compiled out"
same27 = "same"
copy27 = "patches/xnu/0629-k60-sleep-trace.patch:12"

[[contract]]
id = "sleep-report-call-armcpu"
lane = "power"
what = "the call to the ArmCpu sleep report after console_resume()"
source = "patches/xnu/0629-k60-sleep-trace.patch:71"
expect = "armcpu_sleep_report();"
dependence = "macro"
preflight = ["check_report_guard"]
ios27 = "the 27 copy calls it at :63 inside #if defined(PONG); fixing the declarations but not this guard still drops the report"
same27 = "same"
copy27 = "patches/xnu/0629-k60-sleep-trace.patch:63"

[[contract]]
id = "sleep-report-call-k60"
lane = "power"
what = "the call to the board sleep report after console_resume()"
source = "patches/xnu/0629-k60-sleep-trace.patch:74"
expect = "k60_platform_sleep_report();"
dependence = "macro"
preflight = ["check_report_guard"]
ios27 = "the 27 copy calls it at :66 inside #if defined(PONG); the judge observes the board report, so this guard alone can fail the criterion"
same27 = "same"
copy27 = "patches/xnu/0629-k60-sleep-trace.patch:66"
