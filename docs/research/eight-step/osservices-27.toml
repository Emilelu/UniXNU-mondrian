# osservices-27.toml — 顺序 8「OS 服务和打包」中安全与预检那一半的八步记录
#
# 范围（LANE-CONTRACT ios27 §0 + Lead 2026-11-21T16:34 裁决）：官方表第 8 行里 XnuPrelink 与
# DarwinBoot 之外的部分 —— SoftwareAES、AppleKeyStoreState、ShengPreflight，以及 205 个 prelink
# 指针槽里的「首次失败静默」子集（13 项）。kits/ 与 uefi-mondrian/Platforms/Xiaomi/DarwinBootPkg/
# 不归本线，只读引用。
#
# 八步（docs/engineering/EIGHT-STEP-SPEC.md）：
#   ① 同型   ② 官方   ③ 反编译   ④ 广域   ⑤ 方案   ⑥ 深挖   ⑦ 核验   ⑧ 上机
#
# 本文件只做 ①~⑦。⑧ `step.device` 由 Lead 在上机后写，这里有意不建。
# 纪律：没做过的步骤写 done = false 并写明缺什么、什么证据能定它；不要编。
#
# 每条 evidence 必须含可核查引用：file:line / URL / usblog-YYMMDD-HHMMSS / 0x… / P-xx。
#
# 行号约定：本文里 osfmk/ libkern/ security/ libsa/ bsd/ 的行号以 16:16 内核的构建快照为准
# （SN = /opt/k60/trees/ios27-out/mondrian/ios-27.0.1-24A446/mondrian_ios27/tree/build/xnu/
#  fileset-reference/snapshot-040b7fc83b90e0c9/source）。E:/hackios/xnu-12377 检出里同三处是
# startup.c:582/:627/:802；unreachable.toml 用的是更早一版 :478/:526/:689。三套不要混用。

[hardware.os_services]
name = "OS 服务与打包：SoftwareAES、AppleKeyStoreState、ShengPreflight（+ prelink 静默 13 项）"
label = "OS 服务与打包（安全与预检半边）"
status = "researching"
paths = [
  "docs/research/ios27",
  "scripts/check-osservices27-silent13.py",
  "drivers/",
  "board.toml",
  "configs/mondrian_ios27_defconfig",
]
why = '''本线负责的三项在 27 stage-0 全部未接入：board.toml 的 [os_overrides."ios-27.0.1-24A446"]（board.toml:341-410）只 include ArmDTPlatform/ArmCpu/XnuPrelink，configs/mondrian_ios27_defconfig（26 行）无任何安全/加密/AKS 开关，patches/xnu-12377/series（91 行）无 keybag/AKS/SoftwareAES/AMFI 补丁。
prelink 残留两个数字必须并列写：205 个指针槽 = 203 个不同目标地址 + 2 个被 IOHIDFamily 与 IOStorageFamily 共用的地址（0xfffffff00b430ab8、0xfffffff00b430bd4）。build 20（06:33）与 16:16 重建的 candidate_sha256 同为 dee01c54a73edf59…（93,061,120 B），kernel.json 的 stubbed = 203 项 / 25 bundle、missing = 3 项 / 3 bundle；上游 iPad17,3 24A446 基线是 2 missing / 24 stubbed。
13 项静默优先集 = 3 个目标（0xfffffff00b4320d8 / 0xfffffff00b432308 / 0xfffffff00b11a998）被 5 个 bundle 在 AMFI 的 early security init 里解引用；触发点是 kernel_bootstrap_thread() 的 mac_policy_initmach()（SN/osfmk/kern/startup.c:836），早于 bsd_init()（:926）与 USB 控制台，因此失败只在屏上、不进日志。'''
revisit = "Lead 一次 boot 后按 docs/research/ios27/osservices-27.md §B.3 的四行判据回填；A 段（三组件接入点）与 C 段（open→closed 判据表）随后补，不取消"

