[[area]]
id = "cpu"
status = "device-verified"
components = []
paths = ["package/CpuFreq*", "scripts/*armcpu*", "drivers/ArmCpu/**"]
inputs = ["Identify the cpu and interrupts hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for cpu and interrupts."]
procedure = ["Follow the cpu and interrupts stage in the porting guide and record the actual commands."]
findings = ["The SM8475 hardware MPIDRs are flat: 0x000..0x700, Aff1 = core index. That is what the vendor device tree and the Android tree carry, and this firmware rejects every CPU_ON target outside that table. The 4/3/1 A510/A710/X2 grouping seen in Android's sysfs is L2/L3 cache topology, not MPIDR affinity, and the kernel's cluster-type property (all 'P') is what collapses the eight cores into one topology cluster.", "A starting core is matched to its cpu data by MPIDR & 0xFFFF against the ADT's per-CPU reg, and the same value is the PSCI target, so the ADT must carry the real MPIDRs. The board dts must not override the SoC dtsi's cpu nodes: the ADT generator needs their compatible string and their unixnu,cluster-type."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["The eight cores register and the boot CPU takes its first IPI, but no secondary has yet been seen past its own entry checkpoint on hardware."]
next_action = ["Confirm that each secondary CPU runs its own entry checkpoint and serves a timer on the unit."]
evidence = [
  { kind = "device", reference = "README.md", result = "8 核全部启动（board.toml cpus = 8，PSCI 拉起 secondary）。" },
  { kind = "device", reference = "evidence/usblog-20261110-234429/console.log", result = "usblog-20261110-234429: K60 ex=510 kx=80 abn=25 | mem=4864 actual=4864 managed=4864 free_pages=532394" },
]

[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["docs/MEASURED-HIGH-WINDOW-2026-11-02.md", "dts/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*", "probes/**", "scripts/build-window-*", "scripts/test-window-qemu.py"]
inputs = ["Identify the memory and dma hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for memory and dma."]
procedure = ["Follow the memory and dma stage in the porting guide and record the actual commands."]
findings = ["Live serial-6033dbec /memory/reg and rooted /proc/iomem give six RAM banks with a 28 GiB hole at 4..32 GiB. The installed 12 GiB cannot be one XNU window: the longest contiguous unreserved run is 8.65 GiB (0x840000000..0xa69b78000).", "The 4 GiB window booted XNU at mem=actual=managed=4096 MiB. An 8 GiB window (arena equal to the whole 8 GiB) was refused: DXE occupies part of the arena, so DarwinBoot returned to the UniXNU menu.", "A 8.625 GiB arena [0x840000000,0xa68000000) with a 7 GiB window is accepted: loader printed window 0x1c0000000 bytes at pa 0x8400200000 and HANDOFF EXIT RETURN 0. DarwinWindowSizeValid caps a window at 8 GiB, so 12 GiB is not reachable at all.", "Screen trace of the 4 GiB boot: suggestd exits with status 163 signal 0 and ns=0 code=0x0, i.e. a normal exit status, not jetsam or a sandbox denial; disk5s APFS transactions keep completing (xid 2512, 140/140 finished), so the Data volume is not stuck."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["The 4 GiB window is the proven configuration; 7 GiB was accepted by the loader but XNU did not start, and 12 GiB is physically impossible as one window. The display/CA prerequisites from the reference project are present in our kernel; the open wall is userland contract/container handling, evidenced by ns=2 SIGABRT/SIGTRAP."]
next_action = ["Read the STR heap lines from the crash-string image to name the failing framework contract (container path, MobileGestalt, activation), then fix that one contract; display/CoreAnimation prerequisites are already audited as present."]
evidence = [{ kind = "host", reference = "docs/MEASURED-HIGH-WINDOW-2026-11-02.md", command = "python3 repair-high-window.py; build-uefi-8g.sh; build-kernel-summary.sh; package-textonly.py", revision = "48abe35d0a0a57f5fea9f9ba1e570800021ae6b1", result = "8.625 GiB arena and 7 GiB window; strict v4 round trip PASS; image sha256 8ea52daf4b3e926d4840e13a73fa00c9cadf9b3f1e97e1ececfdaa446e1afc34." }, { kind = "device", reference = "docs/MEASURED-HIGH-WINDOW-2026-11-02.md", command = "fastboot boot /mnt/e/k60-work/candidates/7g/boot-ios16-7g-textonly.img", revision = "e06211de59325bbd086c312324bdbf40e21d1045", result = "Loader accepted window 0x1c0000000 bytes at pa 0x8400200000 and HANDOFF EXIT RETURN 0; console output from XNU not yet observed." }]

