recorded_at = "2026-11-21T03:44:00+08:00"
evidence = "The order of record is docs/plans/BT-IOS27-PORT.md:107-127: 23 patches in four layers, with the device series carrying the 0500-0523 order (no 0513). The 0521 blob is a 106-entry manifest, not the 113-file payload (docs/plans/BT-IOS27-PORT.md:129-153). CI 44518998961 built the 23-patch kernel at 93,077,504 B, sha256 4e57f1822d352022b2a825f93ac41d653a149c63872a6cca8e42d505a0bb9f86 (docs/plans/BT-IOS27-PORT.md:265-274), but its head 33f5229 is not an ancestor of a2a75813 (git merge-base --is-ancestor returned 1). This tip also sets CONFIG_XNU_NATIVE_UFS=y at configs/mondrian_ios27_defconfig:21 while build/native-ufs/libNativeUfs.a is absent, so a build from this tip would stop in storage before Bluetooth."
files = ["docs/plans/BT-IOS27-PORT.md", "configs/mondrian_ios27_defconfig", "board.toml"]
plan = "For a BT-only compile use the 33f5229 config with NativeUfs off, or land the F3 archive; log the exact head sha, because this branch cannot reproduce the CI build."

[hardware.bluetooth.step.deep]
done = true
recorded_at = "2026-11-21T03:45:00+08:00"
evidence = "The prelink closure has 38 bundles and none is Bluetooth (docs/plans/BT-IOS27-PORT.md:523-526); the 28 missing and 29 stubbed entries are owner-target references, not Apple's Bluetooth kexts, so they neither prove nor disprove Bluetooth. The 0521 blob is an empty 106-entry manifest, not the 113-file payload (docs/plans/BT-IOS27-PORT.md:129-153 and docs/plans/BT-IOS27-PORT.md:511-513). 24A446 bluetoothd is not extracted, so the product-id answer remains unproven (docs/plans/BT-IOS27-PORT.md:580-586). The storage line's PENDING-safe entry prints the switch state last and refuses a half-set switch (scripts/check-ios27-storage-preflight.py:18-25); Bluetooth has no equivalent entry."
files = ["docs/plans/BT-IOS27-PORT.md", "scripts/check-ios27-storage-preflight.py"]
plan = "A BT preflight must fail on a missing [payload.runtime], a missing 24A446 bluetoothd, an ADT without one of the six properties, or a half-set F3/F4 switch."

