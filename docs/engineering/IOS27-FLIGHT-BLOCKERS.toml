what = "the 27 kernel links no block-storage provider at all: the series has zero ufs patches and the archive list has no NativeUfs, PongUfs or SourceStorage entry"
state = "closed"
observe_via = """offline only: `grep -c ufs patches/xnu-12377/series` must stop being 0, and `board.toml`'s 27 archive list must name the provider that builds it. Then the kernel link must report no undefined `IOBlockStorageDevice` symbol; today linking `libNativeUfs.a` reports eleven plus `_armcpu_timer_interrupts`."""
evidence = """measured 2026-11-24 after r290n: `grep -n 'ufs' patches/xnu-12377/series` prints nothing; the nine 27 archives are build-corecrypto-14.py, build-corecrypto-14.py --namespace, component:ArmDTPlatform, component:ArmCpu, build-libpthread-kernel.py, build-firehose-stub.py --tree ., build-k60-platform-archives.py --tree ., build-k60-fileset-reference.py --tree . --skip-build, build-k60-legacy-display-archive.py --tree ."""
why_open = """a kernel with no block-storage driver cannot mount a root volume, so no amount of interrupt-controller, console or prelink work reaches `bsd_init` completion. The 16.6.1 UFS fix (P-322) is real but belongs to a profile that links drivers/NativeUfs; 27 does not. Two routes exist and are documented in docs/research/ios27/ROOT-STORAGE-GAP.md: port NativeUfs with an IOBlockStorageDevice binding (blocked on eleven vtable symbols), or port sheng's source-storage path, which is the only route that has produced a 27 block device on a Pong-family board."""
