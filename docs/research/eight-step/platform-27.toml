docs/research/ios27/T0SZ-HUNK-INVENTORY.md 把 sheng 补丁逐 hunk 分成两组——13 个几何 hunk（proc_reg.h ×2、pmap_pt_geometry.h、pmap.c ×4、arm_init.c、start.s、arm_vm_init.c、sleh.c、vm_param.h）与 6 个搭车 hunk（proc_reg.h:1807 的 RT 缓存属性、pmap.c 的 HAS_16BIT_ASID 死代码 / is_dram 放宽 ×2 / sync_wimg、sleh.c 的 sheng 采样环），并给出两个载体（arm_init.c:357 的 C 版与 start.s:879 的汇编版）为什么**都要**：冷启动只走 C（start.s:520-521 把 lr 设成 arm_init，:654-655 先写 TCR_EL1_BOOT），热复位先走汇编（start.s:800 cbnz x21 → :821-826 Ltrampoline → :835 arm_init_tramp → :879），随后仍回 arm_init 再走一次 C，因此同一核两次本核 TLB 失效但同值幂等、且 C 版就在 arm_slide_rebase_and_sign_image() 前一行，保住了「签名前 TCR 已定稿」。结论改为逐文件判读：pmap.c 不能整包（9/10，第 10 个属 GPU 线）、arm_vm_init.c 对 pristine 打不进只对构建树成立、sleh.c 只搬 1/3。待验点记了 5 条，其中 CONFIG_SPTM 是否关着今天只能判到「倾向关」（config/MASTER:322 只是可选 option，defconfig 26 行无该键），settle 它要 F1 构建日志里 ../xnu-12377/osfmk/arm/pmap/pmap.c 的编译行。'''
