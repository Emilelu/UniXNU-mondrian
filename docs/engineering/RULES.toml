[[rule]]
id = "P-221"
kind = "pitfall"
source = "docs/engineering/PITFALLS.md:P-221"
statement = "扫描器/水位必须存不可变的对象 id 而不是会移动的 ref 名，比对文件必须用 blob id 而不是逐文件取内容；逐文件 `git show` 的扫描在 5,000 文件规模上必然超时，且脏水位会让它每次都重跑全量。"
check = "python3 scripts/tests/test-pick-upstream-scan.py"
note = "2026-11-16 pick-upstream.py --plan 连续三次超时（600/900/300 s 全 rc=124、输出恒 0 行）；根因是 discover_branches 把裸 origin 当分支、其 rev-parse 输出字面量 origin/origin 写进 seen 永不命中，叠加逐文件 git show（3 分支 × 5,080 文件 ≈ 15,000 次进程）。改用 blob id 对表 + 过滤裸 origin + 丢弃脏水位后 7.4 s。"

[[rule]]
id = "P-222"
kind = "pitfall"
source = "docs/engineering/PITFALLS.md:P-222"
statement = "跨 worktree 的全局账本记的是「这台机器最后一次成功的序列」，答不了「这一套补丁成功过吗」；判据必须先查按对象记录的基线账本（MAIN-BASELINE.toml 的 booted 条目），再退回全局 ledger。只被写入、从不被读取的证据字段在门禁眼里不存在。"
check = "python3 scripts/tests/test-porting-gate-book.py"
note = "2026-11-16 上游跟进构建成功后 porting-gate 仍阻断 [S]：上次成功 4305c6cc2821bcb7(08:59, bt 线 234 条) != 现在 59d8037521a5b07b(main 227 条，07:36 已由 baseline-20261116a 上机)。修法加 booted_series() 读 MAIN-BASELINE.toml 的 state=booted 条目；build-only 永远不能背书。双向验证：真序列 PASS、伪造序列仍 FAIL。"


