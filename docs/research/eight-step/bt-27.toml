# Bluetooth on iOS 27.0.1 (24A446): the seven research steps.
# The fragment intentionally stops before step.device; a merge keeps the
# ledger's existing device block and its prediction.

[hardware.bluetooth]
revisit = 'Restore when all four hold: (1) board.toml ios-27.0.1-24A446 components.include names QcaBluetooth or a documented equivalent, and the device series still carries 0500-0523; (2) board.toml has [payload.runtime] with audio_system_plugins = ["BTAudioHALPlugin.driver"], bluetooth_tool = "scripts/build-bluetooth-userspace.py" and bluetooth_target = "ios27", plus an OS image to mount, so the payload stages BlueTool, bluetoothd, QcaBTType0.dylib and the QCA firmware; (3) the DT exports the six bluetooth properties and local-mac-address plus /chosen/mac-address-bluetooth0, and check-bluetooth-dt.py --driver passes at 3000000 baud and H4; (4) a device run prints [bluetooth] state=2 error=0 and exactly one [bluetooth proc] bluetoothd, with no panic.'
name = "蓝牙（QCA6490 / HCI over UART）"
status = "parked"
paths = ["dts/mondrian.dts", "configs/mondrian_ios27_defconfig", "patches/xnu-12377/series", "/mnt/e/hackios/QcaBluetooth"]
why = 'Stage 0 does not select QcaBluetooth: board.toml:361 includes only ArmDTPlatform, ArmCpu, XnuPrelink and NativeUfs, and configs/mondrian_ios27_defconfig has no Bluetooth or QCA key. The kernel-side series 0500-0523 is in the device series, but board.toml carries [payload] and no [payload.runtime], so the framework never calls scripts/build-bluetooth-userspace.py and never mounts the OS image (docs/plans/BT-IOS27-PORT.md:614-620). A kernel-only boot can publish com.apple.uart.sk.bluetooth but stages no BlueTool, bluetoothd or QcaBTType0.dylib. No 24A446 payload, stage-0 SpringBoard or single bluetoothd start has been observed; the only green 27 kernel build (CI 44518998961, head 33f5229) is not an ancestor of this branch.'
label = "蓝牙（QCA6490 / UART SE20 0x894000 / GENI + QCA 固件 addon）"

[hardware.bluetooth.step.same_model]
done = true
recorded_at = "2026-11-21T03:40:00+08:00"
evidence = "No same-model target runs iPadOS 27: the search covers the SM8475 / Redmi K60 trees and finds no second 27 implementation. t970 is a QCA6390 / QUP0 SE6 board on iPadOS 18, so its four patches are a transport contrast only (docs/plans/BT-IOS27-PORT.md:556-560). zizhan is an iPadOS 18 product-id counterexample, not a 27 implementation (docs/plans/BT-IOS27-PORT.md:562-569). The nearest 27 reference is sheng's two xnu-12377 runtime patches. Files: docs/plans/BT-IOS27-PORT.md."

[hardware.bluetooth.step.official]
done = true
recorded_at = "2026-11-21T03:41:00+08:00"
evidence = "Page UniXNU/docs/zh/porting/bluetooth.md:19-31 labels its table as sheng's values, and UniXNU/docs/zh/porting/bluetooth.md:21 says to read the target DTS, so 0x898000, SE6, GIC493, 51.2 MHz, 3.2 Mbaud and hmtbtfw20.tlv are reference values, not this board's. Our node dts/mondrian.dts:109-116 declares device_type bluetooth, compatible qcom,wcn6855-bt, unixnu,adt-name bluetooth, encoding 1 (H4), speed 3000000 and status okay; scripts/check-bluetooth-dt.py:101-107 enforces speed equals K60_BT_RUN_BAUD and encoding 1. The seven-step power order (UniXNU/docs/zh/porting/bluetooth.md:46-55) is checked by scripts/check-bluetooth-power.py:4-8. The worker and transport model (UniXNU/docs/zh/porting/bluetooth.md:60-67) is the qbt engine in the 0500-0523 series, with the GENI model at docs/plans/BT-IOS27-PORT.md:306-329. The payload.runtime requirement (UniXNU/docs/zh/porting/bluetooth.md:87-106) is not wired: board.toml has no [payload.runtime], so the framework will not stage BlueTool or bluetoothd, and it will not mount the OS image (docs/plans/BT-IOS27-PORT.md:614-620). The three named checks (UniXNU/docs/zh/porting/bluetooth.md:113-115) do not exist here; five equivalents exist (docs/plans/BT-IOS27-PORT.md:528-548). The expected state=2 / error=0 and one bluetoothd (UniXNU/docs/zh/porting/bluetooth.md:126-128) have not been observed. Files: UniXNU/docs/zh/porting/bluetooth.md, dts/mondrian.dts, scripts/check-bluetooth-dt.py, docs/plans/BT-IOS27-PORT.md."

