evidence = [{ kind = "device", reference = "docs/research/storage/RESEARCH.md", command = "bash scripts/flash.sh /mnt/e/k60-work/artifacts/touch-20261114a/boot.img 240", revision = "43c4fc3cf288f0c6545cb2447fc4d285cfb6d3c7", result = "The unixnu three-window partition is what every successful bring-up boot runs from: usblog-20261114-150931 reached SpringBoard 254 with the Data window mounted out of /dev/block/sda38 and no storage error, and the same image family held SpringBoard 128-133 through the 2026-11-16 and 11-17 flights. The earlier silent deaths were explained as P-215: the wifi patch took the Apps SMMU lease before pong_rpmh_init() had allocated the lock, so UFS gave up before the console worker existed." }, { kind = "host", reference = "docs/research/storage/RESEARCH.md", command = "python3 scripts/tests/test-k60-verified-root.py", revision = "43c4fc3cf288f0c6545cb2447fc4d285cfb6d3c7", result = "feat/ufs-verified-table carries the ShengUfs@9d527ae VerifiedTableCache, RootPublication and RootWindowRead headers with their host tests, all passing. The kernel-side signed-root header is still missing, so the cache cannot be wired yet: implemented work with evidence recorded, verified-root handshake still open." }]

