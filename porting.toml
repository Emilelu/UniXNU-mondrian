findings = ["cand7 renders through CPU composition; CONFIG_XNU_PONG_ADRENO_PLATFORM=n disables the real archive. The enabled scanout callsites currently resolve to explicit software-only weak functions, not GPU execution.", "Read-only device evidence confirms Adreno730v3 chip0x07030002 and the actual GMU/SQE/ZAP firmware. The build provider now resolves its real kernel tree, uses the retained register header and captured K60 firmware directory. K60 RSC EL1 accesses historically hang; the actual backend now uses documented Qualcomm monitor secure-IO calls for TCS reads/writes, propagates authorization failures, and retains real fence prerequisites."]
