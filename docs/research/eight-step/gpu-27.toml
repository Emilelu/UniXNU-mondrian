why = "The board is A730v3 (SM8475) while the official GPU line names A740 (SM8550, porting/gpu.md §1 generation matching), so the kit can be read but not copied whole: 55 hardware offsets already match and 12 HWCg rows differ. The 16.6.1 line measured the presenter budget (24 bench samples: import 27 / encode 3,059 / submit 362 / gpu 2,470 / sum 5,907 µs, E:/k60-work/evidence/usblog-20261119-173454/console.log:2455-2506) and the wall a full-screen per-frame copy imposes (a CPU composition fallback of 13,183 µs, about 74 fps ceiling, docs/research/gpu/GPU-27-BUDGET-120FPS.md:106), and four explanations have been refuted in docs/engineering/PITFALLS.md. For 27 the three deliverables are done offline: the contract table, the budget table and the wire proposal; nothing is re-derived for 27 until a frame reaches the panel."
