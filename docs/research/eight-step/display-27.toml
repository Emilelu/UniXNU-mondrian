recorded_at = "2026-11-21"
evidence = "根因级结论四条（都在 DELTA 里带行号）：(1) 27 与 16.6.1 的显示不是版本差而是架构差 —— 16.6.1 打补丁改 XNU 自带 Mini 栈（patches/xnu/0210 的 MiniIOMobileFramebuffer.cpp start()、0211 的 MiniIOSurface.cpp:1916 默认 0→1），27 是独立驱动（NativeLegacyDisplay.cpp 659 行），两者争 PE_current_console，见 R5；(2) 亮度线的唯一实质缺口是六键 calibration 字典 —— 16.6.1 在 K60Backlight.cpp:230-246 记了 20G81 CoreBrightness 读十键不查 NULL（0x1af030a28 读、0x1af030a5c..0x1af030a70 循环、CFNumberGetValue(NULL)→backboardd SIGSEGV，判据 int-236 lr CoreBrightness+0xfbaa4），而 sheng 在 AppleARMBacklight.cpp:301-312 无条件发；(3) 未知属性分支不是缺陷（R4 已撤回）—— 复核 HEAD 后 K60Backlight.cpp:392-404 的三支以 else return kIOReturnSuccess 收尾，goal 只在前两支赋值，:415-418 的 else 是「非 nits」的日志分支而非落空分支；该函数里唯一值得改的是 :416-417 把 goal 打了两次，日志无法区分请求值与等级，已单独提成 patches/proposed/0001-k60-backlight-log-requested-level.patch；(4) 27 的亮度可能被静默吃掉 —— 板级 ADT 的 vmm-present 会让 MobileGestalt 答 IsVirtualDevice，CoreBrightness 选 VMBLControl 丢弃全部请求（sheng-backlight.md:50-54，R2），而本板 ADT 由本仓 board.toml 的 payload adt 段生成（board.toml:228），所以可控。另有一件只审不改的事：wire 版本号中立法案（57 槽 vs 48 B 包装）由 gpu27 出提案、Lead 会签，本线只出覆盖审查 docs/research/display/WIRE-VERSION-REVIEW.md —— 结论是两种形状都能覆盖本线的四条记录，但 48 B 包装必须改 PongAdrenoScanout.cpp:149 的字面量 0 与 :122 的 reserved 零校验（Done.reserved 不是空位而是垃圾哨兵），57 槽则要另写 Wait 无版本的规则。done 仍为 false：四条都还没有 27 上的对照读数。"

