findings = ["cand7 skips touch because the actual FAT ADT has no /arm-io/pong-touch. The format-2 converter accepts typed metadata children; board.toml defines K60 SE4 0x990000, TLMM 0xf000000+0x100000, GPIO16-21 and AVDD71, raw axes14400x32000. No RSC/cmd-db access is permitted in the touch driver.", "Read-only rooted Android be74ba07 confirms Goodix BERLIN/9916R firmware05800263, LDOC2 enabled at1800000uV, 193-byte IC-info with checksum5185 and touch address0x10308. IC-info dimensions1440x3200 must not replace the raw evdev14400x32000 axis contract. The actual Android transfer log uses GPI callbacks with FIFO disabled.", "The compiled GPIO fallback carries the 2us half period, boot-option write/readback and 1488-byte captured config package, but cand15 never entered that transport because bitbang-pins metadata was absent. No XNU handshake, config ACK or touch sample is established. Earlier whole-image diagnostic string checks proved only code inclusion, not controller response.", "The real blocker was not power or the pin map but a missing second command: the driver sent 0x90/0x00 (raw frames off) and never 0x91/0x01 (coordinate reports on), which the on-device Android goodix_htc_enable(false) sends as a pair. It also checked only ack[1] instead of waiting for reply[0] == 0x80, so a config that had not completed looked finished. Both are fixed in the touch patch; the retained module's brl_hw_ops disassembly (dev_confirm at 0x11d44, read_version at 0x136e8, brl_send_config's 20x20 ms state poll) is what pinned the exact order."]
completion = ["Touches map to the display, simultaneous contacts keep stable IDs, release events arrive, and buttons produce expected HID reports."]
limits = ["2026-11-14 boot touch-20261114a (boot.img 0b2003f4…, kernel c78a5cc9…) qualifies single-finger touch: CFG-START/WRITE/EXIT complete at state=0x80, RAW-OFF and COORD-ON both ack=0x80, the chip reports BERLIN 9916R 05.80.02.63 with active config 0x640fdf7d, and eight `goodix: type=1` samples reach `Pong touch HID: type=1|3` for the display-integrated digitizer. Console E:/k60-work/evidence/usblog-20261114-150931/console.log, 268,137 B, 254 SpringBoard lines, no panic marker. NOT yet accepted: two simultaneous contacts, edge gestures, tap-to-wake, and sustained frame rate under a moving finger; the 0x10308 header length is read from misc+48 but the retained module only proves misc+44 (data address) and misc+50 (point struct length)."]
next_action = ["Accept multi-touch next: hold two fingers and confirm two distinct contact IDs with independent coordinates and separate release events, then exercise the screen edges for the system gestures. If a second contact never appears, inspect the point-struct stride against misc+50 before touching the parser. Tap-to-wake (touch detection mode 0xff/0xfe/0x1/0) is logged but not verified against a sleeping panel."]
evidence = [{ kind = "device", reference = "board.toml", command = "adb -s be74ba07 exec-out su -c 'cat /sys/firmware/fdt'; read Goodix chip_info and r:10014:28/r:10070 IC-info selectors", revision = "fb24cf99ad97ab14313284000000000000000000", result = "Actual live FDT SHA2385d2a84ce920b5694b4cfcd8366d8bf6a7c39a0c0d2d02e988c1bc22ff94b1; BERLIN/9916R verified and raw axes14400x32000. This is Android hardware evidence, not XNU touch qualification." }, { kind = "host", reference = "patches/xnu/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz-pong-touch-console.patch", command = "python3 work/touch-gpu/repack-boot.py --template gpu8-start.img --ramdisk payload.img; inspect strings in the resulting image", revision = "04a819c4b9050bf4d37dff64c5357d4efea7e3b1", result = "boot-touch9-input-20261112.img (201883648 B, e7e4e90ab556a3e5) carries the handshake, 2 us bit-bang, config download and coordinate-mode strings; the packet carries no pong_touch argument so the driver runs at its stage-6 default. Not sent: the board was off the USB bus." }, { kind = "device", reference = "docs/research/EIGHT-STEPS.toml", command = "bash scripts/flash.sh /mnt/e/k60-work/artifacts/touch-20261114a/boot.img 240", revision = "0143b465721b47804cebc3d51cd76fa34fbfac37", result = "console.log 268137 B / 3870 lines, capture.json complete=true panicMarker=null, SpringBoard 254. line 683 `goodix: COORD-ON ack=80`; lines 2490-2601 eight `goodix: type=1 finger=0 raw=... normalized=...`; lines 2491-2496 four `Pong touch HID: type=1|3 finger=0 xy=...`; line 1425 display-integrated digitizer opened. User present, screen responded to a real finger. Single contact only; multi-touch and gestures remain unaccepted." }]

[[area]]
id = "gpu"
status = "planned"
components = []
paths = ["package/*Gpu*", "package/*Gmu*", "package/*Adreno*", "scripts/*adreno*", "scripts/*gpu*", "scripts/*metal*", "scripts/*turnip*", "scripts/*air*", "drivers/PongAdreno/**", "drivers/PongMetal/**", "drivers/NativeMetal", "scripts/generate-pong-cp-profile.py"]
inputs = ["Identify the gpu hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for gpu."]
procedure = ["Follow the gpu stage in the porting guide and record the actual commands."]
findings = ["cand7 renders through CPU composition; CONFIG_XNU_PONG_ADRENO_PLATFORM=n disables the real archive. The enabled scanout callsites currently resolve to explicit software-only weak functions, not GPU execution.", "Read-only device evidence confirms Adreno730v3 chip0x07030002 and the actual GMU/SQE/ZAP firmware. The build provider now resolves its real kernel tree, uses the retained register header and captured K60 firmware directory. K60 RSC EL1 accesses historically hang; the actual backend now uses documented Qualcomm monitor secure-IO calls for TCS reads/writes, propagates authorization failures, and retains real fence prerequisites.", "2026-11-18 the frame path is attributed instead of guessed: with the accelerator published and the Metal client committing (Pong Metal: S ... c12/0 d12), the per-frame cost sits in presenter->present() - kernel prepare 4-12 us, render-server retire 38-55 us, and the scanout copy 16,813-19,833 us for 18.4 MB, about 1.1 GB/s, far below A730 blit bandwidth. Copying 18.4 MB is not free, so the open question is which stage inside present() owns that time, not whether the display pipeline is slow.", "The render mode is not the official default: PongMetalPlugin.mm calls setenv(\"TU_DEBUG\",\"sysmem,nocb\",0), which forces whole-screen system-memory rendering, while the porting guide's default is gmem,nocb with per-tile load/store and memoryless attachments. The Turnip tree does implement the gmem path (tu_debug_options has both sysmem and gmem; tu_cmd_buffer.cc returns false for TU_DEBUG(GMEM)), so this is a one-line experiment rather than missing upstream work.", "2026-11-18 the split inside present() was measured on the device and the copy is not the cost: over 45 steady samples the median shares of the stage sum are import 0.2 %, encode 1.9 %, commit 49.6 % and GPU wait 45.9 %, with a median present of 23.0 ms whose sum agrees within +1.8 %. The commit does not wait for the GPU - pearson r(submit, gpu) = 0.007 and r(submit, previous gpu) = 0.088 - so it is CPU work inside the translator, not a serialised queue. Deleting the source-buffer import cache cost nothing measurable (import median 54 us), which also removes the last reason to keep an object across frames."]
completion = ["GPU submissions complete, mapping/fence handling is correct, a known image renders, and the selected Metal client presents it."]
limits = ["The scanout copy is measured but not yet attributed: 18.4 MB in 16,813-19,833 us (about 1.1 GB/s) is slow for a blit but the three candidate owners - re-importing the source pages each frame, the per-frame command submission, and the GPU transfer itself - have not been separated on the device. Frame rate is 0.9-7.79 fps, so 120 fps is an order of magnitude away and no target-motion behaviour has been tested at all.", "The stage numbers were readable on the 2026-11-18 17:15 flight and only then did the split become measurable, but two measurement defects came with them: the outer wait/copy/done spans were divided by 1000 while still labelled us (printed milliseconds as microseconds, P-234), and the sampler fired every 60 frames against a 22-frame flight (P-233). Both are fixed and guarded by executed host tests; the unit fix has not flown yet.", "A source-buffer import cache keyed on (address, length) was written and then removed before flight: the kernel creates a fresh IOMemoryMap per frame and releases it as soon as the copy retires, so a cached MTLBuffer would point into a released mapping. Whether kIOMapAnywhere ever reuses a just-freed address, and whether the runtime pins pages on import, cannot be proven in this tree; the import is therefore per-frame and counted, not reused.", "Which copy shape the frame takes was never recorded, so a per-frame Vulkan image allocation inside the translator could not be ruled out: the linear-texture branch is taken whenever the two strides differ and the source stride is aligned, and it forces an image, its memory and a tiling per frame. The next image removes that branch in favour of per-row buffer copies and prints the shape and both strides once per flight.", "Metal is still not qualified on hardware: drivers/PongMetal/README.md states actual GPU execution and accelerated presentation remain unconfirmed, so the area stays planned even though a provider is published and a client commits."]
next_action = [
  "按 docs/engineering/IOS-SCOPE.md 的判据排队：只有「可转移」的活才开工。当下可转移的四项——① import 双峰（63 us / 15,000 us，见 FLIGHT-CARD-20261119h 5.5）；② 内核扫出单跑已成立，下一步是零拷贝（token/evict/target，48->56 B）；③ P-244 映射泄漏的 maps/unmaps 对账；④ 判读器与门禁的维护。",
  "iOS 16 专属的工作已按用户决定（2026-11-19 m44559）停止：三个 Metal capability selector 的回落、在 16 上追 120 fps 的客户端调优、patches/metal2vulkan 的 16 专属迭代。停止的条目留在文档里，不要重新捡回来。",
  "迁移看 upstream：xNekom/UniXNU-mondrian 的 feat/ios27 已完成 F0/F2/F3（PAC probe 补丁、host 构建 prelink、Linux 构建 userdata、无 macOS 解密 AEA），下一个门槛是 bsd_init；我方暂存在 feat/bt-ios27-port（profiles/os/ios-27.0.1-24A446、configs/mondrian_ios27_defconfig）。"
]

