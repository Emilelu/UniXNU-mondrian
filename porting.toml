findings = ["IOS27 扫描路径（build-only，2026-11-19 14:00）：24A446 的能力位 22（命名扫描通过）与 46（等扫描完成事件）已在 12 字节请求里应答，19 字节请求保持 22H374 老位图；请求 86 按 0x8/0xc/0x200/0x210 解析名字、类型与频道，请求 10 按 0x44/0x48 解析频道，扫描类型 3 直接读已有结果；频道表交给 27 站新增的 nw_wifi_scan_frequencies（weak_import，16 归档缺符号时退回 nw_wifi_scan）。host 自检 pong-abi-selftest.c 31 项 + test-pong-abi.py 18 项全过，对 16 与 27 两个站头都编译通过。",
  "IOS27 ABI（build-only，2026-11-19 13:25）：feat/wifi-ios27-abi 用一个 0x8e8 扫描记录同时服务 1164 与 2280 请求，关联请求接受 0x250/0x290/0x384，24A446 关联完成事件为 540 字节（result 0x214，has_result 0x218）；离线编译 native-abi27 成功；详见 SBL-MISSION §38。", "MISSION36 CLEAN PANE CLOSED (2026-11-19 12:33): 去掉全部 19 条诊断探针与国家 IE 扣留后的生产镜像仍然在设置页列出 5 GHz 行 Emilelu_5G（147 行观察者记录，RSSI -39），用户点进去能看到 IP，并从设置页重连成功；console 1,206,266 B / 14,893 行 / SHA256 4946a432…，68 次 scan request、53 条 Preferences 列表、服务出的探针 0 个，判据 PANE CLOSED, PROBES GONE。", "MISSION34b PANE CLOSED (2026-11-19 11:53): 设置页 Wi-Fi 列表出现 5 GHz 行 Emilelu_5G（BSSID c8:bf:4c:30:03:1c，RSSI -52），12 条 Preferences 列表 / 3,901 行观察者记录 / 52 个 BSSID；同一趟 WiFi lifecycle test PASS（state=6、IPv4=1、lease 3/3、en0 192.168.31.232）。根因确认为 station 侧 IE_MAX 384 把 390 字节元素区截在半个元素里（§34），把 IE_MAX 与 nw_abi.h ie[] 一起抬到 1024 后该记录被 daemon 保留。生产修复只包含这一项。", "MISSION34 ABI (2026-11-19 10:30): 线上 scan_result 自带 elements[1024]（sizeof 1164，offsetof 0x8c），20G81 的 wifid 每次就按 1164 字节取；384 只在我们内部（nw_sta.c IE_MAX 384、nw_abi.h ie[384]），所以目标 AP 的 390 字节元素区是在我们自己的代码里被截断成「走不到结尾」的；被保留的两条 5 GHz 记录是 307/361 字节、都在 384 以内且能完整解析。把 IE_MAX 与 nw_abi.h 一起抬到 1024 不是改协议，是让内部 ABI 追上线上容量。", "MISSION35/wifid offline (2026-11-19 10:19, arm64e xref of wifid 20G81): 整份 wifid 里按记录字段删扫描 BSS 的只有 WAPI 过滤器（谓词 0x1000a8274 取记录字典 key WAPI，v∈{7,11,15} 丢弃；丢弃点 0x100059828 与 0x100052034），我们的记录没有该 key 因此不会被它丢；隐藏网络/5GHz 后缀/companion 那一组字符串全在 WiFiIDSSyncEngine 的口令继承与指标采样里，不在列表路径上——wifid 侧不存在按元素或频道丢弃的代码，mission25 B/E 被丢最简解释仍是旧 384 上限把目标元素区截成不完整尾部。", "MISSION35 (2026-11-19 09:37, image 7b654920, head d5c03c0d, 飞过但未观察): 1024 字节元素区在真机两端一致（5240 记录报 ie 390，超过旧的 384 上限），42 字节填充国家 IE 被驱动扣留（withheld 3 次）；但整趟 wifid 没有发过一次 scan request，Preferences/configd 列表都是 0，所以设置页那一行是否出现仍未观察。", "MISSION34 (2026-11-19 09:16, image b08a14f8, head d91cfc2a, 未飞): 19 条探针 = 5 条加元素（K60A..E）+ 8 条减元素（K60F..M）+ 6 条新探针（K60N..S：把 HT/VHT op、HT/VHT cap、扩展能力的载荷从 kept carrier 换进目标记录，K60S 是尾部裁剪对照）；表压到 45 条给探针留位。换载荷而不是删元素，是因为删结构元素的命中可能只是记录不合法。", "MISSION32 (2026-11-19 08:28, image fd80093a, head a9e8e399): 38 条记录取并集后 33 KEPT / 5 DROPPED，唯一被丢的 5 GHz 记录就是目标；两条被保留的 5 GHz 记录（ie 307/361）元素里都有 7/32/195/221/255，35 与 244 也在被保留的 2.4 GHz 记录里，RSN 两频段逐字节相同。关键差异是形状：目标记录报 ie 384 却只走到 318 B，尾部 66 B 不构成完整元素，而所有被保留的记录都走到底。mission32 删掉元素过滤器，fill_result 只送到最后一个完整元素并打印 tail 行；镜像已校验未飞。", "MISSION24 analysis (2026-11-19 08:00): 把 mission24 console 的 44 条 Preferences 列表取并集后，38 条有元素清单的记录中 33 条 KEPT，唯一被丢的 5 GHz 记录就是目标；被保留的两条 5200 MHz 记录（Rh1 -78、空 SSID -77）元素里就带国家 IE 7、功率约束 32、VHT 发射功率 195、厂商 221、HE 255，所以这些元素单独不可能是过滤器；目标比它们多出 TPC 报告 35、IE 244、一条额外的 255 和没有 OUI 的 221/2。mission31 据此把减法探针扩到八条（新增 K60K 去 35、K60L 去 244、K60M 去两者），并让真实记录去掉 7/35/244 与长度小于 4 的 221。镜像 4abbc2a2，未飞。", "MISSION25 (2026-11-19 06:46, image 95629508, head ec51f578): 人的观察给出决定性结论——A/C/D 出现，B/E 不出现。capability 不触发过滤（C、E 只差元素区），元素区才是（B 丢、D 收）。本次唯一被保留的 5 GHz 载体是 5180 MHz 88:c3:97:c6:0a:73（ie 382 cap 0x0511），目标仍是 5240 MHz c8:bf:4c:30:03:1c（ie 384 cap 0x0511）；两频段元素清单首次完整可比，5 GHz 独有国家 IE 7（42 B）、32/1、35/2、195/5、HE 33 B、221/2。console E:/k60-work/evidence/usblog-20261119-064651/console.log 887,140 B / 11,567 lines / SHA256 fb5cfee0…；boot.json accepted=true、returnedToFastboot=true。 , MISSION24 (2026-11-19 06:06, image 6ba9a053): 一次飞行同时拿到驱动记录与 wifid 的 Preferences 列表。两条影子记录 K60SYNTH（c8:bf:4c:30:03:5c）与 K60SYNTH2（ca:bf:4c:30:03:1c）都排在被送出第 2、3 位，daemon 把 33/33 与 40/40 全部读完，但它 41 项的列表里两条的 BSSID 一次都没有，Emilelu_5G 依旧被丢（44 条记录 30 kept / 14 dropped）。因此名字配对、band-steering 与 BSSID 前缀合并三个假设全部排除，过滤发生在记录内容上。用户提供的路由器截图补充了关键背景：该 AP 5 GHz 为自动信道 48、带宽 160/80/40/20MHz、WPA3/WPA2 混合，2.4 GHz 只有 40/20MHz。", "MISSION22 (2026-11-19 05:14, image 0d6a2f16, head d250f2c3): 第一次在有人打开设置页时同时持有扫描记录转储与 Preferences 列表。console E:/k60-work/evidence/usblog-20261119-051413/console.log 889,855 B / 11,636 lines / SHA256 37e0079f09c83814…；24 条 Preferences 列表，最后一条 40 项；55 条记录中 45 KEPT、10 DROPPED；5 GHz 并未被整段过滤（CMCC8888 5240 -79 cap 0x1531 与一条隐藏 5240 -82 都在列表里），只有 Emilelu_5G（…:1c，-51 dBm，ie 384，cap 0x0511）被丢；其 2.4 GHz 同族 …:1d 的 RSN 与之完全相同（0100000f ac040100 000fac04，纯 WPA2-PSK），排除安全类型；K60SYNTH 副本送出 24 次且 daemon 把每次扫描的全部记录读完（46/46、49/49），列表里仍没有它的 BSSID，说明过滤与 SSID 名字无关，问题在记录本身。 ", "MISSION21 (2026-11-19 03:39, image 766606e0, head 7e8b3310): 元素清单把两个频段的差异缩到一个字段组。console E:/k60-work/evidence/usblog-20261119-033924/console.log 542,538 B / 7,854 lines / SHA256 10d9351965bd76ce67ffc0224cb5dfeb22b7f0c2ea89f159a68584bfeaa3e3e1；扫描表 11 BSS（2.4 8, 5 1, hidden 2）:788、28（19/1）:4893、35（26/1）:4994，本次唯一 5 GHz 记录仍是自家 5240 MHz；同一 AP 的 2.4 GHz 记录 c8:bf:4c:30:03:1d ie 347、rsn 24 B@37、cap 0x0431，5 GHz 记录 c8:bf:4c:30:03:1c ie 384、rsn 24 B@76、cap 0x0511——RSN 长度相同，多出的 37 字节里 3 字节是 SSID，其余 34 字节是别的元素；HE 依旧成立（:822 请求 HT 28 VHT 14 HE 31 bytes，:817 peer HE yes 0x25003ff4，:5112 回到 2.4 后 HE 28 bytes，:1821/:5180 关联 PASS，:5181 lifecycle PASS lease=5/3）；本次无人打开设置页（只有一行 settlement observer init），Preferences 列表仍未观察到；wifid 的 guess1..guess4 / known5ghz 字符串提示按名字配对的合并逻辑，mission22 用同名记录改名副本区分“名字”与“字段”。 ", "MISSION19 (2026-11-19 01:53, image c1429161, head 20e5a2b1): the 5 GHz record is well formed and now served first. console E:/k60-work/evidence/usblog-20261119-015237/console.log 482,395 B / 7,147 lines / SHA256 e83371ee852df28094a28c09be16bab09af43ec0887ddf934665c6a4e4dd70a9; tables 9 BSS (2.4 6, 5 1, hidden 2) :781, 32 (21/1) :4352, 34 (22/1) :4433; the frozen list serves the 5 GHz record first: \"scan result served 1 of 32: 5240 MHz, -51 dBm, Emilelu_5G\" :4386 and \"served 2 of 34\" :4470; its words 00000001 00000001 00000030 00000012 ffa10001 ffcd002c 05110064 304cbfc8 00001c03 decode as version 1, channel 48 flags 0x12, noise -95, SNR 44, RSSI -51, beacon 100, cap 0x0511, BSSID c8:bf:4c:30:03:1c, rate count 0; Country column shows Emilelu_5G CN, Emilelu --, the only BR networks unrelated 2.4 GHz APs, so country is not the cause; supported channels 102 (2.4 14, 5/6 88) :2040 with 2412 flags 0xa; settlement observer maxNetworks 10 maxScans 3 :2031; no Preferences list in the flight, daemon self-joined :4479 and lifecycle PASS :4546 lease=5/3; judge base=PASS dump=PASS user=PENDING -> DIAG-ONLY.", "MISSION18 (2026-11-19 01:00, image c094e5bf, head 7663471a): the daemon reads the 5240 record, so the loss is on content and the country element becomes the lead. console E:/k60-work/evidence/usblog-20261119-010007/console.log 479,040 B / 7,115 lines / SHA256 3ca108dc887cc2598344360d0ef6a4f76bc580a8816bcc30abdd29513723f14b; scan tables 6 (2.4=4, 5=1) :771, 27 (17/1, hidden 9) :4402, 29 (18/1, hidden 10) :4443/:4697/:5675; Emilelu_5G c8:bf:4c:30:03:1c at index 5 in every table (-51/-50 dBm, ie 384, cap 0x0511); scan request type 10 len 5456 :4116 and scan result end after serving 27 of 27 :4437 prove the record was delivered; ages 6/1285/2812 ms for the 5240 entry against 303,825 ms for 2.4 entries, so the module keeps one observation per BSSID; wifid starts :1255 and :1555 but wrote no Preferences list because nobody opened Settings; country log :5231-:5234 (2 countries, <BR> count 1, <CN> count 15, highest <CN>). Judge base=PASS dump=PASS after the regex fix, user PENDING.", "MISSION17 (2026-11-19 00:40, image 738c9125, head 497e512c): the station associates with an 11ax access point. console E:/k60-work/evidence/usblog-20261119-004032/console.log 467,035 B / 6,982 lines / SHA256 ba3b58c2e403291cbda83ef9b36bcd5bdaacfcdab460ed42f14c9a3f6292c3c6; :794 peer HE yes, MCS 80 rx fffa tx fffa, params 0x25003ff4 nss 0xfffc at 5240 MHz width 80; :799 association request HT 28 VHT 14 HE 31 bytes; :3311 association and keys complete; :3309 lifecycle reconnect; :4341 daemon-initiated join (ssid length 7, key length 32, cipher 6) moves to 2412 MHz where :4347 requests HT 28 VHT 0 HE 28 bytes and the peer operation carries 0x2b003ff4; :4420 lifecycle PASS reconnected c8:bf:4c:30:03:1d lease=5/3; :1676 association PASS. Judge 24 PASS, 0 FAIL, 1 PENDING (host receipt), base PASS and HE PASS. HE is proven at association, not at rate selection or throughput.", "MISSION16 (2026-11-19 00:23, image 95e16e01, head d964770e): the diagnostics name every refused request and show the 5 GHz gap belongs to the daemon. console E:/k60-work/evidence/usblog-20261119-002257/console.log 639,221 B / 8,729 lines / SHA256 565cf7890195720f2534a8f1c6a52b79899cea6a2fb05f7f83236135755534ce; scan tables 6 BSS (2.4=3, 5=1) :790, 31 (20/1) :4376, eight at 33 (20/2, hidden 11) from :4404; Emilelu_5G 5240 MHz -50 dBm :4380/:4408; type 10 scan request len 5456 :4389; scan result served 32 of 33 :4416; supported channels 102 = 2.4 GHz 14 + 5/6 GHz 88 :1816; refused types [6,18,25,57,115,207,346,353,365,386,387,419,422,423] with 419 set 136 B starting 01000000d0af, 115 get 1288, 207 get 10016. wifid Preferences lists of 27 entries (:5608, :6453) contain Emilelu, the 5805 neighbour and an empty-SSID record but never Emilelu_5G, so the record stream or the daemon drops it, not the band. Judge 22 PASS, 0 FAIL, 1 PENDING = DIAG-ONLY.", "MISSION15 (2026-11-18 22:32, image 8fedce49, head 6253eafc): the Settings pane starts the wireless daemon because the ADT publishes a wlan nub (:91-:94, devices=6 at :148). console E:/k60-work/evidence/usblog-20261118-223223/console.log 997,880 B / 12,500 lines / SHA256 12a96da390ef1a4beba3c3d842cdc9e3ed879e4cff4e6d6398a1b5c8e0928609; xpcproxy /usr/sbin/wifid :1223; wifid opens the 80211 client :1863/:1967/:3919 with wifivelocityd at :3925; packet filter tap mode 3 :1463/:1465 and :1538/:1540; daemon property lists from :3913 with IO80211InterfaceIPConfigurationBusy false :3936 true :4008 false :4363 true :4708 false :4709; a person joins from the pane :8578 (ssid length 7, key length 32, cipher 6) to 2412 MHz :8583 and the module result is 0 :8590; DHCP 192.168.31.71 (:2013 offer, :2038 ACK), association PASS :4030, lifecycle PASS :4031 lease=3/2; judge 22 PASS, 0 FAIL, 1 PENDING = PANE-ONLY", "MISSION13 (2026-11-18 16:40, image 6625d4b3, head a5fa535f): second full pass of the official six criteria and the flight with large sustained traffic. console E:/k60-work/evidence/usblog-20261118-164031/console.log 443,391 B / SHA256 EA1EDD59…; :1429 the stack opens without panic; :1459 configd opens the 80211 client; :1468/:1594 two DISCOVERs; :1597 OFFER 192.168.31.227; :1845 REQUEST; :1864 ACK; :1918 PASS; :1919 en0 address; :6741-6746 in 23,397 / out 28,455 with tcp443 in 22,315 / out 27,138 and SYN/SYN-ACK/ClientHello/1480 B records over 13 minutes; no panic; :6820 K60AUTORESET 900 s. The k60probe job never ran.", "Official Ath12kWifi shared station component is available (https://github.com/UniXNU/Ath12kWifi.git at f6bf561f92cc42761bdd417fce1d53fe1db9477c), docs/plans/WIFI-PORT-PLAN.md:32.", "K60 PCIe/BAR0/GPIO/SID match the Pong reference: PCIe0 six reg windows, BAR0 0x60200000/2 MiB, GPIO 80/81/82/94/95/96/204, SID 0x1c01, IOVA 0xA0000000/256 MiB and MSI SPI140 (docs/plans/WIFI-PORT-PLAN.md:15).", "2026-11-16/17: K60 reaches PCIe0 link/BAR, SMMU SID1c01 with 64 MiB native-4K DMA, six WLAN rails and amss20 BHI download, then stops at MHI power-up. Exact c7 line E:/k60-work/evidence/usblog-20261116-122546/console.log:632 and MHI-preload line E:/k60-work/evidence/usblog-20261117-114031/console.log:617: Pong MHI: timeout after 20000 ms ee=0 pm_state=2 exec_env=1 mhi_state=1 MHISTATUS=0x101 MHICTRL=0x200. exec_env=1 proves the device sits in SBL while the host cached ee=0 and waits for an EE event that never arrives.", "Official MhiBoot.c:91-99 accepts only BHI_STATUS>>30==2 (3 is error), then MhiWaitSbl at :104-107 polls BHI_EXECENV and writes BHIE TXVECADDR/TXVECSIZE/TXVECDB through start_image at :65-75 when EE==SBL(1); it never waits for an EE event packet. Stock Linux mhi_fw_load_handler returns after READY and mhi_sync_power_up waits the cached EE.", "2026-11-18: candidate fix/wifi-bhi-execenv-wifi at build head 4e00d569 gates the SBL action on BHI_STATUS success, polls BHI_EXECENV for 200x10 ms, and queues DEV_ST_TRANSITION_SBL with a one-shot pong_sbl_pushed latch. Generated anchors boot.c:622/646, pm.c:828/834, mhi.h:445; docs/research/wifi/SBL-QUEUE.md records the official-path comparison; test-wifi-sbl-queue.py passes 14 checks; artifact wifi-20261118sbl-gated boots nothing yet (hardware_tested=false).", "2026-11-18 01:29: direct candidate fix/wifi-bhie-direct at build head 0782eddc pushes AMSS directly in the READY pass after BHI_STATUS success; first flight E:/k60-work/evidence/usblog-20261118-012938/console.log (237,343 B, SHA256 9fff4a26...) logged amss bhie load ret=0, then exec_env=2 (AMSS), pm_state=4 (MHI_PM_M0), mhi_state=2 (MHI_STATE_M0). BHIe works; mhi_sync_power_up still times out because cached ee stayed 1 (SBL). Dataset does not claim WiFi.", "2026-11-18 01:56: mission candidate fix/wifi-mission-poll at build head b60bd6ef wakes the cached EE and sets it to AMSS after the direct BHIe push; artifact E:/k60-work/artifacts/wifi-20261118sbl-mission/boot.img (201,887,744 B, SHA256 be6ba473de4c89cdbd9f2869e198519365a7beb661ae057be607c0d58cb346c2) is built and verified but not flown because the board is USB-down (state none).", "2026-11-18 02:22: mission2 candidate fix/wifi-mission-poll at build head 3bb68355 adds mhi_create_devices after the AMSS/WFW mission poll so the IPCR channels (ee_mask=0x4) exist before mhi_sync_power_up returns; artifact E:/k60-work/artifacts/wifi-20261118sbl-mission2/boot.img (201,887,744 B, SHA256 deeadc2c0dd27ffe00db25f6259400bcfbe94d726b8d175d71fdffb4c9611c07) is built and verified but not flown because the board is USB-down (state none).", "2026-11-18 03:07: mission3 candidate fix/wifi-mission-poll at build head 5d973b58 lengthens the BHI_EXECENV mission poll to 2500x10 ms (25 s) so the timeout-window AMSS transition is caught; artifact E:/k60-work/artifacts/wifi-20261118sbl-mission3/boot.img (201,887,744 B, SHA256 7bd5cd01fbc2487547270bcd0408d6899c0db29657bf13e38bb76187ce425db2) is built and verified but not flown because the board is USB-down (state none).", "2026-11-18 03:41: mission4 candidate fix/wifi-mission-timeout at build head 91c21c7c adds ready_timeout_ms=60000 in generated ath11k/mhi.c:450 so mhi_sync_power_up stays alive while the 2500x10 ms BHI_EXECENV poll caches AMSS; artifact E:/k60-work/artifacts/wifi-20261118sbl-mission4/boot.img (201,887,744 B, SHA256 7646f5caf1b6fd03628587df2cdc915a24d8aca7115816af379858d9e6ac4a26) was flown on 2026-11-18 09:17; console E:/k60-work/evidence/usblog-20261118-091754/console.log (85,874 B, SHA256 59063d2d702e359de9e89b80d24ea09c13dcac7fc436ef573ad5f3bb98cd2bd3) logs exec_env=2 cached ee updated :683, MHI powered up ee=2 state=2 :687, chip_id 0x12 :697, fw_version 0x20070039 :699, 102 channels :722, scan :724, en0 up :727, 12 networks :785, SpringBoard present.", "2026-11-18 10:38: mission5 flew with the mission5 image and 602-byte args ending pong_wifi=2 k60_wifi_rsc=2; console E:/k60-work/evidence/usblog-20261118-103831/console.log (82,266 B, 1,382 lines, SHA256 3b947808aa383cdec5bee903c2be325b4932f44c6e680793d60de451c3666ac2) passed MHI/QMI/102 channels/en0/scan but has no association RUNNING/SKIP/FAIL and no DHCP/IPv4; runtime state 1 is NW_STA_IDLE per nw_abi.h:54, so that gate was not the cause. Mission6 (75e5e842, boot.img SHA256 78b7ac33069739b208d511040321d6a80db085d63c05b15b94885beb7cd426b2, 602 B args) was flown on 2026-11-18 11:01; console E:/k60-work/evidence/usblog-20261118-110147/console.log (88,387 B, SHA256 CF4DF6ADB2509EB0D5B2DF5BAAA66F05CAE0FB5FF76E40BA731941A90D40A9D5) passes MHI/QMI/102 channels/en0/scan but still has no association RUNNING/SKIP/FAIL and no DHCP/IPv4; mission7 adds an association probe.", "MISSION8 (2026-11-18 12:07, E:/k60-work/artifacts/wifi-20261118sbl-mission8/boot.img, SHA256 1414ca38461cc763ba6b05f31bf46ecbb0cc3f296ec0687c7e3630d89bdd1ba5, 602 B args) is the first WPA2 association: console E:/k60-work/evidence/usblog-20261118-120749/console.log (87,208 B, 1,459 lines, SHA256 A98BAE37F9136965255847592B27B4F4E20B46BDD6FC2EFE6A2939BABBF83B8D) logs association test RUNNING :728, connecting c8:bf:4c:30:03:1c on 5240 MHz :737, associated :759, handshake messages 2/4 :761/:763, keys installed :765, connected :766, join result 0 :767 and runtime state=6 :890. configd then panics opening IONetworkStack (:1416/:1424, pc=0xfffffff0084218c4 lr=0xfffffff008425b84, x0=0) before DHCP; the 18-check judge is 11/18.", "MISSION9 (2026-11-18 13:02, image bf2c0348, head f64552e7, console E:/k60-work/evidence/usblog-20261118-130246/console.log 257,335 B / SHA256 5d0d5eec): the four-argument IOUserClient::initWithTask makes the stack open without a panic (:1431), but no DHCP frame leaves and en0 gets no address; judge 15/21.", "MISSION10 (2026-11-18 13:48, image 0b2af9b3, head 37bd4341, console E:/k60-work/evidence/usblog-20261118-134854/console.log 259,781 B / SHA256 c99924c9): the interface namer inside configd opens IONetworkStack under IOResources and reports busy state 1 (:1455), yet sends no naming or configuration command and no DHCP frame; judge 16/22; k60_autoreset=300 reset the board before the namer five-minute timeout.", "MISSION11 (2026-11-18 14:11, image 56b20bf1, head ded2c5a4, console E:/k60-work/evidence/usblog-20261118-141140/console.log 439,287 B / SHA256 DE3F5AC6): the native address configuration runs (dhcp out type 1 :4021, offer yiaddr 192.168.31.134 :4098, request :4103, ACK :4112), en0 obtains 192.168.31.134 (:4131) and the interface carries 21,752 packets in / 13,983 out; 26/26 judge checks pass, no panic; official scan/authentication/association/address/receive/send are device-verified, HTTPS/webpage loading still unproven.", "MISSION12 (2026-11-18 15:08, image 5c3799772e8b5fcdc74eb6cfbddfe5d1845f1375619ee757307cd17e10a1a38f, head 4d404560) adds TCP/443 and DNS counters but its one flight left only a partial console: E:/k60-work/evidence/usblog-20261118-150851/console.log (53,012 B, 918 lines, SHA256 3fb76775a4384cad815705cf6e705702c3b79b4d1ae611487f3fe334217b1235) stops at :912 waiting for the address configuration after :904 associated and :909 connected; no DHCP, DNS, TCP/443 or opener line is in the slice, and the capture wrote capture.ready but no capture.json, so the cut is a host/capture interruption and nothing is concluded. Mission12 must not be re-flown.", "MISSION15 (2026-11-18 22:32, image 8fedce49, head 6253eafc): the Settings pane now works at the protocol level. The reg-less wlan node in dts/mondrian.dts is exported into the ADT (:91-94 nubs, :148 devices=6 against 5 in mission14), so launchd's _LimitLoadToDeviceTree gate for com.apple.wifid is satisfied: :1223 xpcproxy /usr/sbin/wifid, :1504 WiFiManager starting, :1863/:1967/:3919 80211 user client opened by wifid. The packet-filter tap (mode 3 at :1463/:1465 and :1538/:1540), the 383 property-list writes from :3913 and the busy-flag transitions (:3936 false, :4008 true, :4363 false, :4708 true, :4709 false) are the reference implementation's mechanism; the pane's 103 query is answered from the link state (:3995-:3997). A person joined from the pane: :8578 join ssid length 7, key length 32 cipher 6, :8583 connecting 2412 MHz, :8585 associated, :8587-:8589 keys, :8590 join finished: module result 0. DHCP :2013 OFFER 192.168.31.71, :2038 ACK; lifecycle :4031 PASS lease=3/2; tcp443 in 302 out 368. Limits: the page cannot load because WebKit dies (:9046-:9054 corpses, :9200 MobileSafari sig=9 code=0xdead10cc) — an application-layer result is still unproven and belongs to the WebKit/GPU line; the pane list shows no 5 GHz because the whole flight has one scan (type 10 :4846, type 11 :4852) and the refresh types 25/365/419/422/423/115 plus 207 are EOPNOTSUPP (:3998-:4000, :4102/:4104, :7216, :1982), so wifid keeps its boot cache even though the driver's own table holds 17-21 BSS and the boot join ran at 5240 MHz (:3431). mission15 must not be re-flown."]
