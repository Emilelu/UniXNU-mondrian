what = "warm trip point in millidegrees"
source = "drivers/PongPower/K60ThermalMap.h:57"
expect = "K60_THERMAL_TRIP_WARM 90000"
dependence = "firmware"
ios27 = "re-check against the 27 thermal profile before trusting the ladder"

[[contract]]
id = "thermal-trip-junction"
lane = "thermal"
what = "junction trip point in millidegrees"
source = "drivers/PongPower/K60ThermalMap.h:58"
expect = "K60_THERMAL_TRIP_JUNCTION 95000"
dependence = "firmware"
ios27 = "same as warm"

[[contract]]
id = "thermal-trip-emergency"
lane = "thermal"
what = "emergency trip point in millidegrees"
source = "drivers/PongPower/K60ThermalMap.h:59"
expect = "K60_THERMAL_TRIP_EMERGENCY 110000"
dependence = "firmware"
ios27 = "same as warm"

[[contract]]
id = "thermal-trip-reset"
lane = "thermal"
what = "reset trip point in millidegrees"
source = "drivers/PongPower/K60ThermalMap.h:60"
expect = "K60_THERMAL_TRIP_RESET 115000"
dependence = "firmware"
ios27 = "same as warm"

[[contract]]
id = "thermal-trip-shutdown"
lane = "thermal"
what = "shutdown trip point in millidegrees"
source = "drivers/PongPower/K60ThermalMap.h:61"
expect = "K60_THERMAL_TRIP_SHUTDOWN 125000"
dependence = "firmware"
ios27 = "same as warm"

[[contract]]
id = "power-pdmem-vote-magic"
lane = "power"
what = "perf-lock PDMEM address family the vote writes through"
source = "drivers/PongPower/K60CpuFreqPlan.h:61"
expect = "0x17d09804"
dependence = "firmware"
ios27 = "re-derive from the 27 device tree node, not from this comment"

[[contract]]
id = "power-pdmem-vote-offset"
lane = "power"
what = "offset inside the perf-lock PDMEM window"
source = "drivers/PongPower/K60CpuFreqPlan.h:66"
expect = "K60_CPU_FREQ_PDMEM_VOTE_OFFSET 0x804u"
dependence = "firmware"
ios27 = "re-check with the magic above"
