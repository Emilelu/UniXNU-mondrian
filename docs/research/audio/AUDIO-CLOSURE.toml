criteria = "The ring queue (pcm-ring-submit), the low-DMA lease (pcm-low-dma-lease), the PongAudio IOService/UserClient (pcm-service-userclient), the playback graph with periodic ar_write/WRITE_DONE (pcm-playback-graph), the DMA-slot copy/timeout (pcm-dma-feed), the output-only AudioServerPlugIn (pcm-hal-plugin), its kernel deployment into empty-hal (pcm-hal-deploy), the clock handshake (pcm-clock-handshake), the 560-byte adsp_apps intent (glink-message-limit-560) and the low-DMA fallback (pcm-low-dma-fallback) are in place. Image r (kernel f739d730..., ADSP carrier 66336946...) carries all of these plus 560-byte intents, PRM source port 2, ABI version 3/SetHostClock, the 19.2 MHz clock handshake and the kmem_alloc_contig low-DMA fallback; it booted to SpringBoard on 2026-11-18 but its init bindfs view returned EPERM, so mediaserverd never loaded the HAL. Image s (kernel 69aed1e0..., ADSP carrier 66336946...) adds the kernel bindfs mount of /private/var/pong/empty-hal over /System/Library/Audio/Plug-Ins/HAL and booted on 2026-11-18 01:46: console line 635 reports K60AUDIOHAL mount point=/System/Library/Audio/Plug-Ins/HAL files=2/2 error=0, line 1595 reports PongAudio HAL: K60 stereo service connected, and line 1604 reports PongAudio HAL: AudioServerPlugIn initialized; no playback stream entered StartIO, so the clock handshake, low-DMA allocation and service timer have not run yet. Image v (kernel ee8fcc1d..., audio_hal 2a3831cf..., boot.img 678107b0...) carries the same code plus a boot-arg HAL selftest and a pong_audio=1 gate that also publishes the authenticated PAS1 handoff; it is built (31 arguments, 607 bytes) but not yet booted. Image w (kernel 8c8a294c..., audio_hal 2a3831cf..., boot.img 8aa4e8e8...) fixes the empty-lease fallback: an all-zero /chosen/pong-audio-dma now prints PongAudio: low DMA lease invalid and falls through to kmem_alloc_contig instead of returning NoLease; it is built (31 arguments, 607 bytes) and not yet booted. Image y (kernel f49e7d4a..., audio_hal 2a3831cf..., boot.img 26ac04a7...) adds the ml_io_map() remap and the 16 KiB-page 4 GiB max_pnum cap to that fallback; it booted on 2026-11-18 09:26 (31 arguments, 607 bytes) but the adsp_apps slot was registered after the DSP OPEN, so no GLINK channel, APM state or AFE step ran and the HAL selftest returned kAudioHardwareNotRunningError. Images z, aa, ab and ac tried earlier registration and hold variants: z/aa/ab reset the shared transport, while ac reached PMIC up but then lost the transport because it delayed the OPEN_ACK. Commit 02caba7f acknowledges the DSP OPEN immediately and holds only our own OPEN until PMIC up; image ad (kernel 85738be3..., audio_hal 2a3831cf..., battery archive 0a389491..., boot.img d673c7ad...) booted on 2026-11-18 11:52 but still hit K60Battery: physical transport stopped error=-5 right after PMIC up (534), then a separate kernel data abort; image af (HEAD 26f3835d, kernel b87b946a..., audio_hal 2a3831cf..., battery archive 360a26b1..., boot.img aaad4817...) creates the adsp_apps initiator slot only after PMIC up; it booted on 2026-11-18 12:26 (31 arguments, 607 bytes) and printed K60Battery: audio GLINK slot opened and the PMIC-up line without error=-5, but the DSP never answered our OPEN, so the channel stayed down and the HAL selftest still returned kAudioHardwareNotRunningError. Image ag (HEAD b82ce0fe, kernel bc253864..., battery archive 7bf94341..., boot.img 49f121f2...) adds QcomGlink OPEN/OPEN_ACK/slot diagnostics; it booted on 2026-11-18 12:48 (evidence E:/k60-work/evidence/audio-probe-ag/run1-20261118-1238, capture state=captured-budget-complete, 264,186 bytes) and line 208 records QcomGlink: rx OPEN name=adsp_apps p1=3 known=0 hold=-1, proving the DSP opens adsp_apps during the PMIC handshake before the slot exists and never repeats it, while line 548 shows ch adsp_apps lcid=2 sent=1 acked=1 remote=0. Commit 234558f4 remembers early remote OPENs in pending_open[] (QcomGlink: adopt remote OPEN) and defers the OPEN_ACK until our own OPEN is acknowledged (QcomGlink: late OPEN_ACK); host tests are TESTS OK 611 cases. Image ah (HEAD 234558f4, kernel 9f5c3eb8..., payload_kernel 683b409b..., adt 4dc245cd..., battery archive e97c8ea0... 154,712 B, boot.img b99d1560...) is built (31 arguments, 607 bytes) and waiting for a free fastboot. The remaining proof is a host or on-device test that opens the service, maps control/ring through the HAL and submits at least one period through the service timer without an underrun. Until that test exists, M5 cannot pass. Image ah (HEAD 234558f4, boot.img b99d1560..., evidence audio-probe-ah/run1-20261118-1300) brought adsp_apps up (adopt remote OPEN rcid=3, late OPEN_ACK, glink adsp_apps up) and exposed a fatal surplus INTENT, fixed by bc3781e5. Image ai (HEAD bc3781e5) reached APM ready but the PRM clock was refused with status 2; 9d0b1095 moved the AudioReach payload_size to the last header word. Image aj (HEAD 9d0b1095) had the PRM request accepted (opcode 0x02001002 status 0) but the legacy service set-param refused (0x02001005 status 1). Image ak (HEAD 721415bc) repeated that refusal with destination 0 and AFE 4 (status 1 then 2), showing this legacy AFE envelope is not accepted by the K60 firmware. a7d82acf fixes the TDM group to the single live-DT member and adds pong_audio_group_probe=1 to stop after step 1 and log the response route and echoed opcode; image al is the next candidate. Images al to ao followed: al never built (two docs were left out of 14c795c4 and fixed by 48bb3d51; the extra pong_audio_group_probe=1 argument pushed the kernel command line to 632 B against the 607 B limit), am (HEAD 48bb3d51) showed the AFE service answers from ADSP port 4 with opcode 0x000100f3 echoed, so status 2 is ADSP_EBADPARAM on the v1 envelope rather than a routing failure; a7a6a24b switches the group and enable steps to AFE_SVC_CMD_SET_PARAM_V2 (0x000100fc, param_hdr_v3) and image ao (HEAD a7a6a24b, boot.img e6edd1c8..., kernel_built 70e94cf1...