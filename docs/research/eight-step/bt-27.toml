[hardware.bluetooth.step.same_model]
done = true
recorded_at = "2026-11-21T03:40:00+08:00"
evidence = "No same-model target runs iPadOS 27: the search covers the SM8475 / Redmi K60 trees and finds no second 27 implementation. t970 is a QCA6390 / QUP0 SE6 board on iPadOS 18, so its four patches are a transport contrast only (docs/plans/BT-IOS27-PORT.md:556-560). zizhan is an iPadOS 18 product-id counterexample, not a 27 implementation (docs/plans/BT-IOS27-PORT.md:562-569). The nearest 27 reference is sheng's two xnu-12377 runtime patches."
files = ["docs/plans/BT-IOS27-PORT.md"]
plan = "Keep t970 as the SE6-versus-SE20 contrast and zizhan as the product-id failure mode; neither is a same-model proof."

[hardware.bluetooth.step.official]
done = true
recorded_at = "2026-11-21T03:41:00+08:00"
evidence = "Page UniXNU/docs/zh/porting/bluetooth.md:19-31 labels its table as sheng's values, and UniXNU/docs/zh/porting/bluetooth.md:21 says to read the target DTS, so 0x898000, SE6, GIC493, 51.2 MHz, 3.2 Mbaud and hmtbtfw20.tlv are reference values, not this board's. Our node dts/mondrian.dts:109-116 declares device_type bluetooth, compatible qcom,wcn6855-bt, unixnu,adt-name bluetooth, encoding 1 (H4), speed 3000000 and status okay; scripts/check-bluetooth-dt.py:101-107 enforces speed equals K60_BT_RUN_BAUD and encoding 1. The seven-step power order (UniXNU/docs/zh/porting/bluetooth.md:46-55) is checked by scripts/check-bluetooth-power.py:4-8. The worker and transport model (UniXNU/docs/zh/porting/bluetooth.md:60-67) is the qbt engine in the 0500-0523 series, with the GENI model at docs/plans/BT-IOS27-PORT.md:306-329. The payload.runtime requirement (UniXNU/docs/zh/porting/bluetooth.md:87-106) is not wired: board.toml has no [payload.runtime], so the framework will not stage BlueTool or bluetoothd, and it will not mount the OS image (docs/plans/BT-IOS27-PORT.md:614-620). The three named checks (UniXNU/docs/zh/porting/bluetooth.md:113-115) do not exist here; five equivalents exist (docs/plans/BT-IOS27-PORT.md:528-548). The expected state=2 / error=0 and one bluetoothd (UniXNU/docs/zh/porting/bluetooth.md:126-128) have not been observed."
files = ["UniXNU/docs/zh/porting/bluetooth.md", "dts/mondrian.dts", "scripts/check-bluetooth-dt.py", "docs/plans/BT-IOS27-PORT.md"]
plan = "The uncovered requirement is payload.runtime; wire it before the first 27 payload, and do not treat the five static checks as a substitute."

[hardware.bluetooth.step.decompile]
done = true
recorded_at = "2026-11-21T03:42:00+08:00"
evidence = "Local facts: the six DT properties are at dts/mondrian.dts:109-116; the native stack is still off in configs/mondrian_ios27_defconfig:17-21; QcaBluetooth is pinned at revision 22ff97f93416452335bb61badb14c762da653487 in UniXNU/components.toml:494-508 with sheng as the only verified device. The 24A446 kernelcache is pinned and its IOStorageFamily entry is at fileoff 0xa0e670, but no 24A446 bluetoothd has been extracted (docs/plans/BT-IOS27-PORT.md:580-583). 20G81 bluetoothd imports MGGetProductType (docs/plans/BT-IOS27-PORT.md:578-579), which is why zizhan's product-id SIGSEGV is the relevant failure mode (docs/plans/BT-IOS27-PORT.md:562-569)."
files = ["dts/mondrian.dts", "configs/mondrian_ios27_defconfig", "UniXNU/components.toml", "docs/plans/BT-IOS27-PORT.md"]
plan = "Extract 24A446 bluetoothd and BlueTool, then diff their MobileGestalt imports against 20G81 before answering product-id."

