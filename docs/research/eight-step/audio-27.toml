recorded_at = "2026-11-21T04:06:00"
evidence = [
  "官方 §3「实现音频流」按 AudioReach/GPR 排六步：打开并识别服务、描述完整路由、发图命令、接缓冲路径、接 OS 服务、验证路由；见 UniXNU:docs/zh/porting/power.md:44-74。",
  "官方五条硬事实：DSP 缓冲用 32 位地址并在高字放流索引 0x1001&0xf；GLINK 先小 intent 再大 intent；PRM 用自有端口、TX core clock 0x30c；VA/TX macro 都要开 TX SoundWire master 门控；24 MHz 假设要按 19.2 MHz 修正否则 IO 周期偏 25%；见 UniXNU:docs/zh/porting/power.md:76-82。",
  "官方要求采集在流之外做 codec 上电、SoundWire 枚举、模拟/数字通路、周期读和输入发布；见 UniXNU:docs/zh/porting/power.md:87-100。",
