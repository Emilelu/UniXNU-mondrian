[hardware.storage]
revisit = 'Restore when the F3 pair can land together: board.toml:389 gains "build-native-ufs-linux.py --tree . --out build/native-ufs" and configs/mondrian_ios27_defconfig:25 goes back to y in the same change (the closed state is coherent today; scripts/check-ufs27-storage-selection.py grades both). Three things have to be true first: (a) the producer can run at all — it reads build/xnu/ios-obj/*/iokit/DEVELOPMENT/KernelConfigTables.cpo.json, which only a 27 kernel build leaves behind, and no such record exists on this host; (b) the link closes — the eleven IOBlockStorageDevice symbols are the bt line Route D as of 2026-11-21, and until it lands a y switch fails the link with 26 undefined symbols instead of 14; (c) patches/xnu-12377/0542-k60-native-ufs-personality.patch joins the series, because without it the linked driver is never instantiated from the ufshc node. A 27 root mount and a mounted Data volume stay unobserved on this board either way.'
name = "存储、根卷与持久 Data（UFS 3.1 / NativeUfs / RamBlock / VerifiedRoot）"
status = "active"
paths = ["drivers/NativeUfs/", "drivers/NativeRamBlock/", "configs/mondrian_ios27_defconfig", "board.toml", "scripts/build-xnu-generic.sh", "scripts/build-native-ufs-linux.py", "scripts/check-ufs27-storage-selection.py", "docs/research/storage/"]
why = 'The Data gate is five independent stages (docs/research/storage/UFS27-GATE.md §1). Selection: the 27 include list named "NativeUfs", which is only the legacy_name of the ShengUfs catalog entry (UniXNU/components.toml:121, :139); components.selected() (UniXNU/scripts/unixnu/components.py:22-45) accepts a legacy name only when a module for that component exists, and feeds.toml declares only the sm8475 Soc source, so the profile aborted with "unknown component: NativeUfs" before any recipe ran — and it aborted the whole build, because the 27 line goes through the framework (scripts/build-ios27-linux.sh:60 runs ./unixnu build kernel --device "$ROOT"). Fixed 2026-11-21 by dropping the identifier (board.toml:366): the driver stays vendored and a script recipe compiles it (ruling 1). Production and switch: board.toml:389 has no storage recipe, so build/native-ufs/libNativeUfs.a is never written while scripts/build-xnu-generic.sh:646-653 force-loads exactly that path (the 16.6.1 builder does the same at build-xnu-4k-baseline.sh:1054 and :1278); the switch is therefore off (defconfig:25 n, ruling 2) until the recipe entry and the switch land together. Link: the path was already right, but closing the eleven IOBlockStorageDevice symbols belongs to the bt line Route D (ruling 3). Bind: the 12377 KernelConfigTables.cpp closes after IOPanicPlatform and IOExclaveProxy, so no ufshc personality exists yet; 0542 is written and dry-run verified against xnu-12377.121.6 and stays out of the series until F3. Neither a 27 root mount nor a mounted Data volume has been observed on this board.'
label = "UFS 3.1（SM8475 UFSHC 0x01d84000/0x3000、PHY 0x01d80000/0x2000、GCC 0x00100000、apps-SMMU stream 0x60）＋ 32 GiB Data 窗"

