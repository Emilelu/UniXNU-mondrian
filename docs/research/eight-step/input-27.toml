# iOS 27.0.1 (24A446) eight-step ledger — the input line (official porting/drivers row 4:
# QcomGeniSpi, ShengNovatekTouch, ShengHidInput, ButtonProbe).
#
# Steps 1-7 only. Step 8 (device) belongs to the Lead and is never written here.
# 27 side is cited from the 27 tree: the 27 xnu feed (xnu-3199e8bc), the 27 IOHIDFamily
# feed (f53ac321), the 27 device repository (xnekom-ios27) and the same-profile
# reference tree UniXNU-sheng (board.toml:9 = ipados-27.0.1-24A446).
# Gate: python3 scripts/assemble-27-eight-step.py --check

[hardware.touch]
name = "触摸（Goodix GT9916R / BERLIN，BRL 协议）"
status = "active"
paths = [
  "patches/xnu/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz-pong-touch-console.patch",
  "userland/touch.c",
  "board.toml",
  "docs/engineering/TOUCH-STATEMACHINE.md",
]
revisit = "iOS 27 stage-0 进入 SpringBoard 后按线恢复；若触摸成为 stage-0 或首帧阻塞则提前恢复"
why = """iOS 16.6.1 已在真机验证：旧代码只发 0x90/0x00 关 raw debug、从未发 0x91/0x01 坐标使能，且配置完成只查 ack[1] 不等 reply[0]==0x80；修好后收 8 触点 + 4 条 HID 上报。27 要回答的不是控制器协议（同一颗 GT9916R、同一套 BRL 状态机），而是注入路径换了：24A446 的同代参考是内核 IOHIDDevice（ShengHidInput）+ 内核触摸探针，而不是 16.6.1 的 /dev/pong-touch + backboardd 虚拟 HID 服务。本文件只覆盖离线结论，不含上机步骤。"""

# ① 同型：同 SoC 兄弟移植怎么接这个触摸控制器；K60 没有公开同型号移植。
[hardware.touch.step.same_model]
done = true
evidence = [
  "27 设备仓 docs/research/touch/01-same-hardware.md:8-12 — 同型落点是 SM8475/SM8550 兄弟实现：UniXNU-pong（Goodix Berlin-D 协议核 pong_goodix.c + pong_input.c ring 队列）、HackiOS redwood 的 redwood_goodix.c（APSL 2.0，本驱动源头）、官方 marble/fuxi 板级常量；没有同型号 K60 移植可抄",
  "E:/hackios/UniXNU-sheng/board.toml:9 — os_profile = \"ipados-27.0.1-24A446\"：sheng（SM8550、NT36532E）是唯一同代同 OS 的触摸+HID 参考（a68ee4e）",
  "E:/hackios/UniXNU-sheng/package/TouchProbe.cpp:342 — 27 侧触摸源只用 native_touch_set_sink 交出快照，HID 由 ShengHidInput 做；传输是 GeniSpi + 厂商固件下载（sheng-touch=1..4 分阶段），与 K60 的 brl 固件读/坐标不同层",
]

# ② 官方：porting/input 的 §1 传输与固件、§2 窗口/总线/GPIO/IRQ、§3 选择内核的 IOHIDFamily、§4 PMIC。
[hardware.touch.step.official]
done = true
evidence = [
