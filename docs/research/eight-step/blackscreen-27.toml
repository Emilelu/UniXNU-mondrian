- U7 帧缓冲内存是否在 EBS 时被回收/覆盖：描述符类型为 EfiConventionalMemory ⇒ P7 对 EBS 后黑成立；保留/EfiMemoryMappedIO ⇒ 排除 P7。验证：H1 的描述符打印。
- U8 面板/DSI/时钟/电源是否在 EBS 时被关：5 秒保持期内斜看有微弱红像或背光亮而图像黑 ⇒ 面板活着，排除 P6；全暗无背光辉 ⇒ 关断在 EBS 之前。验证：H2 暗室检查。
- U9 内核是否到过 arm_init：绿 bootbar（0551）出现 ⇒ 活过 arm_vm_init + ramoops 初始化，排除桩 panic 在 arm_init 之前；红/黄/青三带（0542）出现情况定位死亡点。验证：§8 实验 H5 色带定位（5/15/60/300 秒拍屏 + 计时）。
- U10 桩 panic 是否静默发生：warm-reset 后 RamoopsDumpDxe 读到 fileset: original component called an unmapped kernel function from 0x… ⇒ 桩 panic 实锤；no signature ⇒ 死在 arm_init 末之前。验证：§8 实验 H6（第二次启动，不长按电源）。
