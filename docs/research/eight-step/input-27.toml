why = """iOS 16.6.1 已在真机验证（yibiya 631efc3）：旧代码只发 0x90/0x00 关 raw debug、从未发 0x91/0x01 坐标使能，且配置完成只查 ack[1] 不等 reply[0]==0x80；修好后收 8 触点 + 4 条 HID 上报，porting.toml 的 input 是 device-verified。27 要回答的是注入路径换了：24A446 的参考实现是内核 IOHIDDevice（ShengHidInput）+ 内核 TouchProbe，而不是我们 16.6.1 的 /dev/pong-touch + backboardd 虚拟 HID 服务。本文件只覆盖离线结论，不含上机步骤。"""

