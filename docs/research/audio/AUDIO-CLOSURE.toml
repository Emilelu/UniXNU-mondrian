[[item]]
id = "pcm-low-dma-fallback"
stage = "M5"
change = "when the /chosen/pong-audio-dma lease is absent or empty, pong_audio.c allocates its own 64 KiB buffer below 4 GiB with kmem_alloc_contig and keeps it mapped"
evidence_kind = "artifact"
evidence = [
  "patches/audio/0003-k60-audio-afe-selftest.patch",
  "V: kernel.macho: PongAudio: low DMA allocated pa=0x%llx size=0x%x",
]
criteria = "pong_audio_dma_lease() still consumes a valid 16-byte /chosen/pong-audio-dma lease when present; when the property is absent or zero-length it calls kmem_alloc_contig(kernel_map, &alloc_va, 0x10000, PAGE_MASK, (ppnum_t)(atop_64(0x100000000ULL - bytes)), 0, KMA_DATA|KMA_KOBJECT, VM_KERN_MEMORY_IOKIT), requires kvtophys() page alignment and PA+0x10000 <= 4 GiB, then ml_io_map()s the physical range so the DSP sees uncached I/O memory, and never frees the buffer. The 16 KiB page size (PAGE_SHIFT_CONST = PAGE_MAX_SHIFT = 14 when RAM > 1 GiB) makes atop_64(4 GiB - bytes), not 0xfffff, the exact page-count cap. Image w kernel 8c8a294c70b379545d67145edad7fd9f014522ac6bb5d287ab90a52b4797bfb6 adds PongAudio: low DMA lease invalid and PongAudio: low DMA unavailable alongside the allocated line. Image y (kernel f49e7d4a381c18c5d43144b60e485ec5267901cdfe125aad00a85b9c29d8bd81, 129,183,744 B; boot.img 26ac04a7672e02c0a2d01aa71f88f39f7b3a63afd78a77b04a385ccc2df296ec) is the first build that combines the fallback with ml_io_map() and the atop_64 page cap; it is built and not yet booted. Image r (kernel_built f739d730ff26b0e156565063c2dfe401045ee2dc53a9fef08242c1de06a32f61, 129,167,360 B) contains PongAudio: low DMA allocated pa=0x%llx size=0x%x once; its ADT still has 16 zero bytes at /chosen/pong-audio-dma."
status = "closed"
owner = "audio-agent"
on_open = "the ADT placeholder is empty on every image; without the fallback the whole PCM path refuses to start"

