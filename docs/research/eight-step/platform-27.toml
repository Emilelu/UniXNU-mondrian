[hardware.platform.step.wide]
done = true
catalog_checked = true
catalog_result = '''catalog 的 ArmCpu 钉在 93a5030c（E:/hackios/UniXNU/components.toml:3-19，os_abi=["ipados-17.7.11-21H461"]，verified_devices=[]），875 行，有 psciCall 与 16 槽 armcpu_spi_attach，但没有 sleep（无 armcpu_sleep_register / ArmCpuSleep.h，那是 823c6b2→5f37026 之后才有）。因此「catalog ArmCpu」在 27 上不是现成可用的：要么升 rev 到 ≥5f37026，要么接受没有睡眠。'''
evidence = '''六个参考树逐一核对（2026-11-21，E:/hackios/ 下）：
- UniXNU-sheng：os_profile 走 ipados-27.0.1-24A446，board.toml 三处 include/archives 用 component:ArmCpu（:20/:117/:174），无 drivers/ArmCpu 目录，副核靠 sheng-smp=1（board.toml:66）。
- xnekom-ios27：os_profile=ios-27.0.1-24A446，drivers/ArmCpu/ArmCpu.cpp 与本板 779 行文件逐字节相同（diff 无输出），board.toml:14/:21 的 include/archives 形状与本板一致，patches/xnu-12377/series:65/:87 带 0532 与 0540，另有 armcpu-sleep-hook.patch 与 drivers/PongPower/K60PlatformSleep.cpp:128（调 armcpu_sleep_register），其 ADT 生成器同样只写 /chosen psci-method（scripts/make-pong-adt.py:174）而**不建 /psci 节点**；该 fork 仍在被维护（24746184 "fix(power): mark secondary CPUs stopped before sleep"、1c662ecd "fix(power): keep the platform sleep path quiet until resume"）。
- UniXNU-t970 / UniXNU-zizhan：18.7.10，各带 581 / 559 行的旧 fork，board.toml 里没有 ArmCpu 条目（分支不同，未深挖）。
- UniXNU-pong：无 drivers/ArmCpu，board.toml 无 ArmCpu 条目。
- 框架 E:/hackios/UniXNU 的 components.toml 是唯一 pin 点；device 侧没有第二份 catalog 版本。
结论：27 时代真正在跑的两棵树走向相反——sheng（SM8550，pad）用 catalog + 引导参数；xnekom（Pong 族，K60 同源）用 fork + 0532/0540。本板与 xnekom 同源，跟后者。'''
recorded_at = '2026-11-21T14:05:00'

