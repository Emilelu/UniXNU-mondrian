# Hardware contracts this line owns, one row per fact that an OS port can
# break silently. Every row is a citation: `source` is path:line and `expect`
# must appear on that line, so a refactor that moves the constant turns the
# checker red instead of leaving a stale address in a document (P-259:
# scripts/check-hw-contracts.py is that pitfall's registered check).
#
# Optional `mirror = "path:line"` names a second copy of the same text - the kernel
# patch that ships a driver stanza, for instance. P-255 happened because only one of
# the two copies was fixed, so a duplicated contract states both lines here.
#
# `dependence` says what an iOS 27 move has to re-check:
#   none            - our own encoding, only both copies of the file must agree
#   macro           - a compile-time switch this tree controls
#   firmware        - a number the DSP/firmware or the boot chain also knows
#   property-number - a PMIC/channel property index that differs per OS image
#   layout          - a struct/array shape shared with another component
#
# ios27 is the action the 27 line takes; "unchanged" means re-verify only.

# Optional \`second = [...]\` names an INDEPENDENT source for a row whose number a
# second system also knows (dependence = "firmware"): the DSP image, the device's
# own flattened device tree, the vendor Linux implementation of the same GLINK
# protocol, or another SM8475 driver. Each entry is one of
#   { source = "path:line", expect = "text that must sit on that line" }
#   { bytes = "path", offset = 24, hex = "00003086" }
# A path outside this repository is written external:<root>/<path>, where <root>
# is declared under [roots] below; the gate translates the drive letter for the
# host it runs on. \`second_note\` says what the citation means when the mapping
# is not obvious. A firmware row that has no independent source must say so:
#   second_unavailable = { tried = ["...", "..."], why = "..." }
# with at least two searched sources and a why that names the artefact that would
# settle it - "cannot be verified" alone is not a reason (Lead, 2026-11-20).
#
# A byte-range source is re-readable rather than trusted: `python3
# scripts/read-fdt-props.py <dump> --node <path> --prop <name> --hex` walks the
# flattened device tree and prints exactly the hex a row records, and the five
# thermal ladder rows are the values that command prints for /soc/thermal-zones.
# The walker has its own fixture suite (scripts/tests/test-read-fdt-props.py, 27
# checks) because a second source nobody can re-read is not a source.
#
# Every row also states what the iOS 27 checkout holds, because "27 is the same as
# 16" is two copies of one fact and two copies drift (P-259). Three fields:
#   same27 = "same" | "drift" | "unchecked"
#   copy27 = "path:line"   (relative to tree27; omitted only when unchecked)
#   why27  = "..."         (required for drift and unchecked: what 27 holds instead)
# The gate re-opens copy27 in the tree named by tree27 and requires `expect` on that
# line for "same"; a "drift" claim is refused once the 27 copy already carries the
# text, so the table cannot quietly keep claiming a gap it closed. A file the 27 tree
# does not have yet is "unchecked" with the reason - not a silent pass.

tree27 = "E:/hackios/xnekom-ios27"

[roots]
hackios = "E:/hackios"
k60work = "E:/k60-work"

