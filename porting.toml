findings = ["2026-11-12 boot packaging regression: cand12 (cba1c0ecad1858a251abc241f5a17989580749a233d5d0cdacc8764869e70c4f) returned to fastboot without a CDC console. The v4 header declares a 1584-byte structure, but firmware starts at the fixed 4096-byte page; work/touch-gpu/repack-boot.py incorrectly used 1584 as the slot start. The resulting payload begins at 550448 instead of 552960, overwriting the compressed firmware tail. zlib.decompressobj(31) accepts cand7 with EOF and an appended FDT, but rejects cand12 with an incorrect data check. The cand12 FAT payload is byte-identical to the current payload.img (49b60bcbc51307ff449e24e72e1c76dd12621c3ff8d156ebceac4a3d9a126a95), so recovery can retain all current kernel and userland changes.", "Prior art: scripts/build-bootimg.py:29-47 and the same-SoC work/refs/pong-ios16/scripts/build-bootimg.py:29-47 already use a 4096-byte firmware start, aligned ramdisk and signature offsets. Reuse that v4 layout rather than rolling back functional patches."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["cand15 restores actual iOS desktop with the current functional kernel unchanged. Touch remains unavailable: live log reaches SE4 protocol1/interfaces1 (FIFO disabled) and stops because bitbang-pins roles are absent; no device handshake or contact was observed. Battery correctly reports no authenticated PAS1 handoff and does not publish a fabricated source. GPU execution is not qualified."]
next_action = ["Keep the repaired v4 layout, UFS-only payload and complete CPU/UFS ADT contracts. cand16 native lockscreen is verified, but user sees Press Home to Open, black wallpaper and no touch. Native buttons type2/no menu plus stale MobileGestalt cache invalidation and genuine WallpaperKit7410 selection are implemented for the next candidate; verify actual policy and wallpaper pixels."]
evidence = [{ kind = "device", reference = "docs/reference/ROUTE-A-18-STATE.md", command = "scripts/k60-device.sh boot /mnt/d/Android/k60-ios/boot-darwin24-bc8.img", revision = "d2af811a6dc9c6225de586e1615ca3824e2edce4", result = "Darwin 24 loader boots the board every time: green bar from Entry.S, then the upstream probe's blue and magenta bars at the kernel entry and just before the MMU comes on. Confirms the 0x480 boot_args ABI, ADT handoff and framebuffer are live on hardware. A readable kernel panic followed at k60_fontscale=4 until the CPU start order was fixed; that panic is gone." }, { kind = "device", reference = "docs/ops/PITFALLS.md", command = "fastboot -s be74ba07 boot E:/k60-ios/boot-cand15-20261112.img; boot_capture2.py --seconds 240 --idle 0", revision = "5abea9af361ac2331c18f275567915125dc0d5f6", result = "console-20261112-103539.log68357B: CDC COM8, original launchd, framebuffer swaps and heartbeats through150s. User confirms iOS desktop, no touch. Image7489cf3172bfd15db989775d900cff367bbac0172f0c5c65b23e745256b5043d; payload kernel994ad402ad8571ef67e732a3d02e3c02abe82608b6612d6b8c8cc8a29aa63f9a unchanged from cand12. Recovery changed packaging and ADT/backend contracts only." }]

[[area]]
id = "cpu"
status = "implemented"
components = []
paths = ["package/CpuFreq*", "scripts/*armcpu*", "drivers/ArmCpu/**"]
inputs = ["Identify the cpu and interrupts hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for cpu and interrupts."]
procedure = ["Follow the cpu and interrupts stage in the porting guide and record the actual commands."]
findings = ["The SM8475 hardware MPIDRs are flat: 0x000..0x700, Aff1 = core index. That is what the vendor device tree and the Android tree carry, and this firmware rejects every CPU_ON target outside that table. The 4/3/1 A510/A710/X2 grouping seen in Android's sysfs is L2/L3 cache topology, not MPIDR affinity, and the kernel's cluster-type property (all 'P') is what collapses the eight cores into one topology cluster.", "A starting core is matched to its cpu data by MPIDR & 0xFFFF against the ADT's per-CPU reg, and the same value is the PSCI target, so the ADT must carry the real MPIDRs. The board dts must not override the SoC dtsi's cpu nodes: the ADT generator needs their compatible string and their unixnu,cluster-type."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["The eight cores register and the boot CPU takes its first IPI, but no secondary has yet been seen past its own entry checkpoint on hardware."]
next_action = ["Confirm that each secondary CPU runs its own entry checkpoint and serves a timer on the unit."]
evidence = [{ kind = "device", reference = "dts/mondrian.dts", command = "adb shell 'cat /sys/devices/system/cpu/cpu*/topology/physical_package_id; cat /proc/device-tree/cpus/cpu@*/reg'", revision = "e636e445b621bed4fac0069f3604b87061350a8d", result = "Android's device tree carries the eight hardware MPIDRs flat, 0x000..0x700, and boots all eight through PSCI; Android's sysfs reports a 4/3/1 A510/A710/X2 split by cache grouping, not by MPIDR. Our board dts had overridden the cpu nodes with packed 0x0-0x3/0x100-0x102/0x200 values, which broke both the firmware target table and the reset vector's match; the override is removed and the SoC dtsi's nodes are inherited again." }, { kind = "device", reference = "drivers/ArmCpu/ArmCpu.cpp", command = "scripts/k60-device.sh boot /mnt/d/Android/k60-ios/boot-darwin24-bc8.img", revision = "d2af811a6dc9c6225de586e1615ca3824e2edce4", result = "The Darwin 22 start order in ArmCpu::start() called initCPU() itself, whose trailing signalCPU(this) sent the boot CPU a self IPI before cpu_machine_init() had set StartedState, so the first IPI tripped the assertion at cpu_common.c:586 with cpu_flags 0x2000 against the expected 0x3000. Switching to the Darwin 24 first-boot path (pong_cpu_first_boot, pong_cpu_first_boot_wait, ml_cpu_init_completed) makes the kernel call initCPU() during processor_boot(). The unit now paints all three probe bars, never reaches the assertion, and walks back to Android on its own through the probe's timed PSCI reset." }, { kind = "device", reference = "patches/xnu-ipados18/0247-k60-psci-flat-targets.patch", command = "scripts/k60-device.sh boot /mnt/d/Android/k60-ios/boot-darwin24-bc11.img", revision = "e636e445b621bed4fac0069f3604b87061350a8d", result = "With the flat targets every CPU_ON was granted and AFFINITY_INFO answered 'on', yet no core joined: the arrival flag showed MPIDR 0x81000200 in the reset vector, and the core then hung on start.s's Lskip_cpu_reset_handler because the cpu data it matched (by its real MPIDR) had no reset handler yet. The flat targets are the firmware's table; the pairing was the defect." }]

[[area]]
