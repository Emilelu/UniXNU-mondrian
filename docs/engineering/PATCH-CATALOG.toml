# 补丁目录：series 之外的每个 .patch 都要在这里说明去处。
#
# patches/xnu/ 下的文件比 series 多（2026-11-17：series 227 条、目录 268 个），
# 多出来的 41 个不是垃圾也不是自动可删：它们随初始导入 6dcb7da0 进来，
# 与约 20 个兄弟检出里的同名文件逐字节相同（共享补丁库），其中一部分是历史编号/改名留下的副本，
# 一部分是真正退役的实验补丁。scripts/check-patch-series.py 要求：
#   series 之外的每个 .patch 必须出现在本文件里；status 只能是 retired / renumbered / library；
#   retired 与 renumbered 必须写 evidence（移除或改名的提交）。
#
# 新增补丁时：要么加进 series，要么在这里登记并写清为什么不用。

