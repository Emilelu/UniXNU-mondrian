evidence = [{ kind = "device", reference = "patches/xnu-ipados18/0244-k60-breadcrumbs.patch", command = "scripts/k60-device.sh boot /mnt/d/Android/k60-ios/boot-darwin24-bc4.img; count the breadcrumb squares", revision = "e636e445b621bed4fac0069f3604b87061350a8d", result = "Breadcrumbs turned a silent reset into a located fault: column 1 showed six squares, column 2 zero, column 3 one, which put the death inside ml_parse_cpu_topology(). The first carrier (u64 slots at 0xA73FF000) was useless because a hung board never returns DRAM, so the markers moved into the framebuffer; 0245 then produced a readable panic on hardware." }, { kind = "device", reference = "docs/reference/ROUTE-A-18-UPSTREAM.md", command = "scripts/k60-device.sh boot /mnt/d/Android/k60-ios/boot-darwin24-bc7.img", revision = "350d1c57c86d2fc562c7fa7529271fdae3af95bc", result = "The upstream entry probe installs on this kernel: stage 1 blue bar, stage 2 magenta bar, stage 3 resets the board through PSCI six seconds after the MMU comes on. The board walked back to fastboot and then to Android by itself, so a hung kernel no longer needs a manual power cycle. The probe's panic screen stays off because it installs code in the padding after panic(), at an address fixed for the reference kernel." }]

[[area]]
id = "cellular"
status = "implemented"
components = ["modem image (ELF32 QDSP6, 30 PT_LOAD)", "PAS1 remoteproc", "QRTR endpoint", "QcomBaseband", "QcomBaseband AppleBaseband bridge"]
paths = ["docs/engineering/ANDROID-HW-TRUTH.md", "dts/mondrian.dts", "drivers/PongCellular/**", "scripts/gen-modem-table.py", "scripts/gen-ipa-patch.py", "scripts/append-conffiles.py", "scripts/build-qcom-baseband.py", "patches/qcombaseband/**", "scripts/tests/test-k60-modem-*", "scripts/tests/test-k60-ipa*", "scripts/tests/test-k60-mdt.c", "scripts/tests/test-k60-arm-smmu.c", "patches/xnu/0620-k60-modem-image.patch", "patches/xnu/0621-k60-modem-pas.patch", "patches/xnu/0622-k60-modem-qrtr.patch", "patches/xnu/0623-k60-ipa.patch", "docs/research/cellular/**"]
inputs = [
  "K60 carries a Snapdragon X65-class modem inside the SM8475 package; it is not an external modem on this board.",
  "Modem firmware, EFS/NV data and the SIM identity live on the Android side of the dual-system unit.",
  "No QRTR/QMI endpoint, IPA path or SIM slot has been exercised under XNU.",
]
configuration = [
  "board.toml selects the QcomBaseband component and links its AppleBaseband control bridge; the dts modem regions remain documentation-only.",
  "dts/mondrian.dts now describes the modem memory regions, the modem GLINK edge with its IPCRTR channel and the IPA block as documentation-only nodes: no status, no unixnu,adt-name, so they are not exported to the ADT and no driver probes them.",
]
procedure = [
  "Inventory the modem firmware partition and the QRTR/QMI services from an Android boot.",
  "Record the IPA/QMAP configuration and the SIM identity source.",
  "Only then decide whether the baseband path is in scope for this port.",
]
findings = [
  "2026-11-19 scope decision (m30366): the baseband repair continues only where the kernel layer can be verified without an iOS userspace contract, so the PAS/SCM, SMEM/GLINK/QRTR, IPA/GSI/SMMU, rail/QMP, UEFI carrier and host-test work stays in scope. The iOS-bound layers are deferred until iOS 16 and iOS 27 are compared: AppleBaseband/PCIControl/PCIInterface class names and method numbers, ABPInterfaceProtocol channel naming, CommCenter BSP/VINYL and TLV 0x42/0x43, ADT baseband-chipset identity, .bbfw/ABM/BBUpdater packaging, and the pdp_ip/plumber interface. A parallel fork (xNekom/UniXNU-mondrian, feat/ios27 95d9c8a1) is porting the same board to iOS 27, so no new kernel code may embed an iOS-16-only constant. The weak coachz_* symbols in K60ModemLink.c remain the seam; the QcomBaseband C++ provider stays deferred.",
  "L1-L3 are in the kernel and verified offline; the QRTR enumeration has not run on the device yet, so no service id has been confirmed by measurement.",
  "Implemented covers the offline half only: the image plan, the PAS handshake and the QRTR probe all build into the kernel, but none of them has produced a device observation, so the completion line below stays open.",
  "The baseband is a PAS remote processor inside the SM8475 package, not a board-level external modem: MSS MMIO sits at 0x04080000, and modem.mdt is a QDSP6 ELF32 (e_machine 0xA4) whose 30 PT_LOAD segments span exactly 0x8bc00000..0x9ee00000, the DT-declared mpss_region carveout of 0x13200000 bytes. The only two PCIe devices on the board are the Qualcomm root port and the QCA6490 WLAN.",
  "The early 2026-11 scoping note limited the flight to L1 firmware load plus L2 QRTR enumeration; docs/research/cellular/03-SCOPE.md now marks the IPA/QMAP/EFS/SIM/IMS exclusion as historical and docs/research/cellular/20-IPA-V51-DATA-PATH.md defines the four-layer target. The IPA ring geometry is driver code rather than DT, and the EFS responder is an Android userspace daemon (tftp_server, pid 2027).",
  "Roughly two thirds of L1 already exists as ADSP code and needs a second instance rather than new theory: K60AdspPas.c carries the PAS SCM sequence, K60AdspImage.c parses the ELF32 segment table, K60Smem.c owns SMEM, and QcomGlink.c implements GLINK but with QCOM_GLINK_MAX_CHANNELS hard-coded to 1 and shaped for the PMIC endpoint.",
  "The modem QRTR transport is GLINK over SMEM on the IPCRTR channel, not MHI: DT declares qcom,glink-channels = \"IPCRTR\" with three intent groups, while mhi_qrtr_cnss carries qcom,dev-id 0x1103, which is the QCA6490 WLAN endpoint.",
  "The modem's QMI service registry is live and enumerable on the running device: 36 services answer on QRTR node 0, so the completion criterion has a concrete Android-side baseline to compare an XNU-side NEW_LOOKUP against.",
  "The carrier is now implemented through the UEFI DXE path: the payload carries 27 modem streams (109,060,761 bytes declared) in a FAT MODEM volume and the ADT declares K60ModemImage as a 16-byte placeholder that DXE replaces with the staged modem.mdt metadata page. A boot with pong_modem=2 previously reached the probe and hit K60MODEM carrier absent at 0x8bc00000; that device observation predates the carrier and remains the only one.",
  "Route B/C now prepares the modem power and transport before PAS: k60_modem_rails_vote() sends AOP QMP load_state modem on and votes cx.lvl/mss.lvl at corner 384 plus xo.lvl at level 3 through TCS4; k60_modem_transport_prepare() takes the TCSR SMEM mutex 0x1f43000, refuses to reset a live SMP2P partition 435, allocates items 428/478/479, writes the AP-owned master-kernel/ipa entries and opens IPCRTR GLINK as initiator before mem_setup/auth. The metadata-only diagnostic (pong_modem>=3) stops after mem_setup, so C isolates the PAS order without power or transport. The path is offline-only; QcomBaseband's AppleBaseband control bridge is linked through K60ModemLink and builds into the 2026-11-18 06:00 k6 candidates, which share kernel sha256 90e2d682a53134f5b162367ffa7d7a2cdfbb671f7536bafab624cec0d3a16ad9 from source commit d822b1bf (device-patch base 8af93c9a, rebased on 352d7f30) and have not been observed on hardware. On 2026-11-18 01:49:46 the C diagnostic was launched on fastboot: fastboot reported Sending OKAY and Booting OKAY with captureArmed=true, but no USB serial port was enumerated by 01:53, console.log stayed empty and k60-device.sh reported none; this is an unclassified C observation, not an S result. That launch embedded UEFI FD 38c1293b, whose mtime 01:28:38 predates commit c1ea878 (01:35:06, CarrierLoadMetadata), so it had no metadata page and could not print S1. Generation k4 keeps FD e007de8a2cbed4ec22d8502a89ff3eef79337bc712ccb6c2414c4b175b5d2589 (02:17:24), which contains CarrierLoadMetadata, and rebuilds the kernel with the QcomBaseband device patch plus the IPA M0/M1 offline parser; the k6 boot images are C cebfe84c..., C0 1a0c012e..., IPA-only 82ef3312..., B de29e350.... The provider fix is carried as k60-cellular patches/qcombaseband/0001-coachz-defer-publication.patch and applied by scripts/build-qcom-baseband.py to upstream dd0199cf, so the build does not need a private QcomBaseband branch. The 3d4a4be4 fix also moves the RSC IRQ accesses to the DRV page, adds the pre-copy item-435 stale guard, tightens QMP mailbox bounds, retries AOP QMP open/load_state, preserves AP-owned GLINK descriptors, fences modem MMIO writes, and retries QcomBaseband publication when IOResources is not ready.",
]
completion = [
  "A device boot shows the modem enumerated over QRTR with a readable firmware revision.",
]
limits = [
  "2026-11-19 kernel-only scope (m30366, docs/research/cellular/03-SCOPE.md section 10): iOS-version-specific work is paused, so the cellular area is judged by kernel-generic evidence only. k18 C-M2 passed the modem C criteria (init_image ok, mem_setup ok, diagnostic stop); k20 (a2ba2e22, kernel dd881b0e361a2f9c27f639996ed109d93f6805687417bee30a55af3a2108fc55) adds the SMC call count and both IPA images flew on 2026-11-19 and passed: p1 41abb12548de35532272973f35847857968c7211e3b6e221ee98b783734c9cc1 (pong_ipa=1) reached PAS15 with INIT_IMAGE resumed four times (calls=5), and p2 b2474eea4ac777d185605642a22e1ca94cd364345e43c9130a62a2cdf21c65e3 (pong_ipa=2) additionally started the M2 runtime (ring 0x90d50d000, tables 0x90d60d000, SMMU bank=72 slot=110 pages=6 leaf=268, GSI stage=10 completed=3); docs/research/cellular/19-MODEM-BRINGUP-FLIGHT.md sections 3.8/3.9. Modem B/auth_reset, QRTR enumeration and rail/QMP remain unverified, and the IPA data path has only its QMAP framing and QMI service 0x31 codec prerequisites landed (673330c1 adds K60IpaQmap.h/.c and 2c986e3f adds K60IpaQmi.h/.c, both with host tests and the k23/k24 kernels, but there is no DAP negotiation, no mux registration, no ifnet and no IRQ 432/654 yet, and neither codec has a runtime caller); the launchd K60EXC shared-region failure is a separate userspace fault. 0623 also carries the QMI server state machine (K60IpaQmiServer.h/.c, a65c8a279e9a92f7ba0275d18feb3460f992389c), the link transport glue (K60IpaQmiTransport.h/.c, 341f248aad46062acadcc0b9f2ffa0262116e4f3) and the QRTR service 49 session (K60IpaQrtr.h/.c, 49d41615a0c93c67bb9cb314e62bc1bbcb64ea03, kernel include renamed to pong_modem_qrtr.h by b11af099) with host tests but still no runtime caller.",
  "2026-11-18 M2 preflight hold: k14 pong_ipa=1/2 reaches k60_ipa_clock_vote() before PAS15. Revised HR-01 allows individually qualified APPS DRV-2 / ACTIVE TCS4 use; the K60 Goodix evidence does not establish the IP0 vote, startup timing, or slot ownership in k14. The k14 IP0 hold is lifted by the k15 PASS; k16 C-M2 has one hardware result (SCM_INTERRUPTED, not a PASS); the other seven k16 images remain unflown and M2 has no hardware PASS. The independent porting gate failed because the configured build-input series was absent. That hold was lifted by the 15:57 IP0 PASS; k18 later gave a C-level hardware PASS, recorded in the new limit entry and in docs/research/cellular/19-MODEM-BRINGUP-FLIGHT.md section 3.6.",
  "The only prior device-side modem observation was the earlier pong_modem=2 boot that ended at the carrier check before any PAS SCM call; the new carrier, power, transport and QcomBaseband bridge path has not been observed with a console. The C diagnostic was launched on 2026-11-18 01:49:46 but produced no USB serial or console.log, so it is unclassified and B must not run. The rebuilt 2026-11-18 06:00 k6 candidates are offline-only, were packed with --skip-gates and are not flight permits: C diagnostics has payload 3554409f... and boot cebfe84c... with pong_modem=3 pong_ipa=1; C0 no-carrier control has payload 6c5b03db... and boot 1a0c012e...; IPA-only has payload 3e0f0f56... and boot 82ef3312... with pong_modem=0 pong_ipa=1; B full has payload 19ab7efc... and boot de29e350... with pong_modem=2 pong_ipa=1. All four k6 boot headers are kernel_size 559,476 and ramdisk 201,326,592. All kernel_args measure 599 of the 608-byte arm64 limit; the shared kernel is 90e2d682... from commit d822b1bf.",
  "No X65 marketing-model string exists in the DT or in the firmware; the DT only carries the codename cape, so the X65 name rests on Qualcomm platform naming and is not used as DT evidence.",
  "Android's qrtr-lookup writes its table to /data/vendor/qrtr/qrtr-lookup.txt and prints only the header row to stdout, so its output must be read from that file; the earlier reading of the empty stdout as a failed enumerator was a tool-usage error, corrected on 2026-11-14.",
  "2026-11-18 20:42 k16 C-M2: the loader and XNU started, but PAS4 INIT_IMAGE returned SCM_INTERRUPTED (x0=1, x1=0x82); the old wrapper performed one SMC and never resumed it, so C/M2 is not a PASS. k17 92657c8f adds the bounded continuation and compiled, but it was not packaged or flown; K60Ipa.c still has its own single-SMC wrapper. A static audit then found the embedded PAS metadata hash segment was generated from a CRLF-contaminated modem.mdt (3,362 B differ from modem.mdt.bin); the header is now regenerated from the clean binary (CRC32 0xac600b5d, SHA256 78d5f2f4...) and embedded in clean-metadata FD 40c29d513eab0dca410c36bceeef936244cf2a20c3233f48bbbaa8ae69a07386; k18 C-M2 boot 1ae178bb5367366493a334eb5e93f000ab7a095ecdbcbe676bdaa13e39155e12 with kernel f245d5066bdcba2ec5b79a274bd302619f0de0a0b58b20af5e19631f059bf784 flew at 23:45 and passed the C criteria (init_image ok, mem_setup ok, diagnostic stop); IPA PAS15 still returned rc=-7 at the time because K60Ipa.c used a single-SMC wrapper; commit bba7dcaa later added the same continuation to IPA (k19, not yet flown), and launchd hit a K60EXC shared-region loop, so B/QRTR and GUI remain unverified",
]
next_action = [
  '2026-11-19 k49 (3e286fce, built offline, not flown): k48 proved the allocator ignores an alignment mask and a zero max_pnum and kept handing out pages above 4 GiB, so k49 passes max_pnum = ((1ull << 32) - bytes) >> 12 and drops the pong_ipa boot argument the image audit refuses. The kernel is 729b2238 and the image e5a39992 (30 arguments, 588 bytes, layout 560384/201326592/3145840/4024, series 65872efa534971ca). It is built but not booted: whether the region lands low, whether the modem then sends rmtfs rw and whether S3 and S6 hold is the next flight.',
  '2026-11-19 k47 (d0f8f2ef): the k46 flight showed the modem asking for exactly 2621440 bytes one line after opening fs1 and fs2, so k47 allocates that region below 4 GiB, moves its ownership from HLOS to HLOS|MSS with SCM 0x0c/0x16, answers alloc with the physical base and serves rw from the region with the scatter list validated first. The shadow is zeros until the UFS read lands; the flight judges S3 and S6 holding, the buffer and SCM lines appearing, whether the modem then sends rmtfs rw, and which of the three outcomes (rw served, assign refused, modem reset) follows.',
  "2026-11-19 k46 (10f6f19e, with 46734396 and 062d84cc): the k45 flight ended the enumeration argument - one line after the AP announces storage service 14 instance 1 on port 0x102 the modem sends a 25 byte QMI open (seven byte header plus a 15 byte path), which is /boot/modem_fs1 or /boot/modem_fs2, and it sends exactly one because nobody answered. k46 parses the QMI v1 open/close/rw/alloc/sync layout from the reference, answers open with storage ids 1-4 for the four EFS images, acknowledges close and sync, and refuses alloc and read-write honestly (result 1) until the shared buffer and UFS read exist. The carried patch is 125,366 B over 7 files. The next flight judges S3 and S6 holding, the rmtfs open answer appearing, and whether the modem then asks for alloc and a read - that is the k47 work.",
  "2026-11-19 k45 (5abc29b9 name server and RMTFS): k44 quiet mode proved the modem neither stalls nor registers anything new when we send nothing, so the QMI stack never comes up on its own. The next single variable is the services it needs before RF init: lookups now go to the name server port 53 (node 0 and broadcast alternating) instead of the control port, NEW_LOOKUP replies are parsed as discoveries, and the AP announces RMTFS service 14 instance 1 on port 0x102 so the modem can ask for its EFS files. Pong blocks PAS4 until native RFS storage is ready for exactly this reason. Judge replies= and rmtfs= in the wait line plus lookup reply and rmtfs request lines; S3 and S6 must hold, S4/S5 are not expected. Image 04d2373f, kernel fd009d66, args tail pong_modem=2 pong_ipa=0.",
  "2026-11-19 k44 (09ae9e20 quiet mode): k43 mode 0 proved the stall is not caused by our lookups or the fixed DMS port, so the next single variable is our periodic traffic. pong_qrtr=3 sends one HELLO and then nothing (no probes, no lookup, no fixed port) while the loop keeps polling; the wait line now carries rxcmd=DATA/HELLO/BYE/NEW_SERVER so the 53 received messages can be read as a picture. If rx still freezes near 53 the stall is the modem own, otherwise the probes are the trigger",
  "2026-11-19 k43 (06edd20c pong_qrtr mode): the k42 flight (E:/k60-work/evidence/usblog-20261119-140442) proved the modem stops reading and acknowledging our GLINK ring 35-45 s after the handshake, so the next variable is whether our own requests cause it. pong_qrtr 0 sends HELLO probes only, 1 adds lookups, 2 adds the fixed DMS port; fly mode 0 first (baked into the image because flash.sh takes no extra kernel arguments) and watch intents= and rx head",
  "2026-11-19 k42 (4b240a65 wait-line intents/rings + 059dbcca hello probe): the k41 flight on 2026-11-19 13:37 (E:/k60-work/evidence/usblog-20261119-133717) opened IPCRTR at 24 ms and still saw exactly two services, with tx head climbing to 1656 while tx tail froze at 888 - so either the modem stopped reading our ring or desc[0] is not its read pointer. k42 prints rx avail/head/tail, intents=busy/valid, local=advertised/count, msgs=rx/tx, dumps both intent tables once at 5 s and re-sends HELLO every 10 s; S3 and S6 must stay PASS, S4/S5 are not expected. Image 6411fb06..., packaged, not flown",
  "2026-11-19 k41 (0054c575 feat(cellular): open IPCRTR as soon as the glink fifo appears): k39 flew on 2026-11-19 13:21 (E:/k60-work/evidence/usblog-20261119-132104, 207,839 B, S3 PASS / S4 FAIL / S5 FAIL / S6 PASS) and proved that repeating the question is useless: eight GetRevision calls to port 96 and eight broadcast lookups over 230 s, every wait line services=2 wanted=0 dms=0 malformed=0, COACHZ also reporting 2 QMI services from second 1 to second 233, and the 300 s autoreset cutting the loop before the verdict line. k41 therefore changes the order instead of the count: the readiness loop breaks as soon as the glink fifo exists (sizes[2] != 0), prints fifo at N ms, smp2p not ready yet; opening IPCRTR early, re-checks readiness every 2500 polls, and adds tx head and tx tail to the wait line. The new acceptance is the order itself: the early-open line must appear before modem ready, and S4 still needs K60MODEM qrtr: dms revision. Image E:/k60-work/artifacts/modem-20261117k41/boot-modem-b-full.img (201,895,936 B, b6e6987e9c8b7a0f7a1e71d008508a640ca855bdeb42e3c3ea01001d0ed915ef), kernel 6ae49f46, 0622 104,896 B / 5 files, S5 is not expected under a 240 s loop and a 300 s autoreset. This commit also fixes the bare newline that k40 (bcf277dc) left in a printf format string: a commit whose file was never compiled is not verified.",
  '2026-11-19 standby: the cellular line is parked until the iOS 27 fork reaches bsd_init, and the next step is the k39 flight (image 9f950b09..., packaged, not flown) plus the k40 readiness timeline (bcf277dc9e549595f75e54b0f26e86ac363464c3, source only, no image); the k41 plan turns the ready loop into a fifo-only adopt so IPCRTR opens before the modem registers its services',
  "2026-11-19 k39 (918ba4055997d8ae27bf759d56a60354151890a3 feat(cellular): keep asking the modem for four minutes): the k38 B flight on 2026-11-19 12:09 (420 s capture, E:/k60-work/evidence/usblog-20261119-120939) judged S3 PASS, S4 FAIL, S5 FAIL, S6 PASS - the static DMS GetRevision to node 0 port 96 left the AP at forty seconds and nothing came back, and the service count stayed at two for the whole minute. k39 keeps the window at four minutes (120000 polls), repeats the alternating all-services and DMS lookups every thirty seconds and repeats the port 96 request on the same beat, up to eight times each; image 9f950b09ed525815133e3fb22efb3553db31a759edc57a4497a8347192a96ddb (201895936 B), kernel 3d2dca35aea4cb09e4b1649858ec8a002c0bb4d40fe66f13da16826e2b5e6371, args tail pong_modem=2 pong_ipa=0. Next: fly it with a 420 s capture and judge S3/S4/S5/S6; if the modem still never answers, the next variable is opening IPCRTR before the modem starts, or an AP-side nameserver replay.",
  "2026-11-19 k38 (f9b1fa3016d2c3ae1f50bd4307ef9c577615026c): the k37 B flight on 2026-11-19 11:21 (420 s, E:/k60-work/evidence/usblog-20261119-112126, 270,708 B console, log sha256 12BBB36647457BADD28BC50CB2519B80070D169DD26800F39C55A3F2F938EE91) held S3 PASS (scm cmd=0x5 ok calls=181) and S6 PASS (22 of 22 services published) but S4/S5 FAIL: both broadcast lookups went unanswered in the sixty-second window, the service count never left 2 (service 66 servreg notification, service 0x2b subsystem control), and the verdict read no reply services=2 node0=2 wanted=0 malformed=0 locator=2 dms=none. The reading from 01-ANDROID-INVENTORY.md 5.5 is that a QRTR lookup is answered by the local AP nameserver replaying its NEW_SERVER table, never by the modem, and the modem registers its QMI services while it boots, before our IPCRTR channel exists; 5.4.1 recorded this firmware's fixed endpoints, including DMS at node 0 port 96. k38 therefore asks DMS directly at node 0 port 96 once twenty thousand polls have run, marks dms_static so it asks once, and appends to=%u to the NEW_SERVER line. 0622 = 102,284 B / 5 files, host suite green. Next: fly E:/k60-work/artifacts/modem-20261117k38/boot-modem-b-full.img and judge --phase b; S4 needs the dms revision line, S3 and S6 must hold.",
  "2026-11-19 k37 (039edd888619c36e43d3c1d5a2e702b89865d396 feat(cellular): widen the QRTR window and repeat the lookup): the k36 B flight on 2026-11-19 10:52 (E:/k60-work/evidence/usblog-20261119-105246, 242,632 B console, logSha256 E4D2A129F134BCF62B706500CE92FCF1BBD3BE07B485AFD5C7082FA75BF0BEB1, stopReason fastboot-return) kept S3 PASS (scm cmd=0x5 ok calls=181, auth_reset ok) and S6 PASS, and the rc=-5 corruption was gone, but S4 still failed with verdict no reply services=2 node0=2 wanted=0 malformed=0 locator=2 dms=none polls=5000: the modem had registered only service 66 (0x42, instance 46081, node 0, port 2) and service 43 (0x2b, instance 4610, node 0, port 1) inside the ten-second window, and the unicast lookup to node 0 was never answered. The probe now polls 30000 x 2 ms = 60 s, sends lookup #1 (all services) and a DMS-targeted lookup #2 at 30 s, both to the broadcast node, and prints K60MODEM qrtr: wait N s services= every 5 s. Host tests: test-k60-modem-qrtr.c TESTS OK 13 groups including the service-targeted builder; 0622 = 100,436 B / 5 files; kernel a8322700 105,734,144 B (COACHZ 40); image b920669f 201,895,936 B; verify-boot-image OK. Fly k37 with bash scripts/flash.sh <image> 420; S3 must stay, S4 needs dms revision, S5 a verdict ok, S6 the bridge publication. If the service count stops at 2 for the whole minute, the next variable is the servloc answer (the modem asked twice for service 64), not another lookup.",
  "2026-11-19 k36 (1a4055b3 fix(cellular): accept a GLINK intent numbered zero in the carried copy): the k35 B flight on 2026-11-19 10:03 (420 s capture, E:/k60-work/evidence/usblog-20261119-100331, 182,646 B console, sha256 37bf3bfa0aae2f07a8542552671613b023de44151929c65a2b9206407372030c) passed S3 for the fourth time (scm cmd=0x5 ok calls=181) and passed S6 for the first time (bridge enabled; COACHZ baseband: 22 of 22 services published; data receiver registered; COACHZ pdp plumb unit 0..3 and pdp_ip0..3 mux 1..4), but S4 still failed at K60MODEM qrtr: glink poll rc=-5 at 2 rx avail=488 head=560 tail=72 tx head=32 tx tail=32 cmd=0x5 p1=0x1 p2=0x1 w2=0x80 w3=0 w4=0x10005 w5=0x1 w6=0x80 w7=0x1. That line pins the first INTENT pair to size 0x80 id 0 and shows the next message advertising id 1, so the modem numbers receive buffers from zero; drivers/PongPower/QcomGlink.c:403 rejected id 0 as corrupt while Linux idr_alloc and hakios accept it. The fix is a generator delta in scripts/update-modem-qrtr-patch.py that rewrites the carried bsd/dev/qcom_glink.c copy to if (!size) return QcomGlinkCorrupt; and leaves the stock drivers/PongPower file with the charger line; scripts/tests/test-k60-modem-image.py now compares the five carried copies against that generator body instead of restating the delta; scripts/tests/test-k60-glink-intent.py feeds the generated parser two streams and prints K60 GLINK INTENT PASS id0 accepted, size0 rejected (id0: poll=4 broken=0, stored id=0 size=128; size0: poll=-5 broken=1). 0622 regenerates to 98,655 B / 5 files. k36 kernel 105,734,144 B sha256 b7d52a68bc45bc3a08c10b0c297cbeeeca001886971e8ec0224a5f661e8222eb (COACHZ strings 40), boot image 201,895,936 B sha256 6f015eb672b9f759d398464b6d7b444ecb7e8eeb3bfb18978c8cc1353940e3e7, payload 2dad8fd3d48a8e07affec36cc252d4dbcc89ac06fcfdddcfe766ae8355b79267, payload kernel 35a77d07c77790fc5f0781660f3a6e23a284e2871866b8d7178701506d2c6b1d, args tail pong_modem=2 pong_ipa=0, verify rc0. Next flight is k36 when the console is free; S3 must stay PASS, S4 needs the dms revision line, S5 needs the servloc verdict, S6 must stay PASS.",
  "2026-11-19 k35 links QcomBaseband for real: the k34 kernel was built while the build tree .config still predated CONFIG_XNU_EXTRA_LD_ARCHIVES (added by c2ced39c), because unixnu build never regenerates the config; unixnu defconfig mondrian_defconfig -D /mnt/e/hackios/k60-cellular --out /tmp/k60-modem-20261117c adds exactly four lines (diff 105a106,109) and the rebuild gives kernel.macho 105,734,144 B sha256 80fb13351479f0fecdb46b7e5e349d87524a61caba9bef221ff512ebab701f93 with 40 COACHZ strings and _coachz_baseband_configure at (__TEXT_EXEC,__text) fffffff007a8c078 (_enabled at fffffff007a871f8), so force-load works and all 272 archive imports resolve against kernel.macho. Image boot-modem-b-full.img 2f989b28acace59dc1162c45d14956bc24c7fe8c5c4a8eabf4ef4bac44b56fa1 (201,895,936 B; payload 7ae83050869cf7f134eab7c97ea6ae969ddb4fbed830ebd8653ef04842c40fda; payload kernel f059d1232fc5b11cafcf5e150b43b8834764b9752a5a31d4184a1e06c52818b3; args pong_modem=2 pong_ipa=0; FD 40c29d51; layout 560384/201326592/3145840/4024; verify rc0) supersedes k34 20fff9f2, whose kernel carried only the weak coachz stubs so S6 would stay N/A. Not flown: the board stayed hung after the k31 flight. On recovery fly k35 with a 420 s capture and judge --phase b: S3 must stay PASS, S4 still needs the dms revision line, S6 is now a real check.",
  "2026-11-19 QcomBaseband is not linked (b66b41ba56a446c290eca1da118bf664a3c8777e): reviewing S6 exposed that no kernel image we ever booted carries the component. libQcomBaseband.a exists (767,600 B, T _coachz_baseband_configure/_enabled, 40 COACHZ strings) but kernel.macho has 0 COACHZ strings and only seven 8-byte-spaced S symbols at fffffff007762978..998 -- the weak fallbacks from 0622. CORRECTED 09:40: the wiring was never missing -- configs/mondrian_defconfig:82 has carried CONFIG_XNU_EXTRA_LD_ARCHIVES=-Wl,-force_load,{tree}/build/qcom-baseband/libQcomBaseband.a since c2ced39c and build-xnu-4k-baseline.sh:1181-1183 appends it to PLATFORM_ARCHIVES, but the build tree generated .config (105 lines, 2026-11-18 02:29) predates that line and unixnu build never regenerates it (cli.py:306 cmd_defconfig runs only inside cmd_release), so XNU_EXTRA_LD_ARCHIVES stayed empty and the archive never reached the link line; ./unixnu defconfig mondrian_defconfig -D /mnt/e/hackios/k60-cellular --out /tmp/k60-modem-20261117c adds exactly four lines (diff 105a106,109) and leaves the other 105 untouched. All 272 undefined symbols of the archive are defined in kernel.macho (missing 0), so a static force-load links. Because coachz_baseband_configure() is a no-op and coachz_baseband_enabled() is always 0: AppleBaseband, AppleBasebandPCIControl, AppleBasebandPCIInterface, the PDP manager and AppleIPAppender have never been published once, which is why k30/k31 printed bridge disabled with no COACHZ line at all. check-modem-flight-log.py now reports S6 as N/A when the log has bridge disabled and no COACHZ publication line (exit code unaffected); the k31 log now reads S3 PASS, S4 FAIL, S5 FAIL, S6 N/A. Next step: rebuild with the regenerated .config (k35) and measure the COACHZ string count, whether _coachz_baseband_configure becomes T, and the image size; then register (XNU_QCOM_BASEBAND, build/qcom-baseband/libQcomBaseband.a, coachz_baseband_configure) in check-kernel-archives.py EXPECTED and decide whether the Coachz PCIe/MHI component fits a SM8475 integrated modem. Lesson: editing configs/*_defconfig does nothing for unixnu build until defconfig or release regenerates the .config in the out tree.",
  "2026-11-19 k34 (cfb2917f982095a4799cba19361b6f3b5ede19e2): k33 never flew because the board stayed hung after the k31 flight, and reviewing S6 while waiting showed it could never pass: K60ModemLink.c printed 'K60MODEM baseband: bridge %s' once before the poll loop, while coachz_baseband_configure() is retried only inside it every 500 polls, so a QcomBaseband provider that defers publication (patches/qcombaseband/0001-coachz-defer-publication.patch prints 'COACHZ baseband: resource service not ready, publication deferred') would leave 'bridge disabled' and fail S6 against a working bridge. k34 adds the transition print 'K60MODEM baseband: bridge enabled (poll %u)' and nothing else; check-modem-flight-log.py --phase b now judges S3/S4/S5/S6 (S5 needs verdict ok with services>0 and node0>=1; S6 needs one bridge-enabled line plus 'COACHZ baseband: N of M services published' with N>0). Candidate E:/k60-work/artifacts/modem-20261117k34/boot-modem-b-full.img sha256 20fff9f27110ef723c281efabd01599b70dfaf43cc0dde91b93da5123b994a98 (kernel 68c6c9bcfbf8258f134714ecab5a6c4e5371bb3f3996e0d8bf86fed1d5b05501, payload 2beb6fd370752abdccdae39d8f821ab5420587058d6aaabf74d073c4cc4dd875, payload kernel 56d8dd65d9273a50901c16004e980b32fe91e7a806bab561d66d783da7cd033d, adt fdc1a9818dd5fcf3ce0cf972faff1434df440917d7c74f5782912b53c2ca91f7, args tail k60_autoreset=300 applog=1 pong_modem=2 pong_ipa=0, layout 560384/201326592/3145840/4024, verify-boot-image OK). Not flown: the device is still hung, so fly it with a 420 s capture once the board is physically recovered and no other agent is booting, then judge S3/S4/S5/S6 and record whether the 300 s autoreset really resets.",
  "2026-11-19 k33 (979bf601e688720798375a28aa6c4a8719b8eca9 + 52c741a836126b320e5b6506a51c368ec2ce779b): k32 is void because its adopt dump sat only in k60_modem_glink_start (transport path, source line 1087) while a B boot always prints 'transport remote glink fifo absent, defer IPCRTR' and adopts in the probe path (K60ModemLink.c:1212); git show 55259825:drivers/PongCellular/K60ModemLink.c | grep -n 'glink adopt' lists 1087 and 1200 only, and the probe slice matches neither. k33 prints the adopt line on both paths, tagged (probe)/(transport), with rx head/tail/avail, tx head/tail and w0..w7, and in the probe path aligns *rx.tail to *rx.head when the modem write pointer is non-zero, printing glink adopt dropped N stale bytes (head=...). Rationale: qcom_glink_adopt requires our own indices to be zero, and both we (K60ModemLink.c:933-938) and hakios.mpss.c:2656-2673 reset only desc[1]/desc[2]; desc[0]/desc[3] are the remote read/write pointers and survive a warm reboot in SMEM, so a non-zero rx head at adopt can only be a previous session's residue - which is why k30 and k31 replayed byte-identical failure lines. tx tail is observed only, so this stays a single variable. 0622 is 98,216 B / 5 files (98,049 B after 52c741a8); test-k60-modem-image.py TESTS OK 30 segments, test-k60-ipa-patch.py PASS, run-host-tests.sh rc0. Kernel 5b84e7c561b64c6882dab7d63359dad991265f941535175c4233ef1bfc94cf61 (105,582,592 B, llvm-strings carries 'glink adopt (probe)', 'glink adopt (transport)' and 'glink adopt dropped %u stale bytes (head=%u)'); image E:/k60-work/artifacts/modem-20261117k33/boot-modem-b-full.img d467eee47ae7e21f0d70210119b3b92a5be55bef9a91be39c41c749c72676a54 (201,895,936 B); payload ae943899297d27890f8acb945c775b6f3a968ae9de0e8fc96c033b6c1cfef040, payload.json 97864e04223d6a39bbacca16b35b17065a7265c58cd311c533fadfd67b348b86, payload kernel db5d04035fc6cba8144e3fc2ebc4809ed3893d2e89acd29622988a201c6d2207, adt 43b356612a51f2587d06b5fff8b7bbcdaeaf55b0e72c7f65e87d53f805cfc