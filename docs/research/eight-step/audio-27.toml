  "Pong 的硬件真值来自实际 DT：WCD938x、PM8350 S10B 供 RXTX/buck/IO 1.8V，CMD DB 0x80860000；PRM 每个 rate 试 rate 与 19.2/9.6 MHz 两档、attribute 1/0 两档，见 docs/research/audio/RESEARCH.md:25-59。",
  "Pong 明确要求在物理采集图真正返回 PCM 前不要宣布麦克风可用；K60 不能把 Pong 的 codec/功放寄存器表当同板事实，见 docs/research/audio/RESEARCH.md:28-40 与 docs/research/audio/GAP-ANALYSIS.md:111-126。",
  "K60 与 Pong 同为 SM8475 但功放不同：Pong 用 CS35L43 形状，K60 是两颗 AW88261（I2C 0x34/0x35）；只能借 PAS1/SMEM/GLINK 的过程，不能借寄存器表，见 docs/research/audio/RESEARCH.md:186-195 与 docs/research/audio/IOS27-SHENG-REFS.md:101-107。",
]

[hardware.audio.step.official]
