[hardware.cellular.step.official]
done = true
evidence = """页面要求逐条对照，缺一条就写缺口，不用「本板 na」掩盖：
- /mnt/e/hackios/UniXNU/docs/zh/porting/baseband.md:22-31 要求先完成平台内存与 DMA，再按四步启动 modem，结果必须是 modem 持续运行、QMI 响应、IPA 初始化完成。16 线已有 /mnt/e/k60-work/wt-k55/drivers/PongCellular/K60ModemBoot.c:82-164 的五步、/mnt/e/k60-work/wt-k55/drivers/PongCellular/K60ModemLink.c:423-429 的 storage 名映射、/mnt/e/k60-work/wt-k55/drivers/PongCellular/K60ModemEfs.c:149 的读服务；27 线还没有 0626–0630 与 data mount，故 27 尚未满足。
- /mnt/e/hackios/UniXNU/docs/zh/porting/baseband.md:25 要求原厂 FSG/EFS/NV 并核对摘要，同页第 29 行要求 proprietary-files.txt 记录固件来源、哈希与打包路径。当前 proprietary-files.txt:1-7 只有 iOS 16.6.1 的 KernelCache/DeviceTree/StaticTrustCache/Cryptex1 条目，没有任何 modem/fsg/fsc/modemst 条目，这是 F3 前必须补的缺口，不是 na。
- /mnt/e/hackios/UniXNU/docs/zh/porting/baseband.md:56 明确 EFS 写入在 bring-up 阶段只保存在内存、重启后重新加载原厂数据。/mnt/e/k60-work/wt-k55/drivers/PongCellular/K60ModemEfs.h:92-95 正是 boot-session shadow：写方向 ACK 但不落盘；这与该页一致，但不能宣称持久化。
- /mnt/e/hackios/UniXNU/docs/zh/guide/userdata.md:60-85 要求 Data 卷来自 payload seed、按目标布局扩种子，同页第 82 行说 seed 大小变化会改变持久化身份并初始化新 Data store；/mnt/e/hackios/UniXNU/docs/zh/concepts/userdata.md:68-70 说持久 store 从 userdata 末尾窗口提供，窗口不适用时内核拒绝 seed。本板 na 的部分：modem EFS 不走 userdata Data store，它走 modemst1/modemst2/fsg/fsc 四个独立分区，见 /mnt/e/k60-work/wt-k55/drivers/PongCellular/K60ModemEfs.c:12-17 与 /mnt/e/k60-work/wt-k55/drivers/PongCellular/K60ModemGpt.h:4-5；依赖的部分：PAS 必须在 native Data 挂载之后，27 的 data-mount 尚未落，见 /mnt/e/k60-work/wt-pitfall/docs/research/cellular/20-IOS27-PORT-PLAN.md:95-99，所以 F3 不能开始。
- /mnt/e/hackios/UniXNU/docs/zh/drivers/qcom-baseband.md:7-9 要求板级提供 modem 启动、固件、电源、DMA、GLINK/QRTR 与 rmtfs，组件只提供桥；16 线实现正在这些位置，27 侧搬运清单见 /mnt/e/k60-work/wt-pitfall/docs/research/cellular/20-IOS27-PORT-PLAN.md:29-32。"""
