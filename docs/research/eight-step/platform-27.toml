[hardware.platform.step.deep]
done = true
evidence = '''三件事都有结论，细节与逐行表在 docs/research/ios27/PLATFORM-BUDGETS.md：
(a) ml_io_map 预算：12377 的 osfmk/arm/io_map.c 里没有 IO_MAP_SIZE / io_submap，io_map() 每次 kmem_alloc(kernel_map, …)（:112，KMA_IO|KMA_PERMANENT），16 系列 0621 的 8→32 MiB 子图在 27 上不存在也不需要。27 stage-0 的实际映射只有 BT 补丁五个窗口（0500-k60-bt-qbt-new-files.patch:1017-1021，GCC 0x1F4200 + UART 0x4000 + QUP 0x2000 + TLMM 0x100000 + GIC 0x10000 = 3,187,200 B ≈ 3.04 MiB）；XNU 自身三处调用（machine_routines.c:1371-1385、cpu.c:1310、cpu.c:289）全由 ADT 属性驱动，本板 ADT 不提供 → 0 字节。
(b) T0SZ：27 构建上条件成立——board_config.h:307-315 引入 BCM2837.h（:11 #define BCM2837）、编译参数 -D ARM64_BOARD_CONFIG_BCM2837 与 -arch arm64e、4 KiB 页无 __ARM_16K_PG__，故 T0SZ_USER=17（47 位用户 VA）。逐 hunk：proc_reg.h 3/3、pmap_pt_geometry.h 1/1、pmap.c 9/10、arm_init.c 1/1、start.s 1/1、sleh.c 2/3、arm_vm_init.c 0/1（对构建基线 1/1）；失败项里 pmap.c 那一个是 native_pmap_user_mappings（GPU 线的 BO 视图），sleh.c 那个是纯注释，arm_vm_init.c 依赖构建基线多出的 #endif。
(c) SIGP：cpu_common.c 3/3、cpu.c 6/6、zzzzzzzzzz-sheng-sigp-reinit-assert.patch（12 行）全部通过。机理是副核在 cpu_idle 被投递 SIGP 后 cpu_signal 里的 SIGPdisabled 位残留，后续投递被判为已投递而丢失，表现为调度停摆/UFS 根挂不上；sheng_sigp_recover() 在重试环里清位并计数。'''
recorded_at = '2026-11-21T14:05:00'

