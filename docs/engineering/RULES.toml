statement = "门禁的 fallback 如果只是「取最新的那一份」，就会拿别的分支/别的板的产物来判本树，把「本机没有能代表当前分支的构建」翻译成「你的补丁序列坏了」。fallback 必须能判断结果是否适用于当前对象：补丁名集合不同就不是本对象的证据，应 skip 而不是判红。"
check = "python3 scripts/tests/test-check-build-applied.py"
