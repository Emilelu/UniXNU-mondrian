findings = ["K60 has 2x AW882xx smartpa at I2C 0x34/0x35 (`awinic,aw882xx_smartpa@34` and `@35`), not TFA9873: docs/plans/BT-AUDIO-PORT-PLAN.md:38,192-194,207-210.", "The PCM stack now carries the ring queue (drivers/PongAudio/PongAudioRing.h), the 11-step AudioReach playback graph and eight DMA slots (drivers/PongAudio/PongAudioPlayback.h), the PongAudio IOService/UserClient (drivers/PongPower/PongAudioService.cpp + PongAudioServiceAbi.h) and the output-only AudioServerPlugIn (userland/PongAudioPlugIn.c, built by userland/build.py audio). The kernel side is linked through libK60PhysicalBattery.a; the HAL builds PongAudio.driver/PongAudio, and patches/xnu/0617 carries that bundle inside the kernel and writes it into /private/var/pong/empty-hal, which the kernel bind-mounts over the HAL search paths (init's bindfs is rejected with EPERM before AMFI). Image r (kernel f739d730..., ADSP carrier 66336946...) contains the 560-byte adsp_apps intent, PRM source port 2, ABI version 3 + SetHostClock, the 19.2 MHz CoreAudio clock handshake, the kmem_alloc_contig low-DMA fallback, the K60AUDIOHAL deploy strings and the K60Handoff PAS1 marker; it booted to SpringBoard on 2026-11-18 but init's bindfs view returned EPERM, so mediaserverd never saw the HAL. Image s (kernel 69aed1e0..., ADSP carrier 66336946...) carries the same audio payload plus the kernel bindfs mount of /private/var/pong/empty-hal over /System/Library/Audio/Plug-Ins/HAL; the merged battery archive is 551f1aaf... (150,888 B) and the audio HAL is 128a47e7... (70,000 B). Image s booted on 2026-11-18 01:46 and its console reports K60AUDIOHAL mount point=/System/Library/Audio/Plug-Ins/HAL files=2/2 error=0, PongAudio HAL: K60 stereo service connected and PongAudio HAL: AudioServerPlugIn initialized, so mediaserverd loads the plugin; no playback stream has triggered StartIO yet, so the clock handshake, low-DMA allocation and PCM period remain unproven. Image w (kernel 8c8a294c..., audio_hal 2a3831cf..., boot.img 8aa4e8e8...) fixes the all-zero ADT lease path so pong_audio_dma_lease() falls through to kmem_alloc_contig instead of returning NoLease; it is built (31 arguments, 607 bytes) and waiting for a free fastboot. Image y (kernel f49e7d4a..., audio_hal 2a3831cf..., boot.img 26ac04a7...) adds ml_io_map() for the fallback and caps max_pnum with atop_64(4 GiB - bytes) for the 16 KiB page size; it booted on 2026-11-18 09:26 (31 arguments, 607 bytes) but the adsp_apps slot was registered too late, so the DSP OPEN was dropped and the HAL selftest failed with kAudioHardwareNotRunningError. Images z, aa, ab and ac tried active, passive and held pre-registration; z/aa/ab reset the shared transport (K60Battery: physical transport stopped error=-5) and ac proved even a delayed OPEN_ACK is fatal. Commit 02caba7f acknowledges the DSP OPEN immediately while still holding our own OPEN until PMIC up; image ad (kernel 85738be3..., audio_hal 2a3831cf..., battery archive 0a389491..., boot.img d673c7ad...) booted on 2026-11-18 11:52 but the shared transport still stopped with error=-5 right after PMIC up, then a separate kernel data abort followed. Image af (HEAD 26f3835d, kernel b87b946a..., audio_hal 2a3831cf..., battery archive 360a26b1..., boot.img aaad4817...) instead creates the adsp_apps initiator slot only after PMIC up; it booted on 2026-11-18 12:26 (31 arguments, 607 bytes) and printed K60Battery: audio GLINK slot opened and the PMIC-up line without error=-5, but the DSP never answered our OPEN, so the channel stayed down and the HAL selftest still returned 1937010544. Image ag (HEAD b82ce0fe, kernel bc253864..., battery archive 7bf94341..., boot.img 49f121f2...) adds QcomGlink OPEN/OPEN_ACK/slot diagnostics; it booted on 2026-11-18 12:48 (evidence E:/k60-work/evidence/audio-probe-ag/run1-20261118-1238, capture state=captured-budget-complete, 264,186 bytes) and line 208 shows QcomGlink: rx OPEN name=adsp_apps p1=3 known=0 hold=-1: the DSP opens adsp_apps during the PMIC handshake, before the slot exists, so the OPEN is dropped and never repeated; line 548 shows ch adsp_apps lcid=2 sent=1 acked=1 remote=0, so our OPEN is acknowledged but remote_open never becomes 1. Commit 234558f4 remembers early remote OPENs in pending_open[] (QcomGlink: adopt remote OPEN) and sends the deferred OPEN_ACK once our OPEN is acknowledged (QcomGlink: late OPEN_ACK); host tests are TESTS OK 611 cases. Image ah (HEAD 234558f4, kernel 9f5c3eb8..., payload_kernel 683b409b..., adt 4dc245cd..., battery archive e97c8ea0... 154,712 B, boot.img b99d1560...) is built with verify-boot-image OK and image-arg-audit OK (31 arguments, 607 bytes) and is waiting for a free fastboot.", "Image ah (HEAD 234558f4, boot.img b99d1560...) booted on 2026-11-18 13:16 (evidence E:/k60-work/evidence/audio-probe-ah/run1-20261118-1300, capture 260,929 B, logSha256 0A30029A...): adopt remote OPEN adsp_apps rcid=3, late OPEN_ACK, channel up and PongAudio: glink adsp_apps up, then a surplus INTENT stopped the transport with QcomGlink: stop rc=-5 cmd=5 p1=3; bc3781e5 drops a surplus intent instead of stopping. Image ai (HEAD bc3781e5, boot.img 024bc2e7..., kernel 252aaa88..., battery be50e93d...) booted at 13:41 (evidence audio-probe-ai/run1-20261118-1330, 257,769 B): APM ready, step 0 sent, response opcode 0x02001005 status 2; 9d0b1095 moved the AudioReach payload_size to the last header word. Image aj (HEAD 9d0b1095, boot.img f6400722..., kernel 8995e4a2...) booted at 14:27 (evidence audio-probe-aj/run1-20261118-1408, 275,679 B): PRM request accepted (opcode 0x02001002 status 0), legacy service set-param refused (0x02001005 status 1). Image ak (HEAD 721415bc, boot.img ce905f9f..., kernel 71a666ed...) booted at 14:49 (evidence audio-probe-ak/run1-20261118-1438, 255,568 B): step 1 refused with status 1 at destination 0 and status 2 at AFE 4; source review places the legacy AFE envelope on the APR contract (apr_audio-v2.h:12521-12533, :2028-2048) while QcomGlink and PRM use GPR, and the AGM TDM endpoint is graph/module-scoped (graph_module.c:390-469,665-755). The live DT group declares only 0x9020 (group-num-ports = 1); a7d82acf removes the extra group member and adds pong_audio_group_probe=1, which stops after step 1 and logs the response route and echoed opcode. Image am (HEAD 48bb3d51, boot.img 344d6d78...) answered from ADSP port 4 with the opcode echoed, so the route is right and status 2 is ADSP_EBADPARAM on the v1 envelope; vendor apr_audio-v2.h:13383-13386 requires AFE_SVC_CMD_SET_PARAM_V2 (0x000100fc) for group TDM, and a7a6a24b switches the service steps to that opcode with param_hdr_v3. The AudioReach graph path then opened and configured the speaker on image au (HEAD 95f3aafa, boot.img 0beac500...): GRAPH_OPEN, the 168-byte TDM sink config (TDM_INTF_CFG, TDM_LANE_CFG, HW_EP_MF_CFG, FRAME_SIZE_FACTOR), the playback open/config/shmem, MEM_MAP (handle 0xb0d8c0b8) and the PRM clock all answered status 0, so module 0x0700100E exists on this ADSP; only the single GRAPH_START of device subgraph 0x4005 returned ADSP_EFAILED, and the slot address was 0x1_dd4f4000 although the DMA lease is below 4 GiB. Image av (HEAD 620918d2, boot.img 13a3fb31...) then accepted both single-subgraph starts but lost its ADSP SMP2P state immediately after submitting four mapped PCM slots (no WRITE_DONE; local transport guard returned -27). This did not yet distinguish the PCM submit path from the started TDM speaker; image aw skipped both speaker START commands and tested the playback subgraph alone. Image aw stopped right after the first period copy: it printed `PCM slot 0 copy begin/copy done` and then nothing, while the image that never wrote a period survived the whole capture budget, so the first PCM WRITE itself kills the transport. The device tree binds the audio ion node to apps SMMU stream 0x1801 with qcom,smmu-sid-mask, so the DSP derives the stream from the buffer address upper word; image ax sends that tagged address in both the shared-memory map and the writes, leases the top context bank as a stage-1 bypass bank for 0x1801 exactly as the Pong and zizhan SM8475 trees do, prints the SMMU audit before the first write, and restores the reference 0x10000000 | sequence token. Image ax booted and the audit answered the open question: streams 0x1800, 0x1801 and 0x1001 all resolve through one masked stream-match group at slot 3 pointing at context bank 3, so a new group placed above it never wins, and the top bank (74) already serves the UFS stream 0x0e0, which is why the lease refused itself. Image ay keeps the lowest idle slot below that masked group and walks up to eight banks down from the top, skipping any bank an SMR still references. Image ay booted that selection and told the rest: the audit still routes 0x1800/0x1801/0x1001 through the masked slot 3, the lease then reported `SMMU lease refused: no free context bank below 75`, and the console ended inside the first four PCM writes without one answer from the DSP. With SMMUEN clear and the masked group already bypass, the apps SMMU is not the fault; the open suspects are the ADSP side XPU/VMID handoff (stock moves the audio pages with SCM hyp_assign) and the command path itself. 镜像 ba（boot.img 5e918ea5…）加了 pump/reap/submit 面包屑和一次零字节写；实测 console 停在 playback graph started without the speaker 之后，零字节探针都没跑到，说明 AP 在 graph 启动完成的瞬间死亡。"]
completion = ["Each declared route carries the selected audio format through playback or capture and handles start/stop correctly."]
limits = ["The playback graph, service and HAL build, and images r/s boot to SpringBoard with the HAL loaded by mediaserverd; the HAL selftest does enter StartIO on the audio candidates, but the adsp_apps GLINK channel never reaches up yet, so no PCM period has been consumed and no audible output has been verified. Images y/z/aa/ab/ac/ad show that a second audio slot registered before the PMIC handshake resets the shared transport (error=-5), while late registration drops the DSP OPEN; af registers the slot in the PMIC-up callback and avoids the reset, but the DSP's own adsp_apps OPEN arrived before the slot existed and is never repeated, so remote_open stays 0; ag proves this with QcomGlink: rx OPEN name=adsp_apps p1=3 known=0 and ch adsp_apps lcid=2 sent=1 acked=1 remote=0, and 234558f4 adopts such early OPENs from pending_open[] so the channel can finally come up. Capture is not implemented. Images ah/ai/aj/ak establish the full control path up to APM ready and one accepted PRM request, but the legacy AFE service set-param is refused (status 1 with destination 0, status 2 with destination 4), so the six-step cannot complete and no PCM period has been submitted. a7d82acf fixes the single live-DT TDM group member and adds a bounded group probe (pong_audio_group_probe=1) that stops after step 1; the probe proves or disproves only that one packet, not playback. The single-member payload was accepted as a route in image am but rejected with status 2, so the v1 service envelope is the remaining blocker; a7a6a24b moves the service steps to AFE_SVC_CMD_SET_PARAM_V2 (0x000100fc, param_hdr_v3). Image al never built: compliance caught two docs left out of 14c795c4 (fixed by 48bb3d51) and the extra pong_audio_group_probe=1 argument pushed the kernel command line to 632 B against the 607 B limit. Images aq to au then showed the legacy AFE envelope rejected by the GPR service port regardless of the group filler (0xffff or 0), the I2S speaker config refused with status 1, and the TDM sink config accepted with status 0; image au's single device-subgraph START returned status 1. Image av's paired START also returned status 1, while both single starts returned status 0; after four PCM slot submissions the ADSP SMP2P state became invalid (-27), with no WRITE_DONE. The aw isolation image started playback without either speaker START and submitted PCM, and stopped at the first period copy, which is why image ax leased the audio SMMU stream instead. That lease refused on the board because the firmware group at SMR slot 3 is masked and covers every audio stream, while the top bank already serves the UFS stream 0x0e0; image ay therefore places the new group below the masked one and tries up to eight banks down from the top. That placement was refused on hardware because every free bank is referenced, so the write path still dies unanswered; the next image traces the pump and opens with a zero-byte write so a command-path failure can be told from a buffer read. ba 的死亡点比 aw 更早：不是写命令，而是 playback graph 一启动就没了，所以下一步把零字节探针提前到 START 完成处，并在 ring 满时也先 pump。"]
next_action = ["Boot image ah (HEAD 234558f4, boot.img b99d1560...) and check QcomGlink: adopt remote OPEN adsp_apps plus QcomGlink: late OPEN_ACK; if the channel comes up, continue to PongAudio: glink adsp_apps up, APM ready, the AFE six-step, at least one PCM period through the service timer without an underrun, then audible output. If the adopted OPEN still does not lift the channel, add a responder-first path that treats the remembered remote OPEN as the authority and re-runs the handshake. Image au (HEAD 95f3aafa, boot.img 0beac500...) proved that the TDM sink opens and configures. Image av (HEAD 620918d2, boot.img 13a3fb31...) started the paired GRAPH_START (0x4005 + 0x4001), which the DSP refused with status 1, then accepted both single-subgraph starts with status 0; the first four 8 KiB slots at 0xdd4f4000 were submitted and the ADSP state invalidated immediately (K60Battery: physical transport stopped error=-27, no PCM write done), so the write path and the TDM speaker path are still entangled. Image aw booted and separated the two failures: the console ends at the first PCM period copy, so the write path kills the transport before the TDM speaker matters. Image ax leases apps SMMU stream 0x1801 as a stage-1 bypass bank (the Pong and zizhan SM8475 recipe), maps and writes the tagged address the DSP expects, and prints the SMMU audit before the first write; Image ax booted: the audit found one masked group at slot 3 covering 0x1800/0x1801/0x1001 and the top bank already serving the UFS stream, so the lease refused and the console ended at the streaming line again. Image ay keeps the new group below the masked one and walks up to eight banks down; boot it and look for `PongAudio: SMMU stream 0x1801 leased to bypass bank` followed by `PCM write done slot=0`. That boot answered with `SMMU lease refused: no free context bank below 75`, four unanswered writes and a reset, so the next image keeps the trace breadcrumbs and sends one zero-byte write first; if the DSP answers that, the fault is the buffer read (ADSP XPU/VMID handoff), and if it dies there the fault is the command path.下一镜像 bb 把零字节写提到 playback START 完成处、并在 ring 满时先 pump 再判断，以区分命令路径与内存访问。"]
