# usb-27.toml — 顺序 6「USB」的八步记录（iOS 27.0.1 / 24A446）
#
# 八步（docs/engineering/EIGHT-STEP-SPEC.md）：
#   ① 同型   ② 官方   ③ 反编译   ④ 广域   ⑤ 方案   ⑥ 深挖   ⑦ 核验   ⑧ 上机
#
# 本文件只做 ①~⑦。⑧ `step.device` 由 Lead 在上机后写，这里有意不建。
# 纪律：没做过的步骤写 done = false 并写明缺什么、什么证据能定它；不要编。
#
# 每条 evidence 必须含可核查引用：file:line / URL / usblog-YYMMDD-HHMMSS / 0x… / P-xx。
# 本轮的完整证据文档：docs/research/eight-step/usb-27-export-surface.md
# 判据脚本：scripts/usb27/kc-surface.py；符号提供者表：docs/research/eight-step/usb-27-providers.tsv

[hardware.usb]
status = "researching"
name = "USB（AppleUSBXDCI / AppleUSBXHCI / UCSI / eUSB2 / QMP PHY）"
why = "27 的关键路径而不是普通外设：K60 唯一控制台是 USB CDC-ACM，它在 bsd_init 之后才起来，所以 bsd_init 之前的任何死都是「0 字节日志」；这条线决定后面所有飞行能不能取证。"
paths = ["drivers/QcomDwc3/", "docs/research/usb/", "patches/usb/", "board.toml"]

[hardware.usb.step.same_model]
done = true
evidence = "同型源三处，逐条落 file:line 并判定（详见 usb-27-export-surface.md §8）：(a) sheng SM8550 / ipados-27.0.1-24A446 / QcomDwc3 —— UniXNU-sheng/board.toml:25 的 11 个 USB prelink 根 + 两条 ! 排除、package/ShengBattery.cpp:31-34,75,79,214,235-236 的 UCSI 消费、scripts/build-gop-legacy-display-27.py:550-589 的 ABI 头生成，判定 adapted（参数按本板换：stream 0x0）；(b) QcomDwc3 源 e4efe95c —— QcomDwc3.cpp:40-41,208,216,307-343,576-604,609-640,790-815、QcomEusb2Phy.h:12-17、QcomQmpUsb3.h:1-6、QcomUcsi.h:22-129，判定 copied（只读行号，GPL-2.0-only，代码未进本仓）；(c) 本板 16.6.1 结案（k60-usb/docs/research/usb/RESEARCH.md:56,67,81,83,109,113,273 与 08-on-device.md 的 c/d 两格 PASS），27 侧实测无 bsd/dev/k60_usblog.c、bsd/conf/files:110-115 无该行、104 条 27 补丁无一条 USB，判定 rejected for 27 as-is。"
recorded_at = "2026-11-21T15:41:00"

[hardware.usb.step.official]
