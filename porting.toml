findings = ["2026-11-17 120 Hz panel path: m11a timing@2 uses the eleven-packet vendor sequence in drivers/PongAdreno/PongDsiPanel.cpp behind p120=1 or the official vsync=120 spelling; the switch is deferred to the first completed GPU frame and updates the INTF1 tear-check vsync_count from 100 to 50. The panel rate is measured from the active INTF line-counter (0xb0) average wrap rate, the official DisplayTimingProbe method; a single shortest interval is only a fallback when fewer than two wraps are seen; the tear-counter high 16 bits is a read-pointer count and the frame counter is only DPU commits. pong_panel_refresh_hz() reports the requested 120 Hz while a request is active (TimingElements publishes once at start), while pong_panel_sample() logs the separately measured INTF1 rate; patches/xnu/0506-k60-120hz-refresh.patch receives that requested value instead of declaring 120 unconditionally. Build 120hz-2: boot.img 201,887,744 B sha256 bbe05b601762152a4ba16942e099f9bc818c00c8f970b0dab803c9ef87bf6cd7, kernel_built 105,521,152 B sha256 a4547e223f3f65405a3db326e249e445de3de4894bb5a9cd839b8ddc7fcd3c8a, manifest head b786416d, kernel_args [p120=1]; verify-boot-image OK and image-arg-audit OK (30 arguments, 582 bytes). Build 120hz-3: boot.img 201,887,744 B sha256 7c6f69edf120b5c176b06003beda39740cb036183de6582bd7653451a91a6f40, kernel_built 105,525,248 B sha256 10dfed8ae736aa45ab13ffdccf4eda3d75bc9ae692298916f6772d170d4d6a45, manifest head acbf6b0a, kernel_args [vsync=120]; verify-boot-image OK and image-arg-audit OK (30 arguments, 585 bytes). Build 120hz-4: boot.img 201,887,744 B sha256 54784067b2a2449a1457760d08fa48f8cc7137f9e51cbc7b4367ce5457ea0c86, kernel_built 105,525,248 B sha256 f0d54b8be5dde5a169b1576c7a6edb01e1aba544cf0be6e98f9efd996522a7a4, manifest head 58eed3fc, kernel_args [p120=1, k60_backlight_control=1]; verify-boot-image OK and image-arg-audit OK (31 arguments, 606 bytes). Build 120hz-5: boot.img 201,887,744 B sha256 093150fbb0ad3826ecb42a244837d7cf35ad8c44cba4d6afd0b6b1a1cea83912, kernel_built 105,525,248 B sha256 8344d340b3c292c10eec120e2257d81a058023cc6fdbf389f42f729f019eb319, manifest head 569bafca, kernel_args [p120=1, k60_backlight_control=1]; verify-boot-image OK and image-arg-audit OK (31 arguments, 606 bytes). Flight 120hz-5 (usblog-20261118-013515) reached the first-GPU-frame switch, eleven packets rc 0, first frame and backlight conformance=1 control=1, but INTF1 count_enable stayed 0 and the line counter never advanced, so the measured rate was 0/s; 120hz-6 selects the CTL active interface, enables its 0xa8 frame/line counter, sets 0x2b4 autorefresh to 1 and prints INTF0-3 state before measuring. Build 120hz-6: boot.img 201,887,744 B sha256 d895c2a3941d5edb1fee21052ffd196a46e8fd26fe7cc9d9ee36bbcaaff614d2, kernel_built 105,525,248 B sha256 9bc7ea8a23441a269b638a5426a1606257e4b653274f73b88da82b5f06711bfb, manifest head 3beef4b6, kernel_args [p120=1, k60_backlight_control=1]; verify-boot-image OK and image-arg-audit OK (31 arguments, 606 bytes). Flight 120hz-6 (usblog-20261118-092134, console.log 248,985 B): first-GPU-frame switch, eleven packets rc 0, first frame and backlight conformance=1 control=1, SpringBoard 129, sig=11 0; INTF line counter after the switch wraps 60/500 ms (120/s) and after the UI frame 61/500 ms (121/s), while the shortest-interval field read 131/s and the before sample read 0/s because the inherited autorefresh divider was still 60 frames. 120hz-7 averages the wrap rate over multiple wraps and sets the autorefresh divider to one frame before the before-switch sample. Build 120hz-7: boot.img 201,887,744 B sha256 d8fdc695c311d5b2e99d06402cc5ef6196bb8999c193b0eb415c0bb7b758bb4c, kernel_built 105,525,248 B sha256 ba1d5979cdc5303d932977b5d5dc97ef199d66cf7ddf979a42bd92ff1c39c7ab, manifest head 767f1e6f, kernel_args [p120=1, k60_backlight_control=1]; verify-boot-image OK and image-arg-audit OK (31 arguments, 606 bytes). Flight 120hz-7 (usblog-20261118-094621, console.log 267,578 B, sha256 BD5C893E44C7ACEC5FDD748D31BEC7673E0B1037D9625614414A8E281A603CC9): check-120hz-log.py PASS with first-GPU-frame switch, eleven packets rc 0, before te 55/s, after-UI te 120/s, first frame, SpringBoard 172, sig=11 0, no DCS failure and backlight conformance=1 control=1; user brightness-slider confirmation pending.", "Software framebuffer implementation is live at 60 Hz: patches/xnu/0210-k60-display-native-canvas.patch:10-31 fixes the K60 panel contract at 1440x3200 with refreshHz() defaulting to 60; patches/xnu/0211-k60-display-startup.patch starts the display services, 0213-k60-display-first-frame.patch publishes TimingElements and the first frame, and 0236-k60-managed-memory-and-panel.patch carries the panel/VM handoff. All four are enabled in patches/xnu/series:86,87,89,115.", "Device log reaches the SpringBoard main loop: `[SpringBoard] _checkIn returned` -> `UIApplication _run entered` -> `main queue reached locked=0 screen=0 dim=1` (docs/state/TRUST-LEDGER.md:41; docs/state/STATE-2026-11-07.md:17-19).", "Board-level chosen display-scale=3 adapted from XTOM0706 9d1a14f83d1050a042313f30dc9d5b7e80d31f7a. Parsing generated ADTs before/after gives identical properties except random-seed with the current 20G81 profile. Its additional sweet display node is not copied because MiniIOMobileFramebuffer already publishes a disp0 display-subsystem child at runtime.", "Backlight is now a 12-bit DCS 0x51 chain: PongDsiPanel.cpp sends the two-byte big-endian DBV in a DCS long write, K60BacklightCodec.h maps CoreBrightness level 1..2047 to DBV 0x4..0xfff, and brightness-19 published conformance=1 control=1 at dbv 0xfff with no sig=11 and first frame present. Android baseline measured on the live device: panel0-backlight max_brightness=4095, mScreenBrightnessRangeMinimum=9.15639E-4, so manual minimum = 0.000915639 * 4095 = 3.75 -> DBV 0x4; maximum 1.0 -> 0xfff. The backlight-calibration-parameters dictionary stays unpublished because a partial dictionary crashed CoreBrightness at pc 0x1af030aa4. The second brightness-19 flight (usblog-20261117-1146-brightness19, 254,828 B) recorded 54 brightness requests with minimum DBV 0x4 and maximum DBV 0xfff; check-backlight-log.py --control=1 --min-dbv=0x4 --max-dbv=0xfff passed, and the user confirmed the range."]
completion = ["A known frame appears with correct geometry and colors, then userland presentation and backlight controls work."]
limits = ["cand18 captured78716B of actual native UI logs: locked=1, screen=1, homeButtonType=2 and live main-loop turns3868 at120s. Wallpaper bootstrap skipped because existing-content=1; no native wallpaper submission or restored pixels is proven. Physical touch transport remains unqualified.", "2026-11-17 brightness-19 first flight E:/k60-work/evidence/usblog-20261117-0426-brightness19/console.log 231960 B: published level 2047 dbv 0xfff conformance=1 control=1, first frame and 128 SpringBoard lines, sig=11 0; only the two startup requests appeared (level 1024 -> dbv 0x802, brightness-nits 0 -> 0x0), so that flight was INCONCLUSIVE for the slider range. The second flight (usblog-20261117-1146-brightness19) recorded 54 requests, minimum DBV 0x4, maximum DBV 0xfff, judge PASS; the range is accepted. brightness-17 DBV 1 blacked the panel at night; the 0x14 floor was Xiaomi's doze-lbm level, not the normal slider floor."]
next_action = ["Verified recovery image E:/k60-ios/boot-cand19-20261112.img SHA256e53b7a6b3487334144f18151b3f11ca0fbecf6f20c9306e2dfd6a5c7b1d502d4 retains the fixed4096-byte header page, FAT offset552960, UFS-only Data and native HomeButtonType2. Its actual FAT kernel and113424-byte signed UI library match the build inputs; args596bytes carry k60_wallpaper_reset=1 exactly once. Native submission and pixels remain unverified because fastboot/ADB/CDC are unavailable. Reconnect in fastboot, boot this image temporarily, and inspect content classes/assets/submission before qualifying the picture; ordinary boots preserve existing wallpaper.", "Brightness range is device-verified on brightness-19 (usblog-20261117-1146-brightness19). No further boot is needed; do not flash."]
evidence = [{ kind = "device", reference = "patches/xnu/0394-k60-launchd-cache.patch", command = "fastboot -s be74ba07 boot E:/k60-ios/boot-cand7-20261111.img", revision = "5198a67999208658bd06d227ef14cfa7efeffb3e", result = "console-20261111-204210.log (74090 bytes): main queue reached, delayed home request accepted, first frame and subsequent BGRA swaps presented, main snapshot turns=3889. User observes desktop, status bar, App Store, Settings and Dock. Software rendering only; touch and GPU not implied." }, { kind = "device", reference = "docs/research/display/08-on-device.md", command = "fastboot boot /mnt/e/k60-work/artifacts/brightness-19/boot.img; python3 scripts/check-backlight-log.py E:/k60-work/evidence/usblog-20261117-1146-brightness19/console.log --control=1 --min-dbv=0x4 --max-dbv=0xfff", revision = "230281a17de627575fd21fe26f992b3e81254d20", result = "brightness-19 boot.img sha256 25ac388989270c56a3494b18b26d90d37bda535a13ba2bdf9eb98d5670a86c5c; published level 2047 dbv 0xfff conformance=1 control=1; first frame; SpringBoard 129; sig=11 0; 54 brightness request lines; minimum DBV 0x4; maximum DBV 0xfff; check-backlight-log.py --control=1 --min-dbv=0x4 --max-dbv=0xfff PASS." }]

[[area]]
id = "input"
status = "device-verified"
components = []
paths = ["board.toml", "userland/touch.c", "userland/touch.h", "patches/xnu/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz-pong-touch-console.patch", "patches/xnu/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz-pong-physical-keys.patch", "scripts/*touch*", "scripts/*hid*", "scripts/make-pong-adt.py"]
inputs = ["Identify the input hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for input."]
procedure = ["Follow the input stage in the porting guide and record the actual commands."]
findings = ["cand7 skips touch because the actual FAT ADT has no /arm-io/pong-touch. The format-2 converter accepts typed metadata children; board.toml defines K60 SE4 0x990000, TLMM 0xf000000+0x100000, GPIO16-21 and AVDD71, raw axes14400x32000. No RSC/cmd-db access is permitted in the touch driver.", "Read-only rooted Android be74ba07 confirms Goodix BERLIN/9916R firmware05800263, LDOC2 enabled at1800000uV, 193-byte IC-info with checksum5185 and touch address0x10308. IC-info dimensions1440x3200 must not replace the raw evdev14400x32000 axis contract. The actual Android transfer log uses GPI callbacks with FIFO disabled.", "The compiled GPIO fallback carries the 2us half period, boot-option write/readback and 1488-byte captured config package, but cand15 never entered that transport because bitbang-pins metadata was absent. No XNU handshake, config ACK or touch sample is established. Earlier whole-image diagnostic string checks proved only code inclusion, not controller response.", "The real blocker was not power or the pin map but a missing second command: the driver sent 0x90/0x00 (raw frames off) and never 0x91/0x01 (coordinate reports on), which the on-device Android goodix_htc_enable(false) sends as a pair. It also checked only ack[1] instead of waiting for reply[0] == 0x80, so a config that had not completed looked finished. Both are fixed in the touch patch; the retained module's brl_hw_ops disassembly (dev_confirm at 0x11d44, read_version at 0x136e8, brl_send_config's 20x20 ms state poll) is what pinned the exact order."]
completion = ["Touches map to the display, simultaneous contacts keep stable IDs, release events arrive, and buttons produce expected HID reports."]
limits = ["2026-11-14 boot touch-20261114a (boot.img 0b2003f4…, kernel c78a5cc9…) qualifies single-finger touch: CFG-START/WRITE/EXIT complete at state=0x80, RAW-OFF and COORD-ON both ack=0x80, the chip reports BERLIN 9916R 05.80.02.63 with active config 0x640fdf7d, and eight `goodix: type=1` samples reach `Pong touch HID: type=1|3` for the display-integrated digitizer. Console E:/k60-work/evidence/usblog-20261114-150931/console.log, 268,137 B, 254 SpringBoard lines, no panic marker. NOT yet accepted: two simultaneous contacts, edge gestures, tap-to-wake, and sustained frame rate under a moving finger; the 0x10308 header length is read from misc+48 but the retained module only proves misc+44 (data address) and misc+50 (point struct length)."]
next_action = ["Accept multi-touch next: hold two fingers and confirm two distinct contact IDs with independent coordinates and separate release events, then exercise the screen edges for the system gestures. If a second contact never appears, inspect the point-struct stride against misc+50 before touching the parser. Tap-to-wake (touch detection mode 0xff/0xfe/0x1/0) is logged but not verified against a sleeping panel."]
evidence = [{ kind = "device", reference = "board.toml", command = "adb -s be74ba07 exec-out su -c 'cat /sys/firmware/fdt'; read Goodix chip_info and r:10014:28/r:10070 IC-info selectors", revision = "fb24cf99ad97ab14313284000000000000000000", result = "Actual live FDT SHA2385d2a84ce920b5694b4cfcd8366d8bf6a7c39a0c0d2d02e988c1bc22ff94b1; BERLIN/9916R verified and raw axes14400x32000. This is Android hardware evidence, not XNU touch qualification." }, { kind = "host", reference = "patches/xnu/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz-pong-touch-console.patch", command = "python3 work/touch-gpu/repack-boot.py --template gpu8-start.img --ramdisk payload.img; inspect strings in the resulting image", revision = "04a819c4b9050bf4d37dff64c5357d4efea7e3b1", result = "boot-touch9-input-20261112.img (201883648 B, e7e4e90ab556a3e5) carries the handshake, 2 us bit-bang, config download and coordinate-mode strings; the packet carries no pong_touch argument so the driver runs at its stage-6 default. Not sent: the board was off the USB bus." }, { kind = "device", reference = "docs/research/EIGHT-STEPS.toml", command = "bash scripts/flash.sh /mnt/e/k60-work/artifacts/touch-20261114a/boot.img 240", revision = "0143b465721b47804cebc3d51cd76fa34fbfac37", result = "console.log 268137 B / 3870 lines, capture.json complete=true panicMarker=null, SpringBoard 254. line 683 `goodix: COORD-ON ack=80`; lines 2490-2601 eight `goodix: type=1 finger=0 raw=... normalized=...`; lines 2491-2496 four `Pong touch HID: type=1|3 finger=0 xy=...`; line 1425 display-integrated digitizer opened. User present, screen responded to a real finger. Single contact only; multi-touch and gestures remain unaccepted." }]

[[area]]
id = "gpu"
status = "planned"
components = []
paths = ["package/*Gpu*", "package/*Gmu*", "package/*Adreno*", "scripts/*adreno*", "scripts/*gpu*", "scripts/*metal*", "scripts/*turnip*", "scripts/*air*", "drivers/PongAdreno/**", "drivers/PongMetal/**", "drivers/NativeMetal", "scripts/generate-pong-cp-profile.py"]
inputs = ["Identify the gpu hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for gpu."]
procedure = ["Follow the gpu stage in the porting guide and record the actual commands."]
findings = ["cand7 renders through CPU composition; CONFIG_XNU_PONG_ADRENO_PLATFORM=n disables the real archive. The enabled scanout callsites currently resolve to explicit software-only weak functions, not GPU execution.", "Read-only device evidence confirms Adreno730v3 chip0x07030002 and the actual GMU/SQE/ZAP firmware. The build provider now resolves its real kernel tree, uses the retained register header and captured K60 firmware directory. K60 RSC EL1 accesses historically hang; the actual backend now uses documented Qualcomm monitor secure-IO calls for TCS reads/writes, propagates authorization failures, and retains real fence prerequisites.", "2026-11-18 the frame path is attributed instead of guessed: with the accelerator published and the Metal client committing (Pong Metal: S ... c12/0 d12), the per-frame cost sits in presenter->present() - kernel prepare 4-12 us, render-server retire 38-55 us, and the scanout copy 16,813-19,833 us for 18.4 MB, about 1.1 GB/s, far below A730 blit bandwidth. Copying 18.4 MB is not free, so the open question is which stage inside present() owns that time, not whether the display pipeline is slow.", "The render mode is not the official default: PongMetalPlugin.mm calls setenv(\"TU_DEBUG\",\"sysmem,nocb\",0), which forces whole-screen system-memory rendering, while the porting guide's default is gmem,nocb with per-tile load/store and memoryless attachments. The Turnip tree does implement the gmem path (tu_debug_options has both sysmem and gmem; tu_cmd_buffer.cc returns false for TU_DEBUG(GMEM)), so this is a one-line experiment rather than missing upstream work.", "2026-11-18 the split inside present() was measured on the device and the copy is not the cost: over 45 steady samples the median shares of the stage sum are import 0.2 %, encode 1.9 %, commit 49.6 % and GPU wait 45.9 %, with a median present of 23.0 ms whose sum agrees within +1.8 %. The commit does not wait for the GPU - pearson r(submit, gpu) = 0.007 and r(submit, previous gpu) = 0.088 - so it is CPU work inside the translator, not a serialised queue. Deleting the source-buffer import cache cost nothing measurable (import median 54 us), which also removes the last reason to keep an object across frames."]
completion = ["GPU submissions complete, mapping/fence handling is correct, a known image renders, and the selected Metal client presents it."]
limits = ["The scanout copy is measured but not yet attributed: 18.4 MB in 16,813-19,833 us (about 1.1 GB/s) is slow for a blit but the three candidate owners - re-importing the source pages each frame, the per-frame command submission, and the GPU transfer itself - have not been separated on the device. Frame rate is 0.9-7.79 fps, so 120 fps is an order of magnitude away and no target-motion behaviour has been tested at all.", "The stage numbers were readable on the 2026-11-18 17:15 flight and only then did the split become measurable, but two measurement defects came with them: the outer wait/copy/done spans were divided by 1000 while still labelled us (printed milliseconds as microseconds, P-234), and the sampler fired every 60 frames against a 22-frame flight (P-233). Both are fixed and guarded by executed host tests; the unit fix has not flown yet.", "A source-buffer import cache keyed on (address, length) was written and then removed before flight: the kernel creates a fresh IOMemoryMap per frame and releases it as soon as the copy retires, so a cached MTLBuffer would point into a released mapping. Whether kIOMapAnywhere ever reuses a just-freed address, and whether the runtime pins pages on import, cannot be proven in this tree; the import is therefore per-frame and counted, not reused.", "Which copy shape the frame takes was never recorded, so a per-frame Vulkan image allocation inside the translator could not be ruled out: the linear-texture branch is taken whenever the two strides differ and the source stride is aligned, and it forces an image, its memory and a tiling per frame. The next image removes that branch in favour of per-row buffer copies and prints the shape and both strides once per flight.", "Metal is still not qualified on hardware: drivers/PongMetal/README.md states actual GPU execution and accelerated presentation remain unconfirmed, so the area stays planned even though a provider is published and a client commits."]
next_action = [
  "按 docs/engineering/IOS-SCOPE.md 的判据排队：只有「可转移」的活才开工。当下可转移的四项——① import 双峰（63 us / 15,000 us，见 FLIGHT-CARD-20261119h 5.5）；② 内核扫出单跑已成立，下一步是零拷贝（token/evict/target，48->56 B）；③ P-244 映射泄漏的 maps/unmaps 对账；④ 判读器与门禁的维护。",
  "iOS 16 专属的工作已按用户决定（2026-11-19 m44559）停止：三个 Metal capability selector 的回落、在 16 上追 120 fps 的客户端调优、patches/metal2vulkan 的 16 专属迭代。停止的条目留在文档里，不要重新捡回来。",
  "迁移看 upstream：xNekom/UniXNU-mondrian 的 feat/ios27 已完成 F0/F2/F3（PAC probe 补丁、host 构建 prelink、Linux 构建 userdata、无 macOS 解密 AEA），下一个门槛是 bsd_init；我方暂存在 feat/bt-ios27-port（profiles/os/ios-27.0.1-24A446、configs/mondrian_ios27_defconfig）。"
]

