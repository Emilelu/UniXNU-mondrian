# Which checkout belongs to whom.
#
# One working tree, one owner. The Lead never edits the shared checkout and no
# agent ever runs a destructive git command in somebody else's tree. P-184 is
# what happens when that rule is missing: `git checkout --` in the shared
# checkout silently discarded eight uncommitted files an agent was editing.
#
# `scripts/check-tree-owner.py` reads this file and refuses to let an actor work
# in a tree it does not own when that tree has uncommitted changes.

[[tree]]
path = "/mnt/e/hackios/UniXNU-mondrian"
owner = "touch-agent"
note = "Shared device checkout. Only the touch agent works here. Lead must use its own worktree."

[[tree]]
path = "/mnt/e/hackios/k60-lead"
owner = "lead"
note = "Lead worktree (feat/pmic-rail). Lead's only writable checkout."

[[tree]]
path = "/mnt/e/hackios/UniXNU"
owner = "lead"
note = "Framework. Push to remote `fork`, never to `origin`."

[[tree]]
path = "/mnt/e/hackios/uefi-mondrian"
owner = "lead"

# The five delegated lines (2026-11-14). Each agent gets its own worktree; the
# shared checkout /mnt/e/hackios/UniXNU-mondrian stays with the touch agent.
[[tree]]
path = "/mnt/e/hackios/k60-wifi"
owner = "wifi-agent"
scope = ["patches/wifi", "drivers/PongWifi", "docs/research/wifi"]

[[tree]]
path = "/mnt/e/hackios/k60-bt"
owner = "bt-agent"
scope = ["drivers/PongBluetooth", "docs/research/bluetooth"]

[[tree]]
path = "/mnt/e/hackios/k60-usb"
owner = "usb-agent"
scope = ["drivers/PongUsb", "docs/research/usb"]

[[tree]]
path = "/mnt/e/hackios/k60-refmine"
owner = "refmine-agent"
scope = ["docs/research/reference"]

[[tree]]
path = "/mnt/e/hackios/k60-audio"
owner = "audio-agent"
scope = ["drivers/PongAudio", "docs/research/audio"]

[[tree]]
path = "/mnt/e/hackios/k60-gates"
owner = "lead"
scope = ["scripts", "docs/engineering", "AGENTS.md"]

[[tree]]
path = "/mnt/e/hackios/k60-wifi-lead"
owner = "lead"
scope = ["drivers/PongWifi", "configs", "scripts", "docs/research/wifi"]

[[tree]]
path = "/mnt/e/hackios/k60-cellular"
owner = "cellular-agent"
scope = ["drivers/PongCellular", "docs/research/cellular", "patches/cellular", "patches/xnu/0620-k60-modem-image.patch"]
