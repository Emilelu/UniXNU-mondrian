statement = "`ml_io_map` 的 IO 子图是全内核共享的一个固定预算，加窗口必须算总和而不是只看本次；预算耗尽时 `kmem_alloc(io_submap, ..., KMA_NOFAIL)` 在控制台起来之前 panic，现象是 0 字节日志而不是崩溃，必须靠 panic 行里的 size 反查是哪个窗口。"
check = "python3 scripts/tests/test-check-io-map-budget.py"
note = "蓝牙 d4（pong_bt_late=1 让控制台先起来）实测 `kmem_alloc(..., 1048576, 0x100021): failed with 3`，1048576 就是 K60_TLMM_SIZE；全树 37 个调用点合计 7.23 MiB / 8 MiB。修法把 IO_MAP_SIZE 提到 32 MiB，并加 check-io-map-budget.py 在已应用树上量总和。"

[[rule]]
id = "P-220"
