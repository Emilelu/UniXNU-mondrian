- 本分支本次无代码改动：上述 P1/P3/P4/P5/P7 的改动点全在 uefi-mondrian 仓库（Platforms/Xiaomi/DarwinBootPkg/Driver/DarwinBoot.c），不是本仓库；本仓库的 0542/0543/0546/0551 仪器已在 27 系列内，缺的不是写入器，是内核到达它们的证明；GopFramebuffer 启用（defconfig + board.toml components）不是一变量判别实验，且在 SM8475/27 上未验证，推迟到首输出判别之后；vermeer 式 framebuffer-console 补丁移植需 xnu-12377 startup.c 上下文核对，源码不在本仓库内，本次不盲目加补丁。uefi-mondrian 改动提案见 BLACKSCREEN-EIGHT-STEP.md §5，含 file:line，不在本分支静默编辑。'''
