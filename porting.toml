schema_version = 1

[device]
name = "mondrian"
soc = "SM8475"
os_profile = "ios-27.0.1-24A446"
summary = "Redmi K60 (mondrian/SM8475), branch feat/ios27: iOS 27.0.1 (24A446) as an iPhone 16 Pro Max (iPhone17,2), arm64e, on xnu-12377 with the Darwin 26 calls. main remains the iOS 16.6.1 port."

[[area]]
id = "ios27-arm64e"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "XnuPrelink"]
paths = ["board.toml", "feeds.toml", "configs/mondrian_ios27_defconfig", "profiles/os/ios-27.0.1-24A446/**", "patches/xnu-12377/**", "patches/unixnu-core/**", "patches/xnu-prelink/**", "patches/ios-mondrian/**", "docs/engineering/IOS27.md", "scripts/check-ios27-granules.sh", "scripts/linux/**", "scripts/legacy/**", "scripts/apply-core-patches.sh", "scripts/build-ios27-linux.sh", "scripts/check-ios27-artifacts.py", ".github/workflows/ios27-kernel.yml", "scripts/build-bluetooth-userspace.py", "scripts/stage-bluetooth-firmware.py", "scripts/toolchain/**", "scripts/tests/test-bt-userspace-stage.py", "firmware/bluetooth/**", "docs/plans/BT-IOS27-PORT.md", "scripts/check-bluetooth-*.py", "scripts/tests/test-bt-*.py", "scripts/tests/fixtures/bt-*.c", "dts/mondrian.dts"]
inputs = ["iOS 27.0.1 build 24A446 iPhone17,2 IPSW; the URL, the size and both hashes are in profiles/os/ios-27.0.1-24A446/profile.toml.", "XNU xnu-12377.121.6 with the Darwin 26 syscall and KPI patches from the arch and OS layers.", "The SM8475 patches/xnu-12377 series (UniXNU-sm8475-common, branch feat/xnu-12377).", "Xcode 26: xnu-12377 uses the four-argument __ptrauth qualifier and older clang cannot compile it."]
configuration = ["board.os_profile = ios-27.0.1-24A446; the profile sets arch = arm64e and page_size = 4096.", "configs/mondrian_ios27_defconfig is the stage-0 kernel: storage, display and GPU are off so the first failure is not hidden behind a driver ABI.", "The payload arguments are cupid's stage-0 list. The device series carries two upstream patches (ptrauth-string-discriminator.patch, because Apple clang's four-argument __ptrauth does not parse on the Linux toolchain, and armcpu-sleep-hook.patch, because ArmCpu's weak_import hook has no definition and ld64-port rejects it) plus the twenty-two-patch Bluetooth series 0500-0523, 0525 and 0526; docs/plans/BT-IOS27-PORT.md describes the series and the hook adaptations."]
procedure = ["F0: boot the PAC probe from the iOS 16 line (ios-mondrian shim/pac.c) and read FEAT_PAuth, the EL1 key registers and PACIA/AUTIA from the panel.", "F1: scripts/install-os-profile.sh, then ./unixnu defconfig mondrian_ios27_defconfig and build with Xcode 26, or with the Linux toolchain of scripts/linux/setup-toolchain.py (--skip-prelink until the reference exists).", "F2: prelink the 24A446 fixture against the board kernel and boot until bsd_init.", "F3: bring PongUfs to the 27 storage ABI and build the userdata image with ./unixnu userdata --os 27 on macOS.", "F4: panel first frame, then touch."]
findings = ["2026-11-18: iOS 27.0.1 (24A446) runs on xnu-12377.121.6 with the Darwin 26 system calls added; Apple has not published a Darwin 26 XNU.", "cupid (SM8450) reaches BSD init with this profile and panics on root mount because it has no SM8450 UFS block driver; mondrian already publishes APFS windows through PongUfs on the 16.6.1 branch.", "sheng (SM8550) booted macOS 27.3 arm64e. arm64e on SM8475 has not been measured yet.", "The 24A446 iPhone17,2 kernelcache is MH_FILESET with 305 entries; its decompressed hash and the AMFI early-init address are pinned in the profile.", "2026-11-18 stage-0 preflight: the device repository's drivers/ArmCpu and drivers/ArmDTPlatform were the iOS 16 hand-written drivers. A device-origin directory outranks the catalog component of the same name, so both silently replaced the catalog pair and the first kernel preflight failed with 'Build inputs missing: ArmCpu/ArmCpuSleep.h'. Both are archived outside drivers/; the stage-0 set now resolves to the catalog ArmCpu (which registers and starts CPUs itself) and catalog ArmDTPlatform (clock-registration hook instead of the boot-epoch sample).", "2026-11-18 publication: both branches are on xNekom's forks (feat/ios27 on UniXNU-mondrian, feat/xnu-12377 on UniXNU-sm8475-common). feeds.toml names the SoC fork and pins 20a30fd, so the xnu-12377 series resolves from a clean checkout; --local-module is no longer needed.", "2026-11-18 F1 kernel: 77 patches applied and the arm64e kernel linked on Linux (MH_EXECUTE ARM64E USR00, NOUNDEFS PIE, minos 27.0, sha256 9349591f793bd4821ff38eb26e65e0eac730c355083dfa66856a69ef256da63a). The prelink waits for the macOS fileset reference; the payload is built and carries the same kernel byte for byte.", "2026-11-18 F1 payload: payload.img (192 MiB FAT) holds EFI/UniXNU/Payloads/kernel.macho with the kernel's sha and a 14,684-byte ADT; the ADT's unique-chip-id is the synthetic MONDRIAN ECID (0x4d4f4e445249414e) the 16.6.1 line used. The image is not bit-reproducible: a rebuild produced 0b465441e4950f1b8b1669f93e1aca850a77e85270e69a14b44b6d6b11e99e with the same kernel because devicetree.py writes a fresh /chosen/random-seed, so the physmap slide changes per payload build.", "2026-11-18 F1 seed: adt.random_seed now pins /chosen/random-seed (256 bytes of 0x11, the reference board table's value repeated to fill the four seeds xnu-12377 reads), through patches/unixnu-core/deterministic-platform-seed.patch. Two payload builds then produce a byte-identical 14,684-byte ADT, and only 21 bytes of the FAT image differ (mtools directory timestamps), so the physmap slide no longer moves between builds; ios-mondrian-traps.md measured about one random slide in three dying in pmap_map_bd.", "2026-11-18 F1 firmware: the EDK II CLANGPDB build of the pinned uefi-mondrian (9b79562, Mu_Basecore 6f805f2 plus the five Resources/MuPatches fixes) completed on Linux with nasm 2.16 and acpica-tools 20230628 into a 3,145,728-byte SILICIUM_UEFI.fd (sha256 9969a6ab28ae95e9ca6811983d5d6084eca2e4bb7ac4e1a620626f468925522c). The volume is not reproducible by design (FIRMWARE-REBUILD.md section 2); whether it finds the payload is a device measurement.", "2026-11-18 F1 boot image: boot/boot.img is 201,887,744 bytes (sha256 badefda4318e5e5614277943484b471c4e782f8919d7c9f9aa844474355ab0d1) with an ANDROID! v4 header (1584 bytes): gzip(112-byte shim + the 3 MiB FD) plus a 4,024-byte appended DTB, and the payload image as the ramdisk. It is byte-for-byte what fastboot boot would send; nothing has run it because there is no board on this host.", "2026-11-18 F2 reference on Linux: the non-LTO fileset reference links once the two LLVM profile-runtime calls XNU's PGO support makes are stubbed (patches/unixnu-core/fileset-reference-linux.patch); cctools ld64 cannot read bitcode and the pinned LLVM 24 has no llvm-link, so --lto stays a macOS job. mach.release.bcm2837.unstripped.noctf is 17,432,216 bytes, sha256 6bbb66dc3de76ab2ef3352d50f3fba1fa63181a07843a745a5b2e34a7327a458.", "2026-11-18 F2 prelink: the 24A446 kernelcache came from Apple's CDN with HTTP range requests (never the 12.3 GB IPSW), and emit_prelink produced a 93,044,736-byte MH_FILESET (sha256 09166aba4bf2706caaed14e6953fec5a2b7dec10c592a7fee77d93cd431a34cd) with 32 entries, closure 38 and 384 unmapped symbols in 28 bundles on the profile's --allow-missing stub. The matcher crashed on a reference symbol outside every section (section_of answers '?'); patches/xnu-prelink/reference-sections.patch compares section names and skips those. mapping_complete and loadable are false until a device run.", "2026-11-18 F2 boot image: boot/boot.img 201,887,744 bytes sha256 17aa7fd959c4ddaa236f09dbe1d7cd1363d77737419aeb90afe75e9aa4ae4cce carries the prelinked fileset in payload.img (sha256 4189bd98e78c9cf859856b51fbf1575b85c0050befaa515db6cfd47619bef32e) and the firmware volume of that build (sha256 a182fdb39edbfb16e87f3f9caa6de51729bd0d7da22e58689212a8075d3ef293). The firmware is rebuilt per run and is not reproducible, so its hash identifies this build only.", "2026-11-18 F3 userdata on Linux: the OS (8,448 MiB) and SystemOS (2,240 MiB) members are AEA archives; ipsw.py now calls `ipsw fw aea` off macOS instead of /usr/bin/aea, and the decrypted raw disks match the profile pins exactly (OS 10,223,616,000 bytes sha256 4b8719fe44a2b80cba9e108ebcec91b6b8a03a3c3ffe353befce3b100f2e6f25, SystemOS 6,023,020,544 bytes sha256 f6d10101770604271c332d27290a48558ceb34f041c4020aae07ee6ca80dbb1b), so the Linux path reproduces the macOS result. userdata-root.img is 16,247,685,120 bytes in a 32 GiB partition (sha256 b6de43820402dc3919f5b9dc08b0fbf5c836d64af23acbcdbc335eeffd64eb43, manifest f3983019...). Nothing flashed: fastboot flash userdata wipes Android data and needs a deliberate decision.", "2026-11-18 F0 partial: the ios-mondrian PAC probe ran on the board and printed ISAR1=0x0010011101211052, ISAR2=0, APA=5 API=0, and then 'RESULT no FEAT_PAuth'. APA=0b0101 is FEAT_PAuth with EPAC and PAuth2, so the hardware does have PAC (Armv9 requires it); API=0 only means the generic keys are absent, which arm64e never uses. The probe's gate required apa && api && gpa && gpi and read GPA/GPI from [15:12]/[19:16] (JSCVT/FCMA) instead of [27:24]/[31:28], so its verdict is a bug, not a measurement. The capture does not contain the key-register or PACIA/AUTIA steps; the probe in ios-mondrian shim/pac.c is fixed and rebuilt, and one boot with the recorded hash is what F0 still needs. The image that produced this capture (iOS 16 shim) had no recorded hash.", "2026-11-19: the staged Bluetooth series builds and prelinks on a Linux runner. GitHub Actions run 44395638974 (head 6f27fbc) applied 96 patches, including 0500, 0502b, 0501, 0502 and 0507-0522, and wrote kernel/kernel.macho (93,077,504 B, sha256 bf737397a915fd659d9c1a89c0addd7263d6a6190f3071d5c9311c544f1d8122) and payload/payload.img (201,326,592 B, sha256 36e0014faade8601d517608ab0d3916c2fccb5cec9cdf1ea911a9292d58eaeb4). The kernel carries the qbt transport strings and the 0520 control alias; no hardware has run it.",
  "2026-11-19 F1 build with the 0523 reclock: the series is twenty Bluetooth patches (0500, 0502b, 0501, 0502, 0507-0512, 0514-0523). GitHub Actions run 44466443708 (head b689f94, 05:37:28Z to 05:52:57Z) built and prelinked it: kernel.macho 93,077,504 bytes sha256 04765d4eb2a1bb6c953ded6009af9733026477e6d4d2255332c76842eccd870b, payload.img 201,326,592 bytes sha256 d571b254de20625c63441764ee3a80ca567ed55808add3aff1aabdf09aa2d7f1, xnu-patches.list 97 entries with 0523 last, and the kernel carries the [bluetooth sk] TIOCSETA log. Textual series validation: qbt_k60.c 65e29a1a, qbt_transport.c 5a80bb03, qbt_transport.h b0cb4d13. No hardware has run it.",
  "2026-11-19 the device-tree node and the third CI run: dts/mondrian.dts carries a root bluetooth node (device_type bluetooth, compatible qcom,wcn6855-bt, unixnu,adt-name bluetooth, transport-encoding 1, transport-speed 3000000). GitHub Actions run 44470953368 (head 5f4c895, 9m12s) built and prelinked it; the payload ADT carries the /arm-io/bluetooth node (bluetooth twice, compatible and transport-speed once). No hardware has run it.",
  "2026-11-19 the iOS 27 userland half built offline: the 24A446 root file system (AEA, decrypted with ipsw fw aea 3.1.749) yields a bluetoothd whose SHA-256 cfd94854d0a2efd3ca4a2de6e55349f43fd0d274a4b8bfa9937f29d9f7208cb1 matches the QcaBluetooth native_ios27 lock, and scripts/build-bluetooth-userspace.py produced signed BlueTool (sha256 aef741399ef23d3283721a708ff78a2ad6d9ea64357229cf2d11564dafe73d9f), re-signed bluetoothd and QcaBTType0.dylib plus 40 firmware files. A Command Line Tools only Mac needed scripts/toolchain/; the payload still does not mount the OS image because payload.runtime is not enabled.",
  "2026-11-19 the CI chain is green from this branch: runs 44491451065 (15m29s) and 44492630013 (27m50s) built the twenty-one-patch series, and 44508963818 (head e837ab4, 14m02s) passed every step including the new \"Check the Bluetooth contract\" step that runs scripts/check-bluetooth-kernel.py over kernel.macho and payload.img. Three earlier runs failed before compiling: 44497671661 for a missing profiles/os/ios-27.0.1-24A446/profile.toml (the install line had been dropped when the CI branch was rebuilt; 38d7404 restores it), and 44508116480 on `curl: (22) ... 404` because the toolchain release asset was still a draft and the CDN lagged after publication (e837ab4 retries the download). .github/workflows/ios27-kernel.yml now lives on feat/bt-ios27-port, so ci/ios27-kernel carries no unique content; .gitignore keeps firmware/bluetooth/qca/*.bin tracked (four NVM files were untracked while the manifest listed 106), and check-bluetooth-dt.py plus check-bluetooth-userspace.py with their tests moved here from the iOS 16 line. This branch is the kernel and the device tree only: [payload.runtime] is not enabled and 0521 is a blob stub, so the iOS 27 baseline is not a working Bluetooth stack.",
  "2026-11-19 marconi-trace 反汇编 20G81 bluetoothd：`marconi-bt` 与 `bluetooth` 是同一个 helper 的两次 IOServiceNameMatching（{IONameMatch}）调用，各读一次 IODeviceTree 递归的 local-mac-address；第一条失败才打印 Unable to match / all 00s 两句，第二条在 0509/0524 发布的 bluetooth 节点上成功并 setenv BT_DEVICE_ADDRESS ⇒ MAC 已有来源，补 marconi-bt 别名只消一条日志、不改行为，故不做。", "2026-11-19 runtime mount: 0526 adds native_bt_runtime_prepare(), which under the boot argument k60bt-runtime=1 installs the GPU addon carrier and mounts /private/var/ngpu/bluetooth-lib over /usr/lib and /private/var/ngpu/bluetooth-bin over /usr/sbin; it is inert without the argument and was text-verified on the 12068a8 tree (kern_exec.c 5da7db94). docs/engineering/IOS27.md now states the two series are separate (227 entries vs 24, xnu-8796 vs 12377, both 4 KiB but by different means) and that the ios27 defconfig is stage-0: it stops at bsd_init.",
  "2026-11-19 the official page step 6 platform check exists for K60: `scripts/check-bluetooth-geni.py` extracts qbt_geni.c, qbt_geni.h and qbt_geni_regs.h from 0500 and builds them against `scripts/tests/fixtures/bt-geni-model.c` under ASan/UBSan. Eight scenarios, 64 assertions, 36 registers, hardware_verified always false; the CI job runs it next to the contract step.", "2026-11-19: `scripts/check-bluetooth-gic.py` covers the second step-6 check, the shared interrupt controller: it splices the two SPI blocks of `drivers/ArmCpu/ArmCpu.cpp` into a GICD model, runs 43 assertions and 16 register writes (619 cold attach, duplicate owner refused without taking a slot, four-slot exhaustion, eight-thread single-flight) and keeps `hardware_verified` false. The CI job runs it after the GENI step; `scripts/tests/test-bt-gic-shared.py` has 20 cases and the checker accepts both `drivers/ArmCpu` and `drivers/armcpu-darwin24`.",
  "2026-11-19: `scripts/check-bluetooth-power.py` covers the third step-6 check. K60 has no shared WCN object, so it asserts the order of the porting page instead: seventeen power-on and seven power-off steps, 587/208 with the +32 INTID, 100/60/100/100 ms delays, no rpmh/spmi/pmic token in either body, and a cold boot that logs instead of refusing. Both trees pass 22 checks; 18 host cases; CI runs it against the tree the build just patched.", "2026-11-19: 0527 completes the runtime mount with the launchd cache. native_bt_runtime_prepare() now also mounts /private/var/ngpu/xpc over /System/Library/xpc after the executables overlay succeeds, because that is the file the framework rewrites with merge_launchd_cache() (BlueTool to root) and signs with sign_launchd_cache(); without it xpcproxy keeps starting BlueTool as mobile, which is what the bt-0525 console shows. Both 0526 and 0527 sit inside #if defined(XNU_OWNER_DATA_MOUNT) in bsd/kern/kern_exec.c, and configs/mondrian_ios27_defconfig does not set CONFIG_XNU_OWNER_DATA_MOUNT, so on this branch the mounts are compiled out: the run 44518998961 kernel carries none of bluetooth-lib, bluetooth-bin or [bluetooth-runtime], and check-bluetooth-kernel.py --expect-runtime fails against it by design. That flag is for the F3 build, the first one with Data mounted. The 16.6.1 line is the one with CONFIG_XNU_OWNER_DATA_MOUNT=y (configs/mondrian_defconfig:43) and it does not carry 0526/0527.", "2026-11-19: scripts/check-bluetooth-runtime-gate.py makes the Data mount boundary a test instead of a comment: the gate may stay closed without 0526/0527, but it may never open without them, so flipping CONFIG_XNU_OWNER_DATA_MOUNT=y in configs/mondrian_ios27_defconfig cannot land silently. It also reads a patched tree and asserts native_bt_runtime_prepare sits inside the #if, with 13 host cases; the CI job runs it after the power ladder.", "2026-11-19: scripts/check-bluetooth-addon-prefixes.py closes the other half of the addon join: the stager reports bluetooth-bin and bluetooth-lib, the framework packs xpc, and 0526/0527 mount those three names below /private/var/ngpu. A rename on one side alone would leave an empty overlay that no build can see, so the checker reads the patches and both builders and fails on a mount no builder packs; a missing framework checkout is reported as a skip, not a failure. Nine host cases.",
    "The launchd cache is checked before it is mounted. `scripts/check-bluetooth-launchd.py` reads the userspace stager report and asserts `com.apple.BlueTool` becomes `root` with `EnablePressuredExit` false and only the four fields `merge_launchd_cache()` accepts; with `--cache` and a framework checkout it re-runs the real merge on the OS `launchd.plist` and asserts one job changed, that its `Label`, `ProgramArguments` and `MachServices` survived, and that no neighbouring job moved. The stock 24A446 job is `mobile` with pressured exit on, which is why BlueTool answers `EPERM` and waits. Ten cases in `scripts/tests/test-bt-launchd-cache.py`; the build runs the suite as `Check the launchd job overrides`.",
  "2026-11-19: the stock BlueTool trace in section 6.3 corrects the bt-0525 reading. `-R` never opens a transport: it is `xpc_connection_create_mach_service` plus a run loop. The `Device not open yet` line is printed from the XPC `RunBuiltinScript` path at `0x100018be0`, guarded by the transport-open flag, and a transport opens only through the `device` command, which is a `PF_SYSTEM` socket to the `com.apple.uart.bluetooth` kernel control. The adapter answers the same mach service without that transport, which is the design, not a defect; whether bluetoothd needs HCI passthrough is open until the Data mount gate closes.",
  "2026-11-19: the bluetoothd trace in section 6.4 closes the loop. bluetoothd is a client of `com.apple.BlueTool` (constructor `0x100401b64`), sends only `RunBuiltinScript` with script/btaddress and `RunCommand` with command, and reads only result, firmware, manufacturer and output, so the adapter is sufficient for that stage. HCI is bluetoothd's own: it probes /dev/cu.bluetooth, /dev/uart.bluetooth, the marconi-bt and bluetooth IOServices, the Apple* nodes, and `os_channel_create(\"com.apple.uart.sk.bluetooth\")`. qbt_transport.c already registers that control (line 565) and the nexus provider (line 372) plus the 0520 alias (line 577), so the kernel is the transport and no HCI needs to pass through BlueTool.",
    "Enabling [payload.runtime] needs a macOS payload host: runtime.py sets request[os_image] whenever bluetooth_tool exists, and build-boot-runtime.py mounts it through hdiutil (os_mount(), lines 38 and 50-54) then checks every staged executable with verified_cdhash(), which needs codesign --display to print a CDHash (line 96). The Linux CI installs UniXNU/scripts/linux/codesign, which deliberately does nothing, so bundle_cdhash() would fail with no CDHash instead of emitting an unsigned addon; the plutil shim is real, so only the launchd merge half would work. F3 therefore runs on macOS, or the framework grows a Linux CDHash path.",
    "scripts/check-bluetooth-payload-host.py reports whether a host can build the [payload.runtime] addon: the board block and its bluetooth_tool, the framework mounting through hdiutil and reading a CDHash, and the host having both tools with codesign printing CDHash=. On WSL the block is absent, the framework is correct and the host is unable (no hdiutil, the codesign shim prints no CDHash); the checker exits 0 as a report and --require/--require-runtime gate a real payload host. 12 tests."
  ]
completion = ["The arm64e kernel reaches bsd_init on the board, the OS volume mounts, and SpringBoard draws and accepts a tap."]
limits = ["F0 is half measured: FEAT_PAuth is present (ISAR1 APA=0b0101) but the key-register write and the PACIA/AUTIA round trip have not run; no capture from this branch's build exists yet.", "F1 is complete on this host; F2 has a prelinked fileset but mapping_complete=False (384 symbols on the --allow-missing stub) and loadable=False until a device run.", "The reference is non-LTO: a reference rebuilt with Xcode 26 would model the original function order better and could recover some of the 384 unmatched symbols.", "F3's userdata image exists but the storage driver has not been ported: the stage-0 kernel still boots with storage off, so nothing on the board can mount those volumes yet."]
next_action = ["Boot the rebuilt PAC probe (ios-mondrian shim/out/shim-boot.img) and read the key-register and PACIA/AUTIA lines; that closes F0.", "Then fastboot boot the F2 image with the CDC-ACM capture attached.", "Port PongUfs to the 27 storage ABI and turn storage back on in the stage-0 defconfig; the userdata image is ready to flash once that works.", "Rebuild the LTO reference with Xcode 26 if the 384 unmapped symbols turn out to matter."]
evidence = [{ kind = "source", reference = "profiles/os/ios-27.0.1-24A446/profile.toml", result = "arm64e, page_size 4096, xnu 12377.121.6, iPhone17,2 IPSW pins and prelink fixture" }, { kind = "host", reference = "scripts/check-ios27-granules.sh", command = "sh scripts/check-ios27-granules.sh ../UniXNU/out/mondrian/ios-27.0.1-24A446/mondrian_ios27/tree", revision = "ac9718fb1af618d5ce8678d0dc6e8a58f252216f", result = "granules: 4 KiB BCM2837, TCR_EL1_BOOT=0x00000022a5192519, ARM_PGBYTES=4096. TG0 = 0 and TG1 = 2, ARM_PGSHIFT = 12 against the pinned xnu-12377 tree. The framework check-xnu-granules.py stops earlier on this XNU because 12377 guards board_config.h with KERNEL_PRIVATE and proc_reg.h needs a CPU geometry (VMAPPLE); this script adds both defines and asserts the same constants." }, { kind = "host", reference = "docs/engineering/IOS27.md", command = "python3 ./unixnu build kernel --dry-run -D ../UniXNU-mondrian-ios27", revision = "b79adcbf881fae3c952206fdd53132ad99e9355a", result = "== kernel preflight: 3 selected components - archive inputs present. With the device copies archived, the tree resolves the catalog ArmCpu (5f370269, ships ArmCpuSleep.h) and the framework's ArmDTPlatform (e8bd8d5), so the missing-input error is gone. The sm8475 feed now resolves its xnu-12377 series from the pinned xNekom fork without --local-module. The build then stops only at the absent Linux clang of /opt/unixnu-linux, which is the next input to install." }, { kind = "host", reference = "docs/engineering/IOS27.md", command = "HOME=/home/pedrojuuu UNIXNU_OUT=/home/pedrojuuu/ios27-out python3 ./unixnu build kernel --device ../UniXNU-mondrian-ios27 -j 12 --skip-prelink", revision = "6079c6776f3179fa8c532f0cfeaaf3d66199ed75", result = "kernel/kernel.macho: MH_EXECUTE ARM64E USR00, flags NOUNDEFS PIE, LC_BUILD_VERSION platform 2 (iOS) minos 27.0 sdk 27.0, 23684560 bytes, sha256 9349591f793bd4821ff38eb26e65e0eac730c355083dfa66856a69ef256da63a. 77 patches applied; corecrypto (both