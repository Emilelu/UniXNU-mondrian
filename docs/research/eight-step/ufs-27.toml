name = "存储、根卷与持久 Data（UFS 3.1 / NativeUfs / RamBlock / VerifiedRoot）"
status = "active"
paths = ["drivers/NativeUfs/", "drivers/NativeRamBlock/", "configs/mondrian_ios27_defconfig", "board.toml", "scripts/build-xnu-generic.sh", "scripts/build-native-ufs-linux.py", "docs/research/storage/"]
why = 'The Data gate is five independent stages, and four of them fail on this branch (docs/research/storage/UFS27-GATE.md §1). Selection: board.toml:361 includes "NativeUfs", which is the legacy_name of ShengUfs (UniXNU/components.toml:121, :139); components.selected() (UniXNU/scripts/unixnu/components.py:22-45) accepts a legacy name only when a module for that component exists, and feeds.toml declares only the sm8475 Soc source, so the profile aborts with "unknown component: NativeUfs" before any recipe runs. Production: board.toml:384 has no storage recipe, so build/native-ufs/libNativeUfs.a is never written, while scripts/build-xnu-generic.sh:646-653 already force-loads exactly that path (the 16.6.1 builder does the same at scripts/build-xnu-4k-baseline.sh:1054 and :1278). Switch: configs/mondrian_ios27_defconfig:21 is CONFIG_XNU_NATIVE_UFS=y against that missing producer. Bind: the iokit/KernelConfigTables.cpp of xnu-12377.121.6 has no ufshc personality, and the 16.6.1 patch for it (patches/xnu/ios16-native-ufs-personality.patch) is in no 27 series layer — the builder injects -DXNU_NATIVE_UFS=1 (scripts/build-xnu-generic.sh:228-232) into a file that ignores it. Only the link path is correct. Neither a 27 root mount nor a mounted Data volume has been observed on this board.'
label = "UFS 3.1（SM8475 UFSHC 0x01d84000/0x3000、PHY 0x01d80000/0x2000、GCC 0x00100000、apps-SMMU stream 0x60）＋ 32 GiB Data 窗"

