- P5 + P2（一次固件构建、一次上电）：FillScreen 与 ExitBootServices 之间插 gBS->Stall(5*1000*1000)，相机对面板 + 暗室检查；同时读出 DARWINBOOT: video base=0x… display=… row=… width=… height=… depth=… 一行，与 ABL splash 地址及菜单 GOP 模式逐项比对。依据：③ 面板 1440x3200 cmd mode + DSC（ANDROID-HW-TRUTH.md）、④ rothko CMD 面板先例（每帧需主动推送）。
- P3（一次固件构建、一行改动）：把 FillScreen 内联 dc 循环换成已有的 FlushRange(Video[0], Video[2]*Video[4])。依据：③ DarwinBoot.c:93-113 FlushRange（读 CTR_EL0、对齐、前后 dsb sy）对 FillScreen 硬编码 64 B 步长。
- P4（一次固件构建、一行改动）：填充常量 0x00FF0000 改为 0xFFFF0000。依据：③ DiagDrawVideo 只用最高字节 0xFF 的常量（0xFF000000、0xFFFFFFFF），红填充是唯一最高字节 0x00 的写入者。
- P7（一次上电，打印内存图描述符）：填充前把覆盖 Video[0] 的内存图描述符（类型 + 属性）打印进 video base= 行；EfiConventionalMemory 则 EBS 后黑成立，保留/EfiMemoryMappedIO 则排除。依据：③ MemoryMapLib.c 未读到 FB 描述符类型、dts/mondrian.dts 无显示保留区。
