# What keeps a structurally valid iOS 27 image from being flyable.
#
# `scripts/check-ios27-artifacts.py --flight-ready` reads this file and refuses
# while any entry is `state = "open"`. Closing one means editing it to
# `closed = "<the evidence that closed it>"` in the same change that removes the
# defect, so the reason it was open is still readable afterwards.
#
# A structural pass is not a flight gate: `boot.img` can be byte-exact, the ADT
# pinned and the payload the declared transform of the kernel, and the image
# still cannot boot. These are the specific reasons, not a general caution.

[[blocker]]
id = "loader-rejects-fileset"
what = "our collection fails the loader's member rule: the com.apple.kernel child carries cpusubtype 0x80000002 while the collection and the other 31 children carry 0xc0000002"
state = "closed"
closed = "stamped 2026-11-20 and rebuilt: scripts/k60-fileset-stamp.py rewrote the com.apple.kernel child cpusubtype at file offset 0x180008 (0x80000002 -> 0xc0000002), the vendored loader gained the catalog fileset path (see firmware-fileset-provider), and the rebuilt payload kernel sha256 is 1c476e88915a. `check-ios27-artifacts.py --flight-ready` now prints 'ok loader: 32 entries, collection cpusubtype 0xc0000002, 0 loader violation(s)' where round-17d printed one violation. The ABI question this blocker waited on came back as E:/iOS Port/Work/scratch/reply-abi-subtype-20261120.md: 0x40000000 is LLVM's CPU_SUBTYPE_ARM64E_KERNEL_PTRAUTH_ABI_MASK (MachO.h:1781-1814), no XNU source reads it (the only ptrauth-subtype readers are user-exec scoring in bsd/dev/arm/kern_machdep.c:50,56 and bsd/kern/kern_exec.c:1019), and the loader compares the field bit-for-bit against the collection -- so relabelling the child to the collection's own value restores Apple's child == outer invariant instead of inventing a value"
evidence = "measured 2026-11-20 with E:/iOS Port/Work/scratch/measure_loader_member_rule.py: Apple's 24A446 collection has 305 entries and every child header equals the outer subtype 0xc0000002, its com.apple.kernel being MH_EXECUTE at flags 0x80200001; ours has 32 entries, 31 equal and com.apple.kernel at 0x80000002. `check-ios27-artifacts.py` prints the same line for the round-17d output: 'com.apple.kernel: cpusubtype 0x80000002 does not equal the collection 0xc0000002'"
source = "E:/iOS Port/Sources/Repos/UniXNU/UniXNU/drivers/DarwinBoot/DarwinBootPkg/Driver/DarwinBoot.c at the catalog pin 3c75734 (the member rule), and kits/XnuPrelink/fileset_emit.py's patch_entry_header (the emitter that should satisfy it)"
why_open = "the loader is not the defect: its three member conditions (MH_EXECUTE, cpusubtype equal to the collection, MH_DYLIB_IN_CACHE) are exactly what Apple's own collection satisfies, so relaxing the guard would paper over a header we emit wrongly. fileset_emit.py already ORs MH_DYLIB_IN_CACHE into the child flags but never rewrites the child cpusubtype, which is the one field that differs. Two candidate repairs, and only one of them is honest: (i) stamp the child to the collection's subtype and rebuild -- correct only if the high byte of cpusubtype is a label we are entitled to set, because it names a pointer-authentication ABI version; (ii) link our kernel so it really is that ABI. Deciding which is which needs the meaning of the 0x80 and 0xc0 bytes on the record, not an assumption that a label is free. Closing this needs that answer, then the chosen change, then a rebuilt payload whose collection check prints zero violations -- never a loader patch"
decision = "closed 2026-11-20: the evidence landed in reply-abi-subtype-20261120.md, and the repair it named -- stamp the child to the collection's own subtype -- is what was applied. The loader guard was never touched"

[[blocker]]
id = "prelink-map-unresolved"
what = "the prelink map still has owner-target references with no address and sites redirected to the panic stub"
state = "open"
observe_via = """two readings, one offline and one from a flight. Offline: `UNIXNU_OUT=... python3 scripts/check-ios27-artifacts.py --flight-ready` prints the two totals (currently 94 unresolved owner-target items in 21 bundles and 203 items redirected to the panic stub in 25 bundles); the number is the observation, so a change that moves it must move it in the same commit. In flight: the stubbed call sites panic through _unixnu_fileset_unmapped, which prints the original component and the return address of the call that was not mapped, so a boot either names the sites or does not reach them; pong-ramoops: console attached at 0x... says the console hook itself ran, which is what makes the absence of a stub line mean something"""
evidence = """build 20, 2026-11-21: kernel.macho sha256 652237c6bf54, 32 fileset entries, 0 loader violations, boot.img 5c060f27. Sixteen reviewed data pairings were folded into kernel.map.json (scripts/k60-fileset-pair.py, each target re-verified with llvm-nm-18 on the native kernel), which moved the unpinned data addresses from 94 in 21 bundles to 3 in 3 bundles. check-prelink-hazards: 3 unpinned, all covered by a segment, 0 outside every segment."""
why_open = """205 pointer slots, not 205 calls, and none of them is reachable before the console.
`osfmk/kern/startup.c` brings the console up at :582 and the code-signing window at :627; the first
kext start is `PE_init_iokit()` at :802 inside `kernel_bootstrap_thread()`. No kext code runs before
:802, and every one of the 205 slots lives in a kext `__DATA_CONST`/`__const` pointer table, so the
'reachable before the console' class is empty by structure rather than by inspection (179
`__auth_got` slots plus 26 `__const` entries, owned by 25 bundles, dispatching into 131
com.apple.kernel function starts). What remains is a functional gap ordered after the console: 41
AMFI slots (the first launchd exec), 20 apfs slots (root volume mount), 23 sandbox slots (every task
launch), 6 AppleARMWatchdogTimer slots (armed before root mount), 5 IOStorageFamily slots (nothing
mounts below them), plus a 24-item display group. 13 of them become reachable from
`code_signing_init()` at :627, which is after console subsystem init but before the USB CDC-ACM
console K60 gives a human, so a trap in that group is silent: implement those first. 84 of the 205
sit in 10 bundles the upstream iPad17,3 baseline also carries and can be booked as a recorded
baseline; the other 121 sit in 15 bundles only this tree carries (AMFI, sandbox, apfs, IOAVFamily and
friends), and those are not fixable by a defconfig key: all 134 unique targets are owned by
com.apple.kernel, the bundles merely reference them (docs/research/ios27/DEFCONFIG-DELTA.md).
`native_original_branches` is empty because `relocate_original_stubs()`
(`fileset_layout.py:255-283`) records a branch only for a uniquely paired symbol ending `.original`
shaped `bti c; b`; this kernel exports none, so an empty list is the measurement and not a missing
flag. Closing this blocker means implementing or excluding those kexts, not clearing a counter;
`check-prelink-regressions.py` guards the numbers meanwhile. Evidence:
docs/research/ios27/PRELINK-RESIDUE.md. Address pairing is now closed as a route: neither the segment ranges nor a constant __TEXT_EXEC delta map Apple addresses onto our symbols (1 of 131 lands on an exact function start), and the cache keeps no names. The three addresses that stay unpinned are recorded in IOS27-PRELINK-ALLOWLIST.toml with their mechanism instead of a name, so check-prelink-hazards.py is green. What remains is runtime: the stub panics with __builtin_return_address(0), so one boot converts each unknown address into a logged call site."""


decision = "open: the 95 data items keep a stale original address and are not stubbed"
[[blocker]]
id = "firmware-fileset-provider"
what = "the loader compiled into the firmware volume has no MH_FILESET path at all: [firmware].packages puts {uefi}/Platforms/Xiaomi before anything else, and that tree's DarwinBoot.c rejects any header whose cpusubtype is not 0 or whose filetype is not 2, before it would ever look at a child"
state = "closed"
closed = "the selected source now carries the fileset path: E:/iOS Port/Sources/Repos/UEFI/uefi-mondrian commit 39fa61c (branch feat/fileset-loader) ported the catalog pin's ParseKernelHeader plus the LC_FILESET_ENTRY walk into Platforms/Xiaomi/DarwinBootPkg/Driver/DarwinBoot.c (43,713 -> 47,379 bytes), and `scripts/check-ios27-firmware.py --board .` now prints 'ok firmware: ... /Platforms/Xiaomi/DarwinBootPkg/Driver/DarwinBoot.c branches on filetype 12 / LC_FILESET_ENTRY'. The rebuilt PE is 55,296 bytes, sha256 52b064d61002e1c5e53549c9e91f0227f2dd81eb4ce668cc995942979fa94380 (round-17d: 54,784 bytes, cb175e4d...), and it stayed byte-identical across two rebuilds whose volumes differ (d56ea4c9..., 8f25b1a0...) -- that is P-216's build-id non-determinism in the other packages, and it is how this evidence distinguishes 'the loader changed' from 'the volume changed'. The image this closed against is boot.img sha256 e3d651ed8123306e832c5596aee3ba853b77384e8b8452ff8074a57f448d46e6, whose embedded volume is 8f25b1a0150d"
evidence = "the round-17d build compiled /mnt/e/iOS Port/Sources/Repos/UEFI/uefi-mondrian/Platforms/Xiaomi/DarwinBootPkg/Driver/DarwinBoot.c (firmware.log:1154) and sealed it into FFS GUID D6112048-454F-4629-870F-7FCA045E4422 (firmware.log:1250, GenSec). That source is 43713 bytes, sha256 d95fe4031e4c4d3c5e7c9c8dea0e1fceeddc6a4c74fbfd7e5e4f0d0a3f2b1a54, and its guard reads: if ((Size < 32) || (U32 (Data) != 0xfeedfacf) || (U32 (Data + 4) != 0x100000c) || (U32 (Data + 8) != 0) || (U32 (Data + 12) != 2)) return EFI_UNSUPPORTED; -- subtype must be exactly 0 and filetype exactly 2. The PE inside the shipped volume is 54784 bytes, sha256 cb175e4d15b5305360bd16578695811a0d0fa7d90c3811b730b19e1d9937e370, byte-identical to AARCH64/DarwinBoot.efi (see E:/iOS Port/Work/scratch/f1-readonly-audit-report-20261120.md:29-77), so this is what the device would run, not a source-tree guess"
source = "E:/iOS Port/Sources/Hardware/k60-gates/board.toml (the [firmware].packages order) and E:/iOS Port/Sources/Repos/UEFI/uefi-mondrian/Platforms/Xiaomi/DarwinBootPkg/Driver/DarwinBoot.c"
why_open = "this is a second, independent reason the image cannot boot, and it survives fixing the header: even a collection whose every child matches the outer subtype is refused by this loader because its first test is on the collection header itself. Two ways to close it, and they are not equivalent: (i) stage the catalog driver (components.toml pins id DarwinBoot revision 3c75734, path drivers/DarwinBoot, scope firmware) into the 27 firmware packages ahead of {uefi}/Platforms/Xiaomi -- that pin does read MH_FILESET, and it is what sheng ships, so it is the intended path; (ii) add a fileset path to the vendored copy, which forks a loader we would then own forever. Either way the proof is the same: the gate re-reads the source that the DSC/FDF actually select, finds a fileset branch in it, and the rebuilt volume's PE hash changes away from cb175e4d"

[[blocker]]
id = "boot-args-abi-608"
what = "the firmware writes a Darwin-22 boot_args struct (CommandLine[608], sizeof 0x2e0) while the 27 kernel reads the Darwin-23 layout (BOOT_LINE_LENGTH 1024, bootFlags at 0x470, memSizeActual at 0x478)"
state = "closed"
observe_via = "offline: `python3 scripts/check-bootargs-abi.py --header Platforms/Xiaomi/DarwinBootPkg/Driver/BootArgs.h --boot-h <xnu>/pexpert/pexpert/arm64/boot.h` compares the command-line capacity, BootFlags offset, MemorySizeActual offset and struct size against the layout the kernel was compiled for (today it prints four FAIL lines); the header can also be compared with `E:/iOS Port/Sources/Repos/UniXNU/UniXNU/drivers/DarwinBoot/DarwinBootPkg/Driver/BootArgs.h`. In flight: `pong-ramoops: console attached` plus a `boot-args` dump of the 8 arguments would show whether the kernel read the CommandLine the firmware wrote"
evidence = "platform header: DARWIN_BOOT_LINE_LENGTH 608, CommandLine[608], STATIC_ASSERT BootFlags == 0x2d0, MemorySizeActual == 0x2d8, sizeof == 0x2e0. Catalog (Darwin 23) header: CommandLine[1024], MemorySizeActual == 0x478, sizeof == 0x480. 27 kernel pexpert/pexpert/arm64/boot.h: BOOT_LINE_LENGTH 1024, bootFlags 0x470, memSizeActual 0x478. The platform writer at DarwinBoot.c:1099-1110 sets MemorySizeActual and Revision/Version, and ArgsAddress is 16 KiB-aligned with TreeAddress one page later, so growing the struct to 0x480 cannot overlap the device tree"
why_open = "it is a real ABI defect but not the freeze: osfmk/arm64/arm_vm_init.c:1843 and osfmk/arm64/sptm/arm_init_sptm.c:1803 both fall back with `args->memSizeActual ? args->memSizeActual : mem_size`, osfmk/arm/machine_routines_common.c:1254 falls back to BootArgs->memSize, and bsd/kern/bsd_init.c:1234-1238 reads bootFlags for darkboot only, so a zeroed field at 0x470 is benign. Closing it means adopting the catalog's Darwin 23 BootArgs.h in the platform tree (sheng ships the catalog DarwinBoot component for exactly this) and rebuilding the firmware volume"
closed = "2026-11-24: Platforms/Xiaomi/DarwinBootPkg/Driver/BootArgs.h now declares CommandLine[1024], BootFlags 0x470, MemorySizeActual 0x478 and sizeof 0x480; check-bootargs-abi.py prints BOOTARGS OK against the built 27 kernel's pexpert/pexpert/arm64/boot.h."
decision = "closed: uefi-mondrian commit 8d46bc3 changed the header; the FD must be rebuilt once so the new struct is what the loader writes."


