evidence = '''三件事都有结论，细节与逐行表在 docs/research/ios27/PLATFORM-BUDGETS.md：
(a) ml_io_map 预算：12377 的 ../xnu-12377/osfmk/arm/io_map.c 里没有 IO_MAP_SIZE / io_submap，io_map() 每次 kmem_alloc(kernel_map, …)（:112，KMA_IO|KMA_PERMANENT），16 系列 0621 的 8→32 MiB 子图在 27 上不存在也不需要；顺带实测出旧门禁 check-io-map-budget.py 在 27 树上是假绿（打印 from default 8388608 后仍打 ✅）。27 stage-0 的实际映射只有 BT 补丁五个窗口（patches/xnu-12377/0500-k60-bt-qbt-new-files.patch:1017-1021，GCC 0x1F4200 + UART 0x4000 + QUP 0x2000 + TLMM 0x100000 + GIC 0x10000 = 3,187,200 B ≈ 3.04 MiB）；XNU 自身三处调用（../xnu-12377/osfmk/arm64/machine_routines.c:1371-1385、cpu.c:1310、cpu.c:289）全由 ADT 属性驱动，本板 ADT 不提供 → 0 字节。窗口表已落成可机读形态 docs/research/ios27/io-map-budget-27.toml（15 行 [[window]]，其中 8 行 in_27_build，合计与 [limits] 的 3,187,200 B / 0x30A200 / 4 KiB 页对齐 3,190,784 / 16 KiB 页对齐 3,211,264 一致，用 tomllib 复算通过）；门禁的形状按 Lead m01381 ① 走「计数模式」而不是对 27 豁免，提案与六条验收读数在 docs/research/ios27/IO-MAP-COUNT-MODE-PROPOSAL.md（gates 仓只读，落地由 Lead 做）。
(b) T0SZ：27 构建上条件成立——构建基线 ../UniXNU/out/mondrian/ios-27.0.1-24A446/mondrian_ios27/tree/.cache/xnu-work/pexpert/pexpert/arm64/board_config.h:307-315 引入 BCM2837.h（:11 #define BCM2837）、编译参数 -D ARM64_BOARD_CONFIG_BCM2837 与 -arch arm64e、4 KiB 页无 __ARM_16K_PG__，故 T0SZ_USER=17（47 位用户 VA）。逐 hunk（对 pristine ../xnu-12377）：proc_reg.h 3/3、pmap_pt_geometry.h 1/1、pmap.c 9/10、arm_init.c 1/1、start.s 1/1、sleh.c 2/3、arm_vm_init.c 0/1（对构建基线 1/1）；失败项里 pmap.c 那一个是 native_pmap_user_mappings（GPU 线的 BO 视图，已单独出草案 docs/research/ios27/PMAP-USER-MAPPINGS-PROPOSAL.md，该文首行即决议：不进 series——全仓无调用者（../UniXNU-sheng/patches/xnu-12377/zzzz-sheng-ipados27-bringup.patch:988/:990 是仅有的两行），sleh.c 那个是纯注释，arm_vm_init.c 依赖构建基线多出的 #endif。
(c) SIGP：已原样搬入 device series 的 patches/xnu-12377/0542-k60-sigp-recover.patch（cpu_common.c 三个 hunk + cpu.c 两个 hunk + assert 守卫合并成一条，+37/−2，对 pristine 通过）。它修的是「SMP 下 UFS 根起不来」：副核在 cpu_idle 被投递 SIGP 后 cpu_signal 里的 SIGPdisabled 位残留，后续投递被判为已投递而丢失，唤醒丢失表现为调度停摆/UFS 根挂不上；sheng_sigp_recover() 在重试环里清位并计数。已按 Lead 裁决标注为「给后续 SMP 备的，不是本轮的修复」。F1 的核数已定案：**cpus = 1**，真值是 scripts/make-pong-adt.py:74 的 --cpus 默认 1；设备仓 board.toml:210 的 cpus = 8 是 iOS 16 残留，由 Lead 改（口径冲突归他）。所以 stage-0 是单核、一次 processor_start 都没有，0542 这条路径本轮不会被走到；0543（cpu_start 回写 ResetHandlerData/const_boot_args/cpu_ttep）现在**不写**，等 F1 通过后按 8 核重评再进 series。硬件 dts/mondrian.dts 本来也没有 cpu@ 节点（计数 0），ADT 由生成器给出；XNU 侧 cpus= 还会在 ../xnu-12377/osfmk/arm64/machine_routines.c:1154 再砍一次拓扑，产物出来后用镜像 pong-boot-manifest.json 的 boot_args 里 cpus= 与 ADT /cpus 子节点数对账（详见 docs/research/ios27/SMP-STEP-DECODE.md §6）。sheng 另外四个 cpu.c hunk（idle WFE 调参、T6000 守卫、HAS_16BIT_ASID 的 bzero、cpu_start 回写 ResetHandlerData/const_boot_args/cpu_ttep）不属于 SIGP，没有搬；最后那个在真开 SMP 时要单独进 series。
