status = "active"
why = "iOS 27 线只做离线契约：27 的显示后端、亮度服务与 boot-arg 预算按官方 porting/display 逐节核对，证据落 docs/research/display/DISPLAY-27-DELTA.md 与 DISPLAY-27-INTEGRATION.md。16.6.1 线已交付形态 A（k60_backlight_control=0 + 真 conformance 查询），27 线的差异从这一形态出发，不重新发明。"
revisit = "27 stage-0 进入 SpringBoard 后按线恢复；若 SpringBoard 的首帧等待链落在本线（IOMFBServer/CoreBrightness），提前恢复。"
