[hardware.os_services.step.decompile]
done = true
evidence = '''两半都做了：机制取证（内核侧）与产物取证（本板构建）。
1) 桩的行为：E:/hackios/UniXNU/patches/xnu-12377/fileset-unmapped-call.patch:13-19 新增 __attribute__((noinline, noreturn, used)) unixnu_fileset_unmapped(uint64_t,uint64_t)，panic 串带 __builtin_ptrauth_strip(__builtin_return_address(0),0) 与 x0/x1 ⇒ 桩被调用即停机并打印原始调用点。
2) 触发路径（逐行，SN = 16:16 内核的源码快照）：SN/osfmk/kern/startup.c:806 PE_init_iokit() → :822 initialize_screen(NULL, kPEAcquireScreen) → :835-836 kernel_bootstrap_log("mac_policy_initmach") / mac_policy_initmach() → SN/security/mac_base.c:365-381（调 load_security_extensions_function() 后把 mac_late 置 1）→ SN/libsa/bootstrap.cpp:505 KLDBootstrap::loadSecurityExtensions()（com.apple.* 且 AppleSecurityExtension 为真者 loadKextWithIdentifier）→ SN/libkern/c++/OSKext.cpp:8497-8551（startfunc 成功后校验 mac_late==false / isPrelinked / AppleSecurityExtension / 目标在该 kext 的 RX 段内，再 blr x16，x16=0xfffffff00921000c）→ AMFI initializeAppleMobileFileIntegrity 解引用 13 个 __auth_got 槽 → 桩 → panic。窗口是 [PE_init_iokit() :806, bsd_init() :926)。
3) 修正审计的一句话：unreachable.toml 每行 reason 写「kernel 从 code_signing_init()（:526）进入该闭包」不成立 —— SN/bsd/kern/code_signing/xnu.c:56-61 的 code_signing_init() 在 !CODE_SIGNING_MONITOR 分支里只有一句 lck_mtx_init，不启动任何 kext。优先级论证改挂在 mac_policy_initmach()（:836）上。
4) 产物：16:16 的 kernel/kernel.macho（93,061,120 B）里 llvm-nm-18 -m 给出 fffffff00b4687b4 (__TEXT_EXEC,__text) external _unixnu_fileset_unmapped，strings 里 panic 串恰好 1 份；kernel.json 的 early_security_init = {AMFI: 0xfffffff00921000c}、collection_slide 0x0、mapping_complete False、stubbed 203 项/25 bundle、missing 3 项/3 bundle。
5) 13 项的静态身份：三个目标都不在 kernel.map.json 的 16,899 个已匹配函数里。0xfffffff00b4320d8（28 B）与 0xfffffff00b432308（664 B）在最后一个已匹配原始函数 _get_arm_cpu_version（0xfffffff00b431f70，native 0xfffffff007542bb0）之上 +0x168 / +0x398，其后无任何匹配函数；0xfffffff00b11a998（240 B）夹在 _code_signing_deallocate（0xfffffff00b11a890，+0x108）与 _disable_code_signing_feature（0xfffffff00b11aa88，−0xf0）之间。逐槽清单见 docs/research/ios27/osservices-27-silent13.toml。
6) A 段两个输入已于 2026-11-24 补测（§A.5，详见 docs/research/ios27/aes-aks-27-abi.md）：24A446 kernelcache（sha256 fa07057b…，与 profile 的 kernelcache_sha256 相同）里 IOAESAccelerator size 0x120 / vtable 181 槽 / 尾槽 0x548–0x5a0，与 OriginalAESABI.h 的 1+12 布局逐槽对齐；AppleSEPKeyStore 的 169 项跳转表（0xfffffff0095d8f10）解出 126 个 handler，AppleKeyStoreState 的 15 个 selector 里 14 个有入口、102（0x66）被拒。仍未测：方法签名与 PAC 判别器、IOAESIV/IOAESKeyData 布局（纯数据，无元数据可读，记 inferred）。'''
recorded_at = "2026-11-21T17:05:00"

