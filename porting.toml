evidence = [{ kind = "device", reference = "scripts/build-pong-adreno-platform-linux.py", command = "fastboot -s be74ba07 boot E:/k60-ios/boot-gpu8-start-20261112.img; boot_capture2.py --seconds 240 --idle 0", revision = "61544e3f6736506485b10a3f635a6d2e87a95a10", result = "console-20261112-013119.log 72314B: startup requested, secure RSC read refused at0x17a2000c return0xfffffffffffffffe, FAIL parent votes. No accelerator published. Authentic K60 GMU/SQE/ZAP firmware is embedded, but GMU/CP/fence execution did not begin." }, { kind = "source", reference = "https://github.com/Emilelu/UniXNU-mondrian (upstream/main in work/up-device)", command = "git show upstream/main:drivers/PongAdreno/PongAdrenoPlatform.cpp; git show upstream/main:porting.toml", revision = "609e51aec8ffc5b06d844d3444ad1349abf598be", result = "The upstream driver maps 0x17a20000/0x10000 directly and never calls secure I/O, and its record reports all 22 startup steps result=0 with parent ARC votes acknowledged and the accelerator published. That is the evidence the local secure-IO route was the deviation, so the direct mapping and retained-highest-corner selection are adopted. Upstream still reports rendering unverified and scanout off." }, { kind = "host", reference = "scripts/build-pong-userspace-linux.py", command = "python3 scripts/build-pong-userspace-linux.py --core core --mesa work/refs/mesa --translator work/refs/metal2vulkan --sdk-root work/iPhoneOS16.5.sdk --venv venv --output-dir work/gpu-userspace", revision = "0eb295a0256d9548567eae347eb763ce6e46392d", result = "Linux cross-build completed rc=0: Turnip 687/687 objects compiled and libvulkan_freedreno.dylib linked, the metal2vulkan crates compiled to the bridge staticlib and linked into PongMetalBridge.dylib, and PongAdrenoMetal linked; all three are arm64 Mach-O dylibs with NOUNDEFS, and the publication marker is 0. Build evidence only: the kernel publishes no accelerator, so no device execution happened." }]

