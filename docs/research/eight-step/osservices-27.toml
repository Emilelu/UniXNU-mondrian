done = false
evidence = "缺：同型（SM8550 / sheng，同一 ipados-27.0.1-24A446 profile，四层补丁结构与本板同构）上这三项的实际接法。要读：E:/hackios/UniXNU-sheng/board.toml 的 [firmware] 预检选择与 [components] include、drivers/SoftwareAES 在 sheng 是否被 component: 引用、AppleKeyStoreState 的 provider（sheng 侧 package/KeyStoreProbe.cpp 只是 payload 侧探针，不是内核 provider）、ShengPreflight 的子模块内容（本机检出为空目录，gitlink 9cfc8d2c）；另读 E:/hackios/xnekom-ios27 的 feat/ios27 26 个提交里是否涉及这三项。能定它的证据：上述四处 file:line + 本板 16.6.1 的同项状态（本板 27 无 MiniAppleKeyStore.cpp、无 SoftwareAES 归档，16.6.1 只有 zzzzzzzzzzzzzzzzzzzzzzzz-pong-software-keybag.patch 的软件 keybag）。"
recorded_at = "2026-11-21T14:05:00"

