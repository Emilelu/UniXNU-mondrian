rence = "userland/build.py", command = "fastboot -s be74ba07 boot E:/k60-ios/boot-cand6-20261111.img", revision = "c6e555c1895e6096c32ab396485ee7d61221a86c", result = "console-20261111-194438.log (64717 bytes): K60UILIB deploy bytes=95856 resid=0 error=0 and all ten SpringBoard hooks install. Main snapshots at 60/120 seconds have turns=0 and identical Firehose/logd registration frames, symbolicated using the matching cache-symbol UUID. notifyd SIGTRAP maps to BUG IN LIBNOTIFY: Event publisher error; the selected cache drops PublishesEvents present in the original descriptor. UI not established." }]

