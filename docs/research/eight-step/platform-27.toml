寄存器的实测取证（GICD_PIDR2、GICD_TYPER、GICR_WAKER）在 16.6.1 线已经做过（drivers/ArmCpu/ArmCpu.cpp:314-363、:365-374），27 侧还没有镜像级复核，那属于 step.device 的输入，不在本步冒充。'''
