[hardware.blackscreen.step.official]
done = true
evidence = '''官方要求（逐项见 docs/research/ios27/BLACKSCREEN-EIGHT-STEP.md §2，URL + 章节）：
- unixnu.com/porting/bring-up §Stage 1-7 与 Failure isolation 表：Stage 4 DarwinBoot 打印 DARWINBOOT: 行与 framebuffer base/width/height/depth；Kernel entry 无日志时先查启动参数、串口选择、帧缓冲地址。红在 EBS 前不出现 ⇒ 故障在 Stage 4 完成之前。
- unixnu.com/guide/debugging §Green bar / Color bars / Entry probe reset / Panic screen：绿条在 ExitBootServices 之后、MMU 关闭、跳转 XNU 之前画在帧缓冲顶部 1/16；绿 → 蓝（MMU 关时内核入口已跑）→ 品红（MMU 开启前一点）；stage 3 无条，MMU 开启后等 --reset-delay 秒再复位；panic_screen=true 运行 scripts/patch-xnu-entry-probe.py --panic-screen --no-reset，panic 屏与 stage-4 探针共用 _start 之后零填充，二者不能同时启用；无探针输出时检查记录的 framebuffer base 与 stride。
- unixnu.com/porting/display §2：先立固件扫描输出（菜单显示正确、GOP 几何与帧缓冲范围对照固件内存映射与板级 DTS、在内核交接期间保留当前扫描缓冲区），再启用 XNU 显示后端（GopFramebuffer + NativeLegacyDisplay.cpp，CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y）；帧缓冲必须是 8 位 BGRA；dpu-scanout=2 是实验功能、默认关闭。
- unixnu.com/guide/debugging §Serial console / §Log sources：payload 写法 [-v, serial=3, debug=0x14e]；板级 UART 引脚与波特率记录在设备页上；支持 USB device 模式的板子可以暴露 CDC ACM 串口代替；官方 USB 调试终端 scripts/debug_terminal.py 实现 giulia 协议 2，只改 USB ID 不能提供协议兼容性。
- unixnu.com/porting/log-capture §1-6：UEFI 菜单（GOP 显示、Advanced Logger、QR 插件）→ XNU 入口（UART 或帧缓冲诊断）→ 存储（预留日志区、内核写入器、Linux 或 recovery 读取器）；ExitBootServices 之后的 XNU 执行用步骤 3 的抓取方式，固件 QR 日志覆盖不到 EBS 之后。
- unixnu.com/guide/build-kernel：构建目标 SDKROOT=iphoneos、ARCH_CONFIGS=ARM64、MACHINE_CONFIGS=BCM2837（选 4 KiB 页布局）、KERNEL_CONFIGS=DEVELOPMENT；XNU_NATIVE_LEGACY_DISPLAY → libNativeLegacyDisplay.late.a，XNU_NATIVE_MOBILE_DISPLAY → libGopFramebuffer.late.a。'''
recorded_at = "2026-11-22"

