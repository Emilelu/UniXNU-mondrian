[hardware.usb.step.deep]
done = true
evidence = "三种口径各给结论，另六项未定（usb-27-export-surface.md §1、§2、§7）：(a) 已定——27 的 kernel.macho 是 MH_FILESET，__PRELINK_INFO 里 38 条减 7 条 kpi 伪条目=31 个 kext，0 个 USB/SCSI；`strings|grep -c AppleUSB`=1295 全是 __PRELINK_TEXT 空洞里的孤立字节（地址在 IOSurface 与 Image4 的 __TEXT 之外，无 plist 条目、无子文件集条目、nm 无符号），不是可加载栈；`grep -i usb` 的符号数 27=2、16.6.1=9，而上一轮「87 vs 170」是十六进制地址噪声（cdc/acm_ 全是 hex 字符），16.6.1 同族实测为 55。(b) 已定——k60_usblog.o 的 34 个 undefined 里 27 个在 27 可解析，缺 7 个全是 16.6.1 诊断面（providers.tsv 逐条给定义行；补丁 0235/0238/0331/0337/0334b/0306/zzz…panic-report）。(c) 已定——K60 DT 的 maximum-speed=high-speed（FEATURES-DRIVERS-RESEARCH-2026-10-31.md:81），故 QMP/SuperSpeed 不是控制台前提，失败可退 UTMI（QcomDwc3.cpp:216）。未定六项（QcomDwc3 在 27 的 undefined、24A446 ABI 槽位、27 是否带 CDC 数据类驱动、eUSB2 的 TCSR、UCSI 是否从 charger_pd 回答、prelink 闭包是否需 !AppleOnboardSerial/!AppleSMC）各给「什么证据能定它」，未猜。"
recorded_at = "2026-11-21T15:41:00"

