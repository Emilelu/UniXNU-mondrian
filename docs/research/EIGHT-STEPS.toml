- 每条 config 命令之后等 cmd_ack.state == 0x80（goodix_brl_hw.c:448-466、484-489），最长 20×20ms=400ms —— 当版新增 goodix_wait_status()。
- 报告读取：touch_data_addr 起 26 字节，pre_buf[0]==0 直接返回（goodix_brl_hw.c:1179-1188）；状态字节 0x80 触点为 GOODIX_TOUCH_EVENT，清标志写 0。与官方一致。"""
previous_unit_test = """scripts/tests/test-brl-parse.py 10/11 通过（唯一失败是测试用例构造错误，非驱动缺陷）：全零帧/空帧→无事件；1/2/5/10 触点→count 正确；超上限 15→拒绝；头部校验错→拒绝；RESET→reset=True。帧格式用真实日志帧交叉验证过：0x10400 的帧若按 8 字节触点头校验失败（cal=0x2B1 vs r=0x0108），按 16 字节 frame_head 校验通过（cal=0x029a == r=0x029a），证明它是 rawdata 帧而非触点报告。"""
previous_artifact_check = """对当时产物 kernel.macho（sha256 d9d5093e…，2026-11-12 15:16 构建）做符号与字符串检查：'state never reached 0x80' 1 处、'state=80' 1 处、'CFG-START' 1 处、'CFG-EXIT' 1 处；'COORD-MODE' 0 处、'identification lost after config reset' 0 处。"""

[hardware.touch.step.device]
done = true
evidence = "2026-11-14 15:09 真机 fastboot boot touch-20261114a（boot.img 0b2003f45603449b28194e29def3302d84f1de508895581c0cd0417dcf9d88e9，kernel c78a5cc93c3ec6e24de34a4a31e1b7639607fb45c2b024cb78b32753b8451b09），串口日志 E:/k60-work/evidence/usblog-20261114-150931/console.log（268,137 B、3,870 行、capture.json complete=true panicMarker=null）。关键行：683 `goodix: COORD-ON ack=80`；681-682 CFG-EXIT/RAW-OFF 均 ack=80；684-686 芯片 BERLIN 9916R 05.80.02.63、active config=0x640fdf7d、touch=0x10308 head=8 point=8 raw axes=14400x32000；2490/2493/2503/2506/2507/2518/2574/2601 八条 `goodix: type=1 finger=0 raw=… normalized=…`；2491/2492/2494/2496 四条 `Pong touch HID: type=1|3 finger=0 xy=…`；1425 `Pong touch HID: display-integrated digitizer opened`。判据：SpringBoard 254 行；`K60PANIC: ring kept`/`initproc exited`/`panic(`/`Debugger called` 各 0 次。用户在场确认屏幕有真实触点响应。"

