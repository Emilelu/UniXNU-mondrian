[[area]]
id = "audio"
status = "host-verified"
components = []
paths = ["package/*Adsp*", "package/*Audio*", "package/*Gpr*", "package/QcomGlink*", "package/QcomMdt*", "package/QcomSmem*", "package/QcomSmp2p*", "scripts/*adsp*", "scripts/*audio*", "scripts/*gpr*", "scripts/*sheng*", "scripts/add-audio-conffiles.py", "scripts/k60-conf-files-hook.py", "scripts/apply-audio27-wiring.py", "scripts/check-audio27-*.py", "scripts/check-sheng-abi.py", "scripts/check-sheng-inject.py", "scripts/judge-audio-capture.py", "scripts/tests/test-*audio*", "scripts/tests/test-sheng-*.py", "scripts/tests/test-wiring-dry-run.sh", "scripts/tests/test-conf-files-hook.py", "scripts/tests/portability/**", "drivers/PongAudio/**", "docs/research/audio/**"]
inputs = ["Identify the audio hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for audio."]
procedure = ["Follow the audio stage in the porting guide and record the actual commands.", "iOS 27 series: python3 scripts/apply-audio27-wiring.py <tree> [--hook-init] (the conf/files anchor follows the tree layout, --anchor overrides it; add --hook-init only once the call site is approved), build with PongAudioAmp.o_CFLAGS_ADD=-DXNU_PONG_AUDIO=1 bash scripts/build-xnu-generic.sh (a dotted environment name: the builder resets EXTRA_MAKE_ARGS at :166, so the same assignment handed over that way delivers nothing), then sh scripts/check-audio27-preflight.sh."]
findings = ["K60 has 2x AW882xx smartpa at I2C 0x34/0x35 (`awinic,aw882xx_smartpa@34` and `@35`), not TFA9873: docs/plans/BT-AUDIO-PORT-PLAN.md:38,192-194,207-210.", "2026-11-19/20: the 16.6.1 speaker path converged on AudioReach with AR_MOD_I2S_SINK 0x0700100A and PARAM_I2S_INTF 0x08001019, PRM clock 0x104 (TER_MI2S_IBIT) at 3.072 MHz, and the speaker switch on gpio52 driven from the playback path; the legacy AFE route cannot work on this firmware (no AFE service in adsp.b18: an aligned u32 scan of all 25 blobs finds none of the AFE opcodes or param ids), and 0x0700100E is an 8-byte registration stub while 0x0700100A has 472 bytes of code. See docs/research/audio/AMPS.md and docs/research/audio/APR-AFE-PLAN.md.", "2026-11-20: the iOS 27 carry tree holds 18 OS-neutral pure-C files (GENI I2C, codec LPI/MACRO/probe/SWR plus their headers), 2 glue files (PongAudioAmp.c, PongAudioRegs.h) and PongAudioAfe.h for the host tests only; the two sources compile against six kernel symbols and three types (scripts/tests/portability), export 11 symbols none of which any 27 tree defines (scripts/check-audio27-collisions.py), and the four interfaces they call still exist in xnu-12377.121.6 at the recorded file:line (scripts/check-audio27-kernel-api.py). See docs/research/audio/IOS27-MIGRATION.md and docs/research/audio/IOS27-WIRING.md.", "2026-11-20: on the 27 series the driver macro XNU_PONG_AUDIO replaces the machine config PONG; the third edit is a per-object CFLAGS_ADD, and the fourth (calling pong_audio_amp_probe from bsd/kern/bsd_init.c) is implemented as an opt-in applier step and awaits the Lead's decision.", "2026-11-20: the define reaches PongAudioAmp.o only as a dotted environment name on a bash invocation; EXTRA_MAKE_ARGS is reset to an empty array at scripts/build-xnu-generic.sh:166, dash drops dotted names, and the consumption point is makedefs/MakeInc.rule:521 ($($@_CFLAGS_ADD)) after SETUP/config/mkmakefile.c:803/808/856-883 writes += lines. scripts/tests/test-audio27-define.py holds those three facts. The 27 series now carries the call site as 0531-k60-audio-amp-probe-call.patch, compared against the emitter by inserted code rather than bytes."]
completion = ["Each declared route carries the selected audio format through playback or capture and handles start/stop correctly."]
limits = ["No device evidence on the iOS 27 series: audio-probe-20261119cc (boot.img 90051b6e68714e098792e4ec3527671df2aacc8c5b584d03a50ddfdb8ab9796c) is a 16-series image and has not flown yet, and 27 stage-0 stops at bsd_init, so no audio log can exist before F4.", "The PCM buffer's DSP ownership (CVP carveout, loader lease or kernel allocation, SMMU stream 0x1801) is unresolved and only reported, never asserted, by the judge."]
next_action = ["Fly audio-probe-20261119cc when the Lead grants the slot and read it with python3 scripts/judge-audio-capture.py --playback <evidence dir> (exit 0 PASS / 1 FAILED / 2 INVALID).", "Once a 27 kernel with the wiring is built, run python3 scripts/check-audio27-kernel.py <kernel.macho> and sh scripts/check-audio27-preflight.sh with XNU27_REPO/XNU27_KERNEL/SHENG_REPO set."]
evidence = [{ kind = "source", reference = "docs/research/audio", result = "ADSP PAS1 groundwork: the 24 PT_LOAD segments spanning 0x86300000..0x89400000 were verified offline, kernel-side PAS/boot/FAT walkers and the platform ownership callbacks are in the tree, and the host suite for the rail sampler is recorded under package/tests/rail-sampler/proposed. Not working: resources_cb still refuses with K60BoardUnsupported(-63) because the LCX/LMX rail vote cannot happen before the Data mount (HR-01), so no PAS1 image is authenticated and no codec is powered." }, { kind = "host", reference = "drivers/PongAudio/tests/run-tests.sh", command = "sh drivers/PongAudio/tests/run-tests.sh", revision = "b12fc5923dec2d247facab0725e1a6124e5a7924", result = "979 amplifier/codec/geni host cases pass, 997 when PONG_ACF_FILE points at the recorded aw882xx_acf.bin." }, { kind = "host", reference = "scripts/check-audio27-preflight.sh", command = "SHENG_REPO=<clone of UniXNU-sheng main> XNU27_REPO=<xnu-12377 source tree> sh scripts/check-audio27-preflight.sh", revision = "b12fc5923dec2d247facab0725e1a6124e5a7924", result = "30 host rows plus one skip: migration list and pure-C build, six-symbol and link-time checks, driver macro in both directions, copy set against the compiler, conf/files appender (9 cases), the chaining conf-files hook (6 cases, a missing extra is named and fails), the define delivery harness (6 cases), wiring applier (13 cases), the weak call site linking both ways, the probe against a zero page, 979 amplifier cases, the wiring dry run, the API/product/collision/closure/emitter/series checkers, the 27 driver's delivery of the hook and the per-object define (six cases, and it says 'not wired yet' while the Lead still has to wire it), 0531 regenerated from the same block as -U1 (806 B sha256 3665a972) with the booked 453 B copy matched by inserted code rather than bytes, and sheng at c8f92b2: audioreach 182 checks, ABI 16/16 constants, injection contract 7/7 invariants. The one skip is the built-kernel row, which needs XNU27_KERNEL." }]
