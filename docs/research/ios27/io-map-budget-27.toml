# 27 的 ml_io_map 窗口清单 —— 计数模式的输入表
#
# 这张表是「27 树没有共享子图」这一事实的可机读形态：12377 的 io_map() 每次
# kmem_alloc(kernel_map, …)，不存在 IO_MAP_SIZE，所以门禁不能再借 16 系列的 8 MiB，
# 只能数窗口。表与树的对应关系由 docs/research/ios27/IO-MAP-COUNT-MODE-PROPOSAL.md
# §3 的契约（写死版）规定；数字的出处逐行写在每条的 file/line 上。
#
# 每行的 file 按 root 解析：root = 'lane' → <lane root>/<file>（板级文件与补丁），
# root = 'xnu' → <--tree>/<file>（XNU 源码）。每行的 verify 决定门禁查什么：
#   macro = 该文件里必须有 "#define <expression 的第一个 token>"
#   file  = 只核文件存在（宏在别的头文件里，或这一行按定义就是 0 字节）
#   none  = 不查（调用方给尺寸，静态定不出来；必须 bytes = 0 且 unresolved = true）
schema_version = 1
generated = '2026-11-21'
title = 'ml_io_map windows in the iOS 27 (xnu-12377) build'
tree_kind = 'xnu-12377: no shared submap, every call allocates from kernel_map'

[limits]
# 12377 没有子图；共享的只有 kernel_map 的 VA 与页表，所以「额度」不是池子，
# 而是「这张表本身」——计数模式判的是树与表是否一致，不是树是否装进某个池子。
