[hardware.bluetooth.step.plan]
done = true
recorded_at = "2026-11-21T03:44:00+08:00"
evidence = "The order of record is docs/plans/BT-IOS27-PORT.md:107-127: 23 patches in four layers, with the device series carrying the 0500-0523 order (no 0513). The 0521 blob is a 106-entry manifest, not the 113-file payload (docs/plans/BT-IOS27-PORT.md:129-153). CI 44518998961 built the 23-patch kernel at 93,077,504 B, sha256 4e57f1822d352022b2a825f93ac41d653a149c63872a6cca8e42d505a0bb9f86 (docs/plans/BT-IOS27-PORT.md:265-274), but its head 33f5229 is not an ancestor of a2a75813 (git merge-base --is-ancestor returned 1). This tip sets CONFIG_XNU_NATIVE_UFS=y at configs/mondrian_ios27_defconfig:21 and board.toml:361 includes NativeUfs, but build/native-ufs/libNativeUfs.a has no producer in the selected build graph. The host script scripts/build-native-ufs-linux.py:18-20 can build drivers/NativeUfs into that archive, but it says it does not wire anything up, and nothing invokes it; this branch's scripts/build-xnu-generic.sh:646-650 force-loads build/native-ufs/libNativeUfs.a when XNU_NATIVE_UFS=1, the shared 27 builder still points at build/sheng-ufs/libPongUfs.a (k60-gates/scripts/build-xnu-generic.sh:647), and the 16-line builder links build/native-ufs/libNativeUfs.a at scripts/build-xnu-4k-baseline.sh:1054 and :1278. This is not a configuration error: either add the producer or set CONFIG_XNU_NATIVE_UFS=n. BT-only 构建前置 = NativeUfs off（引用 33f5229）；不改共享 configs/，不新建第二份 defconfig。Plan actions carried by the seven steps: keep t970 as the SE6-versus-SE20 contrast and zizhan as the product-id failure mode, neither is a same-model proof; wire payload.runtime before the first 27 payload; extract 24A446 bluetoothd and BlueTool and diff their MobileGestalt imports against 20G81; if a second 27 board selects QcaBluetooth, re-run the same 46-field check; for a BT-only compile use the NativeUfs-off config at 33f5229 and do not edit the shared configs/ or add a second defconfig; a BT preflight must fail on a missing [payload.runtime], a missing 24A446 bluetoothd, an ADT without one of the six properties, or a half-set F3/F4 switch. Do not flash. Close the four gates in step.verify.plan and record a device run with the exact head sha. Stop at compile plus static: flight needs all four: (a) a build of this tip or a BT-only config; (b) F1 loader accepts MH_FILESET and the F2 prelink map closes; (c) payload.runtime, the ADT export, 24A446 bluetoothd and product-id are wired; (d) the device prints [bluetooth] state=2 error=0 and exactly one [bluetooth proc] bluetoothd. Missing any one leaves this open."

