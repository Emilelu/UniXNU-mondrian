[[area]]
id = "thermal"
status = "device-verified"
components = []
paths = [
  "docs/research/thermal/**",
  "docs/research/EIGHT-STEPS.toml",
  "porting.toml",
  "drivers/PongThermal/**",
  "patches/thermal/**",
  "scripts/build-thermal*.sh",
  "scripts/tests/test-k60-thermal*",
]
inputs = [
  "The SoC exposes two AP tsens-v2 controllers at 0xc263000 and 0xc265000 with 16 sensors each; the count comes from #qcom,sensors (mondrian.dts:16441, :16451) and is capped at 16 by the binding (qcom-tsens.yaml:209-214).",
  "A second sensor source is the remote QMI path: 25 of the 58 thermal zones read phandle 0x5c (mondrian.dts:16774-16788), which needs QRTR/GLINK that this port does not have.",
  "The board DTB describes no clocks and no nvmem calibration cells, so the controller must already be enabled and calibrated by XBL before XNU runs.",
]
configuration = [
  "board.toml declares no thermal component; the board DTB is the only configuration surface for tsens today.",
  "mondrian.dts:16438-16456 describes both controllers (TM window 0x1ff, SROT window 0x1ff, uplow/critical interrupts, phandles 0x5d/0x6b); mondrian.dts:6643-8422 describes the 58 thermal zones and their cooling maps.",
]
procedure = [
  "Re-derive every register offset from the mainline driver instead of copying it: tsens-v2.c:12-27 lists TM_Sn_STATUS at 0xa0 + 4n and the SROT block at 0x0/0x4, and docs/research/thermal/02-OFFICIAL-DOCS.md §2 tabulates the result.",
  "Generate the 32-entry sensor table from the board DTB with a patched dt-thermal.py rather than transcribing it by hand (docs/research/thermal/03-REVERSE.md §3).",
  "Keep the read path read-only: poll TM_Sn_STATUS, decode LAST_TEMP[11:0] with bit 11 sign extension, require VALID[21], clamp to -40..160 C, and log samples with the zone name and index.",
]
findings = [
  "Both controllers expose 16 sensors each, not the 8 the original brief assumed: 2x16 = 32 AP sensors plus 25 remote QMI zones and one config-only zone (docs/research/thermal/01-SAME-HARDWARE.md §5).",
  "The board DTB carries no calibration data: grepping the decompiled DTS for calib/qfprom/efuse returns nothing, and the upstream calibrationless path (tsens.c:131-152) still works because tsens-v2 status words already hold deci-Celsius (tsens-v2.c:31-39, tsens.c:346-347).",
  "Only 32 of the 58 zones are reachable from the OS; every AP-side trip is passive (the only active trips are modem-side mdmss ones), so a driver must do its own polling because polling-delay is 0 for most zones (docs/research/thermal/01-SAME-HARDWARE.md §6).",
  "The DT zone count and the runtime zone count are different quantities: the board DTB describes 58 thermal zones, while the running Android system registers 84 (32 AP tsens + 25 QMI + 6 PMIC + 8 BCL + 9 Xiaomi virtual + socd + 3 battery), so only the 32 AP sensors can be cross-checked between the two (docs/research/thermal/04-ANDROID-EVIDENCE.md §1).",
  "The live zone list confirms 2x16 = 32 AP sensors and matches the DT thermal-sensor-cells indices one by one (zones 24..55), which is an independent second source for the sensor table used by drivers/PongThermal/K60Tsens.c (docs/research/thermal/04-ANDROID-EVIDENCE.md §2).",
  "The vendor tsens driver is a loadable module recovered from the vendor_boot ramdisk (qcom_tsens.ko, 77928 B, not stripped); its .rodata tsens_v2_regfields table independently repeats TM_Sn_STATUS = 0xa0 + 4n with width 12, and its get_temp_tsens_valid takes the adc=0 branch that multiplies the sign-extended status word by 100 (docs/research/thermal/04-ANDROID-EVIDENCE.md §5).",
]
completion = [
  "A device boot prints 32 timestamped samples, every sensor reports VALID with a value inside -40..160 C, and two consecutive samples of the same sensor differ by less than 20 C.",
]
limits = [
  "drivers/PongThermal is built and verified offline only: scripts/build-thermal-driver.sh cross-compiles both sources into Mach-O arm64 objects (build/thermal/K60Tsens.o, sha256 6facc0fc, 10 required symbols, __const 512 B = 32 entries; build/thermal/K60ThermalLevel.o, 6 required symbols, __const 248 B), both with 0 undefined symbols, but neither has ever been linked into an XNU kernel or run on a device. The kernel side now exists too: drivers/PongThermal/K60ThermalService.cpp implements K60ThermalSensor (two instances, read-only TM+SROT mappings, 1 s polling), AppleSMCSensorDispatcher (the nub thermalmonitord looks up by class name) and its user client with selectors 0..3, and scripts/build-thermal-kext.sh compiles the three sources against a built XNU tree into build/thermal-kext/libK60ThermalKext.a (sha256 8fa4bf72, 160 defined symbols, 10 required, 219 kernel imports all present in all-kpi.exp). Integration is in the tree as of 2026-11-14 and has been built into a kernel once: with CONFIG_XNU_PONG_THERMAL=y the resulting kernel.macho (sha256 cb35295c1ea81fbe4935309e45e2548b0aa8b6ca6e4e12367292c87d4192d0e3, 54,190,080 B) contains eight 'K60Thermal: ' strings and the _k60_thermal_start/_k60tsens_read_controller/_k60tl_step symbols, while the same tree with =n produces 1ebb6052… with none of them; the link line sits behind XNU_PONG_THERMAL=1 in scripts/build-xnu-4k-baseline.sh:1137-1154 (inside the live PLATFORM_ARCHIVES branch, after a first attempt landed in a dead XNU_SOURCE_CORECRYPTO14 branch), the switch travels through configs/mondrian_defconfig:63 and scripts/build-pong-platform-macos.py:41, the hook sits behind the same switch in drivers/ArmDTPlatform/ArmDTPlatform.cpp:27-31 and :232-233, and scripts/make-pong-adt.py:217-234 adds the two ADT nodes (absolute pong,tsens-tm-base/pong,tsens-srot-base properties instead of reg, because the arm-io ranges window does not cover 0xc263000). Threshold programming, interrupts, the 25 QMI zones and every cooling-device action remain out of scope until the read path is device-verified. A second, switch-free route is now in the tree too: patches/xnu/0617-k60-thermal-tsens.patch (469 lines) adds bsd/dev/pong_thermal.c (232 lines) and bsd/sys/pong_thermal.h (198 lines), registers the file in bsd/conf/files, starts a 1 s polling thread from bsd_init.c after pong_buttons_init(), and is the last line of patches/xnu/series; it applies cleanly (git apply --check) on a tree that already carries the other 229 patches, and its host-side arithmetic is covered by 264 assertions, and a kernel containing it has now been built with this line's own trees: build-strict.sh thermal-20261114c (K60_DEVICE_INPUT=/opt/k60/trees/thermal-device, K60_OUT=/opt/k60/trees/thermal-out) passed the eight-step gate, applied 230/230 patches, built kernel.macho (54,173,696 B, sha256 ed0bfe2327ea55244eb95b3313264404dd43fb1d4b0caa68846dc729853331d1) with ten 'PongThermal: ' log strings and five _pong_thermal_* symbols, then built the payload and boot.img (sha256 09a38cb7); four environment gaps had to be closed first (a conf/files anchor that only exists in the format-1 hook path, a missing feeds.toml, a stale .config and a missing .cache/firmware tree), all recorded in docs/research/thermal/08-KERNEL-DRIVER.md §6. The pressure-level publisher is now in the tree as well: bsd/dev/pong_thermal_pm.cpp (the first .cpp the bsd component has ever built) hands the level to IOPMrootDomain::systemPowerEventOccurred under kIOPMThermalLevelWarningKey, reusing the host-tested k60tl_step arithmetic; it installs no actuator. The patch is seven sections and scripts/check-thermal-kernel-patch.py checks eleven properties, including that the publisher never becomes an actuator. What that layer still cannot claim is hardware: a non-Apple kext-side caller of systemPowerEventOccurred has never run on this board, and userland/mkjobs.py:217 still denies thermalmonitord, so no userspace consumer exists yet (docs/research/thermal/08-KERNEL-DRIVER.md §7.4). Trip programming stays out of scope by design, not by omission: docs/research/thermal/TRIP-DESIGN.md shows the 154 trips of the 58 zones exist only in the board DTS (mondrian.dts:6643-8422), the 46 cooling-maps resolve to 16 cooling devices but 20 of those entries are QMI-remote, 9 need GPU/DDR frequency frameworks and the remaining 8 are core halts that would need a new pause/resume state machine on top of a one-way ArmCpu::haltCPU (ArmCpu.cpp:489-495), so this port cannot execute a single cooling-map today; the only exported thermal entry, IOPMrootDomain::systemPowerEventOccurred (all-kpi.exp:908-909), flips thermalWarningState and changes sleep policy rather than frequency (IOPMrootDomain.cpp:8133), and thermalmonitord is still in the launcher DENY list (userland/mkjobs.py:217), so an actuator would have no consumer. The zone-ladder layer added on 2026-11-15 is offline only as well: drivers/PongThermal/K60ThermalZones.{h,c} turn the 101 passive trips of the 32 tsens zones (83 distinct tiers after the 18 duplicate 125 C entries) into a board-local 0..3 level, and pong_thermal_pm.cpp publishes that level as-is instead of mapping it onto kIOPMThermalLevelNormal/Danger/Warning/Trap (docs/research/thermal/LEVEL-MAP.md section 4 gives the three reasons); nothing has yet shown the level rising with load, the first device run read 40-43 C against a 90 C lowest passive tier, and pong_thermal_bias is a validation-only offset rather than calibration. The ladder has been built into a kernel on 2026-11-15 01:30 (build-strict thermal-20261115a, kernel.macho sha256 153450de9196b99c395f38abc98f990ec0bb389a11196d02b37b8fd813a9a10a, 54,173,696 B, fifteen 'PongThermal: ' strings including the three level-line branches and the bias line, with _k60tz_table/_k60tz_step/_k60tz_closest and _pong_thermal_pm_publish in the symbol strings) but has not run on a device yet. The boot verdict is now machine readable as well: docs/research/thermal/CRITERIA.toml holds 34 criteria, each a log regex plus its expectation plus why a failure would matter, and scripts/check-thermal-log.py reads them against a console.log with four checker kinds (count/each/coverage/pair). It infers the profile from the bias line, exits non-zero only when a required criterion fails, accepts 31 or 32 sensor lines because the console sink can drop one whole line under concurrency, requires exactly one published line because the publisher dedupes on the level rather than sampling, and carries a --self-test that proves each criterion can fail. When the level-ladder criteria fail and the log has no level line at all, the reader reads boot.json beside the log and prints the image tag it came from, so a pre-ladder kernel is not read as a defect. The 85000 bias image (thermal-20261115b) was rebuilt after rebasing onto main 344e47d, because --kernel-arg writes the argument into the payload's unixnu.toml (payload.py:130-133) and the firmware only reads that file (P-159); the image header cmdline is not used, so each bias step needs its own build rather than three boots of one image. The kernel grew from 54 MB to 105 MB in that rebuild, which is the defconfig's CONFIG_XNU_GPU_ADDON=y (a 51,278,451 B Metal plugin incbin) and CONFIG_XNU_K60_PHYSICAL_BATTERY=y, not a thermal change; a 105,476,096 B kernel already booted in the 4.5 GiB window (gpu-20261114t, usblog-20261114-235957, K60RV mem=4608, K60METAL deploy files=6/6 error=0), so the size is not a new risk. The 85000 image has not booted yet.",
  "The publisher is the first .cpp in bsd/conf/files and the first non-Apple caller of IOPMrootDomain::systemPowerEventOccurred in this tree, so two things remain unproven: whether a non-Apple kext-side caller is harmless, and when IOService::getPMRootDomain() becomes non-NULL on this board (bsd_init.c:1166-1167 runs long before IOKitBSDInit at :1325). It installs no actuator; userland/mkjobs.py:217 still keeps thermalmonitord in DENY, so nothing consumes the level yet. The one build gap it hit, IOPMPrivate.h being excluded from the exported headers, is recorded in docs/research/thermal/08-KERNEL-DRIVER.md section 6.2. After that fix the build-strict run thermal-20261114f (2026-11-15 00:17) passed end to end: kernel.macho 54,173,696 B sha256 e6557350fe37af880883ef3d24b3e20d2c5eff704e0f8c5e6975ade09b22ddce, eleven 'PongThermal: ' strings including 'PongThermal: level %s (%u) published as %s=%u', the _pong_thermal_pm_publish symbol and the 'Thermal_Level_Warning' string, payload kernel d923f2b2a059a96a737a7cc70288d8ed2f440f90c739c161f4b1694b15cd4bbc and boot.img adc796b63bad27821c491ddfb8ab7da8f6496b4ffd1b0b2e366ee6a301dc5d59.",
  "The SROT block has never been read on this board, so TSENS_EN (SROT_CTRL bit 0) and SROT_HW_VER are still unverified; upstream refuses to probe when TSENS_EN is 0 (tsens.c:974-979), and reading it needs kernel-mode MMIO that Android does not expose (docs/research/thermal/04-ANDROID-EVIDENCE.md §9).",
]
next_action = [
  "The double build is done (2026-11-14): XNU_PONG_THERMAL=1 gave kernel.macho sha256 cb35295c… with eight 'K60Thermal: ' strings and the _k60_thermal_start symbol, and the =n control gave 1ebb6052… with none; scripts/check-kernel-archives.py --out /opt/k60/trees/k60build/out-thermal reported 4 enabled archives all present. What remains is the device step only.",
  "Then get Lead approval for steps 7 and 8, boot the read-only driver on device 6033dbec through scripts/flash.sh only, and confirm SROT_CTRL bit 0, SROT_HW_VER and VALID on all 32 sensors before any threshold or interrupt work. One variable at a time (P-178): do not enable the ADT nodes, the Info.plist personalities and XNU_PONG_THERMAL in the same boot.",
  "The ADT nodes are already written but unverified on hardware; after the first successful boot, check ioreg -l | grep thermal-sensor for both nodes and for 'ArmDTPlatform: published DT nub thermal-sensor@c263000'.",
]
evidence = [
  { kind = "source", reference = "drivers/PongThermal/pong_thermal_pm.cpp", result = "The pressure-level publisher: 116 lines, C++, no actuator. Hands the board-local 0..3 level to IOPMrootDomain::systemPowerEventOccurred under kIOPMThermalLevelWarningKey as a raw value (value = (uint32_t)level at :100) and returns immediately until IOService::getPMRootDomain() is non-NULL." },
  { kind = "source", reference = "drivers/PongThermal/K60ThermalZones.c", result = "The zone ladder: a 32-row table that carries each tsens zone's passive tiers with their hysteresis (13 zones with two tiers, 19 with three), k60tz_step folding 32 zones into the highest level, and k60tz_closest naming the hottest zone and its margin to the next tier. Header K60ThermalZones.h declares the 32-zone, 3-tier shape; neither file writes a register." },
  { kind = "source", reference = "docs/research/thermal/LEVEL-MAP.md", result = "How the 154 trips of the 58 DTS zones become a read-only level: 101 passive trips belong to the 32 tsens zones (83 distinct tiers after 18 duplicate 125 C entries), the other 45 are 41 QMI trips plus four non-temperature entries (mx-pe 1/2/3 and isense_trim 2), the 0..3 definition with hysteresis and no-reading rules, why the publisher sends 0..3 instead of Apple's 0/5/100/110, the expected log lines, and a pong_thermal_bias table that lifts a 45 C board into levels 1..3 for validation." },
  { kind = "source", reference = "docs/research/thermal/CRITERIA.toml", result = "The 34 machine-readable boot criteria: 22 that must hold on every boot (two controller lines with enabled=1, the polling line, 31 to 32 sensor lines, the 32 zone labels, a domain line, the level line format, level name versus number, the published line, published value versus level, each publication following a level line of the same level, and seven strings that must not appear), four for a cold boot (no bias line, level 0/3 throughout, a published value of 0, no 1/2/3) and four per bias step (+50000 expects 1/3, +75000 2/3, +85000 3/3, each with its own bias line and published value). Every pattern is copied from a driver printf and the why field names the file:line to look at first." },
  { kind = "source", reference = "scripts/check-thermal-log.py", result = "The reader: loads CRITERIA.toml, finds the newest usblog console.log unless --log is given, decodes it as bytes because the capture contains NULs, infers the profile from the bias line, and runs the count/each/coverage/pair checkers. Exit code 0 means every required criterion passed; advisory ones only print. --self-test fabricates a clean log for each profile and mutates it fourteen ways (one dropped sensor line must pass, two must fail, a missing controller line, a missing level line, a no-valid-reading line, an out-of-range published value, the same level published twice, a name/value mismatch, the pre-ladder log format, and cold/bias profiles crossed) so the verdict cannot pass by accident." },
  { kind = "source", reference = "docs/research/thermal/08-KERNEL-DRIVER.md", result = "The in-tree route: the nine sections of patches/xnu/0617-k60-thermal-tsens.patch with their hunk headers, why its two anchors survive P-171, the driver's init and polling structure, the publisher's include window around RootDomain.h, the log lines that judge a device boot (including the first device run of thermal-20261114f), the fourteen checks of scripts/check-thermal-kernel-patch.py, and the five build-input gaps (the IOPMPrivate.h export gap in section 6.2) that blocked the first build-strict runs." },
  { kind = "source", reference = "patches/xnu/0617-k60-thermal-tsens.patch", result = "1,203-line, 50,098-byte patch in nine sections that puts the read-only tsens driver, its zone ladder and its publisher into the kernel: new files bsd/dev/pong_thermal.c, bsd/dev/pong_thermal_level.c, bsd/dev/pong_thermal_zones.c, bsd/dev/pong_thermal_pm.cpp, bsd/sys/pong_thermal.h, bsd/sys/pong_thermal_level.h and bsd/sys/pong_thermal_zones.h, four bsd/conf/files lines, and one call in bsd/kern/bsd_init.c; applies cleanly on a tree carrying the other 229 patches and is the last entry of patches/xnu/series." },
  { kind = "source", reference = "scripts/tests/test-k60-thermal-kernel.c", result = "264 assertions over the shared board header: 12-bit sign extension, VALID gating, flags, controller enable bit, version split, register offsets, the 32-entry table and the five-domain fold; plus scripts/check-thermal-kernel-patch.py, which rebuilds both kernel files from the patch and compares them byte for byte with drivers/PongThermal." },
  { kind = "source", reference = "docs/research/thermal/TRIP-DESIGN.md", result = "Answers the three trip questions with file:line citations: (a) the 154 trips of the 58 thermal zones exist only in the board DTS (mondrian.dts:6643-8422) while thermal-engine.conf is an 84-byte empty file, qcom_tsens.ko carries no threshold table and the live trip_point_*_temp values equal the DT ones; (b) the board has 50 cooling-device mentions, 46 cooling-maps and 16 referenced cooling devices, no fan and no PWM, and the only action this port could execute locally is halting a core; (c) the tree has no IOHWMControl, AppleSMC or OSThermalNotification, the only exported thermal entry is IOPMrootDomain::systemPowerEventOccurred and it changes sleep policy only (IOPMrootDomain.cpp:8133), so the driver reports temperatures and pressure levels and registers no actuator, with three re-explicit triggers for revisiting that decision." },
  { kind = "source", reference = "docs/research/thermal/01-SAME-HARDWARE.md", result = "Controller bases, SROT windows, the 32-sensor index map, the 58-zone and cooling-map inventory, and the statement that the board DTB has no calibration node, each with mondrian.dts line numbers." },
  { kind = "source", reference = "docs/research/thermal/02-OFFICIAL-DOCS.md", result = "Register offsets from tsens-v2.c:12-27, status bit fields from tsens-v2.c:94-101, the deci-Celsius conversion from tsens.c:346-347, and the binding example that matches this board at qcom-tsens.yaml:382-396." },
  { kind = "source", reference = "docs/research/thermal/03-REVERSE.md", result = "How UniXNU-sheng (SM8550) and phk110-port (SM6375, 27/27 sensors measured on hardware) read tsens, the three-platform comparison, the 13-item reuse list, and the two forensic gaps that keep step 3 open." },
  { kind = "source", reference = "docs/research/thermal/04-ANDROID-EVIDENCE.md", result = "Live evidence from device 6033dbec: 84 runtime zones versus 58 DT zones, zones 24..55 matching the DT sensor indices, live trips equal to the DT trips, and the reverse-engineered qcom_tsens.ko whose regfield table and adc=0 conversion path confirm 0xa0+4n and the x100 deci-Celsius decode." },
  { kind = "source", reference = "drivers/PongThermal/K60Tsens.c", result = "Read-only tsens reader: 32-entry board table, TM_Sn_STATUS decode with 12-bit sign extension, VALID gating and -40..160 C plausibility window; writes no register, takes no interrupt and never touches SROT." },
  { kind = "source", reference = "scripts/build-thermal-driver.sh", result = "Cross-builds drivers/PongThermal/K60Tsens.c to a Mach-O arm64 object and static archive with clang -target arm64-apple-ios16.6.1 and verifies it: 10 required symbols defined, 0 undefined, __const 512 B (32-entry board table), sha256 written to build/thermal/thermal-manifest.json. It does not link into the kernel, so the kernel integration still belongs to step 8." },
  { kind = "source", reference = "docs/research/thermal/05-PRESSURE-LEVEL.md", result = "How the 32 sensors become macOS's OSThermalPressureLevel: the thermalmonitord contract (polls AppleSMCSensorDispatcher once a second and copies the mTPL key into com.apple.system.thermalpressurelevel), the five inputs and their trip points with DT line numbers, the hysteresis and unreadable-sensor rules, and the 32-row sensor-to-domain table." },
  { kind = "source", reference = "drivers/PongThermal/K60ThermalLevel.c", result = "Data and arithmetic for the pressure level: four trip tables taken from this board's DT (cpu 110/10 115/5 125/1, gpu 95/5, npu 95/5, ddr 90/5), the per-input hysteresis rule of the thermal core, the 32-entry sensor-to-domain map and k60tl_step() which returns the highest input level. No register access, no IOKit, no allocation." },
  { kind = "source", reference = "scripts/tests/test-k60-thermal-level.c", result = "Host test of the pressure level: 72 assertions over the trip tables, the hysteresis boundaries (a trip crossed at 110 C with 10 C hysteresis is still held at 100000 mC and released at 99999), the unreadable-sensor rule, per-input state across rounds, and 13 sensor-to-domain mappings; prints TESTS OK 72." },
  { kind = "source", reference = "scripts/build-thermal-link-check.sh", result = "Proves the kernel link line offline without rebuilding the kernel: ld64 ld -r on a synthetic caller leaves _k60_thermal_start undefined without -force_load (control) and resolves it with -force_load libK60ThermalKext.a, with all 218 archive imports present in all-kpi.exp and 0 unresolved (LINK OK, report build/thermal-link-check/link-check.json). It links nothing into a real kernel, so this verifies the flag's semantics, not the product." },
  { kind = "source", reference = "scripts/build-xnu-4k-baseline.sh", result = "The kernel link line for this line: a XNU_PONG_THERMAL block at :1137-1154 builds libK60ThermalKext.a with build-thermal-kext.sh --no-export-list and adds it to PLATFORM_ARCHIVES with -Wl,-force_load plus PLATFORM_DEPENDENCIES, inside the live platform-archives branch (a first attempt at :934-943 sat in the dead XNU_SOURCE_CORECRYPTO14 branch, which this board disables). Default off, so the stock build is unchanged." },
  { kind = "source", reference = "drivers/ArmDTPlatform/ArmDTPlatform.cpp", result = "The boot hook: :27-31 declares extern \"C\" int k60_thermal_start(void) under #if XNU_PONG_THERMAL and :232-233 calls it after registerService() and the adreno hook, logging 'ArmDTPlatform: thermal service start failed' on failure. Compiled with the switch both off and on: no k60_thermal reference when off, one undefined reference when on." },
  { kind = "source", reference = "scripts/make-pong-adt.py", result = "The two ADT nodes: :217-234 build thermal-sensor@c263000 and thermal-sensor@c265000 with compatible qcom,tsens-v2 and absolute pong,tsens-tm-base/pong,tsens-srot-base/pong,tsens-controller properties (not reg, because the arm-io ranges window 0x17000000+0x02000000 does not cover 0xc263000), and :266 inserts them into the arm-io child list. A real run produced 12600 B and 15 nodes, with both new nodes present and their property values verified through pong_adt_contract.parse_adt." },
  { kind = "source", reference = "docs/research/thermal/07-INTEGRATION.md", result = "The integration checklist for the three gaps and how each was closed: the link line at build-xnu-4k-baseline.sh:1137-1154 inside the live PLATFORM_ARCHIVES branch (plus why :934-943 was dead), the four-link switch chain from configs/mondrian_defconfig:63 through build-pong-platform-macos.py:41, the ArmDTPlatform hook, the ADT node and the ranges gap (0x17000000 + 0x02000000 does not cover 0xc263000), the cold-tree all-kpi.exp constraint that motivated build-thermal-kext.sh --no-export-list, and the four acceptance criteria including the single-variable rule." },
  { kind = "source", reference = "docs/research/thermal/06-KEXT-SERVICE.md", result = "The kernel half: the three classes (K60ThermalSensor, AppleSMCSensorDispatcher, AppleSMCSensorDispatcherUserClient), the four selectors with their dispatch sizes 1/60/60/88, the entitlement check, the build recipe against a built XNU tree, the 160-symbol/219-import verification, and the three integration gaps as they stood before the Lead landed them (link line, caller, ADT node)." },
  { kind = "source", reference = "drivers/PongThermal/K60ThermalService.cpp", result = "Kernel side of the thermal line: two K60ThermalSensor instances map TM and SROT read-only from the DTB bases 0xc263000/0xc222000 and 0xc265000/0xc223000, poll 16 status words a second, publish K60Temp00..K60Temp31 plus K60TsensVersion/K60TsensCtrl, and fold both controllers into the five pressure domains; AppleSMCSensorDispatcher publishes itself with IOUserClientClass and its user client answers selectors 0..3 after checking com.apple.private.smcsensor.user-access. Writes no register, takes no interrupt, posts no notification." },
  { kind = "source", reference = "scripts/check-kernel-archives.py", result = "The archive gate now carries ('XNU_PONG_THERMAL', 'build/thermal-kext/libK60ThermalKext.a', 'k60_thermal_start'), so with CONFIG_XNU_PONG_THERMAL=y it fails with the P-190 message if the archive was force-loaded into a branch that does not run. Run against the private out-thermal tree after the thermal build it reported '✅ kernel archives: 4 enabled archive(s) all present in kernel.macho'." },
  { kind = "source", reference = "scripts/build-thermal-kext.sh", result = "Compiles the three thermal sources into a Darwin archive against a built XNU tree (fakeroot isysroot, patched sources, EXPORT_HDRS, all-kpi.exp) and proves linkability: 160 defined symbols, 10 required ones present, 219 kernel imports all exported. Requires -fno-c++-static-destructors -fno-use-cxa-atexit because the kernel does not export __cxa_atexit, and it matches llvm-nm names both with and without the Mach-O leading underscore." },
