# platform-27.toml — 顺序 1「CPU、中断、定时器、RAM、DMA」的八步记录
#
# 八步（docs/engineering/EIGHT-STEP-SPEC.md）：
#   ① 同型   ② 官方   ③ 参考源   ④ 广域   ⑤ 方案   ⑥ 深挖   ⑦ 核验   ⑧ 上机
#
# 本文件只做 ①~⑦。⑧ `step.device` 由 Lead 在上机后写，这里有意不建。
# 纪律：没做过的步骤写 done = false 并写明缺什么、什么证据能定它；不要编。
#
# 每条 evidence 必须含可核查引用：file:line / URL / usblog-YYMMDD-HHMMSS / 0x… / P-xx。
# 本线配套文档：
#   docs/research/ios27/ARMCPU-FORK-VS-CATALOG.md   ArmCpu 换不换的裁决与符号对账
#   docs/research/ios27/PLATFORM-BUDGETS.md         ml_io_map 预算 + T0SZ/SIGP 逐行判断

[hardware.platform]
status = 'researching'
name = 'CPU、中断、定时器、RAM、DMA（ArmDTPlatform / ArmCpu / ArmSmmu4K / SoC DTSI）'
why = '27 stage-0 要证明的第一件事就是「arm64e 内核能在 mondrian 上把副核拉起来并跑到 bsd_init」。CPU/GIC/定时器这条线目前是 16.6.1 的 fork 在 27 树上跑，catalog 路线（component:ArmCpu）在本板缺 /psci 节点与 sheng-smp 参数，两条路线的取舍必须先钉死，否则后面的存储/显示线会各自假设一个 CPU 启动方式。'
revisit = '上机后由 Lead 写 step.device；本文件在 F1 之后并入 docs/research/EIGHT-STEPS.toml 的 platform 块'
label = '平台线：保留 fork；catalog 迁移前置六条已列清，等 SMP/S2R 触发'
paths = ['drivers/ArmCpu/', 'drivers/ArmDTPlatform/', 'dts/', 'scripts/make-pong-adt.py', 'docs/research/ios27/']

[hardware.platform.step.same_model]
done = true
evidence = '''同型号（mondrian / SM8475）在 27 上没有第二份实现；唯一的同型号基线是本仓库 16.6.1 线的 drivers/ArmCpu/ArmCpu.cpp（779 行），它现在就是 27 树在用的 CPU provider（board.toml:14 include 里的 ArmCpu 被 drivers/ArmCpu/ 遮蔽）。它已经把 ADT 读取、GICv3 分发器/重分发器唤醒、CNTV 时基、secondary 入口全部实现并带观测：drivers/ArmCpu/ArmCpu.cpp:314-363（mapGic 读 /arm-io 的 ranges 与 /arm-io/intc 的 reg，校验 GICD_PIDR2）、:376-404（wakeRedistributor）、:406-451（enableGic，保留固件 ARE 位）、:485-594（八核注册与 PSCI 启动）、:596-613（initCPU）。同型号缺口只有一个：27 上还没有任何一次成功的 SMP 上机记录，因此「16.6.1 的实现能在 24A446 上成立」仍是先验而不是事实。同族参照是 xnekom-ios27（同为 ios-27.0.1-24A446，含 PongUfs/K60PlatformSleep），它带的是逐字节相同的 779 行 fork（diff 无输出，2026-11-21 核对）。'''
recorded_at = '2026-11-21T14:05:00'

[hardware.platform.step.official]
done = true
evidence = '''官方页 docs/zh/porting/platform.md 的四节逐条对应：
- #source-map（:10-19）：「ArmCpu：CPU 注册、计时器/GIC 初始化、次级核入口和 IPI」。对应 drivers/ArmCpu/ArmCpu.cpp:485-594（注册）、:406-451（GIC）、:750-753（次级核入口）、:696-704（IPI 发送）。注意该表写 ArmCpu rev 9066b53b，而 components.toml:3-19 钉的是 93a5030c，引用版本号时以 components.toml 为准。
- #1 描述 CPU 和中断资源（:21-39）：「MPIDR 亲和性、启动核、启用核数、PSCI 方式、GIC 版本、分发器/重分发器范围与 stride、定时器频率、中断描述」。本板的取值在 scripts/make-pong-adt.py:174（psci-method=smc）与 drivers/ArmCpu/ArmCpu.cpp:314-363（GIC 范围/stride 从 ADT 读，redistributor-stride 接受 0x20000/0x30000/0x40000）；PSCI 方式是 SMC，与 sm8475.dtsi:60-63 的 psci 节点一致。
- #clusters 能效簇与性能簇（:41-54）：「给每个 CPU 加 unixnu,cluster-type」。现状是反的：E:/hackios/UniXNU-sm8475-common/dts/sm8475.dtsi:22-59 把八个 cpu 节点全写成 "P"，而 SM8475 是 1+3+4（X2 + 3×A710 + 4×A510）。本线只记录、不改；触发条件写在 ARMCPU-FORK-VS-CATALOG.md §5。
- #block-and-os-services（:69-80）：OS 服务表里与平台线相关的是 VerifiedRoot 与 DarwinBoot 的映射输入；本线只提供 CPU/GIC 与 ml_io_map 的预算结论（PLATFORM-BUDGETS.md）。
- #4 检查组装后的选择（:86-99）：「record source/build and device evidence separately」——本文件即离线部分，设备部分由 Lead 写。
另按该页点名读了 drivers/arm-cpu.md（17 行，构建走 component:ArmCpu → build/armcpu/libArmCpu.a）、drivers/arm-dt-platform.md（17 行，「需要 /cpus、/arm-io、/defaults、/options 和 NVRAM proxy」，注意它没有要求 /psci，而 catalog ArmCpu 的 psciConduit 却读 /psci）、drivers/arm-smmu4k.md（19 行，SMMUv2 原生 4 KiB 表；27 defconfig 里 CONFIG_XNU_NATIVE_ADRENO=n，本线不激活）、porting/bring-up.md:74-103（阶段 5 内核入口 / 阶段 6 存储与根卷，SMP 起核属阶段 5）、concepts/boot-chain.md:65-98（DarwinBoot 到 XNU 的交接，与 secondary 入口的 cache 维护相关）。'''
recorded_at = '2026-11-21T14:05:00'

