evidence = "The prelink closure has 38 bundles and none is Bluetooth (docs/plans/BT-IOS27-PORT.md:523-526); the 28 missing and 29 stubbed entries are owner-target references, not Apple's Bluetooth kexts, so they neither prove nor disprove Bluetooth. The 0521 blob is an empty 106-entry manifest, not the 113-file payload (docs/plans/BT-IOS27-PORT.md:129-153 and docs/plans/BT-IOS27-PORT.md:511-513). 24A446 bluetoothd is not extracted, so the product-id answer remains unproven (docs/plans/BT-IOS27-PORT.md:580-586). The storage line's PENDING-safe entry prints the switch state last and refuses a half-set switch (scripts/check-ios27-storage-preflight.py:18-25); Bluetooth has no equivalent entry. Files: docs/plans/BT-IOS27-PORT.md, scripts/check-ios27-storage-preflight.py."

