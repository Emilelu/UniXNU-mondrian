# Precedent-gap adjudication for 28 patch files found outside the ledger.
# Every evidence line quotes our tree at the cited file:line.

[[item]]
repo = "asteroids"
file = "patches/xnu-12377-ios27/zzzzzzzzzz-ios27-dataconst-room.patch"
verdict = "unknown"
what = "Moves the DTrace SDT probe cstring to __TEXT and the probe records to __DATA, and disables the 30-entry pageout stat table under DEVELOPMENT so the kernelcache's __DATA_CONST section fits."
reason = "No equivalent exists in our series or tree; the patch is sized for the iPhone17,4 kernelcache's __DATA_CONST overflow and K60 is iPhone17,2, so whether our kernelcache overflows the same section is unmeasured."
evidence = 'board.toml:360 description = "Redmi K60 (mondrian/SM8475): iOS 27.0.1 (iPhone17,2) bring-up"'

