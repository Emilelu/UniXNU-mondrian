# 与 docs/research/EIGHT-STEPS.toml 的 [hardware.display]（16.6.1 / 20G81）并列：
# 这里只记 27 的声明与证据，不覆盖 16 线已成立的结论。七个步骤由
# scripts/assemble-27-eight-step.py 合并进 EIGHT-STEPS-27.toml；step.device
