# --------------------------------------------------------------- stages -----
# On-device measurements. Each one has a marker, an expected value and a
# written failure action, so a boot produces PASS/FAIL, not an opinion.

[[stage]]
id = "M1"
name = "ADSP alive and handoff published"
marker = "k60-adsp-glink-handoff"
expect = "property present, 104 bytes, acquire returns 0 (not -1000)"
on_fail = "stop; no audio work; fall back to image m; the provider line owns this stage"

[[stage]]
id = "M2"
name = "adsp_apps channel up"
marker = "PongAudio: glink"
expect = "open acknowledged, channel up within 5 s, unknown_opens stays 0"
on_fail = "stop; dump QcomGlink counters and last_unknown; two-slot wiring is at fault"

[[stage]]
id = "M3"
name = "APM answers"
marker = "PongAudio: apm"
expect = "GET_SPF_STATE response status 1"
on_fail = "stop; APM is not up; GPR addressing or domain ids are wrong"

[[stage]]
id = "M4"
name = "AFE six steps acknowledged"
marker = "PongAudio: afe"
expect = "six steps, each ACK status 0; clock reads back at the voted rate"
on_fail = "stop at the first failing step; record its opcode and status word"

[[stage]]
id = "M5"
name = "sound"
marker = "PongAudio: pcm"
expect = "frames advance, underruns do not grow, speaker audible"
on_fail = "stop; keep the AFE state, report which of codec, soundwire or amp is silent"
