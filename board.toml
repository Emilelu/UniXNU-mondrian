schema_version = 2

[board]
name = "mondrian"
soc = "SM8475"
soc_source = "sm8475"
os_profile = "ios-27.0.1-24A446"
description = "Redmi K60 (mondrian/SM8475): UniXNU UEFI bring-up"
kit = "mondrian"

# The kernel and prelink inputs live in the OS profile (profiles/os/<os_profile>),
# the SM8475 resources in the SoC source, and the board wiring in dts/mondrian.dts.
[components]
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "PongUfs"]

[kernel]
defconfig = "mondrian_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8475.config", "os:configs/ipados.config"]
# The K60 series still carries every patch; the shared layers have empty series for now.
patch_series = ["device:patches/xnu/series"]
archives = ["component:ArmDTPlatform", "component:ArmCpu", "component:PongUfs"]
driver_records = "DEVELOPMENT_ARM64_PONG"
# The Pong Adreno / UI provider scripts are not selected by this key. The kernel
# build only reads the PONG_NATIVE_DRIVER_SOURCE environment variable:
#   scripts/build-xnu-4k-baseline.sh:240   shim-bin goes on PATH when
#                                          $PONG_NATIVE_DRIVER_SOURCE has one
#   scripts/build-xnu-4k-baseline.sh:250   ArmDT / ArmCpu provider scripts
#   scripts/build-xnu-4k-baseline.sh:260   storage ABI derivation
#   scripts/build-xnu-4k-baseline.sh:268   NativeUfs transport compile
#   scripts/build-xnu-4k-baseline.sh:273   NativeRamBlock compile
#   scripts/build-xnu-4k-baseline.sh:970   Adreno platform, falling back to
#                                          ${PONG_NATIVE_DRIVER_SOURCE:-$ROOT}
# and no repository code reads a [kernel] pong_native_driver_source key. The
# scripts that were executed out of that tree live in this repository
# (scripts/build-pong-*.py, scripts/bind-ios16-storage.py,
# scripts/derive-ios16-storage-bindings.py), so the fallback now points at the
# checkout instead of the assembled build tree, which has no drivers/PongAdreno.
# Set the environment variable only to build against a different driver tree;
# see scripts/k60-macos-preflight.sh:13-14 for the macOS CI form.
# pong_native_driver_source IS read, by the unixnu framework rather than by
# this repository: scripts/unixnu/kernel.py:191 assigns it to the
# PONG_NATIVE_DRIVER_SOURCE environment variable. Dropping the key leaves that
# variable empty, build-xnu-4k-baseline.sh:250 then skips the ArmDT provider,
# and line 986 fails with 'test -f "$ARM_DT_ARCHIVE" failed'. 2026-11-12.
pong_native_driver_source = "/tmp/k60build/pong-driver"

[userdata]
first_lba = 53342976
last_lba = 61731583
lba_bytes = 4096
windows = [{ "name" = "OS", "component" = "OS" }, { "name" = "SystemOS", "component" = "Cryptex1,SystemOS" }]

[device_tree]
source = "device:dts/mondrian.dts"
include_dirs = ["soc:dts"]

[firmware]
config = "mondrian"
dsc = "Platforms/Xiaomi/mondrianPkg/mondrian.dsc"
fd = "Build/mondrianPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
patches = [
  # Five K60 fixes the pinned Mu_Basecore (6f805f2, release/202608) does not carry.
  # They live in the uefi repo as patch files and apply cleanly to the pin; applied here
  # for the build and reverted in firmware.py's `finally` block.
  #
  # The sixth fix (AsmMacroLib section naming) is NOT here: upstream solved it differently
  # at 6f805f2 with an `#ifdef __ELF__` split, so the old patch no longer applies.
  # Verified 2026-11-16: pin + these five reproduces ten of the eleven files that the
  # local-only commit 3d2a9fa had changed, byte for byte (P-217).
  "Resources/MuPatches/Auth-Service.patch",
  "Resources/MuPatches/Boot-Manager.patch",
  "Resources/MuPatches/K60-Exception-Image.patch",
  "Resources/MuPatches/Timer.patch",
  "Resources/MuPatches/Usb-Bus.patch",
]
packages = [
  "{uefi}",
  # UniXNUPkg must come from this repo's vendored copy, not from {tree}/package:
  # the tree stages the framework's older package, and with it first in
  # PACKAGES_PATH EDK II silently compiled that copy into the FD (its
  # UniXNURamDiskDxe lacks the initrd tracing added here, which is how the
  # difference was found). Keep the platform root ahead of {tree}/package.
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
  # K60 bring-up inherits the pong vendor DXE/GOP binaries.
  "{uefi}/Binaries/pong",
]

[firmware.defines]
DEVICE_MODEL = "0"
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "UniXNU-Mondrian"

[payload]
volume = "UNIXNU"
size_mib = 192
loader = "firmware"
title = "UniXNU"
# The upstream entry probe patches the prelinked kernel image: it paints the
# stage bars (blue at the kernel entry with the MMU off, magenta just before the
# MMU comes on) and, with the reset delay, resets the board through PSCI six
# seconds after the MMU is on. That turns "did the kernel get past the MMU
# enable" into a board that walks back to fastboot on its own instead of a
# manual power cycle.
#
# The reset delay is now off. The boot CPU got past the MMU and past the CPU
# start order, so the stage 3 timer only cut the run short six seconds in and
# hid whatever came next. Without it the kernel runs until it fails, and the
# failure stays on the frame buffer: the kernel's own video console prints the
# panic text and patch 0246 scales that text to a readable size.
#
# The probe's panic screen stays off: it installs code in the padding after
# panic(), whose address is fixed for the reference kernel, so it refuses to
# patch ours.
# entry_probe_reset_delay = 6
# Contiguous handoff ARENA size, not total installed DRAM. The actual live
# Android memory map has six banks. Use only measured [0x900000000,0xa40000000)
# below high reservations; must match dts/mondrian.dts and MemoryMapLib.c.
dram_size = "0x140000000"
# pong_software_keybag=1 selects the volatile no-passcode keybag from
# zzzzzzzzzzzzzzzzzzzzzzzz-pong-software-keybag.patch. Without it mkbinit cannot
# load a system bag on this board (no SEP) and forces a recovery-mode reboot.
# disable_exc_resource stops the wakeups/disk-write monitors from reaching
# exception_triage() and task_terminate_internal(): on this board the services
# that consume those exceptions are still missing, so watchdogd is killed for a
# FATAL wakeups violation it cannot answer. Remove it once they run.
# pong_ufs_readwrite=1 is what makes the UFS windows writable at all
# (PongUfsTransport gates every write on it); without it even the Data
# window is published read-only and nothing can be mounted read-write.
# amfi_get_out_of_my_way=1 opens three gates at once in this tree:
#   libkern/amfi/miniamfi.c:266 registers the AMFI interface stand-in, so the
#     amfi pointer is no longer NULL and codesigning has a table to ask;
#   bsd/kern/kern_minimac.c:477 registers the miniamfi and minisandbox MAC
#     policies - without a policy named "Sandbox" every __mac_syscall returns
#     ENOPOLICY (bsd/security/mac_base.c) and the launchd, tccd, timed and
#     securityd daemons die in sandbox profile init. That is the SIGKILL storm
#     this board showed on 2026-10-31 and it will come back on darwin24;
#   bsd/kern/kern_codesigning.c:289 turns it into CS_CONFIG_ALLOW_ANY_SIGNATURE,
#     the same thing cs_enforcement_disable=1 asks for.
# It is safe here and only here: the 22H374 profile does not prelink the real
# AppleMobileFileIntegrity kext, so amfi_interface_register() has a single
# caller. The 16.6.1 route prelinks the real kext and adding this argument
# makes the stand-in and the kext collide - panic "AppleMobileFileIntegrity
# interface already set" at libkern/amfi/amfi.c:11, which is what
# boot-amfi.img (2026-10-31) and boot-amfi2.img (2026-11-01) both showed.
#
# These arguments are the measured payload of boot-0461-20261107.img (and of
# boot-0442-20261107.img before it): 28 entries, debug=0x140, 581 bytes of a
# 600-byte command line (docs/reference/PITFALLS-FROM-HISTORY.md pitfall 124).
# Both images reached SpringBoard on the board, so this is the verified list.
# Read the measured list back out of an image with a FAT directory walk over the
# payload volume (/EFI/UniXNU/unixnu.toml, the `args = "..."` line); the boot img
# header and payload offset for these images are documented in
# docs/state/LEDGER.md. boot-0601-goldenargs.img carries a different, 19-entry
# list and is not a substitute for this one
# (docs/state/BUILD-RECIPE-2026-11-08.md records the difference).
#
# The arguments that only exist here, and what their absence did:
#   debug=0x140                 not 0x144. 0x144 has DB_NMI, so a panic parks
#                               in the debugger and never reboots; 0x140 lets
#                               0334/k60_panic_reset hand the board back to
#                               fastboot through IMEM 0x146AA65C instead.
#   k60_usblog=2                enumerates the USB CDC console. Without it the
#                               board is silent even when the kernel is running.
#   k60_skip_firmware_mount=1   launchd's mount-phase bind mounts get EPERM on
#                               this board and PID 1 panics on the error.
#   k60_tolerate_cache_loader=1 a crashed launchd_cache_loader stops being fatal.
#   k60_panic_reset=1           automatic fastboot after a panic, so a failed
#                               experiment does not need a power cycle.
#   k60_console_export=1        exports the console to /chosen for the host.
#   k60_selftest_reboot=300     self-reset watchdog: 150 hearts of 2 s, then
#                               back to fastboot (pitfall 133).
#   amfi_get_out_of_my_way=1, launchd_unsecure_cache=1, xpcproxy_idversion=1,
#   k60_entitlement_allow=1, k60_skip_iosurface=1: the userland gates that let
#   launchd and SpringBoard start without a real AMFI/SEP.
#   pong_metal=2, k60_autoreset=300, applog=1 and the absence of fb_threads /
#   k60_textonly are not cosmetic: the 2026-11-11 image that boots into
#   SpringBoard passes exactly this set, and the 2026-11-12 builds that replace
#   pong_metal=2 with 1 lose SpringBoard to a code-signing page storm
#   (cs_invalid_page 11x, 27 corpses) while the same kernel with these arguments
#   still reaches userland. k60_touch_se is absent on purpose: the driver
#   rejects 19 and stops polling, and stage 6 cannot reach the panel anyway
#   until the qup4 GPIO SPI pin roles exist in the ADT.
kernel_args = [
  "-v", "native-ufs=1", "pong_allow_unauthenticated_root=1", "debug=0x140",
  "cs_enforcement_disable=1", "pong_software_keybag=1", "disable_exc_resource=1",
  "pong_ufs_readwrite=1", "k60_console_export=1", "k60_usblog=2", "pong_data_mount=1",
  "pong_data_rw=1", "amfi_get_out_of_my_way=1",
  "pong_init_path=/private/var/pong/init", "epoch=1793709100",
  "k60_skip_firmware_mount=1", "k60_tolerate_cache_loader=1", "launchd_unsecure_cache=1",
  "xpcproxy_idversion=1", "k60_init_blob=1", "k60_launchd_cache=1", "k60_entitlement_allow=1",
  "k60_skip_iosurface=1", "k60_panic_reset=1", "pong_adreno_start=1",
  "pong_metal=1", "pong_gpu_scanout=1", "sheng-gpu-addon=1",
  "k60_autoreset=300", "applog=1",
  "-uketextconsole", "-ukedeferredconsole"]
# All eight CPUs. The AppleARMCPU device-tree validation that required a
# single-CPU ADT is bypassed by the kext patch on _validateConfiguration, and the
# K60 ArmCpu driver instantiates every device_type=cpu node then starts the
# secondaries through PSCI.
cpus = 8
tools = true
# Unattended bring-up needs a countdown. timeout = -1 means "wait for a key"
# whenever an input device is present, and the K60 keypad (K60KeypadDeviceLib)
# always is: measured 2026-10-29 18:47, the unit parked in the menu, dropped off
# USB and never came back, with XNU never loaded. A positive value boots the
# default entry ("xnu") after that many seconds. If the kernel then fails and the
# menu falls back to "Return to firmware", the unit lands in BDS -> Android,
# which is the state a host-side watchdog can recover from.
# 2026-11-22 03:04 (user): no more manual steps. The countdown is back on and the
# default entry is the 27 kernel, so "power on -> kernel" needs nobody at the panel.
# The black-panel discrimination it was disabled for is now covered by the stage
# bars and by BOOT-FREEZE.md, not by parking the menu.
timeout = 10

# B decision (2026-11-03): align with pong and drop the whole trust-cache path.
# The payload ships no trust-cache sidecar (no --trust-cache anywhere in the
# build chain), so this whitelist is intentionally empty. payload.py reads this
# from [payload], not from [payload."adt"], and only consults it when a
# --trust-cache is passed; keep it an array (schema).
trust_cache_sha256 = []

[payload."adt"]
"chip_id" = "8015"
# Platform identity. Without a seed devicetree.py emits no
# /chosen/unique-chip-id (devicetree.py:312-317), and the bt line logs
# "K60 BT: no platform identity (-2); bluetooth not published" while
# bluetoothd refuses to run (no MAC). The seed is a synthetic board
# identity (K60T, documented in docs/audits/BOOT-STALL-2026-10-31.md:235);
# changing it changes the BT MAC and breaks pairing, so it moves once here.
"unique_chip_id" = "required"
"root_match_volume_uuid" = "C5DAF029-2070-4F68-B3CC-1D1320344CF0"
# DarwinBoot window. Without this key the loader falls back to
#   DarwinBoot.c:20   #define WINDOW_SIZE SIZE_256MB
#   DarwinBoot.c:723  if (WindowSize == 0) { WindowSize = WINDOW_SIZE; }
#   DarwinBoot.c:794  Args->MemorySize = WindowSize;
# so boot_args->memSize reaches XNU as 256 MiB, and arm_vm_init.c:1857 turns that
# into mem_size (gPhysBase comes from args->physBase, i.e. this window's address).
# The earlier 4 GiB attempt targeted [0x100000000,0x380000000), a no-RAM
# hole. Live serial-6033dbec FDT/iomem place high RAM at 0x800000000 and above.
# Firmware exposes only measured arena [0x900000000,0xa40000000); screen
# reports mem=actual=managed=4096 MiB. Service exits continue; SpringBoard is
# pending. devicetree.py emits darwinboot-memory-size from this key.
# 2026-11-14: 4.75 GiB -> 4.5 GiB. The Wi-Fi line's budget model shows a
# 65.9 MB kernel with the 51 MB Metal plugin inside leaves ~16 MiB of
# headroom at 4.75 GiB, and MHI needs a DMA arena on top of that. The
# window is a board contract, so it moves once here for every line.
"owned_memory_size" = "0x120000000"  # 4.5 GiB window (256 MiB below the 4.75 GiB step)

# K60 live FDT: xiaomi_touch@0 on QUP0 SE4. These absolute resources are
# metadata for the board-started driver, not an incomplete interrupt mapping.
[adt.arm-io.pong-touch.string]
compatible = "xiaomi,m11a-spi"

[adt.arm-io.pong-touch.u64]
spi-base = "0x990000"
tlmm-base = "0xf000000"
gcc-base = "0x100000"

[adt.arm-io.pong-touch.u32]
gpio-offset = "0x100000"
avdd-gpio = 71
max-x = 14400
max-y = 32000

[adt.arm-io.pong-touch.bytes]
pins = "100000001100000012000000130000001500000014000000"

# MISO, MOSI, SCLK, CS. SM8475/SM8475P data sheet 80-27620-1 Rev.AJ Table 2-4
# (printed p44) maps QUP[4] L0..L3 to GPIO16/17/18/19, and Xiaomi
# mondrian-s-oss pinctrl-cape.h confirms qup4 function slot1 on the same four
# pads. The earlier 24-permutation scan (P-70) only showed which pad floats high
# under a pull-up; it never proved a lane role, and its author replaced it with
# this table (yibiya 2d3d023). The chip's own boot-option read-back is still the
# only end-to-end proof, so a failed handshake means the pads or the rails are
# wrong, not that this order is wrong.
bitbang-pins = "10000000110000001200000013000000"

# The PMIC key driver (patches/xnu/zzzz...-pong-physical-keys.patch) looks
# /arm-io/pong-buttons up by exact name and asserts all six values. Until now
# the node existed only as an uncommitted edit in the build-copy profile, so a
# clean rebuild printed "Pong keys: DT node /arm-io/pong-buttons not found".
# Values are the SM8475 SPMI addresses the driver already uses: PON at
# 0xc400000, the PM8350 GPIO block at 0xc42d000 and the observer at 0xc440000;
# pon-ppid 0x13 is the power key and volume-up-ppid 0x18d the volume-up key.
[adt.arm-io.pong-buttons.u64]
core-base = "0xc400000"
cnfg-base = "0xc42d000"
observer-base = "0xc440000"

[adt.arm-io.pong-buttons.u32]
ee = 0
pon-ppid = "0x013"
volume-up-ppid = "0x18d"

# iOS buttons node. devicetree.py emits `buttons` only when board.toml carries
# [adt.buttons.*]; without it userland cannot map the PMIC keys even though the
# kernel driver already reports them ("Pong keys: arbiter v7 ... power=1 up=1
# down=1" on 234 boots, with real 0/1/2 down/up events in the logs). Names and
# order follow the reference boards; home-button-type 2 is the capacitive-home
# type the pong family uses.
[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

[package]
# The framework checkout this board is built against.
unixnu = "../UniXNU"

[package.defconfig]
"ipados-16.6.1-20G81" = "mondrian_defconfig"
"ios-27.0.1-24A446" = "mondrian_ios27_defconfig"


# ---------------------------------------------------------------------------
# iOS 27.0.1 (24A446) is the default; iOS 16.6.1 (20G81) is the override.
#
# The top-level tables above are the iOS 27.0.1 stage-0 board: arm64e, 4 KiB
# pages, xnu-12377, and the seven-argument command line that reaches BSD init.
# That is what `unixnu build` produces with no `--os` argument, because this
# branch's job is the 27 line (user decision, 2026-11-19).
#
# The iOS 16.6.1 board that reached SpringBoard is still here: with
# `--os ipados-16.6.1-20G81` the loader finds no override for that profile
# (scripts/unixnu/profiles.py:57-71: `overrides.get(os_name, {})`), so the
# 16.6.1 keys are simply the ones the 27 override rewrites. The two profiles are
# proven equivalent to the boards they came from by
# `scripts/tests/test-board-profiles.py`; the boot evidence for the 16.6.1 side
# is the `state = "booted"` entry for 081dc2f8 in docs/engineering/MAIN-BASELINE.toml.
#
# `--os ios-27.0.1-24A446` rather than `--os 27` on purpose: after
# scripts/install-os-profile.sh copies this profile into the framework
# checkout, `resolve_os` would match both `ipados-27.0.1-24A446` and this one
# and refuse the ambiguous major version.
[os_overrides."ios-27.0.1-24A446"]
# Keys this profile does not have. `remove` takes dotted paths.
remove = [
  # Stage 0 builds no Pong driver tree: PongUfs and its pong_native_driver_source
  # recipe come back in F3. Everything else above (the DarwinBoot window, the
  # unique_chip_id seed) is a board contract both profiles share.
  "kernel.pong_native_driver_source",
]

[os_overrides."ios-27.0.1-24A446".board]
description = "Redmi K60 (mondrian/SM8475): iOS 27.0.1 (iPhone17,2) bring-up"

[os_overrides."ios-27.0.1-24A446".components]
# No PongUfs at stage 0; it returns in F3.
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink"]

[os_overrides."ios-27.0.1-24A446".kernel]
defconfig = "mondrian_ios27_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8475.config", "os:configs/ios.config"]
# The arch and OS layers bring arm64e, the 4 KiB tables, the Darwin 26 calls and
# the prelink. The device series carries two upstream patches
# (ptrauth-string-discriminator, armcpu-sleep-hook) and the Bluetooth series
# 0500-0523; patches/xnu-12377/series is the order of record.
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu-12377/series", "os:patches/xnu/series", "device:patches/xnu-12377/series"]
# The fileset reference builds here without --lto: cctools-port's ld64 reads no
# LLVM bitcode and the pinned LLVM 24 has no llvm-link, so the LTO variant stays
# 2026-11-22: --skip-build because the framework builder cannot link the 27 reference
# (IOUnifiedAddressTranslator has no source in either the 16 or the 27 tree; the carried
# LTO reference is the authoritative artifact and its sha256 is recorded). CONSOLE-GAP.md.
# a macOS/Xcode 26 artifact. patches/unixnu-core/fileset-reference-linux.patch
# stubs its two LLVM profile-runtime calls.
# The framework catalog declares ArmDTPlatform and ArmCpu without a build
# recipe (build = None), so on this line -- which uses the generic builder --
# their component: entries produce nothing, and
# build-fileset-release-reference.py then dies on
# tree/build/armdt-platform/libArmDTPlatform.a. The 16.6.1 line never saw that
# because its own builder ran the two vendor recipes itself.
# build-k60-platform-archives.py drives those same recipes against the tree
# this build just resolved, so the archives appear where the fileset step
# looks for them.
archives = ["build-corecrypto-14.py", "build-corecrypto-14.py --namespace", "component:ArmDTPlatform", "component:ArmCpu", "build-libpthread-kernel.py", "build-firehose-stub.py --tree .", "build-k60-platform-archives.py --tree .", "build-k60-fileset-reference.py --tree . --skip-build"]
# Boot-record label. The object tree is BCM2837, the 4 KiB machine config this
# profile builds; PONG belongs to the 16.6.1 line and would point the next
# reader at a target this profile never produces.
driver_records = "DEVELOPMENT_ARM64_BCM2837"

[os_overrides."ios-27.0.1-24A446".payload]
title = "iOS 27"
# Stage 0: reach bsd_init before any storage, display or GPU argument exists.
# `native-source-storage=1` / `native-ufs-root=1` come back with PongUfs in F3.
# This is cupid's stage-0 list: same 24A446 profile, same arm64e kernel, same
# debug flags - the combination that reached BSD init on SM8450.
# serial=3 replaces k60_usblog=2: the 12377 console is the firmware one.
kernel_args = [
  "-v", "debug=0x14e", "kt_fixed_zones=120", "-no_slto_panic",
  "use_contiguous_hint=0", "amfi_get_out_of_my_way=1", "k60_fontscale=3",
  # -enable_kprintf_spam turns kprintf on (a DEVELOPMENT build keeps it off,
  # P-308).  It is only safe together with 0557: that patch removes the print
  # inside initialize_screen() that runs before v_rows exists (xNekom c3c89df:
  # the scroll then writes past the framebuffer and the board hangs) and prints
  # the same geometry after gc_initialize().  check-kprintf-enabled.py requires
  # the flag and 0557 to travel together.
  # 0558 (vcattach text console) is gated on -uketextconsole and 0559 (deferred
  # video kprintf) on -ukedeferredconsole; without these two the patches are
  # inert and the console still never switches to text (uke PROGRESS.md:229).
  "-uketextconsole", "-ukedeferredconsole",
  "-enable_kprintf_spam",
]

[os_overrides."ios-27.0.1-24A446".payload.adt]
# T8140 = iPhone 16 Pro Max (iPhone17,2, D94AP): the OS profile's identity.
chip_id = "8140"
# /chosen/random-seed decides the physmap slide, and a random one kills about
# one build in three in pmap_map_bd in a way that reads as memory corruption.
# The reference board table pins 64 bytes of 0x11 and xnu-12377 reads four
# 64-byte seeds, so the value repeats. Pinning it also makes the image
# reproducible. Stage 0 only; a shipped system must not carry a published seed.
random_seed = "11"
# The OS volume UUID of the 24A446 iPhone17,2 root, from the profile. It is not
# the 16.6.1 Data UUID above: this is the volume the 27 root mount matches.
root_match_volume_uuid = "E3F4AED0-4454-4D5B-833C-E27E99C4F67B"
