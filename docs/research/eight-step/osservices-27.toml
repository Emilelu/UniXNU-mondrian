done = false
evidence = '''缺：同型（SM8550 / sheng，同一 ipados-27.0.1-24A446 profile）上这三项的实际接法。
已核到的反面事实：E:/hackios/UniXNU-sheng/board.toml 全文没有 [firmware] 表，grep 不到 preflight 选择；E:/hackios/UniXNU-sheng/drivers/ShengPreflight 是空子模块目录（gitlink 9cfc8d2c），内容取不到；同仓 package/KeyStoreProbe.cpp 是 payload 侧探针，不是内核 provider；AppleKeyStoreState 的 6 个 native_aks_* 符号在 UniXNU-sheng / UniXNU-mondrian / UniXNU-pong / UniXNU-zizhan / xnekom-ios27 里都没有内核侧定义。
仍缺：sheng 是否把 SoftwareAES 作为 component: 引用、sheng 的 AKS 走哪条路（MiniAppleKeyStore 还是 kext）、sheng 的板级预检脚本清单。
能定它的证据：上述三处各给一条 file:line（sheng 侧 build 记录或 board.toml），加本板 16.6.1 的同项状态（16 线只有 zzzzzzzzzzzzzzzzzzzzzzzz-pong-software-keybag.patch 的软件 keybag，27 线连 MiniAppleKeyStore.cpp 都没有）。'''
