# 电池/充电 wire 属性号契约（battery / usb / wireless）
#
# 一条 row = 驱动字段 → 请求里的 {opcode, 下标} → 运行时 map 值 → 文档出处。
# 三份独立材料必须同时一致，检查器才算通过：
#   1. drivers/PongPower/K60Battmgr.c 的 fields[]（协议顺序，见 K60Battmgr.h 的 enum）
#   2. docs/research/charger/04-PROP-MAP.md 的表格（.ko 反编译结论）
#   3. 厂商模块 qti_battery_charger_main_m81.ko 的 .rodata map（本机可选：给了路径才读）
#
# 为什么单独成表：wire 上的 prop_id 是**域名 map 的下标**，不是枚举值本身；小米版比上游
# mainline 多一层间接，CAPACITY 是 0x2e 而 mainline 是 41。27 侧复用同一台 ADSP 与同一段
# battmgr 协议，所以这张表是跨版本常量——变的是 IOKit 侧属性号，不是 wire 下标。
schema = 1
checked_by = "python3 scripts/check-battmgr-wire.py"

[[field]]
name = "Status"
source = "drivers/PongPower/K60Battmgr.c:24"
opcode = "OP_BATTERY"
index = 0
map_value = "0x00"
documented_at = "docs/research/charger/04-PROP-MAP.md:368"
note = "电量计状态；map 值与 mainline STATUS 相同"

