# docs/research/audio/AUDIO-CLOSURE.toml
#
# Machine-readable closure ledger for the K60 audio line.
#
# Rule (user, 2026-11-17 00:24): no image may be offered for a boot while any
# item below is "open" or "blocking". scripts/check-audio-closure.py enforces
# this and exits 1, so the rule is a tool, not a promise.
#
# Item fields:
#   id             stable slug
#   stage          M1..M5, which boot stage consumes the item
#   change         what changes on the device side
#   evidence_kind  static | unit | artifact
#   evidence       repo-relative proof; "path:line" or "path:12,34" allowed
#   criteria       how a reviewer checks the evidence is real
#   status         closed | open | blocking
#   owner          who closes it
#   on_open        what it blocks (short)
#
# On-device things that cannot be closed offline are NOT items. They live in
# [[stage]] below as pre-written pass/fail criteria, which is the only place a
# measurement is allowed to stand in for evidence.

schema = 1
updated = "2026-11-17"
owner = "audio-agent"
rule = "A boot is offered only when every item is closed and every stage has a written criterion."

[scope]
freeze = [
  "drivers/PongAudio/",
  "drivers/PongPower/",
  "patches/audio/",
  "patches/xnu/0504-k60-audio-pong-audio.patch",
  "docs/research/audio/",
]
not_ours = [
  "bsd/dev/K60Battmgr.c",
  "patches/wifi/",
  "patches/touch/",
]

