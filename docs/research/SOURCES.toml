finding = """本次 ①②③ 调研记录。① 同型：Pong 是 SM8475 + QCA6490，与 K60 完全相同，40 KB 的 PCIe0 冷启动实现可直接参考。② 官方：Ath12kWifi 组件针对 ath12k（qcc2072/qcn9274/wcn7850），K60 是 QCA6490（ath11k 族），MHI/QRTR 接口不同 → 官方无覆盖，只能参考 Pong + mainline ath11k。③ 反编译：K60 固件路径与大小已知，但 PCI 层参数（device id / BAR / subsystem_device）待补。"""


