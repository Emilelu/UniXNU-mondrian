reason = "the same shape as the IOHIDFamily slot: __common zero fill, vmaddr inside __DATA and file offset outside the segment, referenced only by a runtime-installed pointer. Silent if wrong for the same reason, and equally unnameable because the cache keeps no imports or symbols."
review = "2026-11-21 lead, same evidence; re-review when a symbol-bearing artifact exists"

