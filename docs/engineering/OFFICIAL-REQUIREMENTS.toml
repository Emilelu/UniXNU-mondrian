# Official documentation requirements — one entry per page of the zh mirror.
#
# The mirror is E:/hackios/UniXNU/docs/zh (upstream UniXNU). A page is satisfied only
# when its entry names a gate and that gate passes; `state` records where we stand:
#   mapped   - a gate enforces the page
#   unmapped - nobody checked this page yet (the debt)
#   na       - the page does not constrain this board, with `why`
# `sha256` is the page we read. Editing a page without updating the entry makes the
# gate report it stale, so a changed requirement cannot pass unnoticed.

