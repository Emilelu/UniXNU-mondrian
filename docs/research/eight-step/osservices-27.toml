[hardware.os_services.step.official]
done = true
evidence = '''逐节落成要求，并给出本板落点或判 na 的理由：
- E:/hackios/UniXNU/docs/zh/porting/platform.md:76 SoftwareAES「匹配 XNU AES 辅助接口与 IOCryptoAcceleratorFamily ABI，为 OS profile 构建绑定；预期：加密服务发布，需要的卷操作完成」→ 本板 27 profile 不含 SoftwareAES（board.toml:341-410 的 components.include 只有 ArmDTPlatform/ArmCpu/XnuPrelink）；且 E:/hackios/xnu-12377 里 IOAESAccelerator / IOCryptoAccelerator 两个类 0 命中（*.h/*.c/*.cpp/*.exp），iokit/conf/files:7 只有 `OPTIONS/crypto optional crypto`，所以这两个类来自 prelinked com.apple.iokit.IOCryptoAcceleratorFamily，接入点只能是 ABI 匹配而非编译期继承。
- 同页 :77 AppleKeyStoreState「根据 OS 确认 selector 和状态回调，接入初始化与事件调用方；预期：所需状态查询与通知完成」→ catalog 已声明 ipados-27.0.1-24A446（E:/hackios/UniXNU/components.toml:250），但本板没有 provider（见 same_model 的反面事实），27 上要么补 provider 要么明确「无 keybag、sheng-aks-sls=3 报无密码」是设计状态。
- 同页 :80 ShengPreflight「阅读其板级检查，再为目标固件和内存布局编写检查；预期：目标固件输入通过对应检查」→ 机制在 E:/hackios/UniXNU/scripts/unixnu/firmware.py 与 docs/zh/porting/uefi-firmware.md:169-172（[firmware] preflight 里的构建脚本在 EDK II 构建前跑，--skip-preflight 可跳）；本板 board.toml 没有 [firmware] preflight 键，也没有预检脚本。
- E:/hackios/UniXNU/docs/zh/porting/drivers.md:46 第 8 行给出这五项，:51-76 的五步（选启动路径、资源清理、按所选 OS 编译：类布局/vtable 槽位/selector/参数结构/从 kernelcache 取符号绑定、加进 recipe 的 [components] include 与 [kernel] archives、接选择与链接）是本线 A 段的写法模板。
- E:/hackios/UniXNU/docs/zh/drivers/xnu-prelink.md（只读）：--allow-missing 时调用落到 unixnu_fileset_unmapped；native adapter 记成 N_ABS <stub>.original 并进 native_original_branches；24A446 打包 profile 会拿 original unslid imported targets 校验回归策略 —— 这三条决定了「13 项怎么算修好」（见 B.9 与 C 段）。
- E:/hackios/UniXNU/docs/zh/concepts/security.md：/chosen/amfi-only-platform-code、[kernel.prelink] 的 early_security_init 跑目标地址上的原始 AMFI 初始化、4 KiB 签名哈希（native-4k-signature-hash-cache）、失败置 CS_VALIDATE_TAINTED。本板 profile 的 early_security_init = com.apple.driver.AppleMobileFileIntegrity=0xfffffff00921000c 与 ADT 的 amfi-only-platform-code = 1 与这一节一一对应。
- 判 na：docs/zh/drivers/kexts.md 的 kext 加载路径对本板不适用 —— 加载器在 KextCount != 0 时直接拒绝（E:/hackios/uefi-mondrian/Platforms/Xiaomi/DarwinBootPkg/Driver/DarwinBoot.c:783-786），版本门是 Platforms/Xiaomi/UniXNUPkg/Include/Protocol/UniXNULoader.h:20 的 UNIXNU_LOADER_REVISION = 0x00020000。'''
recorded_at = "2026-11-21T17:05:00"

[hardware.os_services.step.decompile]
done = true
evidence = '''两半都做了：机制取证（内核侧）与产物取证（本板构建）。
1) 桩的行为：E:/hackios/UniXNU/patches/xnu-12377/fileset-unmapped-call.patch:13-19 新增 __attribute__((noinline, noreturn, used)) unixnu_fileset_unmapped(uint64_t,uint64_t)，panic 串带 __builtin_ptrauth_strip(__builtin_return_address(0),0) 与 x0/x1 ⇒ 桩被调用即停机并打印原始调用点。
2) 触发路径（逐行，SN = 16:16 内核的源码快照）：SN/osfmk/kern/startup.c:806 PE_init_iokit() → :822 initialize_screen(NULL, kPEAcquireScreen) → :835-836 kernel_bootstrap_log("mac_policy_initmach") / mac_policy_initmach() → SN/security/mac_base.c:365-381（调 load_security_extensions_function() 后把 mac_late 置 1）→ SN/libsa/bootstrap.cpp:505 KLDBootstrap::loadSecurityExtensions()（com.apple.* 且 AppleSecurityExtension 为真者 loadKextWithIdentifier）→ SN/libkern/c++/OSKext.cpp:8497-8551（startfunc 成功后校验 mac_late==false / isPrelinked / AppleSecurityExtension / 目标在该 kext 的 RX 段内，再 blr x16，x16=0xfffffff00921000c）→ AMFI initializeAppleMobileFileIntegrity 解引用 13 个 __auth_got 槽 → 桩 → panic。窗口是 [PE_init_iokit() :806, bsd_init() :926)。
3) 修正审计的一句话：unreachable.toml 每行 reason 写「kernel 从 code_signing_init()（:526）进入该闭包」不成立 —— SN/bsd/kern/code_signing/xnu.c:56-61 的 code_signing_init() 在 !CODE_SIGNING_MONITOR 分支里只有一句 lck_mtx_init，不启动任何 kext。优先级论证改挂在 mac_policy_initmach()（:836）上。
4) 产物：16:16 的 kernel/kernel.macho（93,061,120 B）里 llvm-nm-18 -m 给出 fffffff00b4687b4 (__TEXT_EXEC,__text) external _unixnu_fileset_unmapped，strings 里 panic 串恰好 1 份；kernel.json 的 early_security_init = {AMFI: 0xfffffff00921000c}、collection_slide 0x0、mapping_complete False、stubbed 203 项/25 bundle、missing 3 项/3 bundle。
5) 13 项的静态身份：三个目标都不在 kernel.map.json 的 16,899 个已匹配函数里。0xfffffff00b4320d8（28 B）与 0xfffffff00b432308（664 B）在最后一个已匹配原始函数 _get_arm_cpu_version（0xfffffff00b431f70，native 0xfffffff007542bb0）之上 +0x168 / +0x398，其后无任何匹配函数；0xfffffff00b11a998（240 B）夹在 _code_signing_deallocate（0xfffffff00b11a890，+0x108）与 _disable_code_signing_feature（0xfffffff00b11aa88，−0xf0）之间。逐槽清单见 docs/research/ios27/osservices-27-silent13.toml。
6) 仍缺（属 A 段）：IOCryptoAcceleratorFamily 在 24A446 kernelcache 里的类布局与 16 个虚槽、IOAESKeyData 的 selector 偏移是否仍 36；AKS 在 27 的 selector 表与状态回调形状。能定它们的证据：kernelcache 反汇编 + 27 kext 的 __DATA_CONST 逐字节对照 OriginalAESABI.h。'''
recorded_at = "2026-11-21T17:05:00"

[hardware.os_services.step.wide]
done = true
evidence = '''把 E:/hackios/UniXNU/components.toml 的 29 个 component 全过了一遍（python tomllib 枚举，不是只 grep 关键词）。落在第 8 行的只有五项：DarwinBoot（build_stage firmware，负责加载器）、SoftwareAES（kernel，os_abi 仅 ipados-17.7.11-21H461）、AppleKeyStoreState（kernel，os_abi 17.7.11 + 27.0.1）、XnuPrelink（prelink，os_abi 空）、ShengPreflight（firmware，os_abi UEFI，hardware Xiaomi Pad 6S Pro，build 与 outputs 皆空）。其中 DarwinBoot、XnuPrelink 归 Lead。
注册表页 E:/hackios/UniXNU/docs/zh/drivers/repositories.md:19（SoftwareAES）、:20（AppleKeyStoreState）、:38（ShengPreflight）与 catalog 一致，没有额外的 OS 服务组件。
