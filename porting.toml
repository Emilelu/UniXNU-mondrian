  { kind = "device", reference = "docs/research/cellular/19-MODEM-BRINGUP-FLIGHT.md", command = "K60_DEVICE_INPUT=/mnt/e/k60-work/mirror-k14-device bash scripts/flash.sh E:/k60-work/artifacts/modem-20261117k29/boot-modem-b-full.img 300 ; python3 scripts/check-modem-flight-log.py --phase b E:/k60-work/evidence/usblog-20261119-062321/console.log", revision = "d549badd79bb4a42c8f33caa90b7ab8ecf740a43", result = "The k29 B image 92359e3d… booted (boot.json bootAccepted=false is the PowerShell wrapper; the console ran 06:23:25-06:29:12), capture complete 230,060 B sha256 9ecde6b8…, budget, no panic. Judge --phase b: S3 PASS with K60MODEM scm cmd=0x5 ok calls=182 and auth_reset ok, which proves the k28 failure was the 100-resume cap; S4 FAIL because after glink desc=0xdf030/32 and modem ready (smp2p items=2) the channel printed up then down and glink poll rc=-5 at 2 (QcomGlinkCorrupt) with no dms revision. Power/init/transport/mem are now hardware-proven in B form; the next single variable is the RX command that returns Corrupt." },
