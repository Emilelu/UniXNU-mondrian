# PREFLIGHT-COVERAGE.toml — 预检里每一个判定，落地在哪
#
# 为什么有这份表（只在预检里拦下的判定）：27 预检能拦下的东西，如果只在预检里拦、契约表里没有行、
# 也没有自己的门禁，那它就是一个"还没落地的判定"——下一次同样的漂移仍然只会在别的
# 地方被偶然发现。2026-11-20 的 sleep-report-guard 就是这么被抓出来的：预检阻塞了，
# 契约表却一行都没有，生成的 27-WORKORDER.md 因此漏掉了它。
#
# 每一行回答一个 `check_*` 函数：它拦的是什么，靠什么落地。
#   backed_by = 契约表里的行 id（硬件事实）；契约行的 preflight 字段反向绑定本函数
#   gate      = 仓库里能独立跑的门禁脚本（不是硬件事实，但同样是可执行的判定）
#   why       = 两者都没有时，写清为什么这个判定不需要独立落地（>= 20 字）
#   planned   = 还没实现的判定（滚动待办）：必须写 next，且 function 留空
# 这份表由 scripts/check-preflight-coverage.py 核对并渲染成 PREFLIGHT-COVERAGE.md。

manifest = "docs/research/power/HW-CONTRACTS.toml"
preflight = "scripts/check-ios27-power-preflight.py"

[[item]]
function = "check_tree"
what = "27 检出能不能用（是不是一个检出、有没有 drivers/）"
why = "这是输入校验，不是关于设备的事实：树不对时任何判定都没有意义，契约表里没有它的位置。"

[[item]]
function = "check_carry"
what = "八个策略模块是否都搬到 27 树（逐文件核对 CARRY.toml 哈希）"
gate = "scripts/check-power-carry.py"
note = "这里逐文件核对模块；判读器另由 check_judges 查存在性，不声称已比较 27 判读器哈希。独立搬运门禁还检查夹具退出码。"

[[item]]
function = "check_report_guard"
what = "27 侧 0629 是否还开着 #if defined(PONG)，导致睡眠报告永不打印"
backed_by = ["sleep-report-guard", "sleep-report-declarations", "sleep-report-call-site", "sleep-report-declaration-armcpu", "sleep-report-declaration-k60", "sleep-report-call-armcpu", "sleep-report-call-k60"]
note = "默认定义、两个弱声明、两个调用点各自落行（声明/调用行用 same + copy27 指到 27 侧的行号）；只把宏定义搬过去仍可能丢掉声明或调用。七个契约行通过 preflight 字段反向绑定。"

[[item]]
function = "check_builder"
what = "执行 27 树的 picker，核对返回的 generic 构建路由"
gate = "scripts/tests/test-check-ios27-power-preflight.py"
note = "夹具执行 picker，覆盖返回旧 PONG builder 和缺失 picker 的阻塞；这检查构建工具，不是设备硬件常量。"

[[item]]
function = "check_judges"
what = "四个控制台判读器是否都在 27 树里"
gate = "scripts/check-judge-exit-codes.py"
note = "这里只查 27 判读器是否存在；退出码表有独立门禁，不声称目标判读器哈希相同。"

[[item]]
function = "check_tables"
what = "八份表与生成物（CARRY、硬件契约、属性号、逐条对齐与 27 工作单）是否都过去了"
why = "判定的是文件在不在；表的内容由各自的生成器与 --render 一致性检查负责，这里不重复判内容。"

[[item]]
function = "check_contracts"
what = "契约表里的行在 27 树上逐行重开（same / drift / moved / missing）"
gate = "scripts/check-hw-contracts.py"

[[item]]
function = "check_console"
what = "判读器匹配的每一行字符串，27 侧打印它的那行还在不在"
gate = "scripts/check-console-contract.py"
note = "31 对 + 8 条书面豁免；判读字符串不是硬件事实，因此不进契约表"

[[item]]
function = "check_wire"
what = "19 个 wire 字段的顺序与下标在 27 侧是否仍然一致"
gate = "scripts/check-battmgr-wire.py"

[[item]]
function = "check_defconfig"
what = "27 stage-0 的 defconfig 是否根本没有链进电池/温度 archive"
why = "源码是否存在与 archive 是否链接是两件事：stage-0 缺配置开关只能解释未链接，不能解释源码缺失，更不能把 missing 降级为通过。"
note = "P-276：预检新增一类判定必须先在本表有一行；这一行只解释 stage 0 的取舍，不改 contracts 行对 missing 的判决。"
