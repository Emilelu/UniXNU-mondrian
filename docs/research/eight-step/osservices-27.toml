# osservices-27.toml — 顺序 8「OS 服务和打包」中安全与预检那一半的八步记录
#
# 范围（Lead 2026-11-21 m00247 划定）：官方表第 8 行里 XnuPrelink 与 DarwinBoot 之外的部分 ——
# SoftwareAES、AppleKeyStoreState、ShengPreflight。kits/ 与
# uefi-mondrian/Platforms/Xiaomi/DarwinBootPkg/ 不归本线，只读引用。
#
# 八步（docs/engineering/EIGHT-STEP-SPEC.md）：
#   ① 同型   ② 官方   ③ 反编译   ④ 广域   ⑤ 方案   ⑥ 深挖   ⑦ 核验   ⑧ 上机
#
# 本文件只做 ①~⑦。⑧ `step.device` 由 Lead 在上机后写，这里有意不建。
# 纪律：没做过的步骤写 done = false 并写明缺什么、什么证据能定它；不要编。
#
# 每条 evidence 必须含可核查引用：file:line / URL / usblog-YYMMDD-HHMMSS / 0x… / P-xx。

[hardware.os_services]
name = "OS 服务与打包：SoftwareAES、AppleKeyStoreState、ShengPreflight"
status = "researching"
paths = [
  "docs/research/ios27",
  "drivers/",
  "board.toml",
  "configs/mondrian_ios27_defconfig",
]
why = "本线负责的三项在 27 stage-0 全部未接入：board.toml 的 27 profile 只 include ArmDTPlatform/ArmCpu/XnuPrelink，configs/mondrian_ios27_defconfig 无任何安全/加密/AKS 开关，patches/xnu-12377/series 无 keybag/AKS/SoftwareAES/AMFI 补丁；prelink 残留在 build 20 是 203 个桩项 / 25 bundle（kernel.json 的 stubbed），13 项在 code_signing_init() 之后、USB 控制台之前可触及。"
revisit = "iOS 27 stage-0 首次 boot 有串口日志后按本线四项交付逐条回填；若 AMFI/sandbox 的 64 项桩在 boot 中先咬人，则提前到 F3 前"

