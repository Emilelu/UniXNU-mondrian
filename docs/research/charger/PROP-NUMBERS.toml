# 16 → 27 属性号对照（电池/充电），每行必须可判定
#
# 三档结论，只允许这三个字面值：
#   same          两侧可打开、取到的值相同
#   differs-known 两侧不同，且 who_changes 写明了谁改（空 = 直接判 FAIL）
#   unknown       至少一侧打不开或取不到；该行同时进 PENDING 清单，交 Lead 决定是否派人翻固件
#
# 引用规则（P-259）：路径只能指向本仓或 27 检出里能打开的文件；指向别处（sheng、构建树）
# 必须加 external: 前缀，这样下一个人 grep 不到时知道它是外部证据，而不是以为它过期了。
#
# 判据由 scripts/check-prop-numbers.py 执行：kind="key" 逐符号核对两侧文件里的那一行，
# kind="wire-table" 直接解析两侧 K60Battmgr.c 的 fields[] 逐项比对。
schema = 1
checked_by = "python3 scripts/check-prop-numbers.py"
tree27 = "E:/hackios/xnekom-ios27"
#
# 27 侧路径写成 "27:<相对路径>"，由 tree27 拼根：本机是 E:/hackios/xnekom-ios27，WSL 下自动换成
# /mnt/e/hackios/xnekom-ios27。写死一边的绝对路径会让另一个宿主上 18 行全部查不到（2026-11-20 实测）。


[[row]]
id = "iokit-current-capacity"
kind = "key"
what = "kIOPMPSCurrentCapacityKey"
side16 = { value = "kIOPMPSCurrentCapacityKey", source = "drivers/PongPower/K60Battery.cpp:129" }
side27 = { value = "kIOPMPSCurrentCapacityKey", source = "27:drivers/PongPower/K60Battery.cpp:108" }
verdict = "same"
note = "两侧同名符号；27 报同名键，XNU 12377 的 IOPM.h 仍定义（external:/opt/k60/trees/ios27-out/feeds/xnu-3199e8bc/iokit/IOKit/pwr_mgt/IOPM.h）"

