  "2026-11-19 15:40 用上游 Linux qcom-cpufreq-hw.c 核对 0x30c 语义：该偏移是 REG_INTR_STATUS（不是静态硬件上限），bit2 是 GT_IRQ_STATUS，即 limits mitigation（LMh/DCVS）事件；同一驱动的 limits_mitigation_notify 在事件置位时读 REG_DOMAIN_STATE 0x20 的 GENMASK(7,0) 并乘 xo_rate/1000，正是 zizhan/K60 使用的 (0x20 & 0xff) × 19.2 MHz。Linux 的 target_index 也先写 PDMEM（perf-lock）再写 REG_PERF_STATE，与我们的顺序一致。我们把命名从硬件上限改为 limits 上限，探针日志改为 limits/status，仍只读 0x30c、不写 0x304/0x308（IRQ enable/clear 属于 IRQ owner）；bit2 是电平还是锁存、0x20 是否实时反映限频，需下一次 mode 1 只读上机确认。代码修正 commit 72315051；battery archive 145,920 B sha256 708602a02ac73024cefb1bf336fa94884a66eca842d56fd56bae9d46e11c6720；host CPU 203 项、七套件 1579 项通过；尚未上机。参考 https://raw.githubusercontent.com/MotorolaMobilityLLC/kernel-msm/android-14-release-u1ug34.23-28-2/drivers/cpufreq/qcom-cpufreq-hw.c。",
