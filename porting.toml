limits = ["IOS27 扫描：频道表与命名扫描只在站里存在 nw_wifi_scan_frequencies 时才生效（22H374 归档没有这个符号，退回全频道扫描）；请求 86 的 0x14e8 字节从未在手上出现过，0x8/0xc/0x200/0x210 全部来自 sheng 的 27 记录，第一次真机扫描请求要用日志核对；selector 0 信封仍未核对。",
  "IOS27：元素区已抬到 2048（两个 builder 同步，27 站 f087c7dd 上构建出 ath11k-abi27 并与 kext 头一致）；24A446 selector 0 信封（0x3c30/0x3c00）仍未核对，手上没有 27 的二进制，这是可能挡住绑定的最后一处形状。sheng 的 27 站仍是 ie[384]/IE_MAX 384，宽记录在他们那条线上会重演 P-230。", "MISSION36: 内核侧 association test 会先于用户在设置页连接自动关联 5 GHz AP，这时设置页没有保存该网络，状态栏显示一格；用户从设置页重连后立刻满格（rssi 两频段几乎相同：-50 / -47 dBm，noise -95），所以不是 RSSI 映射错误而是连接来源；下一版应把 association test 改成默认关闭的 boot-arg 开关。", "MISSION35+: 国家 IE 扣留（>12 字节即扣）不是修复的一部分：mission34 保留了 42 字节国家 IE 仍然让行出现，生产镜像不应扣留任何元素；扣留会改变管制域输入，且曾让 K60B/K60F 两条探针变成空转（P-239）。另有两条未解观察：状态栏 Wi-Fi 一格（kRssi 整趟只被问 1 次，驱动回 -47 dBm）、复位前触摸无响应（触摸日志到关机前 200 行仍在刷，疑 teardown）。", "MISSION34 vs MISSION35 (2026-11-19 10:22): mission35 的扣留可能自己把 5 GHz 记录挡掉（被保留的两条 5 GHz 记录都带 6 字节国家 IE，CoreWiFi 需要国家元素判管制域），且使 K60F 与真实记录重合、K60B 的国家元素在服务前被扣留；因此先飞单变量的 mission34（b08a14f8，1024 元素区，国家 IE 照实），mission35 留作「K60B 被丢而 K60F 被保留」时的第二发。", "MISSION35: 两处改动已上机生效，但缺少人的观察窗口；mission34（b08a14f8）仍未飞，是「只测 1024 元素区」的单变量对照，mission35 飞过后它仍欠一次飞行或需要删除（P-218）。", "MISSION34: 19 条探针共享一次飞行，任一探针出现在设置页即指名元素；但探针只在冻结副本里，真实记录本身要等下一版才改；表被压到 45 条也让最弱记录不再交付（诊断版可接受）。", "MISSION32: 记录尾部被截断是当前最强候选（384 B 定长副本 + TLV 走不完），但还没有一次飞行证明裁剪能救回行；如果仍不见，就要把 station 的 IE_MAX 与 nw_abi.h 的 ie[384] 一起放大到 1024 再测，两处构建都必须改，仓库里没有 vendored 的 ABI 头。", "MISSION24 analysis: 已排除「国家/195/32/221 单独即过滤器」，剩余两个具体嫌疑是 TPC 报告 35 与 IE 244（被保留的 5 GHz 记录里都没有），以及 221/2 这个没有 OUI 的畸形厂商元素；如果 K60K..M 都不出现，则过滤器是共享元素的内容（HT/VHT/HE operation 宽度对 80 MHz 频道结构），需要换 operation 内容再做一发。", "MISSION25: 过滤器已缩到元素区，但还没缩到单条元素。mission25 的 D 探针说明「换成载体的元素区」即可保留，因此下一步只需把 5 GHz 独有的六项（7、32、35、195、255/33、221/2）逐条加回载体；真正的字段仍未命名，真实 Emilelu_5G 记录也还没被改。, MISSION24: 剩余唯一方向是记录字段。已知差异：cap 0x0511（5 GHz）对 0x0431（2.4 GHz），元素区 384 B 对 347 B，两者 RSN 均 24 B 且内容相同；5 GHz 记录带 160 MHz 能力（路由器设置为 160/80/40/20）。mission24 的镜像只打印了 RSN 前 16 字节，mission25 打全 24 字节并新增 op 元素转储。", "MISSION22: 已排除名字配对（改名副本同样被丢）与安全类型（两频段 RSN 相同），也不再怀疑 5 GHz 被整段过滤；剩下两个候选是 BSSID 前缀（…:1c 与在连的 …:1d 只差一位）和记录字段（cap 0x0511 缺 bit5/bit12，元素区 384 B）。mission22 的副本放在冻结列表尾部，而 5 GHz 逐字转储只覆盖前六条，因此该副本是否真被读取没有被日志直接证明——mission24 把副本移到列表最前。 ", "MISSION21: 六次飞行后 daemon 侧列表仍未观察到（无人打开设置页），5 GHz 行缺失的直接原因仍未定；本次只证明两频段记录除 SSID 与元素区（347 vs 384 B，RSN 偏移 37 vs 76，cap 0x0431 vs 0x0511）外无其他结构差异，而 5805 MHz 邻居本次未被听到，缺少对照组。mission20（b0ae4826, head fc8f5432）未飞即被 mission21 取代，mission22（0d6a2f16, head d250f2c3）已构建未飞——两张镜像都欠一次飞行记录。 ", "MISSION19: the daemon-side list is still unobserved (no person opened Settings), so why wifid/Preferences drops the row is unresolved after five flights; the record itself is byte-clean and served first, which rules out ordering, truncation, country and field layout as causes; mission20 only adds observation (scan request filter words, every served record, the first 16 bytes of each 5 GHz element blob) and must be flown with a person at the screen.", "MISSION18: the daemon-side list was not observable because no person opened Settings, so whether wifid or Preferences discards the record is still open and the 5 GHz row is still missing; the frozen strongest-first list (1cb402db) and the Country column (49ee1b8a) are built into mission19 but unflown.", "MISSION17: HE is proven only at association and peer-state level; no rate selection or throughput measurement was made, and the host-side application receipt is still PENDING because WebKit is killed with 0xdead10cc. The peer MCS map 0xfffa is logged, not interpreted.", "MISSION16: the pane list still lacks Emilelu_5G although the driver table carries it, so the list fix is not proven; types 207 (channels-info, 10,016 B), 115 (1,288 B), 419 (136 B set), 422, 423, 25 and 365 are still refused, and a person still has to press Join. The unread-33rd-record explanation is a hypothesis until mission18 prints the record indexes.", "MISSION15: the pane proof is protocol-level, not person-visible; the 5 GHz row is missing and pages do not load because WebKit dies (0xdead10cc). mission16 and mission17 must not be re-flown", "MISSION14 (2026-11-18 19:23, image 48024084, head 8c2b34da): the reconnect is now proven — :2299 arms the lifecycle test, :3902/:3903 disconnect, :3979 reconnect, :4070 WiFi lifecycle test PASS: reconnected BSSID c8:bf:4c:30:03:1c state=6 IPv4=1 lease=3/2, and the judge check that the fresh ACK precedes the PASS passes. The application probe still did not run and the console names why: :529 K60PROBE bytes=34728 resid=0 error=0 and :531 write=0 len=34728, but :530 K60PROBE plist vnode_open error=30 (EROFS) means the job plist cannot be created on the sealed root. The job does ride the curated cache (:526 K60LC len=10437, 24 jobs including com.pong.netprobe), but launchd reads that cache at /System/Library/xpc/launchd.plist and the only code that can put it there is the bindfs view at userland/init.c:475; this image runs the 34,904-byte helper whose view table predates that entry, and every bindfs view it attempted failed with EPERM (:554/:556/:558/:560 result=-1 errno=1), so the cache never becomes launchd input. Judge 31 PASS / 7 FAIL, all seven probe checks. DHCP was 192.168.31.14 (:2077 offer, :2249 ACK, :2289 association PASS, :2290 en0 address). The next image must take launchd out of the path: fork the probe from the init helper before execve(/sbin/launchd) and let it wait for the address. Writing the job into the cache again cannot fix delivery. MISSION13 (2026-11-18 16:40, image 6625d4b3): the application probe did not run. The kernel wrote it (:502 K60PROBE bytes=34600) and the curated cache loaded (:499 K60LC len=10437), but launchd never attempted com.pong.netprobe: no k60probe line and no execerr naming it. The probe delivery is unresolved, so no HTTP status line from our own binary exists; the application-layer evidence is the system's own TLS traffic (tcp443 in 22,315 / out 27,138). capture.json is also missing from this capture (capture.ready and console.log only). Reconnect was not exercised: it needs pong_wifi_test=1 + pong_wifi_cycle=1 and a userland PONG_WIFI_TEST_RECONNECT ioctl (PongWifiLease.h:10), none of which mission13 carried.", "Mission12 (2026-11-18 15:08, image 5c379977, head 4d404560) is only partly captured: console E:/k60-work/evidence/usblog-20261118-150851/console.log is 53,012 B / 918 lines / SHA256 3fb76775 and stops at :912 after association; no DHCP/DNS/TCP443/opener evidence is in the slice and capture.json is absent, so nothing is concluded and mission12 must not be re-flown. Mission11 (E:/k60-work/artifacts/wifi-20261118sbl-mission11/boot.img, SHA256 56b20bf122d184e201077ad59da751a8d2d97668b7832d44d774a4a0712730e4) was flown on 2026-11-18 14:11; console E:/k60-work/evidence/usblog-20261118-141140/console.log (439,287 B, 6,836 lines, SHA256 DE3F5AC656865DEFBD686CD291D2FD436136A1EFFC2B09E63A49EDE299A2844F) proves WPA2 association followed by the native DHCP exchange (out type 1 :4021, offer yiaddr 192.168.31.134 :4098, request :4103, ACK :4112), en0 address 192.168.31.134 (:4131) and sustained receive/transmit (21,752 in / 13,983 out; out DHCP 6, ARP 324, IPv4 13,630), with no panic; the 26-check judge passes. All six official criteria are device-verified; HTTPS/webpage loading is not yet separately proven. Mission11 must not be re-flown. Mission9 (image bf2c0348, console E:/k60-work/evidence/usblog-20261118-130246/console.log) opened the stack without a panic but had no DHCP; mission10 (image 0b2af9b3, console E:/k60-work/evidence/usblog-20261118-134854/console.log) had the namer open the stack but still no DHCP. Neither is to be re-flown. Mission8 (E:/k60-work/artifacts/wifi-20261118sbl-mission8/boot.img, SHA256 1414ca38461cc763ba6b05f31bf46ecbb0cc3f296ec0687c7e3630d89bdd1ba5) was flown on 2026-11-18 12:07; console E:/k60-work/evidence/usblog-20261118-120749/console.log (87,208 B, SHA256 A98BAE37F9136965255847592B27B4F4E20B46BDD6FC2EFE6A2939BABBF83B8D) proves WPA2 authentication, association, the four-way handshake and key installation for Emilelu_5G (association RUNNING :728, connecting :737, associated :759, keys installed :765, connected :766, state=6 :890), but en0 still has no address (:891) and configd panics opening IONetworkStack (:1416/:1424, pc=0xfffffff0084218c4). Root cause: PongWifiNet.cpp newUserClient calls the 3-argument IOUserClient::initWithTask, whose getPropertyTable() fallback skips IORegistryEntry::init; reserve() only allocates the expansion record, so attach() finds a null fRegistryTable. mission9 uses the 4-argument overload and must not re-fly mission8. Mission7 (E:/k60-work/artifacts/wifi-20261118sbl-mission7/boot.img, SHA256 d87eebd945535d508324da81b44107397fb3fddcc0b7ab3003ed6fc32143870b) was flown on 2026-11-18 11:35; console E:/k60-work/evidence/usblog-20261118-113548/console.log (82,932 B, SHA256 d4986302bd51548f451817c0b04a01d3880c8c22b9450dea63af73076967b20d) passes MHI/QMI/102 channels/en0/scan and proves the association test was enabled (association probe fixture=14/13, pong_wifi=1/2), but the 9-network wildcard scan did not contain the target SSID (association target absent target_hash=980ca5d7), so no association/DHCP exchange occurred (judge 11/18); mission7 must not be re-flown. Wi-Fi is not device-verified end to end: association, DHCP and HTTPS remain unproven. Mission4 (E:/k60-work/artifacts/wifi-20261118sbl-mission4/boot.img, 201,887,744 B, SHA256 7646f5caf1b6fd03628587df2cdc915a24d8aca7115816af379858d9e6ac4a26) was flown on 2026-11-18 09:17; console E:/k60-work/evidence/usblog-20261118-091754/console.log (85,874 B, SHA256 59063d2d702e359de9e89b80d24ea09c13dcac7fc436ef573ad5f3bb98cd2bd3) proves MHI power-up (exec_env=2 cached ee updated :683, ee=2 state=2 :687), QMI chip_id 0x12/fw_version 0x20070039 (:697/:699), 102 channels (:722), scan 42 channels (:724), en0 up 00:03:7f:12:6e:b3 (:727) and scan 1 finished 12 networks (:785), with SpringBoard present. The 60 s ready wait and 25 s BHI_EXECENV mission cache work. Mission5 (E:/k60-work/artifacts/wifi-20261118sbl-mission5/boot.img, SHA256 559fb736f996abea8ad80ba61e8c1ab73736d8e38a69c80f30f137fceedc039b) was flown on 2026-11-18 10:38; console E:/k60-work/evidence/usblog-20261118-103831/console.log (82,266 B, SHA256 3b947808aa383cdec5bee903c2be325b4932f44c6e680793d60de451c3666ac2) proves MHI/QMI/102 channels/en0/scan but the association test did not run (no RUNNING/SKIP/FAIL, no DHCP/IPv4; en0 address none). Mission6 (boot.img 78b7ac33069739b208d511040321d6a80db085d63c05b15b94885beb7cd426b2) was flown on 2026-11-18 11:01; console E:/k60-work/evidence/usblog-20261118-110147/console.log (88,387 B, SHA256 CF4DF6ADB2509EB0D5B2DF5BAAA66F05CAE0FB5FF76E40BA731941A90D40A9D5) passes MHI/QMI/102 channels/en0/scan and 11/18 judge checks, but has no association RUNNING/SKIP/FAIL and no DHCP/IPv4; a kernel data abort at :1420 may cut the 60 s deadline. Mission6 is not to be re-flown; mission7 adds an unconditional association probe. c8 5eacc301 stays HOLD.", "MISSION15 (2026-11-18 22:32, image 8fedce49, head 6253eafc): wifid starts and a person joins from the pane, but two gaps remain. No application-layer HTTP result exists: MobileSafari is killed with code=0xdead10cc after repeated com.apple.WebKit corpse crashes (:9046-:9054, :9200), so the missing page is a browser/GPU defect and must not be recorded as a WiFi failure. The pane's network list lacks the 5 GHz SSID: the flight has one scan request and one result read (:4846, :4852) and the pane's refresh types return EOPNOTSUPP (:3998-:4000, :4102/:4104, :7216) as does channels-info 207 (:1982), so the list is the boot-time cache. Judge 22 PASS / 0 FAIL / 1 PENDING = PANE-ONLY. c8 5eacc301 stays HOLD."]
