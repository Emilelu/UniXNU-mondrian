[[contract]]
id = "adsp-smc-clobber"
lane = "adsp"
what = "SMCCC register contract of the SCM wrapper (P-255)"
source = "drivers/PongPower/K60AdspPas.c:38"
expect = "\"x17\", \"memory\""
# the same stanza exists twice: the driver and the kernel patch that ships it.
# P-255 happened because only one copy was fixed; the mirror check is read-only.
mirror = "patches/xnu/0613-k60-adsp-pas.patch:111"
dependence = "none"
ios27 = "copy with the driver; scripts/tests/test-k60-adsp-smccc.py guards both copies"
same27 = "drift"
copy27 = "drivers/PongPower/K60AdspPas.c:1"
why27 = "27 侧的 k60_scm_call 仍只把 x0..x3 声明为 +r、x4..x7 当只读输入、clobber 只有 memory（P-255 未过去）。因果链：只读输入在 asm 之后被编译器认为仍是原值，所以跨一次 SMC 的活跃值可以留在 x4..x7，密钥字也可以被当作仍在该寄存器而省掉重装；SMCCC 1.x 允许 monitor 破坏 x4..x17（PAS 的 session cookie 就回在 x6）。27 线一旦在 EL1 早期先做 PAS、再写 APIAKey/APIBKey/APDAKey/APDBKey/APGAKey，写进密钥寄存器的就可能是陈旧或错位的字，此后每条 PACIA/AUTIA 都对不上，表现为离 SMC 很远的认证陷入。修法与 Linux arm_smccc_smc 相同：x0..x7 全部 +r，x8..x17 clobber，再加 memory；同步时把这段连同 5 行注释一起搬，并同时改 patches/xnu/0613 那份副本"
