schema_version = 2

[board]
name = "mondrian"
soc = "SM8475"
soc_source = "sm8475"
os_profile = "ipados-16.6.1-20G81"
description = "Redmi K60 (mondrian/SM8475): UniXNU UEFI bring-up"
kit = "mondrian"

# The kernel and prelink inputs live in the OS profile (profiles/os/ipados-16.6.1-20G81),
# the SM8475 resources in the SoC source, and the board wiring in dts/mondrian.dts.
[components]
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "PongUfs"]

[kernel]
defconfig = "mondrian_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8475.config", "os:configs/ipados.config"]
# The K60 series still carries every patch; the shared layers have empty series for now.
patch_series = ["device:patches/xnu/series"]
archives = ["component:ArmDTPlatform", "component:ArmCpu", "component:PongUfs"]
driver_records = "DEVELOPMENT_ARM64_PONG"
# The Pong Adreno / UI provider scripts are not selected by this key. The kernel
# build only reads the PONG_NATIVE_DRIVER_SOURCE environment variable:
#   scripts/build-xnu-4k-baseline.sh:240   shim-bin goes on PATH when
#                                          $PONG_NATIVE_DRIVER_SOURCE has one
#   scripts/build-xnu-4k-baseline.sh:250   ArmDT / ArmCpu provider scripts
#   scripts/build-xnu-4k-baseline.sh:260   storage ABI derivation
#   scripts/build-xnu-4k-baseline.sh:268   NativeUfs transport compile
#   scripts/build-xnu-4k-baseline.sh:273   NativeRamBlock compile
#   scripts/build-xnu-4k-baseline.sh:970   Adreno platform, falling back to
#                                          ${PONG_NATIVE_DRIVER_SOURCE:-$ROOT}
# and no repository code reads a [kernel] pong_native_driver_source key. The
# scripts that were executed out of that tree live in this repository
# (scripts/build-pong-*.py, scripts/bind-ios16-storage.py,
# scripts/derive-ios16-storage-bindings.py), so the fallback now points at the
# checkout instead of the assembled build tree, which has no drivers/PongAdreno.
# Set the environment variable only to build against a different driver tree;
# see scripts/k60-macos-preflight.sh:13-14 for the macOS CI form.
# pong_native_driver_source was this path before the fallback existed:
# "/opt/k60/trees/pong-driver" (not in this repository, no reader, remove it).

[userdata]
first_lba = 53342976
last_lba = 61731583
lba_bytes = 4096
windows = [{ "name" = "OS", "component" = "OS" }, { "name" = "SystemOS", "component" = "Cryptex1,SystemOS" }]

[device_tree]
source = "device:dts/mondrian.dts"
include_dirs = ["soc:dts"]

[firmware]
config = "mondrian"
dsc = "Platforms/Xiaomi/mondrianPkg/mondrian.dsc"
fd = "Build/mondrianPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
patches = [
  "Resources/MuPatches/AsmMacroLib.patch",
  "Resources/MuPatches/Boot-Manager.patch"
]
packages = [
  "{uefi}",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot22",
  "{edk2}",
  "{uefi}/Platforms/Xiaomi",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
  # K60 bring-up inherits the pong vendor DXE/GOP binaries.
  "{uefi}/Binaries/pong",
]

[firmware.defines]
DEVICE_MODEL = "0"
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "UniXNU-Mondrian"

[payload]
volume = "UNIXNU"
size_mib = 192
loader = "firmware"
title = "UniXNU"
# The upstream entry probe patches the prelinked kernel image: it paints the
# stage bars (blue at the kernel entry with the MMU off, magenta just before the
# MMU comes on) and, with the reset delay, resets the board through PSCI six
# seconds after the MMU is on. That turns "did the kernel get past the MMU
# enable" into a board that walks back to fastboot on its own instead of a
# manual power cycle.
#
# The reset delay is now off. The boot CPU got past the MMU and past the CPU
# start order, so the stage 3 timer only cut the run short six seconds in and
# hid whatever came next. Without it the kernel runs until it fails, and the
# failure stays on the frame buffer: the kernel's own video console prints the
# panic text and patch 0246 scales that text to a readable size.
#
# The probe's panic screen stays off: it installs code in the padding after
# panic(), whose address is fixed for the reference kernel, so it refuses to
# patch ours.
# entry_probe_reset_delay = 6
# Contiguous handoff ARENA size, not total installed DRAM. The actual live
# Android memory map has six banks. Use only measured [0x900000000,0xa40000000)
# below high reservations; must match dts/mondrian.dts and MemoryMapLib.c.
dram_size = "0x140000000"
# pong_software_keybag=1 selects the volatile no-passcode keybag from
# zzzzzzzzzzzzzzzzzzzzzzzz-pong-software-keybag.patch. Without it mkbinit cannot
# load a system bag on this board (no SEP) and forces a recovery-mode reboot.
# disable_exc_resource stops the wakeups/disk-write monitors from reaching
# exception_triage() and task_terminate_internal(): on this board the services
# that consume those exceptions are still missing, so watchdogd is killed for a
# FATAL wakeups violation it cannot answer. Remove it once they run.
# pong_ufs_readwrite=1 is what makes the UFS windows writable at all
# (PongUfsTransport gates every write on it); without it even the Data
# window is published read-only and nothing can be mounted read-write.
# amfi_get_out_of_my_way=1 opens three gates at once in this tree:
#   libkern/amfi/miniamfi.c:266 registers the AMFI interface stand-in, so the
#     amfi pointer is no longer NULL and codesigning has a table to ask;
#   bsd/kern/kern_minimac.c:477 registers the miniamfi and minisandbox MAC
#     policies - without a policy named "Sandbox" every __mac_syscall returns
#     ENOPOLICY (bsd/security/mac_base.c) and the launchd, tccd, timed and
#     securityd daemons die in sandbox profile init. That is the SIGKILL storm
#     this board showed on 2026-10-31 and it will come back on darwin24;
#   bsd/kern/kern_codesigning.c:289 turns it into CS_CONFIG_ALLOW_ANY_SIGNATURE,
#     the same thing cs_enforcement_disable=1 asks for.
# It is safe here and only here: the 22H374 profile does not prelink the real
# AppleMobileFileIntegrity kext, so amfi_interface_register() has a single
# caller. The 16.6.1 route prelinks the real kext and adding this argument
# makes the stand-in and the kext collide - panic "AppleMobileFileIntegrity
# interface already set" at libkern/amfi/amfi.c:11, which is what
# boot-amfi.img (2026-10-31) and boot-amfi2.img (2026-11-01) both showed.
#
# These arguments are the measured payload of boot-0461-20261107.img (and of
# boot-0442-20261107.img before it): 28 entries, debug=0x140, 581 bytes of a
# 600-byte command line (docs/reference/PITFALLS-FROM-HISTORY.md pitfall 124).
# Both images reached SpringBoard on the board, so this is the verified list.
# Read the measured list back out of an image with a FAT directory walk over the
# payload volume (/EFI/UniXNU/unixnu.toml, the `args = "..."` line); the boot img
# header and payload offset for these images are documented in
# docs/state/LEDGER.md. boot-0601-goldenargs.img carries a different, 19-entry
# list and is not a substitute for this one
# (docs/state/BUILD-RECIPE-2026-11-08.md records the difference).
#
# The arguments that only exist here, and what their absence did:
#   debug=0x140                 not 0x144. 0x144 has DB_NMI, so a panic parks
#                               in the debugger and never reboots; 0x140 lets
#                               0334/k60_panic_reset hand the board back to
#                               fastboot through IMEM 0x146AA65C instead.
#   k60_usblog=2                enumerates the USB CDC console. Without it the
#                               board is silent even when the kernel is running.
#   k60_skip_firmware_mount=1   launchd's mount-phase bind mounts get EPERM on
#                               this board and PID 1 panics on the error.
#   k60_tolerate_cache_loader=1 a crashed launchd_cache_loader stops being fatal.
#   k60_panic_reset=1           automatic fastboot after a panic, so a failed
#                               experiment does not need a power cycle.
#   k60_console_export=1        exports the console to /chosen for the host.
#   k60_selftest_reboot=0       off. 300 was a bring-up watchdog: 150 hearts of
#                               2 s, then back to fastboot (pitfall 133). It is
#                               what pulled the board out of a *healthy* iOS at
#                               13:18 on 2026-11-10, four minutes after the boot
#                               that first reached SpringBoard without crashing.
#   k60_autoreset=0             off. The kernel default is 300 s from bsd_init,
#                               independent of the boot args, so leaving it
#                               unset resets the board mid-session anyway.
#   amfi_get_out_of_my_way=1, launchd_unsecure_cache=1, xpcproxy_idversion=1,
#   k60_entitlement_allow=1, k60_skip_iosurface=1: the userland gates that let
#   launchd and SpringBoard start without a real AMFI/SEP.
kernel_args = [
  "-v", "native-ufs=1", "pong_allow_unauthenticated_root=1", "debug=0x140",
  "cs_enforcement_disable=1", "pong_software_keybag=1", "disable_exc_resource=1",
  "pong_ufs_readwrite=1", "k60_console_export=1", "k60_usblog=2",
  "pong_data_mount=1", "pong_data_rw=1", "fb_threads=3", "k60_textonly=1",
  "amfi_get_out_of_my_way=1", "pong_init_path=/private/var/pong/init",
  "epoch=1793709100", "k60_fontscale=3", "k60_skip_firmware_mount=1",
  "k60_tolerate_cache_loader=1", "launchd_unsecure_cache=1",
  "xpcproxy_idversion=1",
  "k60_entitlement_allow=1", "k60_skip_iosurface=1", "k60_panic_reset=1",
  "k60_init_blob=1", "k60_launchd_cache=1",
  "k60_autoreset=0",
  # Touch stage 6 publishes /dev/pong-touch only after the chip answered the
  # boot-option handshake and accepted the config package. The applog pair was
  # dropped to stay inside the 608-byte arm64 boot-args limit; SpringBoard's own
  # os_log output is unaffected.
  "k60_touch_se=6",
  # Adreno stage A (docs/plans/GPU-ENABLE-PLAN.md 4.4): start the GPU and report
  # every stage, but do not hand the framebuffer over yet. pong_gpu_scanout and
  # pong_gpu_only stay unset until the K60FB line below proves the boot
  # framebuffer is outside the VM's managed range; a GPU DMA into pages the VM
  # also hands out corrupts page tables rather than merely failing to present.
  # The whole list is 594 of the 608 bytes arm64 boot-args allow.
  "pong_adreno_start=1",
]
# All eight CPUs. The AppleARMCPU device-tree validation that required a
# single-CPU ADT is bypassed by the kext patch on _validateConfiguration, and the
# K60 ArmCpu driver instantiates every device_type=cpu node then starts the
# secondaries through PSCI.
cpus = 8
tools = true
# Unattended bring-up needs a countdown. timeout = -1 means "wait for a key"
# whenever an input device is present, and the K60 keypad (K60KeypadDeviceLib)
# always is: measured 2026-10-29 18:47, the unit parked in the menu, dropped off
# USB and never came back, with XNU never loaded. A positive value boots the
# default entry ("xnu") after that many seconds. If the kernel then fails and the
# menu falls back to "Return to firmware", the unit lands in BDS -> Android,
# which is the state a host-side watchdog can recover from.
timeout = 5

# B decision (2026-11-03): align with pong and drop the whole trust-cache path.
# The payload ships no trust-cache sidecar (no --trust-cache anywhere in the
# build chain), so this whitelist is intentionally empty. payload.py reads this
# from [payload], not from [payload."adt"], and only consults it when a
# --trust-cache is passed; keep it an array (schema).
trust_cache_sha256 = []

[payload."adt"]
"chip_id" = "8015"
"root_match_volume_uuid" = "C5DAF029-2070-4F68-B3CC-1D1320344CF0"
# DarwinBoot window. Without this key the loader falls back to
#   DarwinBoot.c:20   #define WINDOW_SIZE SIZE_256MB
#   DarwinBoot.c:723  if (WindowSize == 0) { WindowSize = WINDOW_SIZE; }
#   DarwinBoot.c:794  Args->MemorySize = WindowSize;
# so boot_args->memSize reaches XNU as 256 MiB, and arm_vm_init.c:1857 turns that
# into mem_size (gPhysBase comes from args->physBase, i.e. this window's address).
# The earlier 4 GiB attempt targeted [0x100000000,0x380000000), a no-RAM
# hole. Live serial-6033dbec FDT/iomem place high RAM at 0x800000000 and above.
# Firmware exposes only measured arena [0x900000000,0xa40000000); screen
# reports mem=actual=managed=4096 MiB. Service exits continue; SpringBoard is
# pending. devicetree.py emits darwinboot-memory-size from this key.
"owned_memory_size" = "0x130000000"  # 4.75 GiB window (ladder step after 5 GiB NO WINDOW)

# K60 has only side/volume keys. This is the native MobileGestalt/BSPlatform
# contract, not a synthetic Home key or a lock-screen text override:
# core/docs/guide/mobilegestalt.md:26-44 defines native HomeButtonType=2.
# Verify the actual 20G81 consumer through the runtime homeButtonType log.
# The format2 generator emits /buttons from this typed table. Real digitizer
# events remain responsible for the bottom-edge swipe and normal authentication.
[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

# PMIC key arbiter. bsd/dev/pong_buttons.c looks up exactly
# /arm-io/pong-buttons and rejects any value that differs from these
# constants (its configuration()), so they are not tunable: SM8475 SPMI
# arbiter core/cnfg/observer windows on the APSS EE, and the PM8350C PON
# PON1 (0x013) / GPIO6 (0x18d) peripherals.
[adt.arm-io.pong-buttons.string]
compatible = "pong,pm8350-keys"

[adt.arm-io.pong-buttons.u64]
core-base = "0xc400000"
cnfg-base = "0xc42d000"
observer-base = "0xc440000"

[adt.arm-io.pong-buttons.u32]
ee = 0
pon-ppid = 19
volume-up-ppid = 397

# K60 live FDT: xiaomi_touch@0 on QUP0 SE4. These absolute resources are
# metadata for the board-started driver, not an incomplete interrupt mapping.
[adt.arm-io.pong-touch.string]
compatible = "xiaomi,m11a-spi"

[adt.arm-io.pong-touch.u64]
spi-base = "0x990000"
tlmm-base = "0xf000000"
gcc-base = "0x100000"

[adt.arm-io.pong-touch.u32]
gpio-offset = "0x100000"
avdd-gpio = 71
max-x = 14400
max-y = 32000

[adt.arm-io.pong-touch.bytes]
pins = "100000001100000012000000130000001500000014000000"
# MISO, MOSI, CLK, CS. The FDT only says these four pads belong to qup4, not
# which role each has (P-70). A 24-permutation hardware scan found exactly two
# tuples that read ff ff ff ff instead of 00 00 00 00, which proves MISO is
# GPIO 17: PERM7 (17,16,19,18) and PERM8 (17,18,16,19). The driver additionally
# requires bitbang_pins[3] == 19, so only this tuple is admissible. The chip's
# own 8 x 0xAA boot-option write/read-back then confirms or refutes it.
bitbang-pins = "11000000120000001000000013000000"