name: Repository checks

# The gates that need no build tree and no device.  A rule that only exists in
# prose is a wish; these two turn the two that can run anywhere into a red mark
# on the pull request that breaks them.  Build and boot gates stay in
# porting-record.yml because they need the artifact set.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No hardcoded checkout paths
        run: python3 scripts/check-repo-paths.py
      - name: Documentation consistency
        run: python3 scripts/check-docs.py
      # P-295: a parsed field needs one fixture that carries it and one that
      # does not, with the judge's unmeasured list changing between them. This
      # runs the fixtures only; the real-flight pin skips itself when the
      # evidence store is absent, which is always true on a runner.
      - name: GPU judge field coverage
        run: python3 scripts/check-gpu27-judge-groups.py

      # The v2 flip assertions are dormant while the draft sits in
      # patches/proposed: no series names it, so the check says so and exits 0.
      # The day the patch enters a series it becomes a criterion with no edit
      # here. A runner has no lane tree, so the missing-input path is the one
      # that matters: it must report "cannot read", never "passed".
      - name: GPU v2 assertion copies
        run: |
          lane="${K60_GPU27_REPO:-../k60-gpu-27}"
          if [ -f "$lane/drivers/PongAdreno/PongScanoutWire.h" ]; then
            python3 scripts/check-gpu27-flip-asserts.py --lane-root="$lane"
          else
            echo "SKIP the lane tree is not next to this checkout: $lane"
          fi
