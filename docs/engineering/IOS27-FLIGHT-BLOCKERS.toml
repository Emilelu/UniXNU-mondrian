evidence_r313h = "board.toml 27 archives: build-sheng-source-storage.py --tree .; llvm-nm --defined-only kernel.macho | grep -cE native_ufs_source_create|pong_ufs_transport_start|PongUfsBlock = 51; archive undefined minus kernel defined = 0 symbols; boot.img sha256 932d50adf930bb896211b873f33264fbe6dc8a8b3903752d6321a5f9101c3b07"
decision = "closed: route C (sheng SourceStorage runtime) now instantiates our own drivers/NativeUfs factory. The kernel really links a block-storage provider, which is what this blocker asked for. Whether that provider mounts the written unixnu image is a flight question, tracked by the boot criteria, not by this blocker."
