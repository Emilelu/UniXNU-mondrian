why = "K60 面板身份与显示供电的一手真值：m11a 节点、三档 timing、DSC 参数、5 条供电轨、DSI ctrl/phy/MDP 基址"
examined = "2026-11-14"
finding = """设备 6033dbec 的 live merged FDT（919,210 B，2026-11-02 adb 导出，已含 dtbo；文本解析见 scratch/refmine/fdt_dump.txt）。bootargs 第 13 行 msm_drm.dsi_display0=qcom,mdss_dsi_m11a_42_02_0a_dsc_cmd: 表明实际启用面板是 m11a（phandle 0x6a3，fdt_dump.txt:27733），而 dsi-display-primary 的 qcom,dsi-default-panel=<0x697>（:28881）指向 visionox r66451 视频面板（:22521），不是本机在用的那个。m11a 节点：panel-type=dsi_cmd_mode、bpp=0x18、dsi-ctrl-num=0 / dsi-phy-num=0（单 DSI）、mi,panel-id=<0x4d313141 0x420200>（M11AB+0x02）、brightness-max 0xfff、hbm-bl-max 0x7ff、bl-inverted-dbv、bl-pmic-control-type="bl_ctrl_dcs"（背光走 DCS，不是 Pong 的 NT37705 独立控制器）、platform-reset-gpio=<&tlmm 0 0>（GPIO 0）、esd-err-irq-gpio=<&tlmm 0x74 0x2008>（GPIO 116 下降沿）、reset-sequence=<1 11 0 1 1 11>。timing 三档：timing@0 0x3c=60（:27813）、timing@1 0x5a=90（:27910）、timing@2 0x78=120（:28007），三档都是 0x5a0x0xc80=1440x3200、topology <2 2 1>、panel-clockrate 0x47868c00=1.2 GHz、DSC bit-per-pixel 8 / bit-per-component 0xa / slice-width 0x2d0 / slice-height 0x20 / dsc-version 0x12，且 timing-switch-command 三档各不相同（98 B）。面板供电 5 轨：vddio 1.8V=pm8350c_l12（ldoc12, phandle 0x30a）、vddd 1.07V=display_panel_vddd（GPIO 66 开关）、vci 2.7V=pm8350c_l13（ldoc13, 0x30b）、extvdd 1.2V=pm8350b_l1（ldod1, 0x30e）、avdd 5.5V=display_gpio_regulator@1（GPIO 186）——其中 3 条是 RPMh LDO 投票，与 RSC 不可访问的阻塞点同源。DSI ctrl0 reg 0xae94000+0x400 / 0xaf0f000+0x4 / 0xae36000+0x300，DSI phy0 reg 0xae94400+0xa00 / 0xae94900+0x400 / 0xae94200+0xa0，MDP 0xae00000+0x84000。触摸节点 :10771 与 thermal/charge-screen :28986/:28990 都用 panel=<0x6a3 0x697>，换面板必须同步改触摸的 panel 引用。"""

[subsystem.usb]
why = "USB：DWC3 寄存器分区与同 SoC 的 PHY / Type-C mux 实现，fastboot boot 之外唯一的调试通道"

[[subsystem.usb.required]]
path = "references/pong-usb/Dwc3Registers.h"
why = "DWC3 寄存器分区与 GCTL 位定义（Pong 实测偏移）"
examined = "2026-11-14"
finding = """寄存器分区（:9-14）：XHCI 0x0000、GLOBALS 0xC100..0xC6FF、DEVICE 0xC700..0xCBFF、OTG 0xCC00。关键偏移：GSBUSCFG0=0xC100、GCTL=0xC110、GEVTEN=0xC114、GSTS=0xC118、GSNPSID=0xC120、GUID=0xC128（:17-22）。GCTL 位：CORESOFTRESET=(1<<11)、PRTCAP(n)=((n)&(3<<12))>>12、PRTCAPDIR(n)=(n<<12)、PRTCAP_HOST=1。注意这些是相对 DWC3 基址的偏移，K60 的基址窗口在 MemoryMapLib.c 里是 USB 0x0A600000 + 0x200000。"""

[[subsystem.usb.required]]
path = "references/pong-usb/PongUsbPhy.h"
why = "同 SoC 的 eUSB2 / combo PHY 上电与轮询写法"
examined = "2026-11-14"
finding = """头注释写明寄存器事实来自 Linux drivers/usb/phy/phy-msm-snps-eusb2.c 与 repeater-i2c-eusb2.c（:3）。实现范式：phyWait(m, off, mask, value, ms) 轮询到 (m.r(off)&mask)==value 才算成功（:19），phyMask(off,mask,value) 做读改写（:23），失败统一走 phyFail 打 PongUSB: board PHY unavailable: <reason>（:18）。K60 可以借这套轮询/超时结构，但寄存器偏移必须重新取证。"""

[[subsystem.usb.required]]
path = "references/pong-usb/PongUsbMux.h"
why = "USB Type-C 角色切换（mux 通知）在 XNU 侧怎么发布给上层服务"
examined = "2026-11-14"
finding = """pong_usb_mux_publish / pong_usb_mux_session(online) / pong_usb_mux_receive 是导出接口（:136/:151/:161）。角色事件用 messageClients(0xe3ff8201u, ...) 广播（:158），注释指出这是 22H374 mux_notification_handler 的 configured/unconfigured 事件（:156）。本地 socket 走 127.0.0.1 且端口按大端交换（:62）。K60 的 Type-C 开关在 FDT 里是 i2c@994000 下的 fsa4480@42 与 eusb2_repeater@4f，接法不同，只能借事件模型。"""

[subsystem.bluetooth]
why = "蓝牙：K60 用 QCA6490（同 WiFi 芯片，走 PCIe/MHI），与 phk110 的 WCN6750/WPSS 路线完全不同，现有参考里没有可照抄的 BT 实现"

[[subsystem.bluetooth.required]]
path = "references/phk110-port/docs/phk110/waves/wave1-hwmap.md"
why = "同 SoC 的蓝牙方案对照：说明为什么 K60 不能沿用 phk110 的 BT 路线"
examined = "2026-11-14"
finding = """phk110（redwood）的蓝牙是 WCN6750，走 WPSS（Hexagon）PIL 加载 wpss.mdt，GPIO 84/85/86，状态 missing，只做过只读侦察（:47-48/:145/:172）。K60 的 WiFi/BT 是 QCA6490，无 WPSS 节点，走 PCIe0 + MHI + QRTR（:145-146）。结论：redwood 的 WPSS bring-up 对 K60 整条废弃，蓝牙随 WiFi 一起走 PCIe 上电 + ath11k_pci + qca6490 固件族；BT 侧的 HCI 传输（GENI SE）与 phk110 不是同一子系统。"""

[[subsystem.bluetooth.required]]
path = "reports/live-6033dbec-fdt.dtb"
why = "K60 自己的蓝牙节点与使能脚；BT 实现必须以这张表为准"
examined = "2026-11-14"
finding = """本板 FDT 有独立的 bt_qca6490 节点与 cnss_pins（wlan-en / bt-en / sw-ctrl 一族），蓝牙与 WiFi 共用 QCA6490 与同一套电源时序；没有 qcom,wcn6750 / WPSS remoteproc 节点。唯一完整实现参考在 E:/hackios/QcaBluetooth（qbt_geni.c / qbt_transport.c / qbt_core.c，含 GENI SE 寄存器偏移表与 iOS 27 原生工具），该仓库不在 research-gate 的两种路径回退范围内，因此不能作为本文件的 path，只能在此说明并写进 REFERENCE-INDEX.md。"""

