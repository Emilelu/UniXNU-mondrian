kpoint (superseded availability state): complete version-1 platform ops, persistent linked-reader context and idempotent install were wired before acquire, but no production board supplier existed and available=0; platform31/34 host cases passed. The board supplier is now wired before platform install, so availability can become1; this does not prove power. Lead 15:03 withdrew B/C resources-success claims and restored resources to K60BoardUnsupported(-63) after lease/exclusion/stopped checks, with no resources=1 and log K60ADSP: rails not verified for handoff; no PAS/SMEM mutation. Real owner stages refuse before downstream map_smem/allocation/INIT_IMAGE/MEM_SETUP/COPY/BSS/AUTH/publish. Parent reported focused board8 and owner-claim18 exit0 including direct wrapped allocator count0 and unchanged SMEM; see docs/research/battery/PAS1-PROVIDER-INSTALL.md."]
