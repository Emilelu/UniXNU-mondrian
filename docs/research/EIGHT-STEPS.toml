[hardware.charger.step.deep]
done = true
evidence = "深挖结论三条。一，订阅 ACK 的 type/长度只能从固件定：.ko 与上游都不校验，仓库消费方却要求精确匹配，所以必须反汇编 ADSP handler（0x60155910 回 16 B type 1），不能照抄 Linux 的宽松判据。二，opcode 4 的应答与 opcode 7 的通知是不同帧：0x800a 的 type 2 帧只用于主动推 opcode 7（16 B），订阅应答是 type 1，混淆会让订阅永远不成立。三，协议无 transaction id，超时只能靠 poisoned + 重开通道兜底（K60Battmgr.c:194-200），因此单飞行请求是硬约束。见 docs/research/charger/06-SUBSCRIPTION-CONSTANT.md 与 04-PROP-MAP.md。"

