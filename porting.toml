atureHundredths 与标准属性的换算一致性，并读取 K60BatteryValidFields（必须非零）与 K60BatteryFailedFields。2026-11-18 补容量单位修正（commit af759fe4：CurrentCapacity=(capacity_hundredths+50)/100 并 clamp 0..100，MaxCapacity 固定 100，AppleRawCurrentCapacity/AppleRawMaxCapacity 保留 mAh；K60BatterySmoke 校验百分比与 raw mAh），host TESTS OK 71；最终 battery-only 镜像 E:/k60-work/artifacts/power-conformance-20261118e/boot.img（sha256 8b1df0193f5e9dcc5455612fc0ec9bb070b258b1a8591dde22c6f5176a1fbcf1；payload 9c96ac4956151fbc1b1fdccc3cd0c3cef77b29d9a4618d6e5f3c72a3e084eb99；kernel 9df566917f55d7a31573457523422b706c648c629dccb66d96c581b498bcc319）已于 2026-11-18 03:22 构建，包含 592523aa/6750c7bd/af759fe4。2026-11-18 10:04–10:14 第二次 image e 上机（E:/k60-work/evidence/power-conformance/controlled-final-20261118-100431，console.log 260551 B）：C1 PASS（:488,:538），C2 PASS（12 次命中），12 条完整样本；对同会话 36 行 Android 基线 C3 全窗口仅电压/电流超差（最大 ΔV=91mV、ΔI=1128mA），抽出 3 行匹配电流基线（365/343/63mA）后 C3 PASS（ΔV=43mV、ΔI=54mA、ΔSOC=0、ΔT=0.60°C，judge-android-matched3.txt）。2026-11-18 10:31–10:36 第三次 image e 上机（E:/k60-work/evidence/power-conformance/usblog-boot-20261118-1031，console.log 237388 B，bootAccepted true，bootExitCode 0）：C1 PASS（:401,:465）、C2 PASS（12 次命中），12 条完整样本全部 SOC=99.00%、4419/4464mAh、397mA、external=1 charging=1；首次在真机得到非 100% 容量值，容量百分比单测补 capacity(9900)=99（28/28 通过）；该次无 Android 同窗口基线，未作 C3 判定。", "2026-11-17: Route A 在真机 K60 上完成 ADSP 启动：QMP load_state on、cmd-db lcx/lmx 和 TCS4 双轨投票成功，PAS1 发布 epoch=1 flags=15，物理电池源发布 sample=4 SOC=100.00% charge=4487/4487mAh design=5500mAh cycles=749 voltage=4379mV current=397mA temp=34.30C external=1 charging=1 full=0 subscribed=1。实现修复 QMP 邮箱必须 32-bit word 写入、SMP2P master-kernel 输出项 429、精确尺寸 stale SMEM 回收、16 KiB GLINK ring、零长度 INTENT、battery current optional + USB CURRENT_NOW fallback。证据 E:/k60-work/evidence/route-a/usblog-boot-20261117-0726-final/console.log:189,596；镜像 sha256 6aa9107c30cab42bf4fd1a8555f5d622774eeb242fd79606ca2bec36226061f1。", "PMIC/PON historical observations are recorded in docs/archive/HANDOFF-2026-10-31.md:55 and docs/archive/HANDOFF-k60-work-2026-11-06.md:210; they do not prove battery GLINK ownership.", "2026-11-15: five injected PAS1-owner stages and a persistent wrapper pass 77 named host scenarios around real MDT/SMEM/build/parser code. Exact required=15, independent public facts/internal stage mask, poisoned uncertain shutdown and retained published ownership are enforced; see docs/research/battery/PAS1-PROVIDER-CONTRACT.md.", "2026-11-15: bounded blob/FAT named reader and immutable owner adapter are implemented. Captured-firmware host checks cover 24 segments, exact payload/BSS counts, unaligned b10, BSS-only missing b24, error codes and lifetime; this was the earlier reader-only source checkpoint. See docs/research/battery/PAS1-PROVIDER-CARRIER.md.", "2026-11-15: Lead froze production K60A as a 12-byte LE header and sequential 24-byte records, NUL names (name_len=9), mode0644, packed_size=size and 8-byte zero padding. The production generator/checker and reader exist. The 26 inputs total23505092 bytes and the single cursor gives23506184 bytes; no flat format, compression or second dispatch is accepted. Copy23494284+BSS25925684=49419968 bytes; mapped span51380224 includes1960256 bytes of intersegment gaps. See docs/research/battery/CARRIER-BLOB-PLAN.md.", "2026-11-16 initial adapter checkpoint (superseded availability state): complete version-1 platform ops, persistent linked-reader context and idempotent install were wired before acquire, but no production board supplier existed and available=0; platform31/34 host cases passed. The board supplier is now wired before platform install, so availability can become1; this does not prove power. Lead 15:03 withdrew B/C resources-success claims and restored resources to K60BoardUnsupported(-63) after lease/exclusion/stopped checks, with no resources=1 and log K60ADSP: rails not verified for handoff; no PAS/SMEM mutation. Real owner stages refuse before downstream map_smem/allocation/INIT_IMAGE/MEM_SETUP/COPY/BSS/AUTH/publish