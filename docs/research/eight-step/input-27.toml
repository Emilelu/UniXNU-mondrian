# iOS 27.0.1 (24A446) eight-step ledger — the input line (official porting/drivers row 4:
# QcomGeniSpi, ShengNovatekTouch, ShengHidInput, ButtonProbe).
#
# Steps 1-7 only. Step 8 (device) belongs to the Lead and is never written here.
# Every step starts at done = false with no evidence: this file is the skeleton the
# lane fills in from offline reading, one claim per citation (file:line / URL / P-xx).
# Gate: python3 scripts/assemble-27-eight-step.py --check

