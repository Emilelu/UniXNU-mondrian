  "2026-11-19 k32 (55259825ea47a019a39c9178d06448809871ab48): the k31 B flight pinned the corrupt message: K60MODEM qrtr: glink poll rc=-5 at 2 rx avail=576 head=648 tail=72 cmd=0x5 p1=0x1 p2=0x1 is a GLINK INTENT (command 5) for rcid 1 with one pair. QcomGlink.c:393-421 can return Corrupt only at :394 (count overrun), :403 (pair size or id is zero), :407 (same id already busy) or :411 (all 48 remote-intent slots used), and a channel opened moments earlier cannot have filled 48 slots, so :403 or a stale ring is what remains. k32 changes no behaviour: after qcom_glink_adopt it prints tx tail, rx head and the ring first eight little-endian words (w0 = cmd | p1 << 16, w1 = p2, w2/w3 = the first INTENT pair size/id, w4/w5 = the next header), and the corruption line keeps its old prefix and adds tx head/tx tail and w2..w7 so check-modem-flight-log.py keeps working. 0622 is 96,781 B over 5 files, the host suite is rc0, test-k60-modem-image.py reports TESTS OK 30 segments; kernel 105,582,592 B sha256 f9c915aa361075277a6bf33a123ba0167cd72638e53474c9793033fedd6152ad; boot-modem-b-full.img 201,895,936 B sha256 5571c7f293021c54f7b0f6c43799f028e3953875542db9cb701a65e619f5d145 with payload 95d4cd30, payload.json b7560ab4, payload kernel 8a6749c6, args pong_modem=2 pong_ipa=0, FD 40c29d51, verify rc0. S3 must stay PASS and S4 still needs the dms revision; the new words only decide between a stale ring and a genuine zero pair.",
  "2026-11-19 k31 (d257e2bbabdc95366c97128acfb8b15093034edd): the k30 B flight repeated S3 PASS (scm cmd=0x5 ok calls=179, auth_reset ok, transport prepared, mem_setup ok base=0x8bc00000 span=0x13200000) and failed S4 again with K60MODEM qrtr: glink poll rc=-5 at 2 rx avail=576 head=648 tail=72 cmd=0 p1=0 p2=0. head is the modem write index, so the snapshot showed ring space; the parser and rx_peek read *rx->tail (drivers/PongPower/QcomGlink.c:47-55, rx_advance at :57-63) and avail=576 = 648-72 puts the corrupt message at tail 72. K60ModemLink.c now samples data[(tail+b) % length]; 0622 is 95,552 B / 5 files and the host suite is rc0. k31 kernel b58ca6927757598f188f7f7ac5e95104c1427bf4bd336336c1ae19c0c0dd1b34, boot e9b43266dc804ed9d11f09efaf3e2b86ac59671111acea71e45e3f2019b02cd1, payload 2deb9135f48e3a622b1ae758464671ab80c067e8f53c6c5277bf17c6a745fff4, json d8d263806580d4a37ef35ba8678301a85f1cdd5e54ac3ee2bf75a7a32b410fb2, payload kernel d1a8fb91ca0d15d72dd4538be01db87d6364d22b3e1484ea732b93185817fdfd, args pong_modem=2 pong_ipa=0, FD 40c29d513eab0dca410c36bceeef936244cf2a20c3233f48bbbaa8ae69a07386, layout 560384/201326592/3145840/4024, verify rc0. PACKAGED, NOT FLOWN; S3 must stay PASS, S4 still needs dms revision, and the new rx line must show the real oldest message.",
  "2026-11-19 k30 (3c68b7a8…): because the k29 B S4 failure only says glink poll rc=-5 at 2 (QcomGlinkCorrupt), K60ModemLink.c now snapshots the RX ring head on that error path and prints K60MODEM qrtr: glink poll rc=%d at %u rx avail=%u head=%u tail=%u cmd=%#x p1=%#x p2=%#x. receive_one() peeks without advancing and k60m_glink_stop() does not touch the RX ring, so the corrupt command is still at the head when the line prints; the command ids follow drivers/PongPower/QcomGlink.h (0 VERSION, 2 OPEN, 4 OPEN_ACK, 5 INTENT, 7 RX_INTENT_REQ, 9 TX_DATA, 12 TX_DATA_CONT, 13 READ_NOTIF, 15 SIGNALS) and hakios.mpss.c:2574-2575 uses the same 12/13 numbering. drivers/PongPower/QcomGlink.c belongs to the charger line (docs/engineering/TREE-OWNERS.toml:70) and is not edited. 0622 regenerates to 95370 B over 5 files; test-k60-modem-image.py TESTS OK 30 segments, test-k60-ipa-patch.py PASS, run-host-tests.sh rc0. kernel.macho 105,582,592 B sha256 c6de4ad86e36ca3240cbfa2189ad3e8ed30fa43dd4717c977b8eb55918a24dfd has the snapshot string once and _k60_modem_qrtr_probe at fffffff007763ca0; boot-modem-b-full.img 201,895,936 B sha256 d17550354629f4f18bdb4ced8dcb1bc05f87d652dfcc1250a79913c94195cb17 has payload 7a2d7716, json 54dc54d5, payload kernel 95163b59 and args pong_modem=2 pong_ipa=0 (FD 40c29d51), verify rc0. It supersedes k29 92359e3d and is not flown: the first window after the competing wifi flight ends, with no other agent booting, flies it under existing authorization. S3 must stay PASS; S4 still needs the dms revision, and the new rx line only names the branch.",
  "2026-11-19 k29 B flight (d549badd…): boot-modem-b-full.img 92359e3d… flew and S3 PASSED on hardware: power ok xo=0x300b0/3, init_image ok metadata=0xb7ff0000 bytes=5884, transport ok smp2p=0xe3070/340 plus prepared, mem_setup ok base=0x8bc00000 span=0x13200000, K60MODEM scm cmd=0x5 ok calls=182, auth_reset ok. calls=182 proves the k28 rc=-3 was our 100-resume cap, not TZ. S4 FAILED: glink desc=0xdf030/32, modem ready (smp2p items=2), opening IPCRTR as initiator, bridge disabled, channel up, channel down, glink poll rc=-5 at 2 (QcomGlinkCorrupt), no dms revision. Evidence E:/k60-work/evidence/usblog-20261119-062321 (console 230,060 B sha256 9ecde6b8…, complete, budget); judge scripts/check-modem-flight-log.py --phase b prints S3 PASS / S4 FAIL. The next variable is the RX message that makes receive_one return Corrupt: snapshot the RX ring head 16 bytes in K60ModemLink.c and print cmd/param1/param2/avail; drivers/PongPower/QcomGlink.c belongs to the charger line (TREE-OWNERS.toml:70) and is not edited here.",
  "2026-11-19 k29 (d549badd79bb4a42c8f33caa90b7ab8ecf740a43) fixes the one thing the k28 B flight exposed: AUTH_AND_RESET printed scm cmd=0x5 rc=-3 x0=0x1 x1=0x1, and rc=-3 is K60ModemPasInterrupted while x0=1 is QCOM_SCM_INTERRUPTED, so the monitor was still resuming when K60M_SCM_MAX_CALLS=100 ran out. Pong resumes one PAS transaction up to 100000 times (PongModemRuntime.cpp:112-118), so k29 matches that cap and prints K60MODEM scm cmd=0x5 ok calls=N once N passes 100. 0621 is 17666 B over 3 files; the continuation test now carries 1001 resumes past the old cap and the last-call case prints calls=99999. The k29 kernel is 105,582,592 B sha256 80fe7d6ece5c7e3d573e5d327737e18d551e520a58a76624ca48f3d3c05fe19f; boot-modem-b-full.img is 201,895,936 B sha256 92359e3d246f9df8e6578533b71772e3fb245d09ffb90c76b02a0cd04c55a57a (payload 2b7107f9, payload.json 911e6fac, payload kernel e9b2f946, args pong_modem=2 pong_ipa=0), verify rc0. It supersedes the k28 B image d86a73ac and is not flown; if auth still reports rc=-3 at calls=100000 the next variable is TZ/PAS, not power.",
  "2026-11-19 k28 (8a2d44fc23c893d6c884ca664bfa5e9e36c9f9fd) hardens the B flight timing: K60ModemLink.c waits K60_QRTR_READY_POLLS 15000 x 2 ms = 30 s for the modem to boot after AUTH_AND_RESET instead of 10 s, while the DMS and verdict loop keeps K60_QRTR_POLLS 5000 (10 s). Pong runs a continuous worker (PongModemQrtr.cpp:108) and we have one window per boot, so the old 10 s could declare the modem absent while it was still booting. 0622 is regenerated (94,545 B, 5 files) and test-k60-modem-image.py passes; llvm-objdump of _k60_modem_qrtr_probe shows 15000 at fffffff007764044 and fffffff00776416c for the readiness loop and 5000 at fffffff007764274 and fffffff007764628 for the verdict loop. The k28 kernel is 105,582,592 B sha256 3e4e69fd6695509c64d42d35983c573fbef11f4160f358edc9f601a6dfa527b6; boot-modem-b-full.img is 201,895,936 B sha256 d86a73ac12040413f62f7da45dc7af19d0729eea157cb6d36df1e835dca9ac38 (payload ecd2ecf4, payload.json 96aea7b3, payload kernel e3f75274, args pong_modem=2 pong_ipa=0), verified by scripts/verify-boot-image.py rc0 and test-bootimg-layout.py. It supersedes the k22 B image 82c0cab3 and is not flown; only scripts/flash.sh and fastboot boot, and only when no other agent is booting.",
  "2026-11-19 QRTR service 49 session (49d41615a0c93c67bb9cb314e62bc1bbcb64ea03): K60IpaQrtr.h/.c wrap K60IpaQmiTransport as the QRTR endpoint of IPA service 49. announce() publishes 49/0x101 on port 0x122 with NEW_SERVER, lookup() sends NEW_LOOKUP, a modem 49/0x201 NEW_SERVER records words[2]/words[3] as node/port and starts INIT_DRIVER, DATA to 0x122 from that node feeds the transport, BYE resets it, and QMI SDU type 0 egress uses 0x123 while type 2/4 uses 0x122; a refused send leaves the frame queued and flush() retries. scripts/tests/test-k60-ipa-qrtr.c prints K60 IPA QRTR PASS announce lookup discovery init-driver response subscribe completion bye failures; 0623 is 173,712 B over eighteen files and registers pong_ipa_qrtr.c; b11af099 renames the kernel copy's include to 0622's pong_modem_qrtr.h after the first k27 build failed with 'K60ModemQrtr.h' file not found. k27 kernel 105,582,592 B sha256 faac521b7431274126a6e453a33f67291ae4df09e7180dce06cb9c74c4ebd547 has all six _k60_ipa_qrtr_* symbols. No runtime caller yet: K60ModemLink does not dispatch service 49, which waits on the B/QRTR flight authorization.",
  "2026-11-19 IPA QMI link transport (341f248aad46062acadcc0b9f2ffa0262116e4f3): K60IpaQmiTransport.h/.c own the three-attempt INIT_DRIVER retry and the reply/completion sequencing that Pong writes inline at references/pong-baseband/PongModemWan.h:382-424. start() sends or resends INIT_DRIVER and returns Exhausted after three unanswered attempts; receive() feeds the state machine and immediately sends the reply plus the single 0x22 INIT_COMPLETE; a frame the link refuses stays queued in tx and flush() retries it, so ready() reports delivery rather than composition (the server sets indicated when it builds). scripts/tests/test-k60-ipa-qmi-transport.c prints K60 IPA QMI TRANSPORT PASS start retry subscribe status complete exhaustion send-failure unhandled; 0623 is 163,645 B over sixteen files and registers pong_ipa_qmi_transport.c; k26 kernel 105,582,592 B sha256 2713e297ffb5faacedddc476b1393a2ae6beeadf8ef7f82d8e30ce933b4f16c9 has all five _k60_ipa_qmi_transport_* symbols. No runtime caller yet: the QRTR dispatch must bind service 49 and call these five functions, which waits on the B/QRTR flight authorization.",
  "2026-11-19 IPA QMI server state machine (a65c8a279e9a92f7ba0275d18feb3460f992389c): K60IpaQmiServer.h/.c mirror PongModemWan.h:138-181/:382-424 without a transport: three INIT_DRIVER attempts with a skipped-zero transaction id, DriverReady only on a matching 0x21 response with result 0, handlers for 0x20 (subscribe), 0x35 (one-byte status to uc_ready), 0x27 (config body plus 0x10..0x2f presence mask), 0x24 (pipe below 32, status at most 1, 1+8n rule indices) and 0x23 (echo ids), error 94 for an unknown message, and a single 14-byte 0x22 INIT_COMPLETE only after driver+uC+subscriber. scripts/tests/test-k60-ipa-qmi-server.c prints K60 IPA QMI SERVER PASS attempts refused happy-path status configuration filter rules unhandled malformed; 0623 is 156,864 B over fourteen files and registers pong_ipa_qmi_server.c; k25 kernel 105,582,592 B sha256 f3b93c7900187bb9d9dc0e77a505b95da579337fa626c3c827d7ffe10ca29d6a has all five _k60_ipa_qmi_server_* symbols. No runtime caller yet: QRTR dispatch and service 49 registration still wait on B/QRTR authorization.",
  "2026-11-19 k24 IPA service 0x31 QMI codec (2c986e3ffbf505d2c61257517057af048e4cdca5): K60IpaQmi.h/.c encode INIT_DRIVER 0x21 (17 TLVs, 154 B) plus the 0x22 INIT_COMPLETE indication and 14-byte responses for 0x20/0x23/0x24/0x27/0x35, and parse the requests, the driver status and up to 64 rules. It mirrors references/pong-baseband/PongModemWan.h:61-97/:138-181/:382-420 and corrects the M3 direction (the AP initiates INIT_DRIVER; the modem sends the 0x20/0x35 requests). 0623 is 144,081 B over twelve files, the host suite is rc0 with K60 IPA QMI PASS, and the k24 kernel 105,578,496 B sha256 70c707f59c4fd5313f954fa9ba9aacc38032eb7551f6d3195142f45483f6117d carries all seven _k60_ipa_qmi symbols. No runtime caller yet: wiring it into the QRTR dispatch needs the B/QRTR flight authorization.",
  "2026-11-19 P1 (3e4497733cfca7d82ecb6470ffcf126ceaf624d6) passed on hardware: the k22 rail-only image 393d7f2f01b878ace9bfb2cafec1614b68a4e2ce23f1170072f14379a2c70947 (pong_modem=4 pong_ipa=0) booted under the single supervisor with console capture E:/k60-work/evidence/usblog-20261119-042322; console.log 213,490 B sha256 c94dceedd888e70f0dcf4ac761a51d403c5d4450bdaaa86cd59c863752a9e67e has carrier present, one power ok cx=0x30000/6 mss=0x30060/7 xo=0x300b0/3, one power prepared and the diagnostic stop after power, with no init_image/mem_setup/auth_reset and no power failure, and scripts/check-modem-flight-log.py --phase p1 prints P1: PASS. The three TCS4 modem rails are now hardware-qualified and xo.lvl is the literal 3, so the HR-01 row is no longer unverified. User authorization 2026-11-19 04:16 allows further flights when the code is ready and no other agent is booting; the next flight is the k22 B image 82c0cab36e5d3d8d7a5d88a21b625163c5aa10cba8ee684e3c826a494cbd04d9 (pong_modem=2 pong_ipa=0) to observe transport_prepare/auth_reset and QRTR enumeration. No flash and no partition write.",
  "2026-11-19 k23 (673330c16b9f3635a9b57c2615518da4c1cc174d) lands the QMAP framing codec, the first M5 prerequisite that needs no hardware: K60IpaQmap.h/.c encode and decode the four-byte QMAP header (pad:6|reserved:1|command:1, mux, 16-bit big-endian length that counts the padded payload and excludes the header, padding at the payload tail), skip command frames, reject reserved/mux 0/255/zero-length/pad>length/overrun and stop rather than resynchronise a corrupt aggregate; the layout matches references/pong-baseband/PongModemWan.h:313-342 and references/phk110-port/drivers/modem/hakios.ipa.c:671-689/:710-733. 0623 now carries ten files (128,623 B) and pong_ipa_qmap.c is registered in scripts/append-conffiles.py; scripts/tests/test-k60-ipa-qmap.c prints K60 IPA QMAP PASS. k23 kernel 3fe1b577c164a2e89806821223bdfe3c79c9bfa904ff492d710dcf3322235a91 (105,578,496 B) contains _k60_ipa_qmap_encode/_decode/_frame_bytes. The codec has no runtime caller yet: IPA QMI service 0x31 DAP negotiation, mux 1..4 registration, ifnet and IRQ 432/654 remain to be built, and the modem P1/B flights still wait on their own authorization.",
  "2026-11-19 k22 (3e4497733cfca7d82ecb6470ffcf126ceaf624d6) aligns the xo.lvl vote with Pong: references/pong-baseband/PongModemRuntime.cpp:146-161 votes the raw literal 3 for xo.lvl and converts only cx.lvl/mss.lvl through the cmd-db level table, while k60_modem_find_rail ran xo.lvl through k60_rpmh_level_index as well, which fails outright when the XOB resource has no level table (K60RpmhNoLevel) or writes an index instead of 3 in the very action P1 exists to test. k22 votes 3u directly: kernel a2139ecb5e3e65e76ab29dbb8fab2584c691fc0aad7940b153d93f32d02ae147, pong_modem=4 image 393d7f2f01b878ace9bfb2cafec1614b68a4e2ce23f1170072f14379a2c70947 with payload 74ade8b1a62ee63f8a1cb318a9104a41d9571c8201852efd4b90c9069c6ca752, verified by scripts/verify-boot-image.py and scripts/tests/test-bootimg-layout.py; scripts/update-modem-qrtr-patch.py now regenerates 0622 from the sources. k22 supersedes the k21 rail-only image 7b6bb385 as the P1 candidate; it is not flown and still needs its own HR-01 authorization. The same kernel is also packaged as the B image 82c0cab36e5d3d8d7a5d88a21b625163c5aa10cba8ee684e3c826a494cbd04d9 (pong_modem=2 pong_ipa=0, payload 1baec54f, payload kernel 229ebe50), which replaces the k21 B image eefe6fdf and still needs both a P1 PASS and its own authorization.",
  "2026-11-19 k21 (fbc03066be4174ee21d90d2827311f2896ef2a8f) adds the rail-only diagnostic pong_modem=4 so the three modem rail votes can be judged alone: the host regression now records the whole order and proves phase 2 stops before init_image (TESTS OK 12), and 0621 is regenerated from the sources by scripts/update-modem-pas-patch.py. It is the single-item HR-01 diagnostic and must fly, under its own authorization, before B; it has no device observation yet.",
  "The k20 p1 IPA image 41abb12548de35532272973f35847857968c7211e3b6e221ee98b783734c9cc1 flew on 2026-11-19 01:21:54 and passed PAS15 (console.log:480-494: scm cmd=0x1 rc=0 calls=5, init_image ok, mem_setup ok, auth_and_reset ok, post-PAS GSI channels=28, version=0x45 comp=0x50010000), and the p2 image b2474eea4ac777d185605642a22e1ca94cd364345e43c9130a62a2cdf21c65e3 flew at 01:30:21 and passed the M2 runtime (ring 0x90d50d000, tables 0x90d60d000, SMMU bank=72 slot=110 pages=6 leaf=268, GSI stage=10 completed=3). Next implement and verify the QMAP/ifnet data path plus GSI IRQ 432/654; modem B/QRTR stays gated on its own authorization and rail/QMP qualification. This is kernel-generic work under the m30366 split.",
  "k18 C-M2 flew on 2026-11-18 23:45 and passed the C criteria (init_image ok, mem_setup ok, diagnostic stop); see docs/research/cellular/19-MODEM-BRINGUP-FLIGHT.md section 3.6. At that time B/QRTR and PAS15 were unobserved and K60Ipa.c still used a single-SMC wrapper, which returned rc=-7; bba7dcaa later added the continuation and the k20 p1/p2 flights passed PAS15 and the M2 runtime, so the 2026-11-19 entries supersede this note. Do not run B yet: B/QRTR and rail/QMP qualification are still outstanding. No fastboot flash; no M3-M6 before explicit authorization.",
  "The IP0 vote is now qualified on hardware: the ipclk=1 single-variable probe (kernel 4e40af75, image d704e376, pong_modem=0 pong_ipa=1) printed address=0x50040 unit_khz=40 vote=0x60000bb8 rc=0 at console.log:480-483 and stopped before the IPA handoff and PAS. The HR-01 ledger was promoted in the same commit, so the k14/k15 IP0 hold is lifted; the build-input gate is reconciled with K60_DEVICE_INPUT=/mnt/e/k60-work/mirror-k14-device. M2 runtime validation still has to run on hardware; use scripts/flash.sh with all existing gates and never bypass a missing-input check.",
  "The carrier is staged through the firmware DXE path (27 modem streams, 109,060,761 bytes declared, K60ModemImage placeholder in the ADT), and QcomBaseband's AppleBaseband control bridge is linked through K60ModemLink. Generation k16 in docs/research/cellular/19-MODEM-BRINGUP-FLIGHT.md §3.3 (2026-11-18 19:48–19:56) stages eight C/C0/IPA-only/B images (standard and M2 diagnostic) with UEFI FD 9b7155f6, kernel 03a3aeab and the QcomBaseband bridge plus IPA M0/M1 firmware staging/PAS path, fixed-window IPA handoff, IP0 clock, IPA 5.1 resource-table preparation, GSI EE0 precheck, corrected ipa_gsi_region firmware load and M2 runtime glue in 3d4a4be4/352d7f30/8af93c9a/e7bdbf16/50aa1261/e4b5cfd5/4764d170/b9de56b9/71e7c43/d828f3ab/5d59eab7, with the provider fix carried by patches/qcombaseband/0001-coachz-defer-publication.patch and applied to upstream dd0199cf. The earlier 01:49 launch used FD 38c1293b without CarrierLoadMetadata, so its empty console is not a kernel verdict. With the IP0 hold lifted, run C first under an authorized candidate, run C0 only if C yields no console, then run B only after C passes. The k16 M2 C image 25b21fcd embeds the fixed-window FD and is the first candidate that isolates the loader; k14 M2 C 002d9a57 used FD e007de8a and returned loader Device Error before XNU, so it is not a kernel verdict.",
  "The acceptance test is a node-0 reply to the QRTR_TYPE_NEW_LOOKUP whose service id falls in {21, 1, 11, 3, 16}; the probe prints that as K60MODEM qrtr: verdict ok services=N node0=M wanted=K, and the Android-side baseline to compare against is 37 rows on node 0 in docs/research/cellular/08-QRTR-SERVICES.md.",
  "The IPA data path is scoped in docs/research/cellular/20-IPA-V51-DATA-PATH.md: working assumption IPA v5.1 APQ, M0-M6 plan, and scripts/tests/test-k60-modem-ipa-fw.py as the first offline gate. M0 is in drivers/PongCellular/K60Ipa.h and K60Ipa.c; M1 firmware validation/staging, UEFI fixed-window IPA handoff, IP0 clock and IPA5.1 resource-table preparation are in K60Mdt.h/.c and K60Ipa.h/.c: k60_ipa_firmware_check() parses ipa_fws ELF headers and enforces span <= 0xa000 and metadata <= 0x2000, k60_ipa_firmware_stage() copies the segments into the 40 KiB ipa_gsi_region and metadata page, k60_ipa_clock_vote() votes the IP0 clock through RSC TCS4, k60_ipa_resources_prepare() applies the IPA5.1 QMB/timer and source/destination resource tables, k60_ipa_gsi_check() reads GSI status/channels/events plus command channel 12 and event 0 ownership state and refuses a foreign EE0 before PAS; after PAS, k60_ipa_gsi_check_caps() requires EE0 to be enabled by TZ (GSI_STATUS bit0=1) and returns K60IpaGsiNoDevice otherwise (commit 4764d170), and k60_ipa_probe_from_handoff() reads the UEFI-copied IPA/ipa_fws.mbn from the fixed ipa_fw_region 0x8b900000 (first 0xE000 bytes) and calls k60_ipa_firmware_start(), which maps 0x8b910000/0xa000 and 0x8b90e000/0x2000, refuses a GSI EE0 already owned by another manager, then runs PAS 15 INIT_IMAGE/MEM_SETUP/AUTH_AND_RESET and reads IPA_VERSION. All is carried by patches/xnu/0623-k60-ipa.patch and patches/xnu/0624-k60-ipa-call-site.patch and covered by scripts/tests/test-k60-mdt.c and scripts/tests/test-k60-ipa.c. Host tests pass: bringup 9, PAS 5 groups, QRTR 13 groups, PMIC 16, K60 IPA M0, K60 MDT span/metadata/split, K60 IPA FW PASS size=40376 span=0x9000 metadata=0xe8c loads=3 reloc=1, K60 IPA STAGE PASS span=0x9000 metadata=0xe8c loads=3, K60 IPA PATCH 0623/0624, IPA FW LAYOUT. Kernel 105,562,112 B sha256 06e31af42b066aba216e9af3705a8ebea5d7aa6d2c15fe224807b8a690caebd1 from source commits 4764d170 and b9de56b9 has _k60_ipa_firmware_check, _k60_ipa_firmware_stage, _k60_ipa_firmware_start, _k60_ipa_resources_prepare, _k60_ipa_pas_call, _k60_ipa_probe_from_handoff, _k60_ipa_runtime_start, _k60_ipa_gsi_init, _k60_ipa_gsi_start, _k60_ipa_gsi_poll, _k60_ipa_gsi_submit, _k60_ipa_gsi_stop, _k60_ipa_smmu_plan, _k60_ipa_smmu_configure, _k60_mdt_parse, _k60_mdt_metadata_size, _k60_mdt_place, _k60_fat_open and _k60_fat_find in llvm-nm. M1 is reached from boot when pong_ipa=1, but no IPA register, GSI ring or QMAP mux has been exercised on hardware and coachz_modem_data_send still returns ENETDOWN. M2a is host-tested as K60 IPA GSI PASS (pre-PAS: status=0/channels=13/events=1 accepted, status bit0 busy rejected); the post-PAS k60_ipa_gsi_check_caps() requires status bit0=1 and rejects missing EE0 (commit 4764d170); the GSI command-DMA and SMMU host modules are in K60IpaGsi.h/.c and K60IpaSmmu.h/.c (commit 5c217091). M2 runtime glue is in K60Ipa.c: kmem_alloc_contig() allocates a 1 MiB ring and 0x8000 table block, ArmSmmu4KBuild() builds three ranges (0x146a8000/0x2000, ring, SMEM item 497) for SID 0x5c0, ArmSmmu4KProgramDisabledContext() is followed by direct SMR/S2CR writes, then k60_ipa_gsi_init()/start()/poll() run; the path is gated by boot arg pong_ipa level 2 (pong_ipa=1 is M1 only; default off). Kernel 7094936d compiled it; the later SMMU IDR/context diagnostic commit 71e7c43 rebuilt kernel 1a394bea, host tests pass, and the k12 M2 diagnostic images are built (C 603f25ce..., C0 fb8764cb..., IPA-only 14a1eee6..., B-full 12428e2a...), but no device execution or GSI IRQ exists yet. The k12 standard pong_ipa=1 images are C boot 58d9dc01..., C0 b77cd1d8..., IPA-only d1ffb983..., B cabeef22...; all 201,895,936 B and no device observation. A later offline review found that the K60 PongAdreno ArmSmmu4K builder rejected the Device-nGnRE range (writeback=2) required by the DT additional-mapping at 0x146a8000/0x2000; commit b9de56b9 adds Device-nGnRE table attributes and MAIR index 2, and kernel 06e31af4 (105,562,112 B) contains it. Commit 71e7c43 adds SMMU IDR/context diagnostics without behavioral change and rebuilds the kernel as 1a394bea (105,562,112 B). The k12 standard pong_ipa=1 images are C boot 58d9dc01..., C0 b77cd1d8..., IPA-only d1ffb983..., B cabeef22...; k12 M2 diagnostic images are C 603f25ce..., C0 fb8764cb..., IPA-only 14a1eee6..., B-full 12428e2a...; all 201,895,936 B and no device observation. Commit d828f3ab fixes M2 SMEM item 497 allocation: k60_ipa_runtime_smem_item() allocates or reuses item 497 under the TCSR SMEM mutex at 0x1f43000 before building the SMMU range, and the rebuilt kernel af9b211f (105,562,112 B) contains it; k13 standard and M2 diagnostic images were regenerated from that kernel and remain unobserved on hardware. Commit 5d59eab7 restores patches/xnu/0621-k60-io-submap-budget.patch (IO_MAP_SIZE 8 MiB -> 32 MiB, P-219) so the IPA SMMU ml_io_map cannot panic in kmem_alloc(io_submap) before console; kernel 619acc64 (105,562,112 B) contains the fix, and k14 standard/M2 diagnostic images were regenerated from it and remain unobserved on hardware. The k15 ipclk probe (kernel 4e40af75, image d704e376, pong_modem=0 pong_ipa=1 ipclk=1) then qualified the IP0 vote on hardware (console.log:480-483, address=0x50040 unit_khz=40 vote=0x60000bb8 rc=0) and stopped before IPA handoff/PAS; M2 runtime remains unobserved. The k16 kernel 105,562,112 B sha256 03a3aeab3a5df334c70b1389b1840574efbbb7804fcc2caeaf89cfc46b9a9409 is built from a2d11e2b and consumes IPA/ipa_fws.mbn from the UEFI fixed window 0x8b900000; all eight k16 images embed FD 9b7155f6 and remain unflown.",
]
