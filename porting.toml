 = payload.img." }, { kind = "host", reference = "scripts/build-ios27-linux.sh", command = "UNIXNU_UEFI=$HOME/ios27-src/uefi-mondrian sh scripts/build-ios27-linux.sh", revision = "2644b5a891fb7dc0c676ef72ad93dd96bbd68ea2", result = "reference 17,432,216 bytes sha256 6bbb66dc3de76ab2ef3352d50f3fba1fa63181a07843a745a5b2e34a7327a458 (non-LTO, profile runtime stubbed); prelink over the ranged 24A446 kernelcache produced kernel.macho MH_FILESET 93,044,736 bytes sha256 09166aba4bf2706caaed14e6953fec5a2b7dec10c592a7fee77d93cd431a34cd, 32 entries, closure 38, mapping_complete=False, 384 unmapped symbols in 28 bundles, loadable=False; payload.img 4189bd98e78c9cf859856b51fbf1575b85c0050befaa515db6cfd47619bef32e; boot.img 17aa7fd959c4ddaa236f09dbe1d7cd1363d77737419aeb90afe75e9aa4ae4cce. The kit's own 54 tests pass with the section fix." }, { kind = "host", reference = "scripts/build-ios27-linux.sh", command = "HOME=/home/pedrojuuu UNIXNU_OUT=/home/pedrojuuu/ios27-out python3 ./unixnu userdata --device ../UniXNU-mondrian-ios27", revision = "4fa9319d3b24e8269806af6f03d8e63e32eb0829", result = "OS and SystemOS fetched from the IPSW with HTTP range requests (8,448 and 2,240 MiB at about 50 MiB/s) and decrypted by ipsw fw aea 3.1.749; the raw disks carry the profile's pins (4b8719fe44a2b80cba9e108ebcec91b6b8a03a3c3ffe353befce3b100f2e6f25 and f6d10101770604271c332d27290a48558ceb34f041c4020aae07ee6ca80dbb1b). userdata/userdata-root.img is 16,247,685,120 bytes, sha256 b6de43820402dc3919f5b9dc08b0fbf5c836d64af23acbcdbc335eeffd64eb43, in a 32 GiB partition; hardware_tested is false and nothing was flashed." }]

