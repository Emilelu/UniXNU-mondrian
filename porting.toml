findings = ["2026-11-17: 按官网 power §4 逐条审计电池上报并补齐缺口：K60Battmgr 增加 failed 位图与 raw[19] 原始值快照；K60Battery 发布 K60BatteryFailedFields 与 12 个 K60Raw* 键；registerService 后用 isInactive() 检查并允许下一样本重试；USB 已连但 adapter type 缺失时仍填 USBUnknown family。逐条映射见 docs/research/charger/10-POWER-DOC-CONFORMANCE.md，host test TESTS OK 71；route-c 真机 C1/C2 PASS、C3 因仅 2 对样本 INVALID；带本轮改动的 conformance 镜像尚未构建/上机。", "2026-11-17: Route A 在真机 K60 上完成 ADSP 启动：QMP load_state on、cmd-db lcx/lmx 和 TCS4 双轨投票成功，PAS1 发布 epoch=1 flags=15，物理电池源发布 sample=4 SOC=100.00% charge=4487/4487mAh design=5500mAh cycles=749 voltage=4379mV current=397mA temp=34.30C external=1 charging=1 full=0 subscribed=1。实现修复 QMP 邮箱必须 32-bit word 写入、SMP2P master-kernel 输出项 429、精确尺寸 stale SMEM 回收、16 KiB GLINK ring、零长度 INTENT、battery current optional + USB CURRENT_NOW fallback。证据 E:/k60-work/evidence/route-a/usblog-boot-20261117-0726-final/console.log:189,596；镜像 sha256 6aa9107c30cab42bf4fd1a8555f5d622774eeb242fd79606ca2bec36226061f1。", "PMIC/PON historical observations are recorded in docs/archive/HANDOFF-2026-10-31.md:55 and docs/archive/HANDOFF-k60-work-2026-11-06.md:210; they do not prove battery GLINK ownership.", "2026-11-15: five injected PAS1-owner stages and a persistent wrapper pass 77 named host scenarios around real MDT/SMEM/build/parser code. Exact required=15, independent public facts/internal stage mask, poisoned uncertain shutdown and retained published ownership are enforced; see docs/research/battery/PAS1-PROVIDER-CONTRACT.md.", "2026-11-15: bounded blob/FAT named reader and immutable owner adapter are implemented. Captured-firmware host checks cover 24 segments, exact payload/BSS counts, unaligned b10, BSS-only missing b24, error codes and lifetime; this was the earlier reader-only source checkpoint. See docs/research/battery/PAS1-PROVIDER-CARRIER.md.", "2026-11-15: Lead froze production K60A as a 12-byte LE header and sequential 24-byte records, NUL names (name_len=9), mode0644, packed_size=size and 8-byte zero padding. The production generator/checker and reader exist. The 26 inputs total23505092 bytes and the single cursor gives23506184 bytes; no flat format, compression or second dispatch is accepted. Copy23494284+BSS25925684=49419968 bytes; mapped span51380224 includes1960256 bytes of intersegment gaps. See docs/research/battery/CARRIER-BLOB-PLAN.md.", "2026-11-16 initial adapter checkpoint (superseded availability state): complete version-1 platform ops, persistent linked-reader context and idempotent install were wired before acquire, but no production board supplier existed and available=0; platform31/34 host cases passed. The board supplier is now wired before platform install, so availability can become1; this does not prove power. Lead 15:03 withdrew B/C resources-success claims and restored resources to K60BoardUnsupported(-63) after lease/exclusion/stopped checks, with no resources=1 and log K60ADSP: rails not verified for handoff; no PAS/SMEM mutation. Real owner stages refuse before downstream map_smem/allocation/INIT_IMAGE/MEM_SETUP/COPY/BSS/AUTH/publish. Parent reported focused board8 and owner-claim18 exit0 including direct wrapped allocator count0 and unchanged SMEM; see docs/research/battery/PAS1-PROVIDER-INSTALL.md."]
