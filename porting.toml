findings = ["The three local trees use different userland models: ours keeps an OS+SystemOS read-only APFS union from the unixnu partition; ios-sweet-k60 rewrites a writable HFSX image at build time; UniXNU-pong prepares at run time inside its own static init that becomes PID 1 and then execs launchd. Selected approach: diagnose first and do not replace PID 1, because the launchd chain is already verified and the pong adapter targets Darwin 24 ABI. Our kernel already carries exec_inject and bindfs, so the pong model remains available if the blocker turns out to need run-time preparation. See docs/USERLAND-ROUTES-2026-11-02.md.", "The kernel links and prelinks on macOS CI. Format 1 run 40631225483 produced 54349824 bytes; format 2 run 40650877574 produced 54419456 bytes at the same slide -0xb9c000 and the same lowest component extent 0xfffffff004426600.", "The 69632-byte difference is a real fix, not noise: the format-1 glob applied zzzzzz-pong-init-scratch-allocation.patch through fuzz and the panic string it adds is absent from that kernel, while the strict format-2 series applies it at its intended place and the string is present. The checked scratch allocation had never reached a qualified kernel before.", "mzyxsl daed6b5 fixes the local prelink helper to merge the OS-profile prelink table and board overrides. A real prelink of the 0238 native kernel succeeded with 32 roots and automatic slide -0xb9c000, 53788672 bytes, SHA-256 bb33682837f1807ef28d385cf09acf94f2749f49b3f7337d22348dcbf6c4b9df. Use --profile/--kit for non-sibling checkouts."]
completion = ["Kernel and prelink succeed, payload contains all declared inputs, and the boot image matches the bootloader format and size limit."]
limits = ["cand7 reaches the desktop after restoring notifyd/lsd PublishesEvents. Touch skips for incompatible Pong DT and Adreno is disabled in the kernel configuration; neither subsystem is device-verified."]
next_action = ["Preserve cand7 as the known-working desktop baseline; verify K60 touch and Adreno changes independently using RAM-only fastboot boot candidates."]
evidence = [{ kind = "host", reference = "https://github.com/Emilelu/UniXNU/actions/runs/40650877574", result = "Build kernel succeeded on macOS from this revision: prelink slide -0xb9c000, 54419456 bytes, lowest component extent 0xfffffff004426600", command = "./unixnu build kernel -D ../UniXNU-mondrian", revision = "6a10bf5e42ecfad7eed2789cc091287d31009623" }, { kind = "host", reference = "scripts/verify-boot-img-payload.py", result = "Route a-18 chain reproduces end to end: kernel 20,872,544 B (15966fcd) -> prelink 54,808,576 B -> payload 201,326,592 B -> boot-darwin24-bc6.img. The verifier confirms the kernel slot is the 112-byte shim plus the rebuilt FD, the ramdisk slot is byte-identical to payload.img, and the in-volume kernel.macho matches the built kernel.", command = "python3 scripts/k60-prelink-darwin24.py && python3 scripts/verify-boot-img-payload.py --img /mnt/d/Android/k60-ios/boot-darwin24-bc6.img --payload /tmp/k60build/out/mondrian/ipados-18.7.10-22H374/mondrian/payload/payload.img --kernel /tmp/k60build/out/mondrian/ipados-18.7.10-22H374/mondrian/kernel/kernel.macho", revision = "e636e445b621bed4fac0069f3604b87061350a8d" }, { kind = "host", reference = "userland/build.py", command = "python3 userland/build.py ui --sdk /root/k60/work/iPhoneOS16.5.sdk --out /root/k60/work/ui-v3", revision = "c6e555c1895e6096c32ab396485ee7d61221a86c", result = "Real iOS SDK build succeeds; 0340 array is regenerated with the current deferred-preferences source. Library 95856 bytes, SHA-256 b3289bcb5768a5c6f9d4b3ee0e35abaafb3b8a00f00f5167049109ee71c5aa2b; all 24 4096-byte signature-page hashes verify. Rebuilt/prepared kernel SHA-256 67d0f5bbdfb7422be72b89e1d0bf76057d9f1ac94944772df3f75d078f83f4c7 contains the new blob exactly once and no old blob. cand6 FAT preserves firmware, ADT and arguments; image SHA-256 a7070e6af739565d4829c3de62f7a1687626bd88c9eb2d7f8eb0812593c37871. cand6 device run is recorded separately; no UI readiness is implied." } , { kind = "device", reference = "userland/build.py", command = "fastboot -s be74ba07 boot E:/k60-ios/boot-cand6-20261111.img", revision = "c6e555c1895e6096c32ab396485ee7d61221a86c", result = "console-20261111-194438.log (64717 bytes): K60UILIB deploy bytes=95856 resid=0 error=0 and all ten SpringBoard hooks install. Main snapshots at 60/120 seconds have turns=0 and identical Firehose/logd registration frames, symbolicated using the matching cache-symbol UUID. notifyd SIGTRAP maps to BUG IN LIBNOTIFY: Event publisher error; the selected cache drops PublishesEvents present in the original descriptor. UI not established." }]

