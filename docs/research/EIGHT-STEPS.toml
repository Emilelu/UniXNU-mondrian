evidence = "旧顺序把 BT_EN 拉高和 XO pulse 放在串口时钟、engine、IRQ 之前，且低/高电平各只等 50 ms；官网要求 BT_EN 先低 100 ms，再起串口时钟/engine/IRQ，最后 BT_EN 高 60 ms 后才使能引脚。0517 的 hunk 1 改常量，hunk 2 把 SW_CTRL/serial clock/stop/prepare engine 移到 BT_EN 低电平窗口，hunk 3 把 XO pulse/BT_EN high/XO release/60 ms/pins active 放到 IRQ 之后、geni_start 之前；powered=true 提前到 BT_EN 低之后，使早期失败仍走 power_off。WLAN_EN 低时的 100 ms 放电保留为板级前置。0518 另修一个独立缺陷：armcpu_spi_attach 需要 GIC INTID，旧代码却直接传 DT 的 SPI 587/208，四个调用点改为 32u+587u=619 和 32u+208u=240；旧代码同样返回 0，所以不能凭 attach 返回值判断修好。两者都没有改 NVM 协议；d11 证明 NVM -60 的根因是 UART RX 中断挂错 INTID（587 而非 619），每段 ack 只能等 10 s 命令期限，0518 修正后 ack 约 1 ms 到达。见 docs/research/bt/S4-SPEC.md:1459-1485、docs/research/bt/S4-SPEC.md:7.25、patches/xnu/0517-k60-bt-power-order.patch:4-64、patches/xnu/0518-k60-bt-gic-intid.patch:1-51、patches/xnu/0500-k60-bt-qbt-new-files.patch:1010-1075、patches/xnu/0516-k60-bt-qbt-uart-clock.patch:33-132。"

