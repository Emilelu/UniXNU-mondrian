statement = "fail-closed 必须覆盖真实发布链且先于 PAS/SMEM 副作用；未知供电不得置 ResourcesHeld。resources 拒绝后 map_smem/SMEM allocation/INIT_IMAGE/MEM_SETUP/copy/AUTH/publish 均须为零；TCS 请求不等于轨有效。"
check = 'd=$(mktemp -d) && cc -std=c11 -O1 -Wall -Wextra -I drivers/PongPower -o "$d/rail" scripts/tests/test-k60-pmic-rail.c drivers/PongPower/K60PmicRail.c && "$d/rail" && cc -std=c11 -O1 -Wall -Wextra -I drivers/PongPower -o "$d/board" scripts/tests/test-k60-adsp-board.c drivers/PongPower/K60AdspBoard.c drivers/PongPower/K60Smem.c drivers/PongPower/K60AdspStartup.c && "$d/board" && cc -std=c11 -O1 -Wall -Wextra -Werror -I drivers/PongPower -o "$d/claim" scripts/tests/test-k60-owner-claim.c drivers/PongPower/K60AdspOwner.c drivers/PongPower/K60AdspOwnerStages.c drivers/PongPower/K60AdspMdt.c drivers/PongPower/K60Smem.c drivers/PongPower/K60AdspImageReader.c drivers/PongPower/K60Fat.c drivers/PongPower/K60HandoffBuild.c drivers/PongPower/K60HandoffPublish.c drivers/PongPower/K60BatteryConfig.c drivers/PongPower/K60AdspBoard.c drivers/PongPower/K60AdspStartup.c -Wl,--wrap=k60_smem_alloc && "$d/claim"; rc=$?; rm -rf "$d"; exit $rc'
note = "2026-11-16 15:03 Lead 选择 (iii)：resources 在 lease/排他/stopped 检查后仍返回 K60BoardUnsupported(-63)，不置 resources=1。B 先记账后查表于13:50撤回（读者早于写者）；C 声明成功于15:03撤回（legacy bring_up 的门不覆盖生产 owner stages）。board 仍8场景，第8场景验证回调拒绝；owner-claim 另连真实 board 与 production install/acquire，以 wrap 直接计数 allocation 并验证下游零副作用与 SMEM 不变，不再证明声明成功。rail49仅旧 helper 证据，采样范围/状态语义/单次入口仍待审计；不得出功能图。"


[[rule]]
id = "P-224"
title = "构建的冻结输入把 python 自己写的字节码算进去了"
check = "python3 scripts/tests/test-build-strict-freeze.py"
note = "freeze() 必须排除 __pycache__/*.pyc；否则构建自己重写 .pyc 会被判成「输入变了」而判废（wifi-20261116c7 现场）"

[[rule]]
id = "P-225"
title = "板目录靠 mtime 猜，猜错就静默丢掉 Metal 插件与电池归档"
check = "python3 scripts/tests/test-build-strict-board-dir.py && python3 scripts/tests/test-config-consistency-board-dir.py"
note = "board_dir() 必须按「.config 有没有写 CONFIG_XNU_GPU_ADDON / CONFIG_XNU_K60_PHYSICAL_BATTERY」排序，不能只按 mtime；两个候选都没有这两个键时要警告 P-202。check-config-consistency.py 的 resolve_generated() 是同一判据的第二处，不许退回 found[0]"

[[rule]]
id = "P-228"
kind = "pitfall"
title = "兼容层无条件重放 IRQ，handler 被调用过不等于硬件中断到达"
check = "python3 scripts/check-docs.py"
note = "判据必须指向只有硬件能造成的状态变化（寄存器读回、设备改过的内存、设备递增的指针）；lx_irq_raise_all() 每毫秒无条件重放全部 IRQ，所以 mhi_irq_handler 入口打点不能当 MSI 到达的证据，真判据是依赖 dbi.r(MsiStatus) 的 msiArrivals"

[[rule]]
id = "P-229"
kind = "pitfall"
title = "门禁的测试断言了当前分支身份，导致任何改补丁的分支都构建不了"
check = "python3 scripts/tests/test-porting-gate-book.py"
note = "被构建流程调用的测试不能在断言里依赖「当前检出就是 main」；状态相关的一条必须允许 skipTest 并说明这是正确的拒绝，其余用合成 fixture。P-165（registry 继承 K60_BUILD_IN_PROGRESS）是同一问题域的另一端"

[[rule]]
id = "P-230"
kind = "pitfall"
title = "判据缺输入时不许替换成默认镜像"
check = "python3 scripts/tests/test-device-input-must-be-named.py"
