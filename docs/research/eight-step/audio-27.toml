  "官方记录要求音频写清 DSP、codec、时钟、固件服务、路由和播放/录音；本文件逐项给出证据，未做的项在 verify.plan 里标注；见 UniXNU:docs/zh/porting/records.md:30。",
  "官方把 DSP/音频归到 AdspProbe/AudioProbe（UniXNU:docs/zh/porting/drivers.md:45），但当前 UniXNU/components.toml 的 29 个 id 里没有 AudioProbe/AdspProbe（末尾 QcomBaseband 在 UniXNU:components.toml:564）；本板不适用“直接取组件”，只能按 F3 新建 Pong 音频。",
  "蓝牙页的 audio_system_plugins 是蓝牙 HAL 覆盖，不是扬声器/麦克风路径；本板音频线不接它，见 UniXNU:docs/zh/drivers/qca-bluetooth.md:67-71。",
]

[hardware.audio.step.decompile]
done = true
recorded_at = "2026-11-21T04:06:00"
evidence = [
  "K60 live FDT 的 adsp_region@9fd00000 是 0x9fd00000 + 0x3100000，UEFI MemoryMapLib 也记这个区间；旧文档里的 0x0a000000/0x01c00000 是错值，现行 dts/mondrian.dts:54-80 已改对，见 docs/research/audio/GAP-ANALYSIS.md:65-75。",
  "PAS1 不是“拷完再调 SCM”：PAS_INIT_IMAGE 只取一次 5404 B metadata（884 B header + 4520 B hash），PAS_MEM_SETUP 一次圈 region 0x9fd00000/0x3100000，随后逐段 COPY/BSS，最后 AUTH_AND_RESET；见 docs/research/audio/ADSP-PAS1.md:29-39。",
  "ADSP 镜像链接基址 0x86300000，装载到 0x9fd00000..0xa2e00000；adsp.mdt 26 个 phdr、24 个有效 PT_LOAD，adsp.b10 在 0x86e0b2c0 非页对齐必须逐字节拷，adsp.b24 是 7,245,824 B 纯 bss；见 docs/research/audio/ADSP-PAS1.md:41-47。",
  "K60 两颗 AW88261 的 I2C 地址 0x34/0x35、reset GPIO 1/3、irq 88/63、spksw 52、codec reset 43、TDM clk 0x177000（1.536 MHz）、tx-lines=3、dev-id=2、TDM 引脚 121/123/122/124 来自 K60 live FDT 与 Android audio-kernel；见 docs/research/audio/GAP-ANALYSIS.md:111-126。",
  "Pong 的 I2C 事务状态机是 prepare 后 write_command 设 M_CMD0，event 处理 CANCEL/ABORT/DONE、FIFO 水位和错误，poll 轮询；见 drivers/PongAudio/PongAudioGeniI2c.c:15、:42-52、:106-149。",
  "Pong 的 codec 身份由 SoundWire slave ID 两半拼出，只有 pong_swr_is_wcd938x(id) 成立才认；见 drivers/PongAudio/PongCodecProbe.c:200-206。",
  "功放入口是 pong_audio_amp_probe()/play()/stop()（drivers/PongAudio/PongAudioAmp.c:944/:903/:925），io 表在 :511-513 由 se_rd/se_wr（:418/:425）填；这些是当前内核源码，不是反编译猜测。",
]

