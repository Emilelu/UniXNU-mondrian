# 四条线 + Power 对官网页面的逐条对齐（每行都要可判定）
#
# 页面：docs/zh/porting/power.md（unixnu.com/zh/porting/power）。requirement 必须是页面里
# 逐字出现的一句话（门禁会去页面文本里找），evidence 必须是本仓能打开的文件、判读器或门禁。
#
# status 只允许四档：
#   verified  有本仓证据，且判据已跑过（判读器/门禁/离线用例）
#   partial   代码与判据都在，但缺上机证据或只覆盖一半
#   not-done  没做
#   delegated 由别的线负责（写清是哪条线）
# partial / not-done / delegated 必须写 why，"看起来可以"不算理由。
schema = 1
page_root = "E:/hackios/UniXNU/docs/zh/porting"
page = "power.md"
