# 上游提交研判台账
#
# 为什么有这张表：报告「有新提交」不等于跟进。只有每个提交都被判过
# （取 / 不适用 / 暂缓）并写下理由，跟进才算闭环。没有台账，同样几个提交
# 会被反复"发现"、反复讨论、永远不落地。
#
# 规则（AGENTS.md 铁则 6）：
#   1. 每个 yibiya 镜像的每个分支，都必须有一条 watermark 记录
#   2. watermark 之后的新提交，必须逐个写进 [[commit]]
#   3. verdict 只能是 picked / not-applicable / deferred
#   4. deferred 必须写 reason 和 review_after（否则等于忘记）
#
# scripts/check-upstream-triage.py 会在构建前检查这些。加新镜像时
# 也要在这里加一条 [[branch]]，否则门禁会报"未登记分支"。
#
# 最后更新：2026-11-12

